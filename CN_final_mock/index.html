function renderExam() {
    view = "exam";
    if (state.retry && !inScope(QUESTIONS[state.current])) {
        state.current = BY_ID[state.retry.ids[0]].index;
    }
    const app = document.getElementById("app");
    app.innerHTML = "";
    const shell = el("div", { class: "shell" });
    shell.appendChild(el("aside", { class: "side", id: "side" }));
    shell.appendChild(el("main", { id: "qpane" }));
    app.appendChild(shell);
    renderNav();
    renderQuestion();
    startTimer();
    updateTopbar();
}

function navStatus(q) {
    if (isSubmitted(q)) return verdictOf(questionScore(q), q.marks);
    return isAnswered(q) || (q.parts && q.parts.some((_, pi) => partState(q, pi).submitted)) ? "answered" : "";
}

function renderNav() {
    const side = document.getElementById("side");
    if (!side) return;
    side.innerHTML = "";
    const groups = [[1, "Section A · MCQs (1–50)", ""], [2, "Section B · Structured (51–55)", " wide"], [3, "Section C · Subnetting (56–57)", " wide"]];
    groups.forEach(([sec, title, cls]) => {
        side.appendChild(el("h3", null, title));
        const grid = el("div", { class: "grid" + cls });
        QUESTIONS.filter(q => q.section === sec).forEach(q => {
            const st = navStatus(q);
            const flagged = !!state.flags[q.id];
            const hide = state.flaggedOnly && !flagged;
            const b = el("button", {
                class: "navbtn " + st + (flagged ? " flagged" : "") + (q.index === state.current ? " current" : ""),
                type: "button", "aria-label": `Question ${q.num}${flagged ? ", flagged" : ""}${st ? ", " + st : ""}`,
                "aria-current": q.index === state.current ? "true" : false,
                disabled: !inScope(q) || hide
            }, String(q.num));
            if (flagged) b.appendChild(el("span", { class: "flag", "aria-hidden": "true" }, "⚑"));
            const icon = { correct: "✓", partial: "◐", wrong: "✗" }[st];
            if (icon) b.appendChild(el("span", { class: "mark", "aria-hidden": "true" }, icon));
            b.addEventListener("click", () => goTo(q.index));
            grid.appendChild(b);
        });
        side.appendChild(grid);
    });
    side.appendChild(el("div", { class: "legend" },
        `<div><span></span>Unanswered</div><div><span class="l-ans"></span>Answered</div>
         <div><span class="l-flag"></span>Flagged ⚑</div><div><span class="l-ok"></span>Correct ✓</div>
         <div><span class="l-part"></span>Partial ◐</div><div><span class="l-bad"></span>Wrong ✗</div>`));
    const lab = el("label", { class: "toggle" });
    const cb = el("input", { type: "checkbox" });
    cb.checked = !!state.flaggedOnly;
    cb.addEventListener("change", () => { state.flaggedOnly = cb.checked; save(); renderNav(); });
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(`Show flagged only (${Object.keys(state.flags).filter(k => state.flags[k]).length})`));
    side.appendChild(lab);
    const acts = el("div", { class: "actions" });
    const reset = el("button", { class: "btn danger", type: "button" }, "Reset attempt");
    reset.addEventListener("click", () => {
        if (!confirm("Reset this attempt? All answers, flags and the timer will be cleared. Your best score and attempt history are kept.")) return;
        state = Object.assign(freshState(), { active: false });
        save();
        document.getElementById("banner").hidden = true;
        renderCover();
    });
    acts.appendChild(reset);
    side.appendChild(acts);
}

function goTo(i) {
    if (i < 0 || i >= QUESTIONS.length || !inScope(QUESTIONS[i])) return;
    state.current = i;
    save();
    if (view !== "exam") renderExam();
    else { renderNav(); renderQuestion(); updateTopbar(); }
    window.scrollTo(0, 0);
}

function step(dir) {
    let i = state.current + dir;
    while (i >= 0 && i < QUESTIONS.length && !inScope(QUESTIONS[i])) i += dir;
    goTo(i);
}

function toggleFlag() {
    const q = QUESTIONS[state.current];
    state.flags[q.id] = !state.flags[q.id];
    if (!state.flags[q.id]) delete state.flags[q.id];
    save();
    renderNav();
    const fb = document.getElementById("flagbtn");
    if (fb) {
        fb.classList.toggle("on", !!state.flags[q.id]);
        fb.textContent = state.flags[q.id] ? "⚑ Flagged" : "⚐ Flag for review";
    }
}

function badges(q) {
    const b = el("div", { class: "badges" });
    b.appendChild(el("span", { class: "badge sec" }, SECTION_NAMES[q.section]));
    if (q.section === 1) {
        b.appendChild(el("span", { class: "badge" }, q.type === "multi" ? "Multi-answer" : "Best-answer"));
        b.appendChild(el("span", { class: "badge" }, `Tier ${q.tier}`));
    }
    b.appendChild(el("span", { class: "badge" }, esc(q.topic)));
    b.appendChild(el("span", { class: "badge marks" }, `${q.marks} marks`));
    return b;
}

function renderQuestion() {
    const pane = document.getElementById("qpane");
    const q = QUESTIONS[state.current];
    pane.innerHTML = "";
    const card = el("article", { class: "q", id: q.id });
    const top = el("div", { class: "qtop" });
    top.appendChild(badges(q));
    const flag = el("button", { class: "btn-small" + (state.flags[q.id] ? " on" : ""), type: "button", id: "flagbtn" },
        state.flags[q.id] ? "⚑ Flagged" : "⚐ Flag for review");
    flag.addEventListener("click", toggleFlag);
    top.appendChild(flag);
    card.appendChild(top);
    const title = q.section === 1 ? `Question ${q.num}` : `Question ${q.num} (${q.id})`;
    card.appendChild(el("h2", { class: "qhead" }, `${esc(title)}<small>${q.marks} marks</small>`));
    card.appendChild(el("div", { class: "stem" }, q.stem));
    if (q.section === 1) renderMCQBody(q, card);
    else renderWrittenBody(q, card);
    pane.appendChild(card);

    const pager = el("div", { class: "pager" });
    const prev = el("button", { class: "btn secondary", type: "button" }, "← Previous");
    prev.addEventListener("click", () => step(-1));
    const next = el("button", { class: "btn secondary", type: "button" }, "Next →");
    next.addEventListener("click", () => step(1));
    const scope = scopeQuestions();
    prev.disabled = scope[0].index === q.index;
    next.disabled = scope[scope.length - 1].index === q.index;
    pager.appendChild(prev);
    pager.appendChild(el("span", { class: "pill" }, `${scope.indexOf(q) + 1} of ${scope.length}`));
    pager.appendChild(next);
    pane.appendChild(pager);
}

/* ---------------- Section A ---------------- */

function renderMCQBody(q, card) {
    if (q.code) card.appendChild(codeBlock(q.code, q.codeTitle || "Code", true));
    if (q.svg) card.appendChild(diagram(q.svg));
    if (q.stemAfter) card.appendChild(el("div", { class: "stem" }, q.stemAfter));
    const multi = q.type === "multi";
    card.appendChild(el("div", { class: "instr" },
        multi ? "Select all that apply — negative marking applies (a question never scores below 0)."
              : "Select the BEST answer."));
    const s = mcqState(q);
    const locked = s.submitted || state.finished;
    const show = locked;
    const order = optionOrder(q);
    const box = el("div", { class: "opts", role: multi ? "group" : "radiogroup" });
    const rows = [];
    const res = show ? mcqResult(q) : null;
    order.forEach((idx, pos) => {
        const o = q.options[idx];
        const lab = el("label", { class: "opt" + (locked ? " locked" : "") });
        const inp = el("input", { type: multi ? "checkbox" : "radio", name: "opt-" + q.id, value: String(idx) });
        inp.checked = s.sel.indexOf(idx) !== -1;
        inp.disabled = locked;
        if (inp.checked && !show) lab.classList.add("sel");
        inp.addEventListener("change", () => {
            if (multi) s.sel = rows.filter(r => r.inp.checked).map(r => r.idx);
            else s.sel = [idx];
            rows.forEach(r => r.lab.classList.toggle("sel", r.inp.checked));
            save();
            renderNav();
            updateTopbar();
        });
        lab.appendChild(inp);
        lab.appendChild(el("span", { class: "key", "aria-hidden": "true" }, String(pos + 1)));
        const txt = el("span", { class: "otext" }, q.optionsMono ? `<span class="mono">${esc(o.text)}</span>` : esc(o.text));
        lab.appendChild(txt);
        if (show) {
            const ticked = inp.checked;
            let cls, msg;
            if (ticked && o.correct) { cls = "ok"; msg = multi ? `✓ Correct, ticked (+${fmt2(res.unit)})` : "✓ Correct answer, chosen"; }
            else if (ticked && !o.correct) { cls = "bad"; msg = multi ? `✗ Incorrect, ticked (−${fmt2(res.unit)})` : "✗ Your answer, incorrect"; }
            else if (!ticked && o.correct) { cls = "miss"; msg = multi ? "◐ Missed: this option is correct" : "◐ This was the correct answer"; }
            else { cls = "neutral"; msg = "Not ticked, correctly left out"; }
            lab.classList.add(cls);
            txt.appendChild(el("span", { class: "fb" }, msg));
        }
        box.appendChild(lab);
        rows.push({ lab, inp, o, idx });
    });
    card.appendChild(box);

    if (!locked) {
        const row = el("div", { class: "row" });
        const submit = el("button", { class: "btn", type: "button", id: "submit-mcq" }, "Submit answer");
        submit.addEventListener("click", () => submitMCQ(q));
        row.appendChild(submit);
        card.appendChild(row);
    }

    if (show) {
        const detail = multi
            ? `${res.nOk} correct tick${res.nOk === 1 ? "" : "s"} +${fmt2(res.plus)}, ${res.nBad} wrong tick${res.nBad === 1 ? "" : "s"} −${fmt2(res.minus)}` +
              (res.plus - res.minus < 0 ? " (clamped to 0)" : "")
            : (s.sel.length ? "" : "No option was chosen.");
        card.appendChild(verdictBox(res.score, q.marks, detail, true));
        const ex = q.explanation;
        const notes = order.map(i => q.options[i]).map(o =>
            `<li><strong>${q.optionsMono ? `<code class="inline">${esc(o.text)}</code>` : esc(o.text)}</strong> — <em>${o.correct ? (multi ? "true / correct" : "best answer") : (multi ? "false / not correct" : "not the best answer")}</em><br>${esc(o.note)}</li>`).join("");
        card.appendChild(el("details", { class: "expl", open: true },
            `<summary>Explanation</summary>
             <h4>Verdict</h4><p>${esc(ex.verdict)}</p>
             <h4>Reasoning</h4>${ex.reasoning}
             <h4>Every option</h4><ul>${notes}</ul>
             <p class="src"><strong>Source:</strong> ${esc(ex.source)}</p>`));
    }
}

function submitMCQ(q) {
    const s = mcqState(q);
    if (s.submitted || state.finished) return;
    if (!s.sel.length && !confirm("No option selected. Submit with 0 marks?")) return;
    s.submitted = true;
    save();
    renderNav();
    renderQuestion();
    updateTopbar();
}

/* ---------------- Sections B and C ---------------- */

function wireTab(ta) {
    ta.addEventListener("keydown", e => {
        if (e.key !== "Tab") return;
        e.preventDefault();
        const s = ta.selectionStart, v = ta.value;
        if (e.shiftKey) {
            const lineStart = v.lastIndexOf("\n", s - 1) + 1;
            const m = v.slice(lineStart).match(/^ {1,4}/);
            if (m) {
                ta.value = v.slice(0, lineStart) + v.slice(lineStart + m[0].length);
                ta.selectionStart = ta.selectionEnd = Math.max(lineStart, s - m[0].length);
            }
        } else {
            ta.value = v.slice(0, s) + "    " + v.slice(ta.selectionEnd);
            ta.selectionStart = ta.selectionEnd = s + 4;
        }
        ta.dispatchEvent(new Event("input"));
    });
}

function renderWrittenBody(q, card) {
    if (q.svg) card.appendChild(diagram(q.svg, q.svgCaption));
    const total = el("div", { class: "qtotal" });
    q.parts.forEach((p, pi) => card.appendChild(renderPart(q, p, pi, total)));
    refreshTotal(q, total);
    card.appendChild(total);
}

function refreshTotal(q, total) {
    const done = q.parts.filter((_, pi) => partState(q, pi).submitted).length;
    if (done) {
        total.textContent = `Question total: ${fmt(questionScore(q))} / ${q.marks}  ·  ${done} of ${q.parts.length} parts marked`;
    } else {
        const typed = q.parts.filter((_, pi) => partHasInput(q, pi)).length;
        total.textContent = `${typed} of ${q.parts.length} parts answered · submit each part to see its marking`;
    }
}

function partTables(p) {
    if (!p.table) return [];
    return Array.isArray(p.table) ? p.table : [p.table];
}

function fieldTable(q, p, pi, t, ps, locked, onInput, fb) {
    const fmap = {};
    p.fields.forEach(f => { fmap[f.id] = f; });
    const wrap = el("div", { class: "tablewrap" });
    const tbl = el("table", { class: "fields" });
    tbl.appendChild(el("tr", null, t.head.map(h => `<th>${h}</th>`).join("")));
    t.rows.forEach(r => {
        const tr = el("tr");
        r.forEach(c => {
            if (c && typeof c === "object" && c.f) {
                const f = fmap[c.f];
                const td = el("td");
                const inp = el("input", { class: "fld", type: "text", spellcheck: "false", autocomplete: "off",
                    "aria-label": f.label, size: String(f.size || 12), "data-fid": f.id });
                inp.value = ps.vals[f.id] || "";
                inp.readOnly = locked;
                inp.addEventListener("input", () => onInput(f.id, inp.value));
                td.appendChild(inp);
                if (fb) {
                    const ok = !!(ps.fok && ps.fok[f.id]);
                    td.classList.add(ok ? "fok" : "fbad");
                    td.appendChild(el("span", { class: "fmark" }, ok ? "✓" : "✗"));
                    const tagHtml = ps.fedited && ps.fedited[f.id] ? '<span class="tag edited">edited</span>' : "";
                    const acc = el("span", { class: "facc" }, `Accepted: ${esc(f.model)} (${f.marks} mark${f.marks === 1 ? "" : "s"})${tagHtml} `);
                    const ov = el("button", { class: "btn-small fover", type: "button", title: "Override the verdict for this box" }, ok ? "mark wrong" : "mark correct");
                    ov.addEventListener("click", () => fb.override(f.id));
                    acc.appendChild(ov);
                    td.appendChild(acc);
                }
                tr.appendChild(td);
            } else {
                tr.appendChild(el("td", null, c == null ? "" : String(c)));
            }
        });
        tbl.appendChild(tr);
    });
    wrap.appendChild(tbl);
    return wrap;
}

function renderPart(q, p, pi, total) {
    const ps = partState(q, pi);
    const locked = ps.submitted || state.finished;
    const wrap = el("section", { class: "part", id: `${q.id}-p${pi}` });
    wrap.appendChild(el("div", { class: "part-head" },
        `<span class="plabel">${esc(p.label)}</span><span class="pmarks">(${fmt(p.marks)} mark${p.marks === 1 ? "" : "s"})</span>`));
    wrap.appendChild(el("div", { class: "pprompt" }, p.prompt));
    if (p.svg) wrap.appendChild(diagram(p.svg, p.svgCaption));

    let saveTimer = null;
    const deferredSave = () => {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => { save(); renderNav(); updateTopbar(); refreshTotal(q, total); }, 400);
    };
    const rerender = () => {
        const fresh = renderPart(q, p, pi, total);
        wrap.replaceWith(fresh);
        refreshTotal(q, total);
        renderNav();
        updateTopbar();
    };
    const fbApi = ps.submitted ? {
        override: fid => {
            ps.fok[fid] = !ps.fok[fid];
            ps.fedited[fid] = true;
            save();
            rerender();
        }
    } : null;

    partTables(p).forEach(t => wrap.appendChild(fieldTable(q, p, pi, t, ps, locked, (fid, v) => {
        ps.vals[fid] = v; deferredSave();
    }, fbApi)));

    let ta = null;
    if (p.rubric.length) {
        if (p.fields.length) wrap.appendChild(el("div", { class: "label-sm" }, "Written answer"));
        ta = el("textarea", {
            class: "ans" + (p.kind === "code" ? " code" : ""), spellcheck: "false", autocomplete: "off", autocorrect: "off", autocapitalize: "off",
            "aria-label": `Answer for ${q.title} ${p.label}`,
            placeholder: p.kind === "code" ? "Type your Python code here…" : "Type your answer here…"
        });
        ta.value = ps.text;
        ta.readOnly = locked;
        wireTab(ta);
        wrap.appendChild(ta);
        const counter = el("div", { class: "counter" });
        const count = () => {
            const v = ta.value;
            counter.textContent = `${v ? v.split("\n").length : 0} lines · ${v.length} characters`;
        };
        count();
        ta.addEventListener("input", () => { ps.text = ta.value; count(); deferredSave(); });
        wrap.appendChild(counter);
    }

    if (!locked) {
        const row = el("div", { class: "row" });
        const submit = el("button", { class: "btn", type: "button" }, "Submit answer");
        submit.addEventListener("click", () => {
            if (ta) ps.text = ta.value;
            wrap.querySelectorAll("input.fld").forEach(i => { ps.vals[i.getAttribute("data-fid")] = i.value; });
            if (!partHasInput(q, pi) && !confirm("This part is empty. Submit it with 0 marks?")) return;
            submitPart(q, pi);
            save();
            rerender();
        });
        row.appendChild(submit);
        wrap.appendChild(row);
    }
    if (ps.submitted) renderPartFeedback(q, p, pi, wrap, total);
    return wrap;
}

function submitPart(q, pi) {
    const p = q.parts[pi], ps = partState(q, pi);
    ps.submitted = true;
    ps.ticks = autoTicks(p, ps.text);
    ps.edited = p.rubric.map(() => false);
    ps.fok = {};
    ps.fedited = {};
    p.fields.forEach(f => { ps.fok[f.id] = fieldCorrect(f, ps.vals[f.id]); ps.fedited[f.id] = false; });
}

function renderPartFeedback(q, p, pi, fb, total) {
    const ps = partState(q, pi);
    const vSlot = el("div");
    fb.appendChild(vSlot);
    const recompute = () => {
        vSlot.innerHTML = "";
        const nf = p.fields.length, nOk = p.fields.filter(f => ps.fok[f.id]).length;
        const bits = [];
        if (nf) bits.push(`${nOk} of ${nf} boxes correct (each box shows ✓ or ✗ with the accepted answer)`);
        if (p.rubric.length) bits.push("written points ticked by keyword check where possible; change any tick that is wrong");
        vSlot.appendChild(verdictBox(partScore(q, pi), p.marks, bits.join(" · ")));
        refreshTotal(q, total);
    };
    if (p.rubric.length) {
        fb.appendChild(el("div", { class: "label-sm" }, "Marking rubric"));
        const ul = el("ul", { class: "rubric" });
        p.rubric.forEach((r, i) => {
            const li = el("li", { class: ps.ticks[i] ? "on" : "" });
            const cb = el("input", { type: "checkbox", "aria-label": r.text });
            cb.checked = !!ps.ticks[i];
            const tagCls = ps.edited[i] ? "edited" : (r.auto ? "auto" : "manual");
            const tagTxt = ps.edited[i] ? "edited" : (r.auto ? "auto" : "tick yourself");
            const tag = el("span", { class: "tag " + tagCls }, tagTxt);
            cb.addEventListener("change", () => {
                ps.ticks[i] = cb.checked;
                ps.edited[i] = true;
                li.classList.toggle("on", cb.checked);
                tag.className = "tag edited";
                tag.textContent = "edited";
                save();
                recompute();
                renderNav();
                updateTopbar();
            });
            li.appendChild(cb);
            const t = el("span", { class: "rtext" }, esc(r.text));
            t.appendChild(tag);
            li.appendChild(t);
            li.appendChild(el("span", { class: "rmarks" }, `${fmt(r.marks)} mark${r.marks === 1 ? "" : "s"}`));
            ul.appendChild(li);
        });
        fb.appendChild(ul);
    }
    recompute();
    const d = el("details", { class: "expl", open: true }, "<summary>Model answer & explanation</summary>");
    if (p.fields.length) {
        const forms = Array.from(new Set(p.fields.map(f => acceptedForms(f)).filter(Boolean)));
        d.appendChild(el("p", { class: "src" }, "<strong>Notation accepted:</strong> " + forms.map(esc).join(" · ")));
    }
    if (p.modelAnswer) {
        d.appendChild(el("h4", null, "Model answer"));
        d.appendChild(codeBlock(p.modelAnswer, p.kind === "code" ? "Model answer (runs as shown)" : "Model answer", p.kind === "code"));
    }
    if (p.explain) {
        d.appendChild(el("h4", null, "Working"));
        d.appendChild(el("div", null, p.explain));
    }
    d.appendChild(el("h4", null, "Common mistakes"));
    d.appendChild(el("ul", null, p.commonMistakes.map(m => `<li>${esc(m)}</li>`).join("")));
    d.appendChild(el("p", { class: "src" }, `<strong>Source:</strong> ${esc(p.source)}`));
    fb.appendChild(d);
}

/* ================================================================== */
/*  FINISH & RESULTS                                                   */
/* ================================================================== */

function finish() {
    const scope = scopeQuestions();
    const flagged = scope.filter(q => state.flags[q.id]).length;
    const unanswered = scope.filter(q => !isAnswered(q)).length;
    if (!confirm(`You have ${flagged} flagged and ${unanswered} unanswered question${unanswered === 1 ? "" : "s"} — finish anyway?`)) return;
    scope.forEach(q => {
        if (q.section === 1) mcqState(q).submitted = true;
        else q.parts.forEach((_, pi) => { if (!partState(q, pi).submitted) submitPart(q, pi); });
    });
    state.finished = true;
    state.finishedAt = Date.now();
    const score = scope.reduce((a, q) => a + questionScore(q), 0);
    const max = scope.reduce((a, q) => a + q.marks, 0);
    const started = state.retry ? state.retry.startedAt : state.startedAt;
    state.attempts.push({
        when: state.finishedAt, retry: !!state.retry, score: score, max: max,
        timeMs: state.finishedAt - started,
        overMs: state.retry ? 0 : Math.max(0, state.finishedAt - state.startedAt - DURATION)
    });
    if (!state.retry && (state.best == null || score > state.best)) state.best = score;
    save();
    document.getElementById("banner").hidden = true;
    renderResults();
}

function bar(got, max) {
    return `<div class="bar-mini"><div style="width:${max ? got / max * 100 : 0}%"></div></div>`;
}

function renderResults() {
    view = "results";
    updateTopbar();
    const app = document.getElementById("app");
    app.innerHTML = "";
    const page = el("div", { class: "page" });
    const card = el("div", { class: "cover-card" });
    const scope = scopeQuestions();
    const score = scope.reduce((a, q) => a + questionScore(q), 0);
    const max = scope.reduce((a, q) => a + q.marks, 0);
    const started = state.retry ? state.retry.startedAt : state.startedAt;
    const used = state.finishedAt - started;
    const over = state.retry ? 0 : Math.max(0, used - DURATION);
    card.appendChild(el("div", { class: "cover-head" },
        `<div class="inst">${state.retry ? "RETRY OF MISSED QUESTIONS" : "RESULTS"}</div>
         <h1>${state.retry ? "Retry results" : "Your results"}</h1>`));
    card.appendChild(el("div", { class: "bigscore" },
        `<div class="val">${fmt(score)} / ${fmt(max)}</div><div class="sub">${fmt(max ? score / max * 100 : 0)}%</div>`));

    const mcqs = scope.filter(q => q.section === 1);
    const best = mcqs.filter(q => q.type === "best"), multi = mcqs.filter(q => q.type === "multi");
    const lost = multi.reduce((a, q) => a + (mcqState(q).submitted ? mcqResult(q).minus : 0), 0);
    const sum = qs => qs.reduce((a, q) => a + questionScore(q), 0), mx = qs => qs.reduce((a, q) => a + q.marks, 0);
    const stats = el("div", { class: "stats" });
    stats.innerHTML = `
      <div class="stat"><div class="k">Time used</div><div class="v">${fmtTime(used)}</div></div>
      <div class="stat"><div class="k">Overtime</div><div class="v">${state.retry ? "—" : fmtTime(over)}</div></div>
      <div class="stat"><div class="k">Lost to negative marking</div><div class="v">${fmt2(lost)}</div></div>
      <div class="stat"><div class="k">Best-answer accuracy</div><div class="v">${best.length ? fmt(sum(best) / mx(best) * 100) + "%" : "—"}</div></div>
      <div class="stat"><div class="k">Multi-answer accuracy</div><div class="v">${multi.length ? fmt(sum(multi) / mx(multi) * 100) + "%" : "—"}</div></div>
      <div class="stat"><div class="k">Best score (full paper)</div><div class="v">${state.best == null ? "—" : fmt(state.best) + " / 100"}</div></div>`;
    card.appendChild(stats);

    card.appendChild(el("h2", null, "By section"));
    const secRows = [1, 2, 3].map(sn => { const qs = scope.filter(q => q.section === sn); return { sn, qs }; }).filter(x => x.qs.length);
    card.appendChild(el("table", { class: "plain" },
        `<tr><th>Section</th><th class="num">Marks</th><th></th></tr>` + secRows.map(x =>
            `<tr><td>${SECTION_NAMES[x.sn]}</td><td class="num">${fmt(sum(x.qs))} / ${fmt(mx(x.qs))}</td><td>${bar(sum(x.qs), mx(x.qs))}</td></tr>`).join("")));

    const lec = {};
    scope.forEach(q => {
        const k = q.section === 1 ? q.topic : q.topic;
        const t = lec[k] || (lec[k] = { got: 0, max: 0, order: q.section * 100 + q.index });
        t.got += questionScore(q); t.max += q.marks;
    });
    card.appendChild(el("h2", null, "By lecture"));
    card.appendChild(el("table", { class: "plain" },
        `<tr><th>Lecture / question</th><th class="num">Marks</th><th class="num">%</th></tr>` +
        Object.keys(lec).sort((a, b) => lec[a].order - lec[b].order).map(k => `<tr><td>${esc(k)}</td><td class="num">${fmt(lec[k].got)} / ${fmt(lec[k].max)}</td>
            <td class="num">${fmt(lec[k].got / lec[k].max * 100)}</td></tr>`).join("")));

    if (mcqs.length) {
        card.appendChild(el("h2", null, "Section A by tier"));
        const names = { 1: "Tier 1 — recall-plus", 2: "Tier 2 — applied", 3: "Tier 3 — hard" };
        card.appendChild(el("table", { class: "plain" },
            `<tr><th>Tier</th><th class="num">Questions</th><th class="num">Marks</th><th class="num">%</th></tr>` +
            [1, 2, 3].map(t => { const qs = mcqs.filter(q => q.tier === t); return qs.length ?
                `<tr><td>${names[t]}</td><td class="num">${qs.length}</td><td class="num">${fmt(sum(qs))} / ${fmt(mx(qs))}</td><td class="num">${fmt(sum(qs) / mx(qs) * 100)}</td></tr>` : ""; }).join("")));
    }

    const missed = scope.filter(q => questionScore(q) < q.marks - 1e-9);
    card.appendChild(el("h2", null, `Missed or partly missed (${missed.length})`));
    if (missed.length) {
        const ul = el("ul", { class: "missed" });
        missed.forEach(q => {
            const li = el("li");
            const a = el("a", { href: "#" },
                `<span>Q${q.num} · ${esc(q.section === 1 ? "MCQ · " + q.topic : q.topic)}</span>
                 <span class="sc">${fmt(questionScore(q))} / ${q.marks}</span>`);
            a.addEventListener("click", e => { e.preventDefault(); goTo(q.index); });
            li.appendChild(a);
            ul.appendChild(li);
        });
        card.appendChild(ul);
    } else {
        card.appendChild(el("p", null, "Nothing missed. Full marks on every question in this attempt."));
    }

    const row = el("div", { class: "row" });
    const review = el("button", { class: "btn secondary", type: "button" }, "Review all answers");
    review.addEventListener("click", () => goTo(scope[0].index));
    row.appendChild(review);
    if (missed.length) {
        const retry = el("button", { class: "btn", type: "button" }, `Retry missed only (${missed.length})`);
        retry.addEventListener("click", () => startRetry(missed.map(q => q.id)));
        row.appendChild(retry);
    }
    const fresh = el("button", { class: "btn secondary", type: "button" }, "New attempt");
    fresh.addEventListener("click", () => {
        if (!confirm("Start a new attempt? This attempt's answers will be cleared; its score stays in the history.")) return;
        state = Object.assign(freshState(), { active: false });
        save();
        renderCover();
    });
    row.appendChild(fresh);
    card.appendChild(row);

    if (state.attempts.length) {
        card.appendChild(el("h2", null, "Attempt history"));
        card.appendChild(el("table", { class: "plain" },
            `<tr><th>When</th><th>Type</th><th class="num">Score</th><th class="num">Time</th></tr>` +
            state.attempts.slice().reverse().map(a =>
                `<tr><td>${esc(new Date(a.when).toLocaleString())}</td><td>${a.retry ? "Retry of missed questions" : "Full paper"}</td>
                 <td class="num">${fmt(a.score)} / ${fmt(a.max)}</td><td class="num">${fmtTime(a.timeMs)}${a.overMs ? " (+" + fmtTime(a.overMs) + " over)" : ""}</td></tr>`).join("")));
    }
    page.appendChild(card);
    app.appendChild(page);
    window.scrollTo(0, 0);
}

function startRetry(ids) {
    ids.forEach(id => {
        const q = BY_ID[id];
        if (q.section === 1) state.mcq[id] = { sel: [], submitted: false };
        else delete state.written[id];
    });
    state.retry = { ids: ids, startedAt: Date.now() };
    state.finished = false;
    state.finishedAt = null;
    state.current = BY_ID[ids[0]].index;
    save();
    showBanner(`Retry: ${ids.length} question${ids.length === 1 ? "" : "s"} you missed. Your original attempt stays in the attempt history.`, "info");
    renderExam();
}

/* ================================================================== */
/*  WIRING                                                             */
/* ================================================================== */

document.getElementById("finish-btn").addEventListener("click", finish);
document.getElementById("results-btn").addEventListener("click", renderResults);

document.addEventListener("keydown", e => {
    if (view !== "exam") return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "textarea" || (tag === "input" && e.target.type === "text")) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const q = QUESTIONS[state.current];
    if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
    else if (e.key === "f" || e.key === "F") { toggleFlag(); e.preventDefault(); }
    else if (q.section === 1 && /^[1-5]$/.test(e.key)) {
        const inputs = document.querySelectorAll(`#${q.id} .opt input`);
        const inp = inputs[Number(e.key) - 1];
        if (inp && !inp.disabled) {
            if (inp.type === "radio") inp.checked = true;
            else inp.checked = !inp.checked;
            inp.dispatchEvent(new Event("change"));
            e.preventDefault();
        }
    } else if (e.key === "Enter" && q.section === 1 && tag !== "button") {
        const b = document.getElementById("submit-mcq");
        if (b) { b.click(); e.preventDefault(); }
    }
});

(function themeToggle() {
    const root = document.documentElement;
    const btn = document.getElementById("theme-toggle");
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const current = () => root.getAttribute("data-theme") || (mq.matches ? "dark" : "light");
    const label = () => {
        const dark = current() === "dark";
        btn.textContent = dark ? "☀ Light" : "☾ Dark";
        btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    };
    btn.addEventListener("click", () => {
        const next = current() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("cn-theme", next); } catch (e) { /* storage blocked */ }
        label();
    });
    mq.addEventListener("change", label);
    label();
})();

/* ================================================================== */
/*  SELF-TEST  (open with ?selftest=1)                                 */
/* ================================================================== */

function selfTest() {
    const lines = [];
    let fails = 0;
    const check = (ok, msg) => { if (!ok) fails++; lines.push(`${ok ? "PASS" : "FAIL"} ${msg}`); };
    const total = QUESTIONS.reduce((a, q) => a + q.marks, 0);
    const bySec = [1, 2, 3].map(s => Math.round(QUESTIONS.filter(q => q.section === s).reduce((a, q) => a + q.marks, 0) * 100) / 100);
    check(Math.abs(total - 100) < 1e-9 && bySec.join() === "40,40,20", `marks total ${fmt(total)} (sections ${bySec.join(" / ")})`);
    check(QUESTIONS.length === 57, `question count ${QUESTIONS.length} (57)`);
    const mcq = QUESTIONS.filter(q => q.section === 1);
    const multi = mcq.filter(q => q.type === "multi"), best = mcq.filter(q => q.type === "best");
    check(mcq.length === 50 && multi.length === 32 && best.length === 18, `MCQ counts: ${mcq.length} total, ${multi.length} multi, ${best.length} best`);
    check(mcq.every(q => Math.abs(q.marks - 0.8) < 1e-9), "every MCQ is worth 0.8 marks");
    check(multi.every(q => q.options.length === 5) && best.every(q => q.options.length === 4), "multi-answer has 5 options, best-answer has 4");
    check(best.every(q => q.options.filter(o => o.correct).length === 1), "every best-answer question has exactly one correct option");
    const ks = multi.map(q => q.options.filter(o => o.correct).length);
    const dist = [1, 2, 3, 4].map(k => ks.filter(x => x === k).length).join(",");
    check(dist === "4,10,11,7", `multi-answer correct-count distribution (1,2,3,4 correct): ${dist} (4,10,11,7)`);
    const tiers = [1, 2, 3].map(t => mcq.filter(q => q.tier === t).length).join(",");
    check(tiers === "8,17,25", `tiers 1/2/3: ${tiers} (8,17,25)`);
    const lecs = {};
    mcq.forEach(q => { lecs[q.lecture] = (lecs[q.lecture] || 0) + 1; });
    const want = { L01: 5, L02: 3, L03: 4, L04: 9, L05: 7, L05A: 3, L06: 3, L07: 8, L08: 6, L09: 2 };
    check(Object.keys(want).every(k => lecs[k] === want[k]), `per-lecture counts ${JSON.stringify(lecs)}`);
    const concept = mcq.filter(q => q.kind === "concept").length, applied = mcq.filter(q => q.kind === "applied").length;
    check(concept >= 25 && applied >= 20, `concept ${concept} (>= 25), applied ${applied} (>= 20)`);
    const has = f => mcq.filter(q => q.forms.indexOf(f) !== -1);
    const figs = mcq.filter(q => q.svg && FIGS[q.svg]).length;
    check(figs >= 12, `MCQs with a figure: ${figs} (>= 12)`);
    check(has("calc").length >= 8, `MCQs with a calculation: ${has("calc").length} (>= 8)`);
    check(mcq.filter(q => q.code).length >= 2, `MCQs with Python code: ${mcq.filter(q => q.code).length} (>= 2)`);
    const neg = mcq.filter(q => /\b(NOT|FAIL|LEAST|IMPOSSIBLE)\b/.test(q.stem.replace(/<[^>]+>/g, "")));
    check(neg.length >= 8, `negated stems: ${neg.length} (>= 8)`);
    const ab = has("ab").filter(q => q.type === "best" && /Student A/.test(q.stem) && /Student B/.test(q.stem));
    check(ab.length >= 4, `Student A / Student B best-answer questions: ${ab.length} (>= 4)`);
    check(has("x").length >= 6, `MCQs combining two lectures: ${has("x").length} (>= 6)`);
    const ru = has("ru").filter(q => q.type === "best" && q.options.some(o => !o.correct && /^Runner-up/.test(o.note)));
    check(ru.length >= 6, `best-answer questions with a named runner-up: ${ru.length} (>= 6)`);
    check(mcq.every(q => !/all of the above|none of the above|both [a-e] and/i.test(q.options.map(o => o.text).join(" "))), "no banned option forms");
    let longest = 0, shortest = 0;
    mcq.forEach(q => {
        const L = q.options.map(o => o.text.length);
        const mx = Math.max(...L), mn = Math.min(...L);
        check(mx / mn <= 1.25, `${q.id} option length ratio ${(mx / mn).toFixed(3)} (<= 1.25)`);
        if (q.options.some((o, i) => o.correct && L[i] === mx)) longest++;
        if (q.options.some((o, i) => o.correct && L[i] === mn)) shortest++;
        check(q.options.every(o => o.note && o.note.length > 20), `${q.id} every option has a note`);
        check(!!(q.explanation.verdict && q.explanation.reasoning && q.explanation.source), `${q.id} has verdict, reasoning and source`);
    });
    check(longest <= 20, `longest option is a correct option in ${longest} questions (<= 20)`);
    check(shortest >= 18, `shortest option is a correct option in ${shortest} questions (>= 18)`);
    QUESTIONS.filter(q => q.parts).forEach(q => {
        const partSum = q.parts.reduce((a, p) => a + p.marks, 0);
        check(Math.abs(partSum - q.marks) < 1e-9, `${q.id}: parts sum to ${fmt(partSum)} / ${q.marks}`);
        check(q.parts.length >= 3 && q.parts.length <= 5, `${q.id}: ${q.parts.length} lettered parts`);
        q.parts.forEach(p => {
            const fsum = p.fields.reduce((a, f) => a + f.marks, 0);
            const rsum = p.rubric.reduce((a, r) => a + r.marks, 0);
            check(Math.abs(fsum + rsum - p.marks) < 1e-9, `${q.id} ${p.label}: fields ${fmt(fsum)} + rubric ${fmt(rsum)} = ${fmt(p.marks)}`);
            check(p.commonMistakes.length >= 2 && p.commonMistakes.length <= 4 && !!p.source, `${q.id} ${p.label}: ${p.commonMistakes.length} common mistakes and a source`);
            if (p.rubric.length) {
                const autoMax = p.rubric.reduce((a, r) => a + (r.auto ? r.marks : 0), 0);
                const sc = t => p.rubric.reduce((a, r) => a + (r.auto && runCheck(r.check, t, p.kind) ? r.marks : 0), 0);
                const model = sc(p.modelAnswer), empty = sc("");
                const wrong = p.wrongAnswers.map(sc);
                const ok = Math.abs(model - autoMax) < 1e-9 && empty === 0 && wrong.length > 0 && wrong.every(w => w < rsum - 1e-9) &&
                    p.rubric.every(r => r.marks >= 0.5 && r.marks <= 2);
                check(ok, `${q.id} ${p.label} text: model ${fmt(model)}/${fmt(autoMax)} · empty ${fmt(empty)} · wrong [${wrong.map(fmt).join(", ")}] of ${fmt(rsum)}`);
            }
            p.fields.forEach(f => {
                const m = fieldCorrect(f, String(f.accept[0]));
                const alts = f.alts.map(a => fieldCorrect(f, a));
                const near = f.near.map(n => fieldCorrect(f, n));
                const blank = fieldCorrect(f, "");
                check(m && alts.every(Boolean) && near.length > 0 && near.every(x => !x) && !blank,
                    `${q.id} ${p.label} field "${f.label}": model ${m ? "ok" : "REJECTED"} · alternatives [${alts.map(x => x ? "ok" : "REJECTED").join(", ")}] · near-miss [${near.map(x => x ? "ACCEPTED" : "rejected").join(", ")}]`);
            });
        });
    });
    lines.unshift(`SELF-TEST: ${fails} failure${fails === 1 ? "" : "s"} (${lines.length} checks)`);
    const out = lines.join("\n");
    console.log(out);
    const box = document.getElementById("selftest");
    box.textContent = out;
    box.style.display = "block";
    window.__selftest = { fails, out };
}

/* ================================================================== */
/*  START                                                              */
/* ================================================================== */

if (/[?&]selftest=1/.test(location.search)) selfTest();
if (state && state.active && !state.finished && /[?&]resume=1/.test(location.search)) renderExam();
else renderCover();
startTimer();
</script>
