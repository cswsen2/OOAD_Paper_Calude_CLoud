nt-baseline=\"central\">F (8)<\/text><rect class=\"leaf\" x=\"484.0\" y=\"279.0\" width=\"52.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"510.0\" y=\"292.0\" text-anchor=\"middle\" dominant-baseline=\"central\">C (6)<\/text><rect class=\"grp\" x=\"431.0\" y=\"199.0\" width=\"68.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"465.0\" y=\"212.0\" text-anchor=\"middle\" dominant-baseline=\"central\">FC (14)<\/text><rect class=\"grp\" x=\"333.0\" y=\"119.0\" width=\"84.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"375.0\" y=\"132.0\" text-anchor=\"middle\" dominant-baseline=\"central\">AEFC (37)<\/text><rect class=\"grp\" x=\"190.0\" y=\"39.0\" width=\"100.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"240.0\" y=\"52.0\" text-anchor=\"middle\" dominant-baseline=\"central\">BDAEFC (90)<\/text><\/svg><\/figure><table class=\"grid num\"><thead><tr><th>symbol<\/th><th>frequency<\/th><th>codeword<\/th><th>length<\/th><th>freq × length<\/th><\/tr><\/thead><tbody><tr><td>B<\/td><td>36<\/td><td><span class=\"mono\">00<\/span><\/td><td>2<\/td><td>72<\/td><\/tr><tr><td>D<\/td><td>17<\/td><td><span class=\"mono\">01<\/span><\/td><td>2<\/td><td>34<\/td><\/tr><tr><td>A<\/td><td>12<\/td><td><span class=\"mono\">100<\/span><\/td><td>3<\/td><td>36<\/td><\/tr><tr><td>E<\/td><td>11<\/td><td><span class=\"mono\">101<\/span><\/td><td>3<\/td><td>33<\/td><\/tr><tr><td>F<\/td><td>8<\/td><td><span class=\"mono\">110<\/span><\/td><td>3<\/td><td>24<\/td><\/tr><tr><td>C<\/td><td>6<\/td><td><span class=\"mono\">111<\/span><\/td><td>3<\/td><td>18<\/td><\/tr><tr><td><b>total<\/b><\/td><td>90<\/td><td><\/td><td><\/td><td><b>217<\/b><\/td><\/tr><\/tbody><\/table><p>Total = <b>217 bits<\/b>.<\/p>","figures":[]},"rubric":[{"text":"Splits with group sums: BD | AEFC (53 | 37), then B | D, AE | FC (23 | 14), A | E, F | C.","marks":1},{"text":"Codewords B 00, D 01, A 100, E 101, F 110, C 111.","marks":0.5},{"text":"Total 217 bits.","marks":0.5}],"mistakes":[{"text":"First split B | DAEFC (36 | 54, difference 18) instead of BD | AEFC (53 | 37, difference 16) → B gets a 1-bit code and the total becomes 212 — which happens to equal the Huffman total, but it is not the split step 2 asks for (difference 18 &gt; 16).","trap":null},{"text":"Splits the symbols in the order A–F without sorting by frequency first — step 1 lines them up by falling frequency.","trap":null}],"source":"Lecture08.ppt, slides 22–27","check":{"algo":"sf","freq":{"A":12,"B":36,"C":6,"D":17,"E":11,"F":8},"expect":{"codes":{"B":"00","D":"01","A":"100","E":"101","F":"110","C":"111"},"total":217}},"rows":[],"data":null,"figure":null,"id":"p1-q4c","cover":["shannon-fano"]},{"label":"d","marks":2,"tier":3,"minutes":3,"archetype":"D9","pattern":["FM-C.5","FM-C.3"],"lecture":"L08","topic":"Which code is optimal? Totals vs entropy","block":"compression","stem":"<p>Which of the codes from (b) and (c) is optimal for this log? Compare both totals with the fixed-length total from (a) and with the entropy bound n·H, where H = −Σ p<sub>i<\/sub> log<sub>2<\/sub> p<sub>i<\/sub>, and name the step of the Shannon-Fano construction that costs the extra bits.<\/p>","solution":{"html":"<p>H = −Σ p<sub>i<\/sub> log<sub>2<\/sub> p<sub>i<\/sub> = 2.312 bits per event, so n·H = 90 × 2.312 = <b>208.1 bits<\/b> — no lossless code can do better.<\/p><p>Totals: entropy bound 208.1 ≤ Huffman <b>212<\/b> &lt; Shannon-Fano <b>217<\/b> &lt; fixed length 270. The <b>Huffman code is optimal<\/b> here, 5 bits shorter.<\/p><p>The culprit is Shannon-Fano's <b>first split<\/b> BD | AEFC: it puts B (36, the most frequent event) in a 2-bit group. Huffman gives B a 1-bit code, saving 36 bits, and pays one extra bit on D, F and C (17 + 8 + 6 = 31 bits): 36 − 31 = 5.<\/p>","figures":[]},"rubric":[{"text":"Huffman optimal: 212 &lt; 217 &lt; 270, and both ≥ n·H ≈ 208.1 (H ≈ 2.31).","marks":1},{"text":"Names the first Shannon-Fano split as the culprit (B gets 2 bits instead of 1; 36 saved vs 31 extra).","marks":1}],"mistakes":[{"text":"Answers “Huffman” with no totals. On the past paper's data both codes cost the same, so the answer needs the numbers.","trap":"T9"},{"text":"Says a better prefix code could reach the entropy 208.1 bits: the entropy is a lower bound, and Huffman is already optimal among prefix codes.","trap":null}],"source":"Lecture08.ppt, slides 18–21","check":{"algo":"entropy","freq":{"A":12,"B":36,"C":6,"D":17,"E":11,"F":8},"expect":{"H":2.312,"nH":208.08,"huff":212,"sf":217}},"procs":[],"rows":[],"data":null,"figure":null,"id":"p1-q4d","cover":["entropy"]},{"label":"e","marks":4,"tier":2,"minutes":7,"archetype":"D1","pattern":["FM-Q4.3"],"lecture":"L07","topic":"MST-KRUSKAL with the disjoint-set table","block":"greedy","procs":["MST-KRUSKAL"],"stem":"<p>Find the minimum cost spanning tree (MCST) of the graph using MST-KRUSKAL given at the end of the paper. Show the lecture's table: the weight, the edge, merge or reject, and the disjoint sets after each step. How many edges does the MCST have, and why must it have exactly that many?<\/p>","figure":"<svg class=\"dg\" viewBox=\"0 0 500 280\" style=\"min-width:500px;max-width:550px\" role=\"img\" aria-label=\"weighted undirected graph on P, Q, R, S, T, U\" xmlns=\"http://www.w3.org/2000/svg\"><line class=\"edge\" x1=\"79.0\" y1=\"60.0\" x2=\"231.0\" y2=\"60.0\"/><line class=\"edge\" x1=\"269.0\" y1=\"60.0\" x2=\"421.0\" y2=\"60.0\"/><line class=\"edge\" x1=\"79.0\" y1=\"230.0\" x2=\"231.0\" y2=\"230.0\"/><line class=\"edge\" x1=\"269.0\" y1=\"230.0\" x2=\"421.0\" y2=\"230.0\"/><line class=\"edge\" x1=\"60.0\" y1=\"79.0\" x2=\"60.0\" y2=\"211.0\"/><line class=\"edge\" x1=\"250.0\" y1=\"79.0\" x2=\"250.0\" y2=\"211.0\"/><line class=\"edge\" x1=\"440.0\" y1=\"79.0\" x2=\"440.0\" y2=\"211.0\"/><line class=\"edge\" x1=\"74.2\" y1=\"72.7\" x2=\"235.8\" y2=\"217.3\"/><line class=\"edge\" x1=\"264.2\" y1=\"72.7\" x2=\"425.8\" y2=\"217.3\"/><rect class=\"halo\" x=\"148.0\" y=\"68.0\" width=\"14.0\" height=\"16.9\" rx=\"3\"/><text cla \" x=\"235.0\" y=\"145.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">6<\/text><rect class=\"halo\" x=\"418.0\" y=\"136.6\" width=\"14.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"425.0\" y=\"145.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">3<\/text><rect class=\"halo\" x=\"135.4\" y=\"150.7\" width=\"14.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"142.4\" y=\"159.1\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">7<\/text><rect class=\"halo\" x=\"325.4\" y=\"150.7\" width=\"14.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"332.4\" y=\"159.1\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">1<\/text><circle class=\"node\" cx=\"60.0\" cy=\"60.0\" r=\"18\"/><text class=\"lbl vname\" x=\"60.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P<\/text><circle class=\"node\" cx=\"250.0\" cy=\"60.0\" r=\"18\"/><text class=\"lbl vname\" x=\"250.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"central\">Q<\/text><circle class=\"node\" cx=\"440.0\" cy=\"60.0\" r=\"18\"/><text class=\"lbl vname\" x=\"440.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"central\">R<\/text><circle class=\"node\" cx=\"60.0\" cy=\"230.0\" r=\"18\"/><text class=\"lbl vname\" x=\"60.0\" y=\"230.0\" text-anchor=\"middle\" dominant-baseline=\"central\">S<\/text><circle class=\"node\" cx=\"250.0\" cy=\"230.0\" r=\"18\"/><text class=\"lbl vname\" x=\"250.0\" y=\"230.0\" text-anchor=\"middle\" dominant-baseline=\"central\">T<\/text><circle class=\"node\" cx=\"440.0\" cy=\"230.0\" r=\"18\"/><text class=\"lbl vname\" x=\"440.0\" y=\"230.0\" text-anchor=\"middle\" dominant-baseline=\"central\">U<\/text><\/svg><figcaption>MCST edges highlighted<\/figcaption><\/figure><p>MCST = {(Q,U), (R,U), (Q,T), (P,T), (S,T)}, total cost <b>28<\/b>.<\/p><p>Rejected: (Q,R) 5; (P,Q) 8; (T,U) 9; (P,S) 13 — both ends were already in the same set, so the edge would close a cycle.<\/p><p>The tree has <b>5 edges<\/b>: a spanning tree of an n-vertex graph has exactly n − 1 = 6 − 1 = 5 edges (it connects all vertices and has no cycle).<\/p>","figures":[]},"rubric":[{"text":"Edges taken in non-decreasing order of weight: 1, 3, 5, 6, 7, 8, 9, 11, 13.","marks":1},{"text":"Merge/reject with the sets after each step; (Q,R) 5 rejected because Q and R are already in {Q,R,U}; (P,Q) 8 and (T,U) 9 rejected.","marks":1.5},{"text":"MCST {QU, RU, QT, PT, ST} with total 28.","marks":1},{"text":"5 edges = n − 1 for n = 6 vertices.","marks":0.5}],"mistakes":[{"text":"Accepts (Q,R) 5 without checking the sets: the cycle Q–U–R–Q appears, giving 6 edges and cost 33.","trap":"T-L07b"},{"text":"Rejects (P,T) 7 because T is already in a tree: P is still alone in {P}, so FIND-SET(P) ≠ FIND-SET(T) and the edge is merged.","trap":"T-L07b"},{"text":"Takes the edges in the order they are drawn, not by weight — then the result is not a minimum cost tree.","trap":null}],"source":"Lecture07 (5).ppt, slides 11–21","check":{"algo":"kruskal","V":["P","Q","R","S","T","U"],"E":[["P","Q",8],["Q","R",5],["S","T",11],["T","U",9],["P","S",13],["Q","T",6],["R","U",3],["P","T",7],["Q","U",1]],"expect":{"total":28,"tree":[["Q","U"],["R","U"],["Q","T"],["P","T"],["S","T"]],"actions":["merge","merge","reject","merge","merge","reject","reject","merge","reject"]}},"rows":[],"data":null,"id":"p1-q4e","cover":["kruskal","spanning-tree"]},{"label":"f","marks":3,"tier":3,"minutes":5,"archetype":"D1","pattern":["FM-Q4.2","FM-Q4.3"],"lecture":"L07","topic":"MST-PRIM candidate edges; why both totals match","block":"greedy","procs":["MST-PRIM"],"stem":"<p>Run MST-PRIM on the same graph from the root S. Write the first three steps in the lecture's layout (Choose vertex …, Candidate edges = …, Choose edge …), then give the total cost. Prim takes (S,T) first while Kruskal takes it last: explain why the two totals are still equal.<\/p>","solution":{"html":"<div class=\"primlines\"><div>Choose vertex S, V = {P,Q,R,T,U}<\/div><div>Candidate edges = (S,T)11 (S,P)13<\/div><div><span class=\"chosen\">Choose edge (S,T) = 11 &nbsp; V = {P,Q,R,U}<\/span><\/div><div>Candidate edges = (T,Q)6 (T,P)7 (T,U)9 (S,P)13<\/div><div><span class=\"chosen\">Choose edge (T,Q) = 6 &nbsp; V = {P,R,U}<\/span><\/div><div>Candidate edges = (Q,U)1 (Q,R)5 (T,P)7 (Q,P)8 (T,U)9 (S,P)13<\/div><div><span class=\"chosen\">Choose edge (Q,U) = 1 &nbsp; V = {P,R}<\/span><\/div><div>Candidate edges = (U,R)3 (Q,R)5 (T,P)7 (Q,P)8 (S,P)13<\/div><div><span class=\"chosen\">Choose edge (U,R) = 3 &nbsp; V = {P}<\/span><\/div><div>Candidate edges = (T,P)7 (Q,P)8 (S,P)13<\/div><div><span class=\"chosen\">Choose edge (T,P) = 7 &nbsp; V = {}<\/span><\/div><\/div><p>Prim's edges in order: (S,T) 11, (T,Q) 6, (Q,U) 1, (U,R) 3, (T,P) 7; total <b>28<\/b>.<\/p><p>The candidate list changes after every choice: edges from the newly added vertex join it, and edges whose ends are both in the tree drop out.<\/p><p>Why the totals match: both are greedy algorithms that the lecture shows always produce a <b>minimum cost spanning tree<\/b>, and the minimum cost of a spanning tree of a graph is a single number — only the order in which edges are chosen differs. Here both even pick the same five edges. (S,T) is S's cheapest edge, so Prim from S must take it at once, while for Kruskal it is the heaviest tree edge (28 = 28).<\/p>","figures":[]},"rubric":[{"text":"Step 1: candidates (S,T)11, (S,P)13 → choose (S,T). Step 2: candidates include (T,Q)6, (T,P)7, (T,U)9, (S,P)13 → choose (T,Q).","marks":1},{"text":"Step 3: candidates updated with Q's edges (Q,U)1, (Q,R)5, (Q,P)8 → choose (Q,U); total 28.","marks":1},{"text":"Both algorithms always give a minimum cost spanning tree, and that minimum cost is unique, so 28 = 28 (only the order differs).","marks":1}],"mistakes":[{"text":"Keeps only the newest vertex's edges as candidates: after (Q,U) and (U,R) it finds no edge out of R and stalls. All edges from the tree to V stay candidates.","trap":"T-L07c"},{"text":"Drops (S,P) 13 from the list after step 1 because S is “done”: every edge from a tree vertex to V stays a candidate until its far end joins the tree.","trap":"T-L07c"},{"text":"Says the totals match “because both are greedy” — greedy alone does not guarantee optimality (the shortest-path example on slide 9). The reason is that both produce a minimum cost spanning tree.","trap":"T-L07a"}],"source":"Lecture07 (5).ppt, slides 24–32","check":{"algo":"prim","V":["P","Q","R","S","T","U"],"E":[["P","Q",8],["Q","R",5],["S","T",11],["T","U",9],["P","S",13],["Q","T",6],["R","U",3],["P","T",7],["Q","U",1]],"root":"S","expect":{"total":28,"order":[["S","T",11],["T","Q",6],["Q","U",1],["U","R",3],["T","P",7]]}},"rows":[],"data":null,"figure":null,"id":"p1-q4f","cover":["prim"]}]}]},{"id":2,"title":"Paper 2","appendix":["INSERTION-SORT","MERGE","HEAPS","KNAPSACK","MCM","NAIVE","RABIN-KARP","AUTOMATON","HUFFMAN","HU-TUCKER","ZIV-LEMPEL","DIJKSTRA"],"questions":[{"num":1,"marks":15,"title":"Recursion and Algorithm Design","lectures":["L02","L03","L04","L05"],"context":"Arrays are 1-based. Procedures named in a part are printed with that part or in the Algorithms appendix at the end of the paper.","parts":[{"label":"a","marks":1,"tier":1,"minutes":2,"archetype":"D11","pattern":["FM-Q3.1","FM-Q3.2"],"lecture":"L05","rows":["R11"],"topic":"Height of a complete binary tree; full binary tree node count","stem":"<p>A max-heap stores n = 12 elements in A[1..12]. (i) What is the height of the heap? (ii) What is the smallest number of elements that must be added before the tree becomes a <em>full<\/em> binary tree (in the lecture's sense)?<\/p>","solution":{"html":"<p>(i) A heap is a complete binary tree, so its height is ⌊log<sub>2<\/sub> n⌋ = ⌊log<sub>2<\/sub> 12⌋ = ⌊3.585⌋ = <b>3<\/b>.<\/p><p>(ii) A full binary tree of height h has exactly 2<sup>h+1<\/sup> − 1 nodes: 2<sup>4<\/sup> − 1 = 15. So 15 − 12 = <b>3<\/b> more elements fill the bottom level (A[13], A[14], A[15]) without changing the height.<\/p>","figures":[]},"rubric":[{"text":"Height ⌊log₂ 12⌋ = 3.","marks":0.5},{"text":"2^(h+1) − 1 = 15 nodes for a full tree of height 3, so 3 more elements.","marks":0.5}],"mistakes":[{"text":"Uses ⌈log₂ 12⌉ = 4 → a full tree of 31 nodes, 19 more. The height of a complete tree with n nodes is ⌊log₂ n⌋.","trap":null},{"text":"Uses 2^h − 1 = 7 nodes for height 3: the height counts edges from the root, so a full tree of height 3 has 15 nodes.","trap":null}],"source":"Lecture05.ppt, slides 9–12","check":{"algo":"tree","n":12,"expect":{"h":3,"more":3}},"procs":[],"block":null,"data":null,"figure":null,"id":"p2-q1a","cover":[]},{"label":"b","marks":2,"tier":1,"minutes":3,"archetype":"D5","pattern":["FM-Q1.4","T1-Q1.4"],"lecture":"L02","rows":["R3"],"topic":"Insertion sort: worst-case input and its bound","procs":["INSERTION-SORT"],"stem":"<p>The values 26, 9, 41, 17, 33 are to be sorted with INSERTION-SORT (given at the end of the paper). Give the order of these values that makes INSERTION-SORT take its worst case, and explain why. How many times is line 6 (A[i + 1] ← A[i]) executed for that order? What is the worst-case running time in Big O?<\/p>","solution":{"html":"<p>Worst case: <b>descending order [41, 33, 26, 17, 9]<\/b>. Every key A[j] is smaller than all of A[1..j − 1], so the while loop of line 5 moves it past every earlier element: t<sub>j<\/sub> = j tests (t2 = 2, t3 = 3, t4 = 4, t5 = 5).<\/p><p>Line 6 runs (t<sub>j<\/sub> − 1) times for each j: 1 + 2 + 3 + 4 = <b>10<\/b> = n(n − 1)/2.<\/p><p>T(n) = cn<sup>2<\/sup> + dn + e in the worst case, so the worst-case running time is <b>O(n<sup>2<\/sup>)<\/b>.<\/p><p class=\"note\">For comparison: ascending order moves nothing (line 6 runs 0 times, O(n)); the order given moves 4 times.<\/p>","figures":[]},"rubric":[{"text":"Order 41, 33, 26, 17, 9 with the reason: each key is smaller than every key before it, so it moves past all of them (t_j = j).","marks":1},{"text":"Line 6 executed 1 + 2 + 3 + 4 = 10 times.","marks":0.5},{"text":"Worst case O(n²).","marks":0.5}],"mistakes":[{"text":"Gives ascending order [9, 17, 26, 33, 41]: that is the best case — line 6 never runs and T(n) = an + b.","trap":null},{"text":"Counts the line-5 tests (14) as line-6 executions (10): each j has one final failing test.","trap":null}],"source":"Lecture02.pptx, slides 3 and 8–11","check":{"algo":"insertion","vals":[26,9,41,17,33],"expect":{"worst":[41,33,26,17,9],"shifts":10,"tests":14}},"block":null,"data":null,"figure":null,"id":"p2-q1b","cover":[]},{"label":"c","marks":5,"tier":2,"minutes":10,"archetype":"D1","pattern":["FM-Q3.3","FM-Q3.4"],"lecture":"L05","rows":["R12"],"topic":"BUILD_HEAP and HEAPSORT trace","procs":["HEAPSORT","BUILD_HEAP","HEAPIFY"],"stem":"<p>HEAPSORT, BUILD_HEAP and HEAPIFY are given at the end of the paper. Illustrate the operations of HEAPSORT(A) for the array with the given set of elements. (For the illustration process assign the values only once to the given algorithm codes and then use diagrammatic way to reach the answer.)<\/p>","data":"<table class=\"arr\"><tr><th class=\"ix\">i<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><\/tr><tr><th class=\"rowlab\">A<\/th><td class=\"\">18<\/td><td class=\"\">52<\/td><td class=\"\">51<\/td><td class=\"\">29<\/td><td class=\"\">89<\/td><td class=\"\">76<\/td><\/tr><\/table>","solution":{"html":"<p><b>BUILD_HEAP<\/b>: heap_size ← 6, then i runs from ⌊6/2⌋ = 3 down to 1.<\/p><div class=\"figrow\"><figure class=\"fig\"><svg class=\"dg\" viewBox=\"0 0 360 234\" style=\"min-width:360px;max-width:396px\" role=\"img\" aria-label=\"input array as a tree\" xmlns=\"http://www.w3.org/2000/svg\"><text class=\"ttl\" x=\"180.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"central\">input array as a tree<\/text><line class=\"edge\" x1=\"165.0\" y1=\"71.7\" x2=\"105.0\" y2=\"118.3\" \"middle\" dominant-baseline=\"central\" font-size=\"12\">1<\/text><circle class=\"node done\" cx=\"90.0\" cy=\"130.0\" r=\"18\"/><text class=\"lbl\" x=\"90.0\" y=\"130.0\" text-anchor=\"middle\" dominant-baseline=\"central\">29<\/text><text class=\"idx\" x=\"60.0\" y=\"121.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"12\">2<\/text><circle class=\"node done\" cx=\"270.0\" cy=\"130.0\" r=\"18\"/><text class=\"lbl\" x=\"270.0\" y=\"130.0\" text-anchor=\"middle\" dominant-baseline=\"central\">51<\/text><text class=\"idx\" x=\"300.0\" y=\"121.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"12\">3<\/text><circle class=\"node done\" cx=\"45.0\" cy=\"200.0\" r=\"18\"/><text class=\"lbl\" x=\"45.0\" y=\"200.0\" text-anchor=\"middle\" dominant-baseline=\"central\">52<\/text><text class=\"idx\" x=\"15.0\" y=\"191.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"12\">4<\/text><circle class=\"node done\" cx=\"135.0\" cy=\"200.0\" r=\"18\"/><text class=\"lbl\" x=\"135.0\" y=\"200.0\" text-anchor=\"middle\" dominant-baseline=\"central\">76<\/text><text class=\"idx\" x=\"165.0\" y=\"191.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"12\">5<\/text><circle class=\"node done\" cx=\"225.0\" cy=\"200.0\" r=\"18\"/><text class=\"lbl\" x=\"225.0\" y=\"200.0\" text-anchor=\"middle\" dominant-baseline=\"central\">89<\/text><text class=\"idx\" x=\"195.0\" y=\"191.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"12\">6<\/text><\/svg><figcaption><table class=\"arr\"><tr><th class=\"ix\">i<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><\/tr><tr><th class=\"rowlab\">A<\/th><td class=\"\">18<\/td><td class=\"done\">29<\/td><td class=\"done\">51<\/td><td class=\"done\">52<\/td><td class=\"done\">76<\/td><td class=\"done\">89<\/td><\/tr><\/table><div class=\"cap2\">exchange A[1] ↔ A[2], heap_size = 1; HEAPIFY: no exchange<\/div><\/figcaption><\/figure><\/div><p>Sorted array: <b>[18, 29, 51, 52, 76, 89]<\/b>.<\/p><p class=\"note\">Watch step i = 5: after the exchange heap_size = 4, so HEAPIFY(A, 2) compares 18 only with A[4] = 29 — A[5] = 76 is already outside the heap.<\/p>","figures":[]},"rubric":[{"text":"BUILD_HEAP calls HEAPIFY(A, 3), HEAPIFY(A, 2), HEAPIFY(A, 1) in this order; the last one cascades 18 from index 1 to 2 to 5, giving the heap [89, 52, 76, 29, 18, 51].","marks":2},{"text":"The five exchange + HEAPIFY(A, 1) steps with heap_size reduced each time, showing the array (or tree) after each step: [76, 52, 51, 29, 18, 89]; [52, 29, 51, 18, 76, 89]; [51, 29, 18, 52, 76, 89]; [29, 18, 51, 52, 76, 89]; [18, 29, 51, 52, 76, 89].","marks":2},{"text":"At i = 5 HEAPIFY ignores A[5] = 76 (heap_size = 4): 18 sinks to index 4 by swapping with 52 and then 29.","marks":0.5},{"text":"Final sorted array [18, 29, 51, 52, 76, 89].","marks":0.5}],"mistakes":[{"text":"Runs BUILD_HEAP with i = 1 up to 3 instead of ⌊n/2⌋ down to 1 → [52, 89, 76, 29, 18, 51], which is not a heap (A[1] = 52 &lt; A[2] = 89; A[1] = 52 &lt; A[3] = 76).","trap":"T6"},{"text":"Does not reduce heap_size: at i = 5 HEAPIFY pulls the sorted 89 back into the heap ([89, 52, 18, 29, 76, 51]) and the result is not sorted ([89, 18, 52, 29, 76, 51]).","trap":"T6"},{"text":"Stops HEAPIFY(A, 1) after the first exchange in BUILD_HEAP → [89, 18, 76, 29, 52, 51], where A[2] = 18 &lt; A[4] = 29; A[2] = 18 &lt; A[5] = 52 still breaks the heap property: HEAPIFY recurses on the child it swapped into.","trap":null}],"source":"Lecture05.ppt, slides 15, 23–27, 30–33 and 38–40","check":{"algo":"heapsort","a":[18,52,51,29,89,76],"expect":{"build":[[18,52,76,29,89,51],[18,89,76,29,52,51],[89,52,76,29,18,51]],"heap":[89,52,76,29,18,51],"ext":[[76,52,51,29,18,89],[52,29,51,18,76,89],[51,29,18,52,76,89],[29,18,51,52,76,89],[18,29,51,52,76,89]],"sorted":[18,29,51,52,76,89]}},"block":null,"figure":null,"id":"p2-q1c","cover":[]},{"label":"d","marks":2,"tier":2,"minutes":4,"archetype":"D1","pattern":["FM-Q1.5","FM-Q2.a"],"lecture":"L04","rows":["R10"],"topic":"MERGE (algorithm 2) with sentinels","procs":["MERGE"],"stem":"<p>Illustrate the operations of MERGE(A, 1, 3, 6) (Merge procedure, Algorithm 2, given at the end of the paper) for the array below. Show L and R, and the array A after every iteration of the for loop in line 12. How many times is the comparison in line 13 executed?<\/p>","data":"<table class=\"arr\"><tr><th class=\"ix\">i<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><\/tr><tr><th class=\"rowlab\">A<\/th><td class=\"\">16<\/td><td class=\"\">31<\/td><td class=\"\">44<\/td><td class=\"\">20<\/td><td class=\"\">27<\/td><td class=\"\">58<\/td><\/tr><\/table>","solution":{"html":"<p>n1 = 3, n2 = 3: L[1..4] = [16, 31, 44, ∞], R[1..4] = [20, 27, 58, ∞] (∞ are the sentinels of lines 8–9).<\/p><table class=\"grid\"><thead><tr><th>k<\/th><th>L[i]<\/th><th>R[j]<\/th><th>line 14 or 16<\/th><th>A[1..6] after this k<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>L[1] = 16<\/td><td>R[1] = 20<\/td><td>A[1] ← L[1] = 16<\/td><td>16 31 44 20 27 58<\/td><\/tr><tr><td>2<\/td><td>L[2] = 31<\/td><td>R[1] = 20<\/td><td>A[2] ← R[1] = 20<\/td><td>16 20 44 20 27 58<\/td><\/tr><tr><td>3<\/td><td>L[2] = 31<\/td><td>R[2] = 27<\/td><td>A[3] ← R[2] = 27<\/td><td>16 20 27 20 27 58<\/td><\/tr><tr><td>4<\/td><td>L[2] = 31<\/td><td>R[3] = 58<\/td><td>A[4] ← L[2] = 31<\/td><td>16 20 27 31 27 58<\/td><\/tr><tr><td>5<\/td><td>L[3] = 44<\/td><td>R[3] = 58<\/td><td>A[5] ← L[3] = 44<\/td><td>16 20 27 31 44 58<\/td><\/tr><tr><td>6<\/td><td>L[4] = ∞<\/td><td>R[3] = 58<\/td><td>A[6] ← R[3] = 58<\/td><td>16 20 27 31 44 58<\/td><\/tr><\/tbody><\/table><p>Line 13 runs once per k = p … r: <b>6<\/b> = r − p + 1 times. The last one compares L[4] = ∞ with R[3] = 58 — the sentinel is what lets the loop run without testing whether L is used up.<\/p>","figures":[]},"rubric":[{"text":"L = [16, 31, 44, ∞] and R = [20, 27, 58, ∞] with the sentinels.","marks":0.5},{"text":"Six k-steps placing 16, 20, 27, 31, 44, 58 in that order (array after each k).","marks":1},{"text":"6 comparisons (r − p + 1), including the one against ∞.","marks":0.5}],"mistakes":[{"text":"Stops comparing once L is used up → 5 comparisons. That is how Algorithm 1 behaves; Algorithm 2's sentinels make line 13 run for every k.","trap":null},{"text":"Leaves out the ∞ sentinels: at k = 6, L[4] does not exist and line 13 cannot be evaluated.","trap":null}],"source":"Lecture04.ppt, slides 22–27","check":{"algo":"merge","a":[16,31,44,20,27,58],"p":1,"q":3,"r":6,"expect":{"after":[[16,31,44,20,27,58],[16,20,44,20,27,58],[16,20,27,20,27,58],[16,20,27,31,27,58],[16,20,27,31,44,58],[16,20,27,31,44,58]],"comps":6}},"block":null,"figure":null,"id":"p2-q1d","cover":[]},{"label":"e","marks":3,"tier":3,"minutes":6,"archetype":"D3","pattern":["FM-Q2.c","FM-Q1.7c"],"lecture":"L03","rows":["R7"],"topic":"Recurrence of a divide-and-conquer procedure, solved by a recursion tree","stem":"<p>COUNT-INV(A, l, r) counts the pairs i &lt; j in A[l..r] with A[i] &gt; A[j]:<\/p><div class=\"code\"><pre>     COUNT-INV(A, l, r)\n<span class=\"ln\"> 1<\/span>  if l ≥ r\n<span class=\"ln\"> 2<\/span>     then return 0\n<span class=\"ln\"> 3<\/span>  q ← ⌊(l + r)/2⌋\n<span class=\"ln\"> 4<\/span>  c ← COUNT-INV(A, l, q) + COUNT-INV(A, q + 1, r)\n<span class=\"ln\"> 5<\/span>  for i ← l to q\n<span class=\"ln\"> 6<\/span>      do for j ← q + 1 to r\n<span class=\"ln\"> 7<\/span>             do if A[i] &gt; A[j]\n<span class=\"ln\"> 8<\/span>                   then c ← c + 1\n<span class=\"ln\"> 9<\/span>  return c\n<\/pre><\/div><ol class=\"roman\"><li>Write a recurrence equation that describes the running time T(n) of COUNT-INV, where n = r − l + 1 is a power of 2. Clearly define the initial condition.<\/li><li>Solve it with the recursion-tree method: draw the first three levels, give the cost of each level and the total.<\/li><\/ol>","solution":{"html":"<p>Lines 1–4 do two recursive calls on halves. Lines 5–8 run the inner test (n/2)·(n/2) = n²/4 times, so the work outside the calls is cn² for a constant c:<\/p><table class=\"cases\"><tr><td rowspan=\"2\" class=\"brace\">T(n) =<\/td><td>d<\/td><td>n = 1<\/td><\/tr><tr><td>2T(n/2) + cn<sup>2<\/sup><\/td><td>n &gt; 1<\/td><\/tr><\/table><figure class=\"fig\"><svg class=\"dg\" viewBox=\"0 0 700 278\" style=\"min-width:700px;max-width:770px\" role=\"img\" aria-label=\"recursion tree for T(n) = 2T(n/2) + cn²\" xmlns=\"http://www.w3.org/2000/svg\"><text class=\"ttl\" x=\"350.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"central\">recursion tree for T(n) = 2T(n/2) + cn²<\/text><line class=\"edge\" x1=\"325.1\" y1=\"71.1\" x2=\"202.5\" y2=\"135.5\"/><line class=\"edge\" x1=\"374.9\" y1=\"71.1\" x2=\"497.5\" y2=\"135.5\"/><line class=\"edge\" x1=\"161.0\" y1=\"164.7\" x2=\"101.5\" y2=\"227.3\"/><line class=\"edge\" x1=\"189.0\" y1=\"164.7\" x2=\"248.5\" y2=\"227.3\"/><line class=\"edge\" x1=\"511.0\" y1=\"164.7\" x2=\"451.5\" y2=\"227.3\"/><line class=\"edge\" x1=\"539.0\" y1=\"164.7\" x2=\"598.5\" y2=\"227.3\"/><rect class=\"grp\" x=\"326.0\" y=\"44.0\" width=\"48.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"350.0\" y=\"58.0\" text-anchor=\"middle\" dominant-baseline=\"central\">c n²<\/text><rect class=\"grp\" x=\"135.0\" y=\"136.0\" width=\"80.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"175.0\" y=\"150.0\" text-anchor=\"middle\" dominant-baseline=\"central\">c (n/2)²<\/text><rect class=\"grp\" x=\"485.0\" y=\"136.0\" width=\"80.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"525.0\" y=\"150.0\" text-anchor=\"middle\" dominant-baseline=\"central\">c (n/2)²<\/text><rect class=\"grp\" x=\"47.5\" y=\"228.0\" width=\"80.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"87.5\" y=\"242.0\" text-anchor=\"middle\" dominant-baseline=\"central\">c (n/4)²<\/text><rect class=\"grp\" x=\"222.5\" y=\"228.0\" width=\"80.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"262.5\" y=\"242.0\" text-anchor=\"middle\" dominant-baseline=\"central\">c (n/4)²<\/text><rect class=\"grp\" x=\"397.5\" y=\"228.0\" width=\"80.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"437.5\" y=\"242.0\" text-anchor=\"middle\" dominant-baseline=\"central\">c (n/4)²<\/text><rect class=\"grp\" x=\"572.5\" y=\"228.0\" width=\"80.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"612.5\" y=\"242.0\" text-anchor=\"middle\" dominant-baseline=\"central\">c (n/4)²<\/text><\/svg><\/figure><table class=\"grid\"><thead><tr><th>level<\/th><th>nodes<\/th><th>cost of one node<\/th><th>cost of the level<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><td>c n²<\/td><td>c n²<\/td><\/tr><tr><td>1<\/td><td>2<\/td><td>c (n/2)²<\/td><td>c n²/2<\/td><\/tr><tr><td>2<\/td><td>4<\/td><td>c (n/4)²<\/td><td>c n²/4<\/td><\/tr><tr><td>i<\/td><td>2<sup>i<\/sup><\/td><td>c (n/2<sup>i<\/sup>)²<\/td><td>c n²/2<sup>i<\/sup><\/td><\/tr><tr><td>lg n (leaves)<\/td><td>n<\/td><td>d<\/td><td>dn<\/td><\/tr><\/tbody><\/table><div class=\"mline\">T(n) = cn²(1 + ½ + ¼ + … + 1/2<sup>lg n − 1<\/sup>) + dn &lt; 2cn² + dn<\/div><p>The level costs fall geometrically, so the root level dominates: <b>T(n) = Θ(n<sup>2<\/sup>)<\/b>.<\/p>","figures":[]},"rubric":[{"text":"T(n) = 2T(n/2) + cn² with T(1) = constant; the cn² justified by the (n/2)(n/2) iterations of lines 5–8.","marks":1},{"text":"Tree with node costs cn², c(n/2)², c(n/4)² and level costs cn², cn²/2, cn²/4 (lg n levels, n leaves).","marks":1},{"text":"Total cn²(1 + ½ + ¼ + …) &lt; 2cn² ⇒ Θ(n²).","marks":1}],"mistakes":[{"text":"Uses the merge-sort recurrence T(n) = 2T(n/2) + cn → Θ(n lg n). The double loop costs n²/4, not n.","trap":null},{"text":"Treats every level as costing cn² → cn² lg n = Θ(n² lg n). The level costs halve: cn², cn²/2, cn²/4, …","trap":null}],"source":"Lecture03.ppt, slides 17–20 and 29–31; Lecture04, slides 28–31","check":{"algo":"countinv","expect":{"C":{"1":0,"2":1,"4":6,"8":28},"sim":28}},"procs":[],"block":null,"data":null,"figure":null,"id":"p2-q1e","cover":[]},{"label":"f","marks":2,"tier":3,"minutes":4,"archetype":"D4","pattern":["FM-Q2.d","T1-Q2.d"],"lecture":"L03","rows":["R8"],"topic":"Master theorem case 3 with the regularity condition","stem":"<ol class=\"roman\"><li>Confirm your answer to (e) with the master theorem: state a, b, f(n), n<sup>log<sub>b<\/sub> a<\/sup>, the case, and check the regularity condition.<\/li><li>Count only the line-7 comparisons: C(1) = 0 and C(n) = 2C(n/2) + (n/2)<sup>2<\/sup>. Find C(8) and compare it with a plain double loop that compares every pair i &lt; j of 8 elements once.<\/li><\/ol>","solution":{"html":"<p>a = 2, b = 2, f(n) = cn<sup>2<\/sup>, n<sup>log<sub>b<\/sub> a<\/sup> = n<sup>log<sub>2<\/sub> 2<\/sup> = n.<\/p><p>f(n) = cn<sup>2<\/sup> = Ω(n<sup>1 + ε<\/sup>) with ε = 1 ⇒ <b>case 3<\/b>, if the regularity condition holds:<\/p><div class=\"mline\">a·f(n/b) = 2c(n/2)<sup>2<\/sup> = ½·cn<sup>2<\/sup> ≤ c′·f(n) with c′ = ½ &lt; 1 &nbsp;✓<\/div><p>So T(n) = Θ(f(n)) = <b>Θ(n<sup>2<\/sup>)<\/b>, the same as the recursion tree.<\/p><div class=\"mline\">C(2) = 2·0 + 1 = 1, &nbsp; C(4) = 2·1 + 4 = 6, &nbsp; C(8) = 2·6 + 16 = <b>28<\/b><\/div><p>A plain double loop compares 8·7/2 = <b>28<\/b> pairs — exactly the same. Every pair is compared once, at the level where it is split, so this divide and conquer saves nothing: both are Θ(n<sup>2<\/sup>).<\/p>","figures":[]},"rubric":[{"text":"a = 2, b = 2, n^(log_b a) = n, f(n) = cn² = Ω(n^(1+ε)), ε = 1, case 3, regularity 2c(n/2)² = ½cn² ≤ c′cn² with c′ = ½ &lt; 1 ⇒ Θ(n²).","marks":1},{"text":"C(2) = 1, C(4) = 6, C(8) = 28, equal to the 8·7/2 = 28 pairs of the double loop.","marks":1}],"mistakes":[{"text":"Picks case 1 (“f(n) is polynomial”) → Θ(n). Case 1 needs f(n) = O(n^(1−ε)), but cn² is larger than n.","trap":null},{"text":"Skips the regularity condition: case 3 also needs a·f(n/b) ≤ c·f(n) for some c &lt; 1.","trap":null},{"text":"Uses C(n) = 2C(n/2) + n → C(8) = 24; the double loop of lines 6–7 runs (n/2)² times, not n.","trap":null}],"source":"Lecture03.ppt, slides 32–39","check":{"algo":"countinv","expect":{"C8":28,"pairs":28}},"procs":[],"block":null,"data":null,"figure":null,"id":"p2-q1f","cover":[]}]},{"num":2,"marks":15,"title":"Dynamic Programming","lectures":["L09"],"context":"<p>Use the recursive solution and the algorithms given at the end of the paper, and these data:<\/p><ul><li><b>0/1 knapsack<\/b>: n = 4, c = 9, w = [4, 2, 5, 3], p = [3, 7, 9, 15].<\/li><li><b>Matrix chain<\/b>: A<sub>1<\/sub> is 4 × 3, A<sub>2<\/sub> is 3 × 3, A<sub>3<\/sub> is 3 × 5, A<sub>4<\/sub> is 5 × 7; the product is A<sub>1<\/sub>A<sub>2<\/sub>A<sub>3<\/sub>A<sub>4<\/sub>.<\/li><\/ul>","parts":[{"label":"a","marks":1,"tier":1,"minutes":2,"archetype":"D11","pattern":["FM-Q5.1"],"lecture":"L09","topic":"Optimal substructure, applied to one split","procs":["MATRIX_CHAIN_ORDER"],"stem":"<p>For the chain above, MATRIX_CHAIN_ORDER computes m[1, 4] by trying k = 1, 2 and 3. Write the k = 3 candidate as a formula in m-entries and dimensions p<sub>i<\/sub> (no numbers needed), and explain which element of dynamic programming allows the algorithm to use the stored value m[1, 3] inside it.<\/p>","solution":{"html":"<div class=\"mline\">k = 3: &nbsp; m[1, 3] + m[4, 4] + p<sub>0<\/sub>·p<sub>3<\/sub>·p<sub>4<\/sub> &nbsp; (= m[1, 3] + 0 + 4·5·7)<\/div><p><b>Optimal substructure.<\/b> If the best order for A<sub>1<\/sub>…A<sub>4<\/sub> splits after A<sub>3<\/sub>, then inside it A<sub>1<\/sub>A<sub>2<\/sub>A<sub>3<\/sub> must itself be computed in its cheapest way — otherwise replacing that part with a cheaper order would make the whole product cheaper. So the optimal sub-chain cost m[1, 3] is exactly the piece needed.<\/p>","figures":[]},"rubric":[{"text":"m[1,3] + m[4,4] + p0·p3·p4.","marks":0.5},{"text":"Optimal substructure, with the reason: an optimal solution contains optimal solutions to its sub-problems.","marks":0.5}],"mistakes":[{"text":"Writes p1·p3·p4: the left factor of A1..3 times A4 is p_(i−1) = p0, the row count of A1.","trap":"T8"},{"text":"Names only “overlapping subproblems”: that explains why m[1, 3] is stored and reused, not why the stored optimum is the right piece to use.","trap":null}],"source":"Lecture09.ppt, slides 6–7 and 41–44","check":{"algo":"mcm-cand","p":[4,3,3,5,7],"expect":{"k3":236}},"rows":[],"block":null,"data":null,"figure":null,"id":"p2-q2a","cover":[]},{"label":"b","marks":6,"tier":2,"minutes":9,"archetype":"D2","pattern":["FM-Q5.2","WB-2"],"lecture":"L09","topic":"0/1 knapsack table from P(i, k)","procs":["P(i, k)"],"stem":"<p>Construct a table for the 0/1 knapsack problem above using Dynamic Programming with the recursive solution P(i, k) given at the end of the paper. Use the lecture's layout: rows i = 4 down to 1, columns k = 0 … 9. Mark every cell whose value comes from the “take item i” branch (write +p<sub>i<\/sub> in it).<\/p>","solution":{"html":"<table class=\"dp\"><thead><tr><th>i\\k<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><th>9<\/th><\/tr><\/thead><tbody><tr><th>4<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><\/tr><tr><th>3<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">15<\/td><td class=\"\">15<\/td><td class=\"\">15<\/td><td class=\"\">15<\/td><td class=\"\">15<\/td><td class=\"take\">24<span class=\"plus\">+9<\/span><\/td><td class=\"take\">24<span class=\"plus\">+9<\/span><\/td><\/tr><tr><th>2<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"take\">7<span class=\"plus\">+7<\/span><\/td><td class=\"\">15<\/td><td class=\"\">15<\/td><td class=\"take\">22<span class=\"plus\">+7<\/span><\/td><td class=\"take\">22<span class=\"plus\">+7<\/span><\/td><td class=\"take\">22<span class=\"plus\">+7<\/span><\/td><td class=\"\">24<\/td><td class=\"\">24<\/td><\/tr><tr><th>1<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">7<\/td><td class=\"\">15<\/td><td class=\"\">15<\/td><td class=\"\">22<\/td><td class=\"\">22<\/td><td class=\"\">22<\/td><td class=\"\">24<\/td><td class=\"take\">25<span class=\"plus\">+3<\/span><\/td><\/tr><\/tbody><\/table><p>Sample cells:<\/p><div class=\"mline\">P(3, 8) = max( P(4, 8), p3 + P(4, 8 − 5) ) = max( 15, 9 + 15 ) = max( 15, 24 ) = <b>24<\/b><\/div><div class=\"mline\">P(2, 5) = max( P(3, 5), p2 + P(3, 5 − 2) ) = max( 15, 7 + 15 ) = max( 15, 22 ) = <b>22<\/b><\/div><div class=\"mline\">P(1, 9) = max( P(2, 9), p1 + P(2, 9 − 4) ) = max( 24, 3 + 22 ) = max( 24, 25 ) = <b>25<\/b> &nbsp;← take wins by only 1<\/div>","figures":[]},"rubric":[{"text":"Row i = 4: 0 0 0 15 15 15 15 15 15 15.","marks":1},{"text":"Row i = 3: 0 0 0 15 15 15 15 15 24 24.","marks":1.5},{"text":"Row i = 2: 0 0 7 15 15 22 22 22 24 24.","marks":1.5},{"text":"Row i = 1: 0 0 7 15 15 22 22 22 24 25 (P(1, 9) = 25, where taking item 1 wins 25 to 24).","marks":1.5},{"text":"The take-branch cells are marked (+p_i).","marks":0.5}],"mistakes":[{"text":"Uses the slide's 1-D loop with k increasing: items can be reused (unbounded knapsack) → P[9] = 45 instead of 25.","trap":null},{"text":"Stops at P(2, 9) = 24 for the answer: the last cell P(1, 9) = max(24, 3 + P(2, 5)) = 25 — item 1 is worth taking by 1.","trap":null},{"text":"Fills the rows with items 1..i instead of i..n: different rows and a wrong read-off in (c).","trap":"T7"}],"source":"Lecture09.ppt, slides 13–16 and 23–32","check":{"algo":"knapsack","w":[4,2,5,3],"p":[3,7,9,15],"c":9,"expect":{"rows":{"4":[0,0,0,15,15,15,15,15,15,15],"3":[0,0,0,15,15,15,15,15,24,24],"2":[0,0,7,15,15,22,22,22,24,24],"1":[0,0,7,15,15,22,22,22,24,25]},"x":[1,1,0,1],"best":25,"optimalSubsets":1}},"rows":[],"block":null,"data":null,"figure":null,"id":"p2-q2b","cover":[]},{"label":"c","marks":2,"tier":2,"minutes":3,"archetype":"D9","pattern":["FM-Q5.3","FM-Q5.4"],"lecture":"L09","topic":"Read-off P(2, 8) and the trace-back","procs":["P(i, k)"],"stem":"<ol class=\"roman\"><li>Find P(2, 8) using the recursive equations, writing out the line you used.<\/li><li>Briefly explain how you obtain the items of the optimal solution from your table, and give the solution vector x and its total weight.<\/li><\/ol>","solution":{"html":"<div class=\"mline\">P(2, 8) = max( P(3, 8), p2 + P(3, 8 − 2) ) = max( 24, 7 + 15 ) = max( 24, 22 ) = <b>24<\/b><\/div><p>Leaving item 2 out wins: items 3 and 4 (9 + 15 = 24) beat item 2 with item 4 (7 + 15 = 22).<\/p><p>Trace back from P(1, 9): if P(i, k) ≠ P(i + 1, k), item i was taken (x<sub>i<\/sub> = 1, k drops by w<sub>i<\/sub>); otherwise x<sub>i<\/sub> = 0.<\/p><div class=\"mline\">P(1, 9) = 25 ≠ P(2, 9) = 24 ⇒ x1 = 1, k ← 9 − 4 = 5<br>P(2, 5) = 22 ≠ P(3, 5) = 15 ⇒ x2 = 1, k ← 5 − 2 = 3<br>P(3, 3) = 15 = P(4, 3) = 15 ⇒ x3 = 0<br>i = 4: last item, w4 = 3 ≤ k = 3 ⇒ x4 = 1<\/div><p>x = <b>[1, 1, 0, 1]<\/b>: profit 25, weight 9.<\/p>","figures":[]},"rubric":[{"text":"P(2, 8) = max(P(3, 8), 7 + P(3, 6)) = max(24, 22) = 24, with the line written.","marks":1},{"text":"Trace-back comparing P(i, k) with P(i + 1, k) (k reduced after each taken item); x = [1, 1, 0, 1], weight 9.","marks":1}],"mistakes":[{"text":"Uses items 1..2 for P(2, 8) → 10 instead of 24. P(i, k) is defined on items i..n.","trap":"T7"},{"text":"Sets x3 = 1 because P(3, 3) = 15 is not 0 — the test is P(3, 3) against P(4, 3), which are equal, so item 3 is not taken.","trap":null}],"source":"Lecture09.ppt, slides 16 and 32","check":{"algo":"knapsack-cell","w":[4,2,5,3],"p":[3,7,9,15],"c":9,"cell":[2,8],"expect":{"value":24,"x":[1,1,0,1]}},"rows":[],"block":null,"data":null,"figure":null,"id":"p2-q2c","cover":[]},{"label":"d","marks":4,"tier":2,"minutes":9,"archetype":"D2","pattern":["FM-Q5.5","WB-1"],"lecture":"L09","topic":"Matrix-chain m and s tables (matrix sizes given)","procs":["MATRIX_CHAIN_ORDER","PRINT-OPTIMAL-PARENS"],"stem":"<p>Draw the m and s tables for the chain above using MATRIX_CHAIN_ORDER given at the end of the paper. Hence find the optimal parenthesizing of A<sub>1<\/sub>A<sub>2<\/sub>A<sub>3<\/sub>A<sub>4<\/sub> and the optimal number of scalar multiplications.<\/p>","solution":{"html":"<p>p<sub>0<\/sub> … p<sub>4<\/sub> = 4, 3, 3, 5, 7 (A<sub>i<\/sub> is p<sub>i−1<\/sub> × p<sub>i<\/sub>).<\/p><p>m[1,2] = 4·3·3 = 36, m[2,3] = 3·3·5 = 45, m[3,4] = 3·5·7 = 105.<\/p><div class=\"mline\">m[1, 3] = min { k = 1: m[1,1] + m[2,3] + p0·p1·p3 = 0 + 45 + 4·3·5 = 105<br>&nbsp;&nbsp;&nbsp;&nbsp;k = 2: m[1,2] + m[3,3] + p0·p2·p3 = 36 + 0 + 4·3·5 = 96 } = <b>96<\/b> &nbsp;⇒ s[1, 3] = <b>2<\/b><\/div><div class=\"mline\">m[2, 4] = min { k = 2: m[2,2] + m[3,4] + p1·p2·p4 = 0 + 105 + 3·3·7 = 168<br>&nbsp;&nbsp;&nbsp;&nbsp;k = 3: m[2,3] + m[4,4] + p1·p3·p4 = 45 + 0 + 3·5·7 = 150 } = <b>150<\/b> &nbsp;⇒ s[2, 4] = <b>3<\/b><\/div><div class=\"mline\">m[1, 4] = min { k = 1: m[1,1] + m[2,4] + p0·p1·p4 = 0 + 150 + 4·3·7 = 234<br>&nbsp;&nbsp;&nbsp;&nbsp;k = 2: m[1,2] + m[3,4] + p0·p2·p4 = 36 + 105 + 4·3·7 = 225<br>&nbsp;&nbsp;&nbsp;&nbsp;k = 3: m[1,3] + m[4,4] + p0·p3·p4 = 96 + 0 + 4·5·7 = 236 } = <b>225<\/b> &nbsp;⇒ s[1, 4] = <b>2<\/b><\/div><div class=\"figrow\"><table class=\"dp tri\"><caption>m[i, j]<\/caption><thead><tr><th>i\\j<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody><tr><th>1<\/th><td>0<\/td><td>36<\/td><td>96<\/td><td>225<\/td><\/tr><tr><th>2<\/th><td class=\"blank\"><\/td><td>0<\/td><td>45<\/td><td>150<\/td><\/tr><tr><th>3<\/th><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td>0<\/td><td>105<\/td><\/tr><tr><th>4<\/th><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td>0<\/td><\/tr><\/tbody><\/table><table class=\"dp tri\"><caption>s[i, j]<\/caption><thead><tr><th>i\\j<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody><tr><th>1<\/th><td class=\"blank\"><\/td><td>1<\/td><td>2<\/td><td>2<\/td><\/tr><tr><th>2<\/th><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td>2<\/td><td>3<\/td><\/tr><tr><th>3<\/th><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td>3<\/td><\/tr><tr><th>4<\/th><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td class=\"blank\"><\/td><\/tr><\/tbody><\/table><\/div><p>s[1,4] = 2: (A1A2)(A3A4). Optimal parenthesizing <b>((A1A2)(A3A4))<\/b> with <b>225<\/b> scalar multiplications (the three candidates were 234, 225, 236 — close, so every entry must be exact).<\/p>","figures":[]},"rubric":[{"text":"m[1,2] = 36, m[2,3] = 45, m[3,4] = 105 (from p = 4, 3, 3, 5, 7).","marks":1},{"text":"m[1,3] = 96 (s = 2) and m[2,4] = 150 (s = 3) with their min{…} expansions.","marks":1},{"text":"m[1,4] = 225 from the candidates 234, 225, 236; s[1,4] = 2.","marks":1},{"text":"Complete s table and ((A1A2)(A3A4)) with 225 scalar multiplications.","marks":1}],"mistakes":[{"text":"Uses p<sub>i<\/sub>·p<sub>k<\/sub>·p<sub>j<\/sub> instead of p<sub>i−1<\/sub>·p<sub>k<\/sub>·p<sub>j<\/sub> → m[1,4] = 177.","trap":"T8"},{"text":"Picks k = 2 for m[2,4] because its last product 3·3·7 = 63 is cheaper → 168 instead of 150; the whole sum decides.","trap":null},{"text":"Stores the cost in s[i, j] instead of k.","trap":"T8"}],"source":"Lecture09.ppt, slides 38–49","check":{"algo":"mcm","p":[4,3,3,5,7],"expect":{"m":{"1,1":0,"1,2":36,"1,3":96,"1,4":225,"2,2":0,"2,3":45,"2,4":150,"3,3":0,"3,4":105,"4,4":0},"s":{"1,2":1,"1,3":2,"1,4":2,"2,3":2,"2,4":3,"3,4":3},"parens":"((A1A2)(A3A4))","best":225,"unique":true}},"rows":[],"block":null,"data":null,"figure":null,"id":"p2-q2d","cover":[]},{"label":"e","marks":2,"tier":3,"minutes":4,"archetype":"D9","pattern":["FM-Q5.3","FM-Q5.4"],"lecture":"L09","topic":"Which rows change when one weight changes","stem":"<p>Suppose item 2's weight drops from 2 kg to 1 kg (its profit stays 7). Without rebuilding everything: which rows of your table in (b) stay exactly the same, and why? Recompute the rows that change and give the new optimal profit and solution vector x.<\/p>","solution":{"html":"<p>Rows <b>i = 4 and i = 3 stay the same<\/b>: P(i, k) uses only items i..n, and items 3 and 4 have not changed. Rows 2 and 1 use item 2, so they must be recomputed.<\/p><table class=\"dp\"><thead><tr><th>i\\k<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><th>9<\/th><\/tr><\/thead><tbody><tr><th>4<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><\/tr><tr><th>3<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">15<\/td><td class=\"\">15<\/td><td class=\"\">15<\/td><td class=\"\">15<\/td><td class=\"\">15<\/td><td class=\"take\">24<span class=\"plus\">+9<\/span><\/td><td class=\"take\">24<span class=\"plus\">+9<\/span><\/td><\/tr><tr><th>2<\/th><td class=\"\">0<\/td><td class=\"take\">7<span class=\"plus\">+7<\/span><\/td><td class=\"take\">7<span class=\"plus\">+7<\/span><\/td><td class=\"\">15<\/td><td class=\"take\">22<span class=\"plus\">+7<\/span><\/td><td class=\"take\">22<span class=\"plus\">+7<\/span><\/td><td class=\"take\">22<span class=\"plus\">+7<\/span><\/td><td class=\"take\">22<span class=\"plus\">+7<\/span><\/td><td class=\"\">24<\/td><td class=\"take\">31<span class=\"plus\">+7<\/span><\/td><\/tr><tr><th>1<\/th><td class=\"\">0<\/td><td class=\"\">7<\/td><td class=\"\">7<\/td><td class=\"\">15<\/td><td class=\"\">22<\/td><td class=\"\">22<\/td><td class=\"\">22<\/td><td class=\"\">22<\/td><td class=\"take\">25<span class=\"plus\">+3<\/span><\/td><td class=\"\">31<\/td><\/tr><\/tbody><\/table><p>New P(1, 9) = <b>31<\/b> with x = <b>[0, 1, 1, 1]<\/b> (weight 1 + 5 + 3 = 9). The kilogram saved lets item 3 in, and item 1 drops out.<\/p>","figures":[]},"rubric":[{"text":"Rows 4 and 3 unchanged, because P(i, k) depends only on items i..n.","marks":1},{"text":"New rows 2 and 1 (0 7 7 15 22 22 22 22 24 31 / 0 7 7 15 22 22 22 22 25 31); P(1, 9) = 31, x = [0, 1, 1, 1].","marks":1}],"mistakes":[{"text":"Says only row 2 changes: row 1 is built from row 2, so it changes too.","trap":"T7"},{"text":"Keeps x = [1, 1, 0, 1] and reports 25: the freed kilogram makes room for item 3 (9 + 7 + 15 = 31).","trap":null},{"text":"Says rows 1 and 2 stay the same and rows 3 and 4 change — the rows are built from the bottom (i = n) up, on the suffix i..n.","trap":"T7"}],"source":"Lecture09.ppt, slides 13–16 and 21–32","check":{"algo":"knapsack","w":[4,1,5,3],"p":[3,7,9,15],"c":9,"base":[4,2,5,3],"expect":{"rows":{"4":[0,0,0,15,15,15,15,15,15,15],"3":[0,0,0,15,15,15,15,15,24,24],"2":[0,7,7,15,22,22,22,22,24,31],"1":[0,7,7,15,22,22,22,22,25,31]},"x":[0,1,1,1],"best":31,"optimalSubsets":1,"same":[3,4]}},"procs":[],"rows":[],"block":null,"data":null,"figure":null,"id":"p2-q2e","cover":[]}]},{"num":3,"marks":15,"title":"String Matching Algorithms","lectures":["L06"],"context":"<p>Indices are 1-based. A shift s lines P[1..m] up under T[s + 1..s + m]. Character comparisons are counted left to right, stopping at the first mismatch (a full match costs m comparisons). The algorithms are given at the end of the paper.<\/p><p>For (a) and (b), a DNA fragment:<\/p><table class=\"arr\"><tr><th class=\"ix\">i<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th class=\"ix\">7<\/th><th class=\"ix\">8<\/th><th class=\"ix\">9<\/th><th class=\"ix\">10<\/th><th class=\"ix\">11<\/th><th class=\"ix\">12<\/th><th class=\"ix\">13<\/th><th class=\"ix\">14<\/th><\/tr><tr><th class=\"rowlab\">T<\/th><td class=\"\">A<\/td><td class=\"\">A<\/td><td class=\"\">A<\/td><td class=\"\">T<\/td><td class=\"\">C<\/td><td class=\"\">A<\/td><td class=\"\">T<\/td><td class=\"\">C<\/td><td class=\"\">A<\/td><td class=\"\">T<\/td><td class=\"\">C<\/td><td class=\"\">G<\/td><td class=\"\">A<\/td><td class=\"\">T<\/td><\/tr><\/table><p>P = <span class=\"mono\">ATCA<\/span> (m = 4).<\/p>","parts":[{"label":"a","marks":2,"tier":1,"minutes":3,"archetype":"D11","pattern":["FM-C.1"],"lecture":"L06","topic":"Valid shift definition, applied","stem":"<p>For T and P above, state whether each of the shifts s = 5, s = 8 and s = 12 is a valid shift. Justify each answer from the definition of a valid shift.<\/p>","solution":{"html":"<p>n − m = 14 − 4 = 10. A shift s is valid if 0 ≤ s ≤ n − m and T[s + 1..s + m] = P[1..m].<\/p><ul><li>s = 5: 0 ≤ 5 ≤ 10 and T[6..9] = ATCA = P ⇒ <b>valid<\/b> — even though it overlaps the occurrence at shift 2 (they share T[6] = A).<\/li><li>s = 8: in range, but T[9..12] = ATCG ≠ ATCA (T[12] = G, P[4] = A) ⇒ <b>invalid<\/b>.<\/li><li>s = 12: 12 &gt; n − m = 10 ⇒ <b>invalid<\/b>; T[13..14] = AT only looks like the start of P.<\/li><\/ul>","figures":[]},"rubric":[{"text":"n − m = 10 worked out and used.","marks":0.5},{"text":"s = 5 valid: T[6..9] = ATCA (overlapping occurrences are allowed).","marks":0.5},{"text":"s = 8 invalid: the 4th character differs (T[12] = G, P[4] = A).","marks":0.5},{"text":"s = 12 invalid because 12 &gt; n − m.","marks":0.5}],"mistakes":[{"text":"Rejects s = 5 because it overlaps the occurrence at s = 2: the definition has no such rule.","trap":null},{"text":"Accepts s = 12 because T[13..14] = AT matches P[1..2]: the range condition fails.","trap":"T-L06c"}],"source":"Lecture06 (1).ppt, slides 7–9","check":{"algo":"validshift","T":"AAATCATCATCGAT","P":"ATCA","shifts":[5,8,12],"expect":[true,false,false]},"procs":[],"rows":[],"block":null,"data":null,"figure":null,"id":"p2-q3a","cover":[]},{"label":"b","marks":3,"tier":2,"minutes":5,"archetype":"D1","pattern":["FM-Q1.5","FM-Q2.a"],"lecture":"L06","topic":"NAIVE-STRING-MATCHER: valid shifts and comparisons","procs":["NAIVE-STRING-MATCHER"],"stem":"<p>Illustrate the operations of NAIVE-STRING-MATCHER(T, P) for T and P above. List every valid shift and find the total number of character comparisons it makes.<\/p>","solution":{"html":"<table class=\"snap mono\"><tr><th><\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th class=\"ix\">7<\/th><th class=\"ix\">8<\/th><th class=\"ix\">9<\/th><th class=\"ix\">10<\/th><th class=\"ix\">11<\/th><th class=\"ix\">12<\/th><th class=\"ix\">13<\/th><th class=\"ix\">14<\/th><th>comparisons<\/th><\/tr><tr><th>T<\/th><td>A<\/td><td>A<\/td><td>A<\/td><td>T<\/td><td>C<\/td><td>A<\/td><td>T<\/td><td>C<\/td><td>A<\/td><td>T<\/td><td>C<\/td><td>G<\/td><td>A<\/td><td>T<\/td><td><\/td><\/tr><tr class=\"\"><th>s = 0<\/th><td class=\"ok\">A<\/td><td class=\"bad\">T<\/td><td class=\"skip\">C<\/td><td class=\"skip\">A<\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td>2<\/td><\/tr><tr class=\"\"><th>s = 1<\/th><td class=\"out\"><\/td><td class=\"ok\">A<\/td><td class=\"bad\">T<\/td><td class=\"skip\">C<\/td><td class=\"skip\">A<\/td><td class=\"out\"><\/td><td cl each step.<\/li><li>Label every hit as a valid match or a spurious hit, and state how many explicit character-by-character checks are made.<\/li><\/ol>","solution":{"html":"<p>p = 996 mod 13 = <b>8<\/b> (996 = 13·76 + 8); &nbsp; h = 10<sup>2<\/sup> mod 13 = 100 mod 13 = <b>9<\/b>; &nbsp; t<sub>0<\/sub> = 198 mod 13 = <b>3<\/b>.<\/p><p>Rolling formula t<sub>s+1<\/sub> = (d(t<sub>s<\/sub> − T[s + 1]·h) + T[s + m + 1]) mod q:<\/p><div class=\"mline\">t<sub>1<\/sub> = (10·(t<sub>0<\/sub> − T[1]·h) + T[4]) mod 13 = (10·(3 − 1·9) + 3) mod 13 = (-57) mod 13 = <b>8<\/b> &nbsp;&nbsp;[check: 983 mod 13 = 8]<\/div><div class=\"mline\">t<sub>2<\/sub> = (10·(t<sub>1<\/sub> − T[2]·h) + T[5]) mod 13 = (10·(8 − 9·9) + 9) mod 13 = (-721) mod 13 = <b>7<\/b> &nbsp;&nbsp;[check: 839 mod 13 = 7]<\/div><table class=\"snap mono\"><tr><th>s<\/th><th class=\"ix\">0<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th class=\"ix\">7<\/th><th class=\"ix\">8<\/th><th class=\"ix\">9<\/th><\/tr><tr><th>window<\/th><td>198<\/td><td>983<\/td><td>839<\/td><td>391<\/td><td>914<\/td><td>145<\/td><td>459<\/td><td>599<\/td><td>996<\/td><td>961<\/td><\/tr><tr><th>t<sub>s<\/sub> mod 13<\/th><td class=\"\">3<\/td><td class=\"hit\">8<\/td><td class=\"\">7<\/td><td class=\"\">1<\/td><td class=\"\">4<\/td><td class=\"\">2<\/td><td class=\"\">4<\/td><td class=\"\">1<\/td><td class=\"hit\">8<\/td><td class=\"\">12<\/td><\/tr><tr><th><\/th><td><\/td><td class=\"bad\">spurious hit<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td class=\"ok\">valid match<\/td><td><\/td><\/tr><\/table><p>Hits (t<sub>s<\/sub> = 8) at s = 1 and s = 8. Explicit checks: T[2..4] = 983 ≠ 996 ⇒ <b>spurious hit<\/b>; T[9..11] = 996 = P ⇒ <b>valid match<\/b> (shift 8). <b>2 explicit checks<\/b>.<\/p>","figures":[]},"rubric":[{"text":"p = 8 and h = 9.","marks":1},{"text":"Two rolling steps written in full (high-order digit × h removed, × 10, new digit added, mod 13, negative results brought into 0..12).","marks":1},{"text":"All 10 window values 3 8 7 1 4 2 4 1 8 12.","marks":1.5},{"text":"s = 1 spurious hit (983 ≠ 996) and s = 8 valid match.","marks":1},{"text":"2 explicit checks (one per hit).","marks":0.5}],"mistakes":[{"text":"Reports two occurrences (s = 1 and s = 8): a hit is not a match until the characters are checked.","trap":"T-L06a"},{"text":"Uses h = 10<sup>m<\/sup> mod 13 = 12 → wrong windows from s = 1 on (4 9 2 2 …).","trap":"T-L06b"},{"text":"Keeps a negative remainder: (-721) mod 13 written as -6 instead of 7.","trap":"T-L06b"}],"source":"Lecture06 (1).ppt, slides 15–21","check":{"algo":"rk","T":"198391459961","P":"996","q":13,"expect":{"p":8,"h":9,"windows":[3,8,7,1,4,2,4,1,8,12],"valid":[8],"spurious":[1]}},"rows":[],"block":null,"data":null,"figure":null,"id":"p2-q3c","cover":[]},{"label":"d","marks":5,"tier":3,"minutes":10,"archetype":"D1","pattern":["FM-Q2.a","FM-Q5.3"],"lecture":"L06","topic":"String-matching automaton: δ table, overlapping occurrences, non-zero fallback","procs":["automaton"],"stem":"<p>A receiver watches a bit stream for the marker P = <span class=\"mono\">10110<\/span> over Σ = {0, 1}. Use the string-matching automaton given at the end of the paper.<\/p><ol class=\"roman\"><li>Construct the transition function δ (states 0 … 5, state 5 accepting) as a table. A state-transition diagram is optional.<\/li><li>Give the state sequence φ(T<sub>i<\/sub>) for T = <span class=\"mono\">010110110101<\/span> and every shift at which P occurs.<\/li><li>Explain why δ(5, 1) is 3 and not 0, and what this means for the occurrences you found.<\/li><\/ol>","solution":{"html":"<div class=\"figrow\"><table class=\"dp\"><thead><tr><th>state<\/th><th>0<\/th><th>1<\/th><th>P<\/th><\/tr><\/thead><tbody><tr><th>0<\/th><td class=\"\">0<\/td><td class=\"take\">1<\/td><td>1<\/td><\/tr><tr><th>1<\/th><td class=\"take\">2<\/td><td class=\"\">1<\/td><td>0<\/td><\/tr><tr><th> lo\" x=\"374.0\" y=\"166.6\" width=\"14.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"381.0\" y=\"175.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">1<\/text><line class=\"edge spine\" x1=\"449\" y1=\"192\" x2=\"503\" y2=\"192\" marker-end=\"url(#fa)\"/><rect class=\"halo\" x=\"470.0\" y=\"166.6\" width=\"14.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"477.0\" y=\"175.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">0<\/text><path class=\"edge back\" d=\"M326.0,174.0 C326.0,114.9 244.0,114.9 244.0,170.0\" marker-end=\"url(#fa)\"/><rect class=\"halo\" x=\"278.0\" y=\"101.5\" width=\"14.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"285.0\" y=\"110.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">0<\/text><path class=\"edge back\" d=\"M422.0,174.0 C422.0,29.7 148.0,29.7 148.0,170.0\" marker-end=\"url(#fa)\"/><rect class=\"halo\" x=\"278.0\" y=\"37.5\" width=\"14.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"285.0\" y=\"46.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">1<\/text><path class=\"edge back\" d=\"M518.0,210.0 C518.0,303.7 340.0,303.7 340.0,214.0\" marker-end=\"url(#fa)\"/><rect class=\"halo\" x=\"422.0\" y=\"291.6\" width=\"14.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"429.0\" y=\"300.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">1<\/text><path class=\"edge back\" d=\"M132,209 C105,258 177,258 150,213\" marker-end=\"url(#fa)\"/><rect class=\"halo\" x=\"134.0\" y=\"257.6\" width=\"14.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"141.0\" y=\"266.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">1<\/text><circle class=\"node\" cx=\"45\" cy=\"192\" r=\"19\"/><text class=\"lbl\" x=\"45.0\" y=\"192.0\" text-anchor=\"middle\" dominant-baseline=\"central\">0<\/text><circle class=\"node\" cx=\"141\" cy=\"192\" r=\"19\"/><text class=\"lbl\" x=\"141.0\" y=\"192.0\" text-anchor=\"middle\" dominant-baseline=\"central\">1<\/text><circle class=\"node\" cx=\"237\" cy=\"192\" r=\"19\"/><text class=\"lbl\" x=\"237.0\" y=\"192.0\" text-anchor=\"middle\" dominant-baseline=\"central\">2<\/text><circle class=\"node\" cx=\"333\" cy=\"192\" r=\"19\"/><text class=\"lbl\" x=\"333.0\" y=\"192.0\" text-anchor=\"middle\" dominant-baseline=\"central\">3<\/text><circle class=\"node\" cx=\"429\" cy=\"192\" r=\"19\"/><text class=\"lbl\" x=\"429.0\" y=\"192.0\" text-anchor=\"middle\" dominant-baseline=\"central\">4<\/text><circle class=\"node acc\" cx=\"525\" cy=\"192\" r=\"19\"/><circle class=\"node accin\" cx=\"525\" cy=\"192\" r=\"15\"/><text class=\"lbl\" x=\"525.0\" y=\"192.0\" text-anchor=\"middle\" dominant-baseline=\"central\">5<\/text><\/svg><\/figure><\/div><p>Shaded entries are the spine δ(q, P[q + 1]) = q + 1.<\/p><table class=\"snap mono\"><tr><th>i<\/th><td>—<\/td><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th class=\"ix\">7<\/th><th class=\"ix\">8<\/th><th class=\"ix\">9<\/th><th class=\"ix\">10<\/th><th class=\"ix\">11<\/th><th class=\"ix\">12<\/th><\/tr><tr><th>T[i]<\/th><td>—<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><th>state φ(T<sub>i<\/sub>)<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">1<\/td><td class=\"\">2<\/td><td class=\"\">3<\/td><td class=\"\">4<\/td><td class=\"acc\">5<\/td><td class=\"\">3<\/td><td class=\"\">4<\/td><td class=\"acc\">5<\/td><td class=\"\">3<\/td><td class=\"\">2<\/td><td class=\"\">3<\/td><\/tr><\/table><p>φ = 5 at i = 6 and i = 9: occurrences with shifts 6 − 5 = <b>1<\/b> and 9 − 5 = <b>4<\/b>. They overlap: T[5..6] = “10” ends the first and starts the second.<\/p><p><b>δ(5, 1) = 3:<\/b> in state 5 the automaton has read “10110”; reading 1 gives a text ending in “101101”. The longest prefix of P that is a suffix of “101101” is “101” (length 3) — “1011” and “10110” are not suffixes. So after a full match the automaton is already 3 characters into the next occurrence; that is how it finds the overlapping occurrence at shift 4 without re-reading the text.<\/p>","figures":[]},"rubric":[{"text":"δ rows for states 0–2 correct, columns 0 1 (0: 0 1 · 1: 2 1 · 2: 0 3).","marks":1},{"text":"δ rows for states 3–5 correct (3: 2 4 · 4: 5 1 · 5: 0 3).","marks":1},{"text":"State sequence 0 0 1 2 3 4 5 3 4 5 3 2 3.","marks":1},{"text":"Occurrences ending at 6 and 9, i.e. shifts 1 and 4 (overlapping).","marks":1},{"text":"δ(5, 1) = 3 explained as the longest prefix of P that is a suffix of 101101 (= 101), and linked to the overlapping occurrence.","marks":1}],"mistakes":[{"text":"Resets to 0 (or to 1 on a 1) after every mismatch or match: the run becomes 0 0 1 2 3 4 5 1 1 2 3 0 1 and only 1 occurrence is found — the overlapping one is lost.","trap":"T-L06d"},{"text":"Writes δ(1, 1) = 0: after reading “1” then 1, the text ends in “11”, whose suffix “1” is P[1], so δ(1, 1) = 1.","trap":"T-L06d"},{"text":"Gives the end positions 6 and 9 as the shifts: shift = end − m.","trap":null}],"source":"Lecture06 (1).ppt, slides 22–27","check":{"algo":"fa","P":"10110","sigma":"01","T":"010110110101","expect":{"delta":{"0,0":0,"0,1":1,"1,0":2,"1,1":1,"2,0":0,"2,1":3,"3,0":2,"3,1":4,"4,0":5,"4,1":1,"5,0":0,"5,1":3},"states":[0,0,1,2,3,4,5,3,4,5,3,2,3],"ends":[6,9]}},"rows":[],"block":null,"data":null,"figure":null,"id":"p2-q3d","cover":[]}]},{"num":4,"marks":15,"title":"Data Compression Algorithms and Greedy Algorithms","lectures":["L08","L07"],"context":"<p><b>Compression.<\/b> A data logger records one of five status letters a &lt; b &lt; c &lt; d &lt; e. In a 69-letter log the counts are:<\/p><table class=\"grid num\"><thead><tr><th>letter<\/th><th>a<\/th><th>b<\/th><th>c<\/th><th>d<\/th><th>e<\/th><\/tr><\/thead><tbody><tr><td>count<\/td><td>2<\/td><td>24<\/td><td>10<\/td><td>18<\/td><td>15<\/td><\/tr><\/tbody><\/table><p><b>Greedy.<\/b> The weighted directed graph below is used in parts (e) and (f).<\/p>","parts":[{"label":"a","marks":2,"tier":1,"minutes":3,"archetype":"D11","pattern":["FM-C.1"],"lecture":"L08","topic":"Lossless vs lossy; prefix-free check on a flawed code","block":"compression","stem":"<ol class=\"roman\"><li>The log is used for billing and must be restored bit for bit. Should it be compressed with a lossless or a lossy method? Why?<\/li><li>A colleague proposes the variable-length code a = 0, b = 10, c = 01, d = 110, e = 111. Is it prefix-free? If not, name the clash and give a 3-bit string that decodes in two different ways.<\/li><\/ol>","solution":{"html":"<p>(i) <b>Lossless<\/b>: the decompressed log must be exactly the original; a lossy method permanently removes information (acceptable for images or sound, not for billing records).<\/p><p>(ii) <b>Not prefix-free<\/b>: the codeword for a (0) is a prefix of the codeword for c (01). The string <b>010<\/b> decodes as a·b (0|10) and as c·a (01|0), so a decoder cannot tell which was sent.<\/p>","figures":[]},"rubric":[{"text":"Lossless, because the data must be restored exactly (lossy permanently removes information).","marks":1},{"text":"Not prefix-free: 0 (a) is a prefix of 01 (c); 010 = a b = c a.","marks":1}],"mistakes":[{"text":"Chooses lossy “because it compresses more”: for records that must be restored exactly, any lost bit is an error.","trap":null},{"text":"Calls the code prefix-free because all five codewords are different: distinct codewords are not enough — none may be the start of another.","trap":null}],"source":"Lecture08.ppt, slides 5–7 and 14–16","check":{"algo":"prefix","code":{"a":"0","b":"10","c":"01","d":"110","e":"111"},"expect":{"clashes":[["a","c"]],"ambiguous3":["010"]}},"procs":[],"rows":[],"data":null,"figure":null,"id":"p2-q4a","cover":["lossless-lossy","prefix-free"]},{"label":"b","marks":2,"tier":2,"minutes":4,"archetype":"D1","pattern":["FM-C.2","FM-C.3"],"lecture":"L08","topic":"Huffman code and total bits","block":"compression","procs":["HUFFMAN"],"stem":"<p>Construct the codeword for each letter using HUFFMAN(C) given at the end of the paper (the first EXTRACT-MIN becomes the left child, labelled 0). Show the forest after every merge, and find the number of bits needed for the log.<\/p>","solution":{"html":"<p>Merges: 2 + 10 = 12, 12 + 15 = 27, 18 + 24 = 42, 27 + 42 = 69.<\/p><div class=\"figrow\"><figure class=\"fig\"><svg class=\"dg\" viewBox=\"0 0 400 84\" style=\"min-width:400px;max-width:440px\" role=\"img\" aria-label=\"(a)\" xmlns=\"http://www.w3.org/2000/svg\"><text class=\"ttl\" x=\"200.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"central\">(a)<\/text><rect class=\"leaf\" x=\"22.0\" y=\"41.0\" width=\"36.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"40.0\" y=\"54.0\" text-anchor=\"middle\" dominant-baseline=\"central\">a:2<\/text><rect class=\"leaf\" x=\"90.0\" y=\"41.0\" width=\"44.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"112.0\" y=\"54.0\" text-anchor=\"middle\" dominant-baseline=\"central\">c:10<\/text><rect class=\"leaf\" x=\"162.0\" y=\"41.0\" width=\"44.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"184.0\" y=\"54.0\" text-anchor=\"middle\" dominant-baseline=\"central\">e:15<\/text><rect class=\"leaf\" x=\"234.0\" y=\"41.0\" width=\"44.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"256.0\" y=\"54.0\" text-anchor=\"middle\" dominant-baseline=\"central\">d:18<\/text><rect class=\"leaf\" x=\"306.0\" y=\"41.0\" width=\"44.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"328.0\" y=\"54.0\" text-anchor=\"middle\" dominant-baseline=\"central\">b:24<\/text><\/svg><\/figure><figure class=\"fig\"><svg class=\"dg\" viewBox=\"0 0 386 154\" style=\"min-width:386px;max-width:425px\" role=\"img\" aria-label=\"(b)\" xmlns=\"http://www.w3.org/2000/svg\"><text class=\"ttl\" x=\"193.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"central\">(b)<\/t t to the nearer one. (ASCII: E = 69, N = 78, T = 84.) Give the table and the symbol stream, then the two frequency tables gzip builds its Huffman codes from.<\/p>","solution":{"html":"<table class=\"grid\"><thead><tr><th>text so far<\/th><th>distance back<\/th><th>number to copy or ASCII code<\/th><\/tr><\/thead><tbody><tr><td><span class=\"mono\">T<\/span><\/td><td>0<\/td><td>84<\/td><\/tr><tr><td><span class=\"mono\">TE<\/span><\/td><td>0<\/td><td>69<\/td><\/tr><tr><td><span class=\"mono\">TEN<\/span><\/td><td>0<\/td><td>78<\/td><\/tr><tr><td><span class=\"mono\">TENT<\/span><\/td><td>3<\/td><td>1<\/td><\/tr><tr><td><span class=\"mono\">TENTTENT<\/span><\/td><td>4<\/td><td>4<\/td><\/tr><tr><td><span class=\"mono\">TENTTENTENT<\/span><\/td><td>3<\/td><td>3<\/td><\/tr><\/tbody><\/table><p>Symbol stream: <b>(0,84) (0,69) (0,78) (3,1) (4,4) (3,3)<\/b>.<\/p><p>At position 9 “ENT” appears both 7 back and 3 back; the nearer copy gives (3, 3).<\/p><div class=\"figrow\"><table class=\"grid num\"><thead><tr><th>distance<\/th><th>frequency<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>2<\/td><\/tr><tr><td>4<\/td><td>1<\/td><\/tr><\/tbody><\/table><table class=\"grid num\"><thead><tr><th>copy length<\/th><th>frequency<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><\/tr><tr><td>3<\/td><td>1<\/td><\/tr><tr><td>4<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><p>gzip builds one Huffman code on the distance counts (the 0s signal a new character) and one on the copy lengths; the ASCII numbers of (0, ASCII) pairs are not copy lengths.<\/p>","figures":[]},"rubric":[{"text":"Six-row table and the stream (0,84) (0,69) (0,78) (3,1) (4,4) (3,3).","marks":1},{"text":"Distance table 0:3, 3:2, 4:1 and copy-length table 1:1, 3:1, 4:1.","marks":1}],"mistakes":[{"text":"At position 9 points 7 back to the first ENT → (7,3); the rule asks for the nearer copy, (3,3).","trap":null},{"text":"At position 5 copies the nearest T (1 back) → (1,1), then codes ENT separately: take the longest match first, TENT 4 back → (4,4).","trap":null},{"text":"Puts the ASCII codes 84, 69, 78 in the copy-length table: they are characters, not lengths.","trap":null}],"source":"Lecture08.ppt, slides 40–45","check":{"algo":"lz","text":"TENTTENTENT","expect":{"stream":[[0,84],[0,69],[0,78],[3,1],[4,4],[3,3]],"dist":{"0":3,"3":2,"4":1},"lens":{"1":1,"4":1,"3":1}}},"rows":[],"data":null,"figure":null,"id":"p2-q4c","cover":["ziv-lempel"]},{"label":"d","marks":3,"tier":3,"minutes":6,"archetype":"D1","pattern":["FM-C.4","FM-C.5"],"lecture":"L08","topic":"Hu-Tucker alphabetic code; why it cannot beat Huffman","block":"compression","procs":["Hu-Tucker"],"stem":"<p>The logger needs an <em>alphabetic<\/em> code (codewords in the same order as a &lt; b &lt; c &lt; d &lt; e, so coded logs can be sorted). Construct it with the Hu-Tucker algorithm given at the end of the paper, find its total number of bits, and explain why it can never be shorter than your Huffman total from (b).<\/p>","solution":{"html":"<p>Nodes marked * are internal; only a <em>leaf<\/em> between two nodes blocks a join.<\/p><div class=\"mline\">list [a 2, b 24, c 10, d 18, e 15]: allowed pairs a–b 26, c–d 28, d–e 33, b–c 34 ⇒ join <b>a + b = 26<\/b><br>list [a+b* 26, c 10, d 18, e 15]: allowed pairs c–d 28, d–e 33, a+b–c 36 ⇒ join <b>c + d = 28<\/b><br>list [a+b* 26, c+d* 28, e 15]: allowed pairs a+b–e 41, c+d–e 43, a+b–c+d 54 ⇒ join <b>a+b + e = 41<\/b><br>list [a+b+e* 41, c+d* 28]: allowed pairs a+b+e–c+d 69 ⇒ join <b>a+b+e + c+d = 69<\/b><\/div><p>The third join, (a+b) with e, is allowed because only the internal node c+d lies between them.<\/p><figure class=\"fig\"><svg class=\"dg\" viewBox=\"0 0 344 294\" style=\"min-width:344px;max-width:378px\" role=\"img\" aria-label=\"Hu-Tucker tree\" xmlns=\"http://www.w3.org/2000/svg\"><text class=\"ttl\" x=\"172.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"central\">Hu-Tucker tree<\/text><line class=\"edge\" x1=\"62.1\" y1=\" xt><circle class=\"node\" cx=\"177.8\" cy=\"54.0\" r=\"17\"/><text class=\"lbl\" x=\"177.8\" y=\"54.0\" text-anchor=\"middle\" dominant-baseline=\"central\">69<\/text><\/svg><\/figure><table class=\"grid num\"><thead><tr><th>letter<\/th><th>frequency<\/th><th>H-T length<\/th><th>alphabetic code<\/th><th>freq × length<\/th><\/tr><\/thead><tbody><tr><td>a<\/td><td>2<\/td><td>3<\/td><td><span class=\"mono\">000<\/span><\/td><td>6<\/td><\/tr><tr><td>b<\/td><td>24<\/td><td>3<\/td><td><span class=\"mono\">001<\/span><\/td><td>72<\/td><\/tr><tr><td>c<\/td><td>10<\/td><td>2<\/td><td><span class=\"mono\">01<\/span><\/td><td>20<\/td><\/tr><tr><td>d<\/td><td>18<\/td><td>2<\/td><td><span class=\"mono\">10<\/span><\/td><td>36<\/td><\/tr><tr><td>e<\/td><td>15<\/td><td>2<\/td><td><span class=\"mono\">11<\/span><\/td><td>30<\/td><\/tr><tr><td><b>total<\/b><\/td><td>69<\/td><td><\/td><td><\/td><td><b>164<\/b><\/td><\/tr><\/tbody><\/table><p>Hu-Tucker needs <b>164 bits<\/b>, Huffman 150. Huffman is optimal over <em>all<\/em> prefix codes; Hu-Tucker solves the same problem with an extra restriction (alphabetic order), so its total can only be equal or larger. Here b (24) sits next to the rare a (2) and is forced down to length 3, while Huffman gives it 2 bits: +24, and c gains back 10 → 14 bits more.<\/p>","figures":[]},"rubric":[{"text":"Joins in order a+b (26), c+d (28), (a+b)+e (41) — allowed because only the internal node c+d lies between — then the root (69).","marks":1},{"text":"Lengths a 3, b 3, c 2, d 2, e 2; codes a 000, b 001, c 01, d 10, e 11; total 164.","marks":1},{"text":"Huffman is optimal among all prefix codes and Hu-Tucker adds the alphabetic restriction, so H-T ≥ Huffman (here b pays the extra bit).","marks":1}],"mistakes":[{"text":"Refuses to join a+b with e because c+d lies between them: only leaves block a join. Joining (c+d)+e (43) instead gives a total of 166 bits.","trap":null},{"text":"Joins the two smallest frequencies a (2) and c (10) as Huffman would: the leaf b lies between them, so that join is not allowed.","trap":null},{"text":"Reads the codewords straight off the join tree (giving e a code that sorts before c): the lecture assigns alphabetic codes from the lengths.","trap":null}],"source":"Lecture08.ppt, slides 33–39","check":{"algo":"hutucker","syms":["a","b","c","d","e"],"w":[2,24,10,18,15],"expect":{"depth":{"a":3,"b":3,"c":2,"d":2,"e":2},"codes":{"a":"000","b":"001","c":"01","d":"10","e":"11"},"total":164,"huff":150}},"rows":[],"data":null,"figure":null,"id":"p2-q4d","cover":["hu-tucker"]},{"label":"e","marks":4,"tier":2,"minutes":7,"archetype":"D1","pattern":["FM-Q4.3"],"lecture":"L07","topic":"DIJKSTRA with the lecture's table","block":"greedy","procs":["DIJKSTRA","RELAX","INITIALIZE-SINGLE-SOURCE"],"stem":"<p>Find the shortest paths from s using DIJKSTRA given at the end of the paper. Show the lecture's table: Step #, vertex to be marked, d[s] d[a] d[b] d[c] d[d] d[t], unmarked vertices. Then give the shortest path from s to t and its length.<\/p>","figure":"<svg class=\"dg\" viewBox=\"0 0 650 300\" style=\"min-width:650px;max-width:715px\" role=\"img\" aria-label=\"weighted directed graph on s, a, b, c, d, t\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto-start-reverse\"><path class=\"arrowhead\" d=\"M0,0 L10,5 L0,10 z\"/><\/marker><marker id=\"arwh\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto-start-reverse\"><path class=\"arrowhead hl\" d=\"M0,0 L10,5 L0,10 z\"/><\/marker><\/defs><line class=\"edge\" x1=\"76.4\" y1=\"140.4\" x2=\"211.9\" y2=\"60.6\" marker-end=\"url(#arw)\"/><line class=\"edge\" x1=\"76.4\" y1=\"159.6\" x2=\"211.9\" y2=\"239.4\" marker-end=\"url(#arw)\"/><line class=\"edge\" x1=\"249.0\" y1=\"50.0\" x2=\"399.0\" y2=\"50.0\" marker-end=\"url(#arw)\"/><line class=
