\"209.5\" width=\"22.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"515.6\" y=\"218.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">12<\/text><circle class=\"node\" cx=\"60.0\" cy=\"150.0\" r=\"18\"/><text class=\"lbl vname\" x=\"60.0\" y=\"150.0\" text-anchor=\"middle\" dominant-baseline=\"central\">s<\/text><circle class=\"node\" cx=\"230.0\" cy=\"50.0\" r=\"18\"/><text class=\"lbl vname\" x=\"230.0\" y=\"50.0\" text-anchor=\"middle\" dominant-baseline=\"central\">a<\/text><circle class=\"node\" cx=\"230.0\" cy=\"250.0\" r=\"18\"/><text class=\"lbl vname\" x=\"230.0\" y=\"250.0\" text-anchor=\"middle\" dominant-baseline=\"central\">c<\/text><circle class=\"node\" cx=\"420.0\" cy=\"50.0\" r=\"18\"/><text class=\"lbl vname\" x=\"420.0\" y=\"50.0\" text-anchor=\"middle\" dominant-baseline=\"central\">b<\/text><circle class=\"node\" cx=\"420.0\" cy=\"250.0\" r=\"18\"/><text class=\"lbl vname\" x=\"420.0\" y=\"250.0\" text-anchor=\"middle\" dominant-baseline=\"central\">d<\/text><circle class=\"node\" cx=\"590.0\" cy=\"150.0\" r=\"18\"/><text class=\"lbl vname\" x=\"590.0\" y=\"150.0\" text-anchor=\"middle\" dominant-baseline=\"central\">t<\/text><\/svg><figcaption>π edges of the path to t highlighted<\/figcaption><\/figure><p>Shortest path s → t: <b>s → c → d → b → t<\/b>, length <b>23<\/b> (π[t] = b, π[b] = d, π[d] = c, π[c] = s).<\/p>","figures":[]},"rubric":[{"text":"Steps 0–1: s then a marked; d[a] = 7, d[c] = 11, then d[b] = 18, d[d] = 14.","marks":1},{"text":"Step 2: c marked (11 &lt; 14, 18) and d[d] lowered from 14 to 12.","marks":1},{"text":"Steps 3–5: d, b, t marked; d[b] 18 → 17, d[t] 24 → 23.","marks":1},{"text":"Path s → c → d → b → t with length 23, read from the π values.","marks":1}],"mistakes":[{"text":"Treats a d value as final when it is first set (never lowers it): d[d] = 14, d[b] = 18, d[t] = 26. A vertex is final only when it is marked.","trap":"T-L07d"},{"text":"After marking a, continues with a's neighbour d (14) as if walking a path: Dijkstra marks the unmarked vertex with the smallest d overall, which is c = 11.","trap":"T-L07d"}],"source":"Lecture07 (5).ppt, slides 35–44","check":{"algo":"dijkstra","V":["s","a","b","c","d","t"],"arcs":[["s","a",7],["s","c",11],["a","b",11],["a","d",7],["c","a",9],["c","d",1],["b","t",6],["d","b",5],["d","t",12]],"s":"s","expect":{"order":["s","a","c","d","b","t"],"d":{"s":0,"a":7,"b":17,"c":11,"d":12,"t":23},"path":["s","c","d","b","t"]}},"rows":[],"data":null,"id":"p2-q4e","cover":["dijkstra"]},{"label":"f","marks":2,"tier":3,"minutes":3,"archetype":"D9","pattern":["FM-Q4.2"],"lecture":"L07","topic":"Greedy ≠ optimal: the greedy walk against Dijkstra","block":"greedy","stem":"<p>A classmate uses the lecture's first greedy method: start at s and always follow the cheapest arc out of the current vertex until t is reached. Which route and cost does it give on this graph? Use your table from (e) to explain why this greedy choice fails while Dijkstra's greedy choice gives the optimum.<\/p>","solution":{"html":"<ul><li>at s: arcs s→a 7, s→c 11 ⇒ take s→a<\/li><li>at a: arcs a→d 7, a→b 11 ⇒ take a→d<\/li><li>at d: arcs d→b 5, d→t 12 ⇒ take d→b<\/li><li>at b: arcs b→t 6 ⇒ take b→t<\/li><\/ul><p>Route <b>s → a → d → b → t<\/b>, cost 7 + 7 + 5 + 6 = <b>25<\/b> — 2 more than d[t] = 23.<\/p><p>The walk compares single arcs and never goes back: taking s→a (7 &lt; 11) commits it to reaching d at cost 14. Dijkstra's greedy choice is the unmarked vertex with the smallest <em>total<\/em> distance d[u], and RELAX keeps improving estimates — d[d] fell from 14 to 12 through c — so a vertex's d is final only when it is marked.<\/p>","figures":[]},"rubric":[{"text":"Route s → a → d → b → t with each arc choice shown, cost 25.","marks":1},{"text":"25 &gt; d[t] = 23, with the reason: the walk compares single arcs, Dijkstra compares whole path lengths and relaxes (e.g. d[d] 14 → 12).","marks":1}],"mistakes":[{"text":"Says Dijkstra is “not greedy”: it is greedy (it always marks the smallest d), but its choice is over total distances, which is why it is optimal.","trap":"T-L07a"},{"text":"Follows s→c because c leads to the cheapest arc (c→d = 1): that looks ahead, which the greedy walk does not do; from s it takes the cheaper arc s→a.","trap":"T-L07a"}],"source":"Lecture07 (5).ppt, slides 3–9 and 41–44","check":{"algo":"walk","arcs":[["s","a",7],["s","c",11],["a","b",11],["a","d",7],["c","a",9],["c","d",1],["b","t",6],["d","b",5],["d","t",12]],"s":"s","t":"t","expect":{"path":["s","a","d","b","t"],"cost":25,"opt":23}},"procs":[],"rows":[],"data":null,"figure":null,"id":"p2-q4f","cover":["greedy-not-optimal"]}]}]}],"procs":{"INSERTION-SORT":{"id":"INSERTION-SORT","title":"INSERTION-SORT(A)","source":"Lecture02, slide 3","html":"<div class=\"code\"><pre>     INSERTION-SORT(A)\n<span class=\"ln\"> 1<\/span>  for j ← 2 to length[A]\n<span class=\"ln\"> 2<\/span>      do key ← A[j]\n<span class=\"ln\"> 3<\/span>         ⊲ Insert A[j] into the sorted sequence A[1..j − 1]\n<span class=\"ln\"> 4<\/span>         i ← j − 1\n<span class=\"ln\"> 5<\/span>         while i &gt; 0 and A[i] &gt; key\n<span class=\"ln\"> 6<\/span>             do A[i + 1] ← A[i]\n<span class=\"ln\"> 7<\/span>                i ← i − 1\n<span class=\"ln\"> 8<\/span>         A[i + 1] ← key\n<\/pre><\/div>","names":["INSERTION-SORT"]},"QUICKSORT":{"id":"QUICKSORT","title":"QUICKSORT and PARTITION (Partition Algorithm 02)","source":"Lecture04, slides 8 and 10","html":"<div class=\"code\"><pre>     QUICKSORT(A, p, r)\n<span class=\"ln\"> 1<\/span>  if p &lt; r\n<span class=\"ln\"> 2<\/span>     then q ← PARTITION(A, p, r)\n<span class=\"ln\"> 3<\/span>          QUICKSORT(A, p, q − 1)\n<span class=\"ln\"> 4<\/span>          QUICKSORT(A, q + 1, r)\n     ⊲ To sort an entire array A, the initial call is QUICKSORT(A, 1, length[A]).\n<\/pre><\/div><div class=\"code\"><pre>     PARTITION(A, p, r)\n<span class=\"ln\"> 1<\/span>  x ← A[r]\n<span class=\"ln\"> 2<\/span>  i ← p − 1\n<span class=\"ln\"> 3<\/span>  for j ← p to r − 1\n<span class=\"ln\"> 4<\/span>      do if A[j] ≤ x\n<span class=\"ln\"> 5<\/span>            then i ← i + 1\n<span class=\"ln\"> 6<\/span>                 exchange A[i] ↔ A[j]\n<span class=\"ln\"> 7<\/span>  exchange A[i + 1] ↔ A[r]\n<span class=\"ln\"> 8<\/span>  return i + 1\n<\/pre><\/div>","names":["QUICKSORT","PARTITION"]},"MERGE":{"id":"MERGE","title":"MERGE (Merge procedure, Algorithm 2)","source":"Lecture04, slide 24","html":"<div class=\"code\"><pre>     MERGE(A, p, q, r)\n<span class=\"ln\"> 1<\/span>  n1 ← q − p + 1\n<span class=\"ln\"> 2<\/span>  n2 ← r − q\n<span class=\"ln\"> 3<\/span>  create arrays L[1..n1 + 1] and R[1..n2 + 1]\n<span class=\"ln\"> 4<\/span>  for i ← 1 to n1\n<span class=\"ln\"> 5<\/span>      do L[i] ← A[p + i − 1]\n<span class=\"ln\"> 6<\/span>  for j ← 1 to n2\n<span class=\"ln\"> 7<\/span>      do R[j] ← A[q + j]\n<span class=\"ln\"> 8<\/span>  L[n1 + 1] ← ∞\n<span class=\"ln\"> 9<\/span>  R[n2 + 1] ← ∞\n<span class=\"ln\">10<\/span>  i ← 1\n<span class=\"ln\">11<\/span>  j ← 1\n<span class=\"ln\">12<\/span>  for k ← p to r\n<span class=\"ln\">13<\/span>      do if L[i] ≤ R[j]\n<span class=\"ln\">14<\/span>            then A[k] ← L[i]\n<span class=\"ln\">15<\/span>                 i ← i + 1\n<span class=\"ln\">16<\/span>            else A[k] ← R[j]\n<span class=\"ln\">17<\/span>                 j ← j + 1\n<\/pre><\/div>","names":["MERGE"]},"HEAPS":{"id":"HEAPS","title":"HEAPIFY, BUILD_HEAP and HEAPSORT","source":"Lecture05, slides 15, 23, 30 and 38","html":"<div class=\"code\"><pre>     HEAPIFY(A, i)\n<span class=\"ln\"> 1<\/span>  l ← LEFT_CHILD(i)\n<span class=\"ln\"> 2<\/span>  r ← RIGHT_CHILD(i)\n<span class=\"ln\"> 3<\/span>  if l ≤ heap_size[A] and A[l] &gt; A[i]\n<span class=\"ln\"> 4<\/span>     then largest ← l\n<span class=\"ln\"> 5<\/span>     else largest ← i\n<span class=\"ln\"> 6<\/span>  if r ≤ heap_size[A] and A[r] &gt; A[largest]\n<span class=\"ln\"> 7<\/span>     then largest ← r\n<span class=\"ln\"> 8<\/span>  if largest ≠ i\n<span class=\"ln\"> 9<\/span>     then exchange A[i] ↔ A[largest]\n<span class=\"ln\">10<\/span>          HEAPIFY(A, largest)\n     ⊲ PARENT(i) = ⌊i/2⌋,  LEFT_CHILD(i) = 2i,  RIGHT_CHILD(i) = 2i + 1\n<\/pre><\/div><div class=\"code\"><pre>     BUILD_HEAP(A)\n<span class=\"ln\"> 1<\/span>  heap_size[A] ← length[A]\n<span class=\"ln\"> 2<\/span>  for i ← ⌊length[A]/2⌋ downto 1\n<span class=\"ln\"> 3<\/span>      do HEAPIFY(A, i)\n<\/pre><\/div><div class=\"code\"><pre>     HEAPSORT(A)\n<span class=\"ln\"> 1<\/span>  BUILD_HEAP(A)\n<span class=\"ln\"> 2<\/span>  for i ← length[A] downto 2\n<span class=\"ln\"> 3<\/span>      do exchange A[1] ↔ A[i]\n<span class=\"ln\"> 4<\/span>         heap_size[A] ← heap_size[A] − 1\n<span class=\"ln\"> 5<\/span>         HEAPIFY(A, 1)\n<\/pre><\/div>","names":["HEAPIFY","BUILD_HEAP","HEAPSORT"]},"KNAPSACK":{"id":"KNAPSACK","title":"0/1 knapsack: the recursion P(i, k) and KNAPSACK-RECURSE","source":"Lecture09, slides 13–18","html":"<div class=\"code\"><div class=\"ctitle\">The 0/1 knapsack recursion<\/div><div class=\"formula\"><p>P(i, k) is the maximum profit possible using items i…n and remaining capacity k. Item i has weight w<sub>i<\/sub> and profit p<sub>i<\/sub>.<\/p><table class=\"cases\"><tr><td rowspan=\"4\" class=\"brace\">P(i, k) =<\/td><td>0<\/td><td>i = n and w<sub>n<\/sub> &gt; k<\/td><\/tr><tr><td>p<sub>n<\/sub><\/td><td>i = n and w<sub>n<\/sub> ≤ k<\/td><\/tr><tr><td>P(i + 1, k)<\/td><td>i &lt; n and w<sub>i<\/sub> &gt; k<\/td><\/tr><tr><td>max( P(i + 1, k), p<sub>i<\/sub> + P(i + 1, k − w<sub>i<\/sub>) )<\/td><td>i &lt; n and w<sub>i<\/sub> ≤ k<\/td><\/tr><\/table><\/div><\/div><div class=\"code\"><pre>     KNAPSACK-RECURSE(i, k, n, p, w)\n<span class=\"ln\"> 1<\/span>  if (i = n)\n<span class=\"ln\"> 2<\/span>     if (w<sub>n<\/sub> &gt; k)\n<span class=\"ln\"> 3<\/span>        return 0\n<span class=\"ln\"> 4<\/span>     else return p<sub>n<\/sub>\n<span class=\"ln\"> 5<\/span>  if (w<sub>i<\/sub> &gt; k)\n<span class=\"ln\"> 6<\/span>     return KNAPSACK-RECURSE(i + 1, k, n, p, w)\n<span class=\"ln\"> 7<\/span>  else x ← KNAPSACK-RECURSE(i + 1, k, n, p, w)\n<span class=\"ln\"> 8<\/span>       y ← p<sub>i<\/sub> + KNAPSACK-RECURSE(i + 1, k − w<sub>i<\/sub>, n, p, w)\n<span class=\"ln\"> 9<\/span>       return max(x, y)\n<\/pre><\/div>","names":["KNAPSACK-RECURSE","P(i, k)"]},"MCM":{"id":"MCM","title":"MATRIX_CHAIN_ORDER and PRINT-OPTIMAL-PARENS","source":"Lecture09, slides 44, 45 and 48","html":"<div class=\"code\"><div class=\"ctitle\">Matrix-chain recursion<\/div><div class=\"formula\"><p>Matrix A<sub>i<\/sub> has dimension p<sub>i−1<\/sub> × p<sub>i<\/sub>. m[i, j] is the minimum number of scalar multiplications needed to compute A<sub>i<\/sub>A<sub>i+1<\/sub>…A<sub>j<\/sub>; s[i, j] is the k that achieves it.<\/p><table class=\"cases\"><tr><td rowspan=\"2\" class=\"brace\">m[i, j] =<\/td><td>0<\/td><td>if i = j<\/td><\/tr><tr><td>min<sub>i ≤ k &lt; j<\/sub> { m[i, k] + m[k + 1, j] + p<sub>i−1<\/sub> p<sub>k<\/sub> p<sub>j<\/sub> }<\/td><td>otherwise<\/td><\/tr><\/table><\/div><\/div><div class=\"code\"><pre>     MATRIX_CHAIN_ORDER(p)\n<span class=\"ln\"> 1<\/span>  n ← length[p] − 1\n<span class=\"ln\"> 2<\/span>  for i ← 1 to n\n<span class=\"ln\"> 3<\/span>      do m[i, i] ← 0\n<span class=\"ln\"> 4<\/span>  for l ← 2 to n\n<span class=\"ln\"> 5<\/span>      do for i ← 1 to n − l + 1\n<span class=\"ln\"> 6<\/span>             do j ← i + l − 1\n<span class=\"ln\"> 7<\/span>                m[i, j] ← ∞\n<span class=\"ln\"> 8<\/span>                for k ← i to j − 1\n<span class=\"ln\"> 9<\/span>                    do q ← m[i, k] + m[k + 1, j] + p<sub>i−1<\/sub> p<sub>k<\/sub> p<sub>j<\/sub>\n<span class=\"ln\">10<\/span>                       if q &lt; m[i, j]\n<span class=\"ln\">11<\/span>                          then m[i, j] ← q\n<span class=\"ln\">12<\/span>                               s[i, j] ← k\n<span class=\"ln\">13<\/span>  return m and s\n<\/pre><\/div><div class=\"code\"><pre>     PRINT-OPTIMAL-PARENS(s, i, j)\n<span class=\"ln\"> 1<\/span>  if i = j\n<span class=\"ln\"> 2<\/span>     then print \"A\"<sub>i<\/sub>\n<span class=\"ln\"> 3<\/span>     else print \"(\"\n<span class=\"ln\"> 4<\/span>          PRINT-OPTIMAL-PARENS(s, i, s[i, j])\n<span class=\"ln\"> 5<\/span>          PRINT-OPTIMAL-PARENS(s, s[i, j] + 1, j)\n<span class=\"ln\"> 6<\/span>          print \")\"\n<\/pre><\/div>","names":["MATRIX_CHAIN_ORDER","PRINT-OPTIMAL-PARENS"]},"NAIVE":{"id":"NAIVE","title":"NAIVE-STRING-MATCHER","source":"Lecture06, slides 7 and 10","html":"<div class=\"code\"><pre>     ⊲ P occurs with shift s in T if 0 ≤ s ≤ n − m and T[s + 1..s + m] = P[1..m] (a valid shift).\n     NAIVE-STRING-MATCHER(T, P)\n<span class=\"ln\"> 1<\/span>  n ← length[T]\n<span class=\"ln\"> 2<\/span>  m ← length[P]\n<span class=\"ln\"> 3<\/span>  for s ← 0 to n − m\n<span class=\"ln\"> 4<\/span>      do if P[1..m] = T[s + 1..s + m]\n<span class=\"ln\"> 5<\/span>            then print \"Pattern occurs with shift\" s\n<\/pre><\/div>","names":["NAIVE-STRING-MATCHER"]},"RABIN-KARP":{"id":"RABIN-KARP","title":"The Rabin-Karp method","source":"Lecture06, slides 16–20","html":"<div class=\"code\"><pre>     ⊲ Alphabet {0, 1, …, 9}: a string of m digits is read as an m-digit decimal number (radix d = 10).\n     ⊲ q is the modulus; h = d<sup>m−1<\/sup> mod q.\n<span class=\"ln\"> 1<\/span>  p ← P[1..m] mod q;  t<sub>0<\/sub> ← T[1..m] mod q\n<span class=\"ln\"> 2<\/span>  for s ← 0 to n − m\n<span class=\"ln\"> 3<\/span>      do if p = t<sub>s<\/sub>                              ⊲ a hit\n<span class=\"ln\"> 4<\/span>            then if P[1..m] = T[s + 1..s + m]     ⊲ explicit check\n<span class=\"ln\"> 5<\/span>                    then print \"Pattern occurs with shift\" s   ⊲ valid match\n<span class=\"ln\"> 6<\/span>                    ⊲ otherwise the hit is a spurious hit\n<span class=\"ln\"> 7<\/span>         if s &lt; n − m\n<span class=\"ln\"> 8<\/span>            then t<sub>s+1<\/sub> ← (d(t<sub>s<\/sub> − T[s + 1]·h) + T[s + m + 1]) mod q\n     ⊲ Rolling step on the slide: 14152 ≡ (31415 − 3·10000)·10 + 2 (mod 13).\n<\/pre><\/div>","names":["Rabin-Karp"]},"AUTOMATON":{"id":"AUTOMATON","title":"String-matching automaton","source":"Lecture06, slides 23–27","html":"<div class=\"code\"><pre>     A finite automaton M is a 5-tuple (Q, q<sub>0<\/sub>, A, Σ, δ): states Q, start state q<sub>0<\/sub>,\n     accepting states A ⊆ Q, input alphabet Σ, transition function δ: Q × Σ → Q.\n     The string-matching automaton for a pattern P[1..m]:\n       Q = {0, 1, …, m},  q<sub>0<\/sub> = 0,  A = {m}\n       δ(q, a) = the largest k such that P[1..k] is a suffix of P[1..q]a\n       (the right-going 'spine' edges are δ(q, P[q + 1]) = q + 1; an edge that is not drawn goes to 0).\n     Running it on T[1..n]: start in state 0; after reading T[i] the state is φ(T<sub>i<\/sub>) = δ(φ(T<sub>i−1<\/sub>), T[i]).\n     Whenever φ(T<sub>i<\/sub>) = m, an occurrence of P ends at position i (shift i − m).\n<\/pre><\/div>","names":["automaton"]},"HUFFMAN":{"id":"HUFFMAN","title":"HUFFMAN(C)","source":"Lecture08, slides 29–31","html":"<div class=\"code\"><pre>     HUFFMAN(C)\n<span class=\"ln\"> 1<\/span>  n ← |C|\n<span class=\"ln\"> 2<\/span>  Q ← C\n<span class=\"ln\"> 3<\/span>  for i ← 1 to n − 1\n<span class=\"ln\"> 4<\/span>      do allocate a new node z\n<span class=\"ln\"> 5<\/span>         left[z] ← x ← EXTRACT-MIN(Q)\n<span class=\"ln\"> 6<\/span>         right[z] ← y ← EXTRACT-MIN(Q)\n<span class=\"ln\"> 7<\/span>         f[z] ← f[x] + f[y]\n<span class=\"ln\"> 8<\/span>         INSERT(Q, z)\n<span class=\"ln\"> 9<\/span>  return EXTRACT-MIN(Q)    ⊲ Return the root of the tree.\n     ⊲ Codewords: trace the tree from the root; a left edge is 0 and a right edge is 1.\n<\/pre><\/div>","names":["HUFFMAN"]},"SHANNON-FANO":{"id":"SHANNON-FANO","title":"Shannon-Fano algorithm","source":"Lecture08, slides 22–23","html":"<div class=\"code\"><pre>     Shannon-Fano algorithm\n<span class=\"ln\"> 1<\/span>  Line up the symbols by falling probability (frequency) of incidence.\n<span class=\"ln\"> 2<\/span>  Divide the symbols in two groups, so that both groups have equal or almost equal sum of the probabilities.\n<span class=\"ln\"> 3<\/span>  Assign value 0 to the first group, and value 1 to the second.\n<span class=\"ln\"> 4<\/span>  For each of the both groups go to step 2.\n<\/pre><\/div>","names":["Shannon-Fano"]},"HU-TUCKER":{"id":"HU-TUCKER","title":"Hu-Tucker algorithm","source":"Lecture08, slides 33–39","html":"<div class=\"code\"><pre>     Hu-Tucker algorithm (alphabetic code)\n<span class=\"ln\"> 1<\/span>  Keep the symbols (leaves) in alphabetical order with their frequencies.\n<span class=\"ln\"> 2<\/span>  Join the two nodes with the least total frequency that are not separated by a leaf\n          (internal nodes between them do not block the join); on a tie, choose the leftmost pair.\n          The new node replaces the left node of the pair in the list.\n<span class=\"ln\"> 3<\/span>  Repeat step 2 until a single tree remains.\n<span class=\"ln\"> 4<\/span>  Read off each symbol's level (code length) from the tree.\n<span class=\"ln\"> 5<\/span>  Assign the codewords in alphabetical order: the first symbol gets all 0s; each next codeword\n          is the previous one plus 1, extended with 0s (or cut) to its own length.\n<\/pre><\/div>","names":["Hu-Tucker"]},"ZIV-LEMPEL":{"id":"ZIV-LEMPEL","title":"Ziv-Lempel model and gzip","source":"Lecture08, slides 41–45","html":"<div class=\"code\"><pre>     Ziv-Lempel model (as on the slides)\n<span class=\"ln\"> 1<\/span>  Read the message from left to right, keeping the text already seen as the window.\n<span class=\"ln\"> 2<\/span>  At each position find the longest earlier copy of the text that starts here.\n<span class=\"ln\"> 3<\/span>  If there is one, output (distance back, number of characters to copy) and move past them;\n          otherwise output (0, ASCII code of the character) and move one character on.\n     gzip: the symbol stream is coded with two Huffman codes — one built on the frequency counts\n     of the distances (including the 0s, which signal a new character), one on the copy lengths.\n<\/pre><\/div>","names":["Ziv-Lempel","gzip"]},"KRUSKAL":{"id":"KRUSKAL","title":"MST-KRUSKAL and the disjoint-set operations","source":"Lecture07, slides 17–19","html":"<div class=\"code\"><pre>     MAKE-SET(x): creates a new set whose only member is x.\n     FIND-SET(x): returns the representative of the set containing x.\n     UNION(x, y): unites the sets that contain x and y.\n     MST-KRUSKAL(G, w)\n<span class=\"ln\"> 1<\/span>  A ← Ø\n<span class=\"ln\"> 2<\/span>  for each vertex v ∈ V[G]\n<span class=\"ln\"> 3<\/span>      do MAKE-SET(v)\n<span class=\"ln\"> 4<\/span>  sort the edges of E into non-decreasing order by weight w\n<span class=\"ln\"> 5<\/span>  for each edge (u, v) ∈ E, taken in non-decreasing order by weight\n<span class=\"ln\"> 6<\/span>      do if FIND-SET(u) ≠ FIND-SET(v)\n<span class=\"ln\"> 7<\/span>            then A ← A ∪ {(u, v)}\n<span class=\"ln\"> 8<\/span>                 UNION(u, v)\n<span class=\"ln\"> 9<\/span>  return A\n<\/pre><\/div>","names":["MST-KRUSKAL","MAKE-SET","FIND-SET","UNION"]},"PRIM":{"id":"PRIM","title":"MST-PRIM","source":"Lecture07, slides 24–31","html":"<div class=\"code\"><pre>     MST-PRIM(G, w, r)\n<span class=\"ln\"> 1<\/span>  for each u ∈ V[G]\n<span class=\"ln\"> 2<\/span>      do key[u] ← ∞\n<span class=\"ln\"> 3<\/span>         π[u] ← NIL\n<span class=\"ln\"> 4<\/span>  key[r] ← 0\n<span class=\"ln\"> 5<\/span>  Q ← V[G]\n<span class=\"ln\"> 6<\/span>  while Q ≠ Ø\n<span class=\"ln\"> 7<\/span>      do u ← EXTRACT-MIN(Q)\n<span class=\"ln\"> 8<\/span>         for each v ∈ Adj[u]\n<span class=\"ln\"> 9<\/span>             do if v ∈ Q and w(u, v) &lt; key[v]\n<span class=\"ln\">10<\/span>                   then π[v] ← u\n<span class=\"ln\">11<\/span>                        key[v] ← w(u, v)\n     ⊲ Lecture layout: Choose vertex r; Candidate edges = edges from the tree to V; Choose edge …\n<\/pre><\/div>","names":["MST-PRIM"]},"DIJKSTRA":{"id":"DIJKSTRA","title":"DIJKSTRA, INITIALIZE-SINGLE-SOURCE and RELAX","source":"Lecture07, slides 39–44","html":"<div class=\"code\"><pre>     INITIALIZE-SINGLE-SOURCE(G, s)\n<span class=\"ln\"> 1<\/span>  for each vertex v ∈ V[G]\n<span class=\"ln\"> 2<\/span>      do d[v] ← ∞\n<span class=\"ln\"> 3<\/span>         π[v] ← NIL\n<span class=\"ln\"> 4<\/span>  d[s] ← 0\n<\/pre><\/div><div class=\"code\"><pre>     RELAX(u, v, w)\n<span class=\"ln\"> 1<\/span>  if d[v] &gt; d[u] + w(u, v)\n<span class=\"ln\"> 2<\/span>     then d[v] ← d[u] + w(u, v)\n<span class=\"ln\"> 3<\/span>          π[v] ← u\n<\/pre><\/div><div class=\"code\"><pre>     DIJKSTRA(G, w, s)        ⊲ all edge weights are non-negative\n<span class=\"ln\"> 1<\/span>  INITIALIZE-SINGLE-SOURCE(G, s)\n<span class=\"ln\"> 2<\/span>  S ← Ø\n<span class=\"ln\"> 3<\/span>  Q ← V[G]\n<span class=\"ln\"> 4<\/span>  while Q ≠ Ø\n<span class=\"ln\"> 5<\/span>      do u ← EXTRACT-MIN(Q)\n<span class=\"ln\"> 6<\/span>         S ← S ∪ {u}\n<span class=\"ln\"> 7<\/span>         for each vertex v ∈ Adj[u]\n<span class=\"ln\"> 8<\/span>             do RELAX(u, v, w)\n<\/pre><\/div>","names":["DIJKSTRA","INITIALIZE-SINGLE-SOURCE","RELAX"]}},"coverAll":["fixed-length","prefix-free","entropy","shannon-fano","huffman","hu-tucker","ziv-lempel","lossless-lossy","greedy-not-optimal","kruskal","prim","dijkstra","spanning-tree"],"forbidden":["arr:[10,0,8,4]","arr:[28,15,1,30,0,8]","arr:[45,25,15,85,75,65,35,55]","arr:[23,17,14,6,13,10,1,5,7,12]","arr:[7,3,9,4,8]","arr:[7,4,8,3,5,2,1,9,6]","arr:[5,2,4,6,1,3]","arr:[2,8,7,1,3,5,6,4]","arr:[4,1,3,2,16,9,10,14,8,7]","arr:[7,24,19,21,14,3,10,2,13,11]","arr:[5,2,4,7,1,3,2,6]","ks:[[3,4,6,3],[6,12,8,2],10]","ks:[[4,3,5,2],[ function blank(p, keep) {
    keep = keep || {};
    return { v: 1, paper: p, started: false, finished: false, current: 0, parts: {}, flags: {}, timeMs: 0,
             attempts: keep.attempts || [], best: keep.best == null ? null : keep.best, redo: null };
}
function load(p) {
    try {
        const raw = localStorage.getItem(KEY(p));
        if (raw) { const s = JSON.parse(raw); if (s && s.v === 1 && s.paper === p) return s; }
    } catch (e) { /* blocked or corrupt */ }
    return blank(p);
}
const ST = { 1: load(1), 2: load(2) };
let P = null, view = "cover";
const S = () => ST[P];
function save(p) { p = p || P; if (!p) return; try { localStorage.setItem(KEY(p), JSON.stringify(ST[p])); } catch (e) { /* blocked */ } }
function ps(pt, st) {
    st = st || ST[pt.paper];
    if (!st.parts[pt.id]) st.parts[pt.id] = { revealed: false, marked: false, ticks: pt.rubric.map(() => false) };
    return st.parts[pt.id];
}
function partScore(pt, st) {
    const s = ps(pt, st);
    return pt.rubric.reduce((a, r, i) => a + (s.ticks[i] ? r.marks : 0), 0);
}
function partState(pt, st) {
    const s = ps(pt, st);
    if (s.marked) { const sc = partScore(pt, st); return sc >= pt.marks - 1e-9 ? "full" : sc <= 1e-9 ? "zero" : "part"; }
    return s.revealed ? "rev" : "none";
}
function paperScore(p, st) { st = st || ST[p]; return PARTS[p].reduce((a, pt) => a + (ps(pt, st).marked ? partScore(pt, st) : 0), 0); }
function markedCount(p) { return PARTS[p].filter(pt => ps(pt).marked).length; }

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function el(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
        if (k === "class") e.className = attrs[k];
        else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    if (html !== undefined) e.innerHTML = html;
    return e;
}
function fmt(n) { const r = Math.round(n * 100) / 100; return String(r); }
function fmtTime(ms) {
    const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function marksTxt(m) { return `(${fmt(m)} mark${m === 1 ? "" : "s"})`; }

function currentTheme() {

}
function syncThemeBtn() { document.getElementById("theme-toggle").textContent = currentTheme() === "dark" ? "☀ Light" : "☾ Dark"; }

function updateTopbar() {
    const ids = ["scorepill", "clock", "switch-btn", "results-btn", "finish-btn", "algo-btn"];
    const where = document.getElementById("where");
    if (view === "cover" || !P) { where.textContent = ""; ids.forEach(i => document.getElementById(i).hidden = true); return; }
    const st = S(), pt = PARTS[P][st.current];
    where.textContent = view === "paper" ? `Paper ${P} · Question ${pt.qnum} (${pt.label})` : `Paper ${P} · Results`;
    const marked = PARTS[P].filter(x => ps(x).marked);
    const pill = document.getElementById("scorepill");
    pill.hidden = false;
    pill.textContent = `Self-score ${fmt(marked.reduce((a, x) => a + partScore(x), 0))} / ${fmt(marked.reduce((a, x) => a + x.marks, 0))}`;
    const c = document.getElementById("clock"); c.hidden = false; c.textContent = "⏱ " + fmtTime(st.timeMs);
    document.getElementById("switch-btn").hidden = false;
    document.getElementById("algo-btn").hidden = view !== "paper";
    document.getElementById("finish-btn").hidden = view !== "paper" || st.finished;
    document.getElementById("results-btn").hidden = !st.finished || view === "results";
}
let lastTick = Date.now();
setInterval(() => {
    const now = Date.now(), dt = Math.min(5000, now - lastTick); lastTick = now;
    if (view === "paper" && P && !S().finished && document.visibilityState === "visible") {
        S().timeMs += dt;
        if (Math.floor(S().timeMs / 1000) % 5 === 0) save();
        const c = document.getElementById("clock"); if (c) c.textContent = "⏱ " + fmtTime(S().timeMs);
    }
}, 1000);
document.addEventListener("visibilitychange", () => { lastTick = Date.now(); if (P) save(); });
window.addEventListener("beforeunload", () => { if (P) save(); });
document.getElementById("switch-btn").addEventListener("click", () => renderCover());

function paperStatus(p) {
    const st = ST[p], N = PARTS[p].length;
    if (st.finished) return { label: `Finished · ${fmt(paperScore(p))} / 60`, kind: "done", frac: 1 };
    if (!st.started) return { label: "Not started", kind: "new", frac: 0 };
    const n = PARTS[p].filter(pt => ps(pt, st).marked).length;
    return { label: `In progress · ${n} of ${N} parts marked`, kind: "progress", frac: n / N };
}

/* ================================================================== */
/*  JS PORTS OF THE LECTURE ALGORITHMS (used by the self-test)         */
/* ================================================================== */
const ALG = {
    insertion(a) {
        const A = [null, ...a]; const t = {}; let shifts = 0;
        for (let j = 2; j < A.length; j++) { const key = A[j]; let i = j - 1, tests = 1;
            while (i > 0 && A[i] > key) { A[i + 1] = A[i]; i--; shifts++; tests++; } A[i + 1] = key; t[j] = tests; }
        return { t, shifts, sorted: A.slice(1), tests: Object.values(t).reduce((x, y) => x + y, 0) };
    },
    quicksort(a) {
        const A = [null, ...a], calls = []; let comps = 0;
        const part = (p, r) => { const x = A[r]; let i = p - 1;
            for (let j = p; j <= r - 1; j++) { comps++; if (A[j] <= x) { i++; [A[i], A[j]] = [A[j], A[i]]; } }
            [A[i + 1], A[r]] = [A[r], A[i + 1]]; return [i + 1, x]; };
        const qs = (p, r) => { if (p < r) { const [q, x] = part(p, r); calls.push([p, r, x, q, A.slice(1)]); qs(p, q - 1); qs(q + 1, r); } };
        qs(1, a.length); return { calls, final: A.slice(1), comps };
    },
    merge(a, p, q, r) {
        const A = [null, ...a], L = A.slice(p, q + 1).concat([Infinity]), R = A.slice(q + 1, r + 1).concat([Infinity]);
        let i = 0, j = 0, comps = 0; const after = [];
        for (let k = p; k <= r; k++) { comps++; if (L[i] <= R[j]) A[k] = L[i++]; else A[k] = R[j++]; after.push(A.slice(1)); }
        return { after, comps };
    },
    heap(a) {
        const A = [null, ...a], n = a.length; let size = n;
        const hp = (i) => { const l = 2 * i, r = 2 * i + 1; let lg = (l <= size && A[l] > A[i]) ? l : i;
            if (r <= size && A[r] > A[lg]) lg = r; if (lg !== i) { [A[i], A[lg]] = [A[lg], A[i]]; hp(lg); } };
        const build = []; for (let i = Math.floor(n / 2); i >= 1; i--) { hp(i); build.push(A.slice(1)); }
        const heap = A.slice(1), ext = [];
        for (let i = n; i >= 2; i--) { [A[1], A[i]] = [A[i], A[1]]; size--; hp(1); ext.push(A.slice(1)); }

    },
    heapViolations(seq) { const A = [null, ...seq], n = seq.length, bad = [];

    knapsack(w, p, c) {

            const wi = w[i - 1], pi = p[i - 1];
            if (i === n) P[i + "," + k] = wi > k ? 0 : pi;
            else if (wi > k) P[i + "," + k] = P[(i + 1) + "," + k];
            else P[i + "," + k] = Math.max(P[(i + 1) + "," + k], pi + P[(i + 1) + "," + (k - wi)]);
        }
        const x = []; let k = c;
        for (let i = 1; i <= n; i++) { const take = i === n ? (w[i - 1] <= k ? 1 : 0) : (P[i + "," + k] !== P[(i + 1) + "," + k] ? 1 : 0); x.push(take); if (take) k -= w[i - 1]; }
        const rows = {}; for (let i = n; i >= 1; i--) { rows[i] = []; for (let kk = 0; kk <= c; kk++) rows[i].push(P[i + "," + kk]); }
        let best = -1, cnt = 0;
        for (let mask = 0; mask < (1 << n); mask++) { let ww = 0, pp = 0; for (let i = 0; i < n; i++) if (mask >> i & 1) { ww += w[i]; pp += p[i]; }
            if (ww <= c) { if (pp > best) { best = pp; cnt = 1; } else if (pp === best) cnt++; } }
        return { rows, x, best: P["1," + c], P, optimalSubsets: cnt, brute: best };
    },
    mcm(p) {

            for (let k = i; k < j; k++) { const q = m[i + "," + k] + m[(k + 1) + "," + j] + p[i - 1] * p[k] * p[j]; qs.push(q); if (q < best) { best = q; bk = k; } }
            if (qs.filter(q => q === best).length > 1) unique = false; m[i + "," + j] = best; s[i + "," + j] = bk; }
        const par = (i, j) => i === j ? "A" + i : "(" + par(i, s[i + "," + j]) + par(s[i + "," + j] + 1, j) + ")";

    },
    naive(T, P) { const n = T.length, m = P.length, valid = [], per = []; let comps = 0;
        for (let s = 0; s <= n - m; s++) { let c = 0, ok = true; for (let i = 0; i < m; i++) { c++; if (T[s + i] !== P[i]) { ok = false; break; } }

    rk(T, P, q) { const n = T.length, m = P.length, mod = (a) => ((a % q) + q) % q; let h = 1; for (let i = 0; i < m - 1; i++) h = (h * 10) % q;
        let p = 0, t = 0; for (let i = 0; i < m; i++) { p = (10 * p + +P[i]) % q; t = (10 * t + +T[i]) % q; }
        const windows = [], valid = [], spurious = [];

            if (s < n - m) t = mod(10 * (t - +T[s] * h) + +T[s + m]); }

    t("coverage: Huffman in both papers", PAPERS[1].questions[3].parts.some(pt => pt.cover.includes("huffman")) && PAPERS[2].questions[3].parts.some(pt => pt.cover.includes("huffman")));
    [1, 2, 3, 4].forEach(qn => {
        t(`parity Q${qn}: parts ${partsQ["1-" + qn]} vs ${partsQ["2-" + qn]} (±1)`, Math.abs(partsQ["1-" + qn] - partsQ["2-" + qn]) <= 1);
        t(`parity Q${qn}: tier marks ${tierQ["1-" + qn]} vs ${tierQ["2-" + qn]} (±1 each)`, [0, 1, 2].every(k => Math.abs(tierQ["1-" + qn][k] - tierQ["2-" + qn][k]) <= 1));
        t(`parity Q${qn}: minutes ${minsQ["1-" + qn]} vs ${minsQ["2-" + qn]} (±3)`, Math.abs(minsQ["1-" + qn] - minsQ["2-" + qn]) <= 3);
    });
    const ak = new Set([...Object.keys(arch[1]), ...Object.keys(arch[2])]);
    ak.forEach(k => t(`parity archetype ${k}: ${arch[1][k] || 0} vs ${arch[2][k] || 0} (±2)`, Math.abs((arch[1][k] || 0) - (arch[2][k] || 0)) <= 2));
    const shared = [...sigs[1]].filter(s => sigs[2].has(s));
    t("no dataset shared between the papers", !shared.length, shared.join("; "));
    const forb = new Set(DATA.forbidden);
    const bad = [...sigs[1], ...sigs[2]].filter(s => forb.has(s));
    t("no dataset from past papers, lecture examples or calibration examples", !bad.length, bad.join("; "));
    const fail = rows.filter(r => !r.ok);
    const out = `SELF-TEST · ${rows.length - fail.length} passed · ${fail.length} failed\n` + rows.map(r => `${r.ok ? "PASS" : "FAIL"}  ${r.name}${r.detail ? "  [" + r.detail + "]" : ""}`).join("\n");
    const pre = document.getElementById("selftest"); pre.style.display = "block"; pre.textContent = out;
    console.log(out);
    window.__selftest = { pass: rows.length - fail.length, fail: fail.length, rows };
    return window.__selftest;
}

if (/[?&]selftest=1/.test(location.search)) selfTest();
