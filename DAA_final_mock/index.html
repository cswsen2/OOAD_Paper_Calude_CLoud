<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAA Final Mock</title>
<script>
/* apply a saved theme before first paint, so the page never flashes the wrong colours */
try {
    var savedTheme = localStorage.getItem("daa-theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
} catch (e) { /* storage blocked: follow the device setting */ }
</script>
<style>
:root {
    color-scheme: light;
    --bg: #FAF7F0; --card: #FFFDF8; --heading: #7A1E2C; --primary: #2B3A55; --border: #E3DCCB;
    --text: #1F1F1F; --code-bg: #F1ECE1; --code-text: #2B2B2B; --correct: #2E7D32; --wrong: #B3261E;
    --partial: #B7791F; --on-primary: #FFFFFF; --correct-text: #276E2B; --partial-text: #8A5A12;
    --muted: rgba(31, 31, 31, 0.68); --correct-tint: #E6EEE0; --wrong-tint: #F6E3DE; --partial-tint: #F6EDDE;
    --primary-tint: #E6E6E4;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #1B1814; --card: #24201B; --heading: #E39AA5; --primary: #A9BCE0; --border: #3A342C;
        --text: #ECE6DA; --code-bg: #2B2620; --code-text: #E8E1D3; --correct: #7CC47F; --wrong: #F08A80;
        --partial: #E3B25A; --on-primary: #1B1814; --correct-text: #7CC47F; --partial-text: #E3B25A;
        --muted: rgba(236, 230, 218, 0.68); --correct-tint: #323A2B; --wrong-tint: #45312B; --partial-tint: #433725;
        --primary-tint: #39393B;
    }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1B1814; --card: #24201B; --heading: #E39AA5; --primary: #A9BCE0; --border: #3A342C;
    --text: #ECE6DA; --code-bg: #2B2620; --code-text: #E8E1D3; --correct: #7CC47F; --wrong: #F08A80;
    --partial: #E3B25A; --on-primary: #1B1814; --correct-text: #7CC47F; --partial-text: #E3B25A;
    --muted: rgba(236, 230, 218, 0.68); --correct-tint: #323A2B; --wrong-tint: #45312B; --partial-tint: #433725;
    --primary-tint: #39393B;
}
@media print {
    :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
        color-scheme: light;
        --bg: #FFFFFF; --card: #FFFFFF; --heading: #7A1E2C; --primary: #2B3A55; --border: #BBB4A4;
        --text: #1F1F1F; --code-bg: #F4F1EA; --code-text: #2B2B2B; --muted: rgba(31, 31, 31, 0.7);
        --primary-tint: #EEEEEC; --partial-tint: #F6EDDE; --correct-tint: #E6EEE0; --wrong-tint: #F6E3DE;
    }
}
:root {
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", "Courier New", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--sans); }
button { font-family: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.mono { font-family: var(--mono); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
    padding: 9px 18px; background: var(--card); border-bottom: 1px solid var(--border); }
.brand { font: 700 1rem var(--serif); color: var(--heading); white-space: nowrap; }
.where { flex: 1; min-width: 0; font: 600 0.9rem var(--sans); color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.pill { font: 600 0.82rem var(--sans); color: var(--primary); background: var(--bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.clock { font: 700 0.92rem var(--mono); color: var(--primary); white-space: nowrap; }
.btn { font: 600 0.9rem var(--sans); color: var(--on-primary); background: var(--primary); border: 1px solid var(--primary);
    border-radius: 8px; padding: 0 14px; min-height: 38px; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.secondary { background: var(--card); color: var(--primary); }
.btn.danger { background: var(--card); color: var(--wrong); border-color: var(--wrong); }
.btn-small { font: 600 0.8rem var(--sans); color: var(--primary); background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 0 10px; min-height: 32px; cursor: pointer; white-space: nowrap; }
.btn-small:hover, .btn.secondary:hover { border-color: var(--primary); }
.btn-small.on { background: var(--heading); color: var(--on-primary); border-color: var(--heading); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }

/* ---------- layout ---------- */
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; max-width: 1320px; margin: 0 auto; padding: 18px; }
.side { position: sticky; top: 70px; align-self: start; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; max-height: calc(100vh - 88px); overflow: auto; }
.side h3 { font: 700 0.76rem var(--sans); color: var(--heading); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 8px; }
.navq { margin-bottom: 12px; }
.navq .qt { font: 600 0.82rem var(--sans); color: var(--primary); margin-bottom: 5px; display: flex; justify-content: space-between; gap: 6px; }
.navq .qt span:last-child { color: var(--muted); font-weight: 500; }
.navparts { display: flex; flex-wrap: wrap; gap: 5px; }
.navbtn { position: relative; min-width: 46px; height: 34px; padding: 0 8px; border-radius: 7px; cursor: pointer;
    font: 700 0.8rem var(--sans); color: var(--primary); background: var(--card); border: 1.5px solid var(--border); }
.navbtn:hover { border-color: var(--primary); }
.navbtn .sym { margin-left: 4px; font-size: 0.78rem; }
.navbtn.rev { border-color: var(--primary); }
.navbtn.rev .sym { color: var(--primary); }
.navbtn.full { background: var(--correct-tint); color: var(--correct-text); border-color: var(--correct); }
.navbtn.part { background: var(--partial-tint); color: var(--partial-text); border-color: var(--partial); }
.navbtn.zero { background: var(--wrong-tint); color: var(--wrong); border-color: var(--wrong); }
.navbtn.flagged { box-shadow: inset 0 0 0 1px var(--heading); }
.navbtn .flag { position: absolute; top: -9px; right: -5px; font-size: 0.72rem; color: var(--heading); }
.navbtn.current { outline: 2px solid var(--primary); outline-offset: 2px; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; font-size: 0.74rem; color: var(--muted); margin-top: 10px;
    border-top: 1px solid var(--border); padding-top: 10px; }
.legend b { display: inline-block; min-width: 16px; text-align: center; font-weight: 700; }
.legend .l-rev { color: var(--primary); } .legend .l-full { color: var(--correct-text); }
.legend .l-part { color: var(--partial-text); } .legend .l-zero { color: var(--wrong); } .legend .l-flag { color: var(--heading); }
.side .actions { display: grid; gap: 8px; margin-top: 12px; }
.side .meta { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }

/* ---------- question paper ---------- */
.qcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 28px 28px; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--heading); padding-bottom: 8px; margin-bottom: 12px; }
.qhead h2 { font: 700 1.3rem/1.3 var(--serif); color: var(--heading); margin: 0; }
.qhead .qm { font: 700 1rem var(--serif); color: var(--heading); white-space: nowrap; }
.qcontext { font-family: var(--serif); font-size: 1.04rem; margin-bottom: 8px; }
.qcontext p { margin: 6px 0; }
.part { border-top: 1px solid var(--border); padding: 16px 0 6px; scroll-margin-top: 80px; }
.part.current { box-shadow: -14px 0 0 -10px var(--primary); }
.phead { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
.plabel { font: 700 1.05rem var(--serif); color: var(--heading); min-width: 2em; }
.pstem { flex: 1; min-width: 0; font-family: var(--serif); font-size: 1.04rem; }
.pstem p { margin: 0 0 8px; }
.pmarks { font: 700 0.95rem var(--serif); color: var(--primary); white-space: nowrap; }
.pdata, .pfig { margin: 8px 0 8px 2.4em; }
.pctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 4px 2.4em; }
.pctrl .hint { font-size: 0.78rem; color: var(--muted); }
ol.roman { list-style: lower-roman; margin: 4px 0 8px; padding-left: 26px; }
ol.roman li { margin-bottom: 4px; }
.pstem ul, .qcontext ul { margin: 4px 0 8px; padding-left: 22px; }

/* ---------- answer panel ---------- */
.answer { margin: 10px 0 8px 2.4em; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); padding: 4px 16px 14px; }
.answer h4 { font: 700 0.78rem var(--sans); color: var(--heading); text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 6px; }
.answer .sol { font-size: 0.97rem; }
.answer .sol p { margin: 6px 0; }
.rubric { list-style: none; padding: 0; margin: 4px 0 8px; display: grid; gap: 6px; }
.rubric li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; }
.rubric li.on { border-color: var(--correct); background: var(--correct-tint); }
.rubric li.locked { cursor: default; }
.rubric input { width: 19px; height: 19px; margin: 2px 0 0; accent-color: var(--correct); flex: none; }
.rubric .rk { font: 700 0.74rem var(--sans); color: var(--muted); min-width: 1.1em; margin-top: 3px; }
.rubric .rtext { flex: 1; font-size: 0.93rem; }
.rubric .rmarks { font: 600 0.82rem var(--sans); white-space: nowrap; color: var(--primary); }
.scoreline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
.scorebox { font: 700 1rem var(--sans); padding: 5px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--card); color: var(--primary); }
.scorebox.full { border-color: var(--correct); color: var(--correct-text); background: var(--correct-tint); }
.scorebox.part { border-color: var(--partial); color: var(--partial-text); background: var(--partial-tint); }
.scorebox.zero { border-color: var(--wrong); color: var(--wrong); background: var(--wrong-tint); }
.marked-note { font-size: 0.82rem; color: var(--muted); }
ul.mist { margin: 4px 0; padding-left: 20px; } ul.mist li { margin-bottom: 5px; font-size: 0.92rem; }
.trap { display: inline-block; font: 700 0.68rem/1 var(--sans); padding: 3px 6px; border-radius: 4px; margin-left: 6px;
    color: var(--heading); border: 1px solid var(--heading); background: var(--card); vertical-align: 1px; }
.tags { font-size: 0.84rem; color: var(--muted); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.tags b { color: var(--primary); font-weight: 600; }

/* ---------- tables, code, figures ---------- */
.code { margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg); overflow-x: auto; }
.code .ctitle { font: 700 0.8rem var(--sans); color: var(--primary); padding: 6px 12px 0; }
.code pre { margin: 0; padding: 8px 12px 10px; font: 0.88rem/1.5 var(--mono); color: var(--code-text); white-space: pre; }
.code .ln { color: var(--muted); user-select: none; }
.code .formula { padding: 4px 12px 10px; font-size: 0.93rem; color: var(--code-text); }
.code .formula p { margin: 4px 0; }
table.cases { border-collapse: collapse; margin: 6px 0; font-family: var(--serif); }
table.cases td { padding: 2px 10px; vertical-align: middle; }
table.cases td.brace { border-right: 2px solid var(--primary); white-space: nowrap; font-weight: 600; }
.mline { font: 0.9rem/1.6 var(--mono); background: var(--code-bg); color: var(--code-text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; margin: 6px 0; overflow-x: auto; }
.note { font-size: 0.88rem; color: var(--muted); border-left: 3px solid var(--border); padding-left: 10px; }
table.arr, table.snap, table.dp, table.grid { border-collapse: collapse; margin: 6px 0 10px; font-size: 0.9rem; }
table.arr th, table.arr td, table.snap th, table.snap td, table.dp th, table.dp td, table.grid th, table.grid td {
    border: 1px solid var(--border); padding: 4px 9px; text-align: center; }
table.arr td, table.snap td, table.dp td { font-family: var(--mono); min-width: 2.4em; }
table.arr th.ix, table.snap th.ix { font: 600 0.76rem var(--sans); color: var(--muted); background: transparent; }
table.arr th.rowlab, table.snap th, table.dp th, table.grid th { background: var(--code-bg); color: var(--primary); font: 700 0.8rem var(--sans); }
table.grid td { text-align: left; }
table.grid.num td { text-align: center; }
td.hl { background: var(--partial-tint); color: var(--partial-text); font-weight: 700; }
td.piv { outline: 2px solid var(--heading); outline-offset: -3px; font-weight: 700; }
td.out { color: var(--muted); background: var(--bg); }
td.done { color: var(--muted); }
td.take { background: var(--correct-tint); }
td .plus { display: block; font: 600 0.66rem var(--sans); color: var(--correct-text); }
td .ij { display: block; font: 700 0.66rem var(--sans); color: var(--heading); }
td.ok, span.ok { color: var(--correct-text); font-weight: 700; }
td.bad, span.bad { color: var(--wrong); font-weight: 700; }
td.skip { color: var(--muted); }
td.hit { background: var(--partial-tint); font-weight: 700; }
td.acc { background: var(--correct-tint); font-weight: 700; color: var(--correct-text); }
tr.valid th { color: var(--correct-text); }
tr.final td, tr.final th { border-top: 2px solid var(--primary); }
table.dp caption { font: 700 0.82rem var(--sans); color: var(--primary); text-align: left; padding-bottom: 3px; }
table.dp td.blank { background: var(--bg); }
span.lowered { text-decoration: underline; text-decoration-thickness: 2px; color: var(--heading); font-weight: 700; }
span.newd { font-weight: 700; }
.callhead { font: 600 0.9rem var(--sans); color: var(--primary); margin: 12px 0 4px; }
.nocall { font-size: 0.88rem; color: var(--muted); margin: 4px 0; }
.primlines { font: 0.9rem/1.7 var(--mono); background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; overflow-x: auto; }
.primlines .chosen { font-weight: 700; color: var(--correct-text); }
.figrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; margin: 6px 0; }
.figrow > figure.fig { width: min-content; }
figure.fig { margin: 6px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 8px; overflow-x: auto; flex: 0 0 auto; max-width: 100%; }
figure.fig figcaption { font: 0.8rem var(--sans); color: var(--muted); margin-top: 4px; }
.cap2 { font-size: 0.78rem; color: var(--muted); max-width: 300px; }
.tablewrap { overflow-x: auto; }

/* ---------- SVG figures: colours only from tokens ---------- */
svg.dg { display: block; width: 100%; height: auto; }
svg.dg text { font-family: var(--sans); font-size: 14px; fill: var(--text); }
svg.dg .ttl { font-weight: 600; fill: var(--primary); font-size: 13px; }
svg.dg .wt { font-weight: 700; fill: var(--heading); }
svg.dg .bit { font-weight: 700; fill: var(--heading); }
svg.dg .idx { fill: var(--muted); }
svg.dg .vname { font-weight: 700; }
svg.dg .edge { stroke: var(--primary); stroke-width: 1.6; fill: none; }
svg.dg .edge.spine { stroke-width: 3.2; }
svg.dg .edge.hl { stroke: var(--correct); stroke-width: 3.4; }
svg.dg .edge.rej { stroke: var(--wrong); stroke-dasharray: 5 4; }
svg.dg .edge.dim { stroke: var(--border); }
svg.dg .node { fill: var(--card); stroke: var(--primary); stroke-width: 1.8; }
svg.dg .node.hl { fill: var(--partial-tint); stroke: var(--partial); stroke-width: 2.4; }
svg.dg .node.done { fill: var(--code-bg); stroke: var(--border); }
svg.dg .node.acc { stroke-width: 2.2; }
svg.dg .node.accin { fill: none; }
svg.dg .leaf { fill: var(--primary-tint); stroke: var(--primary); stroke-width: 1.4; }
svg.dg .grp { fill: var(--card); stroke: var(--primary); stroke-width: 1.4; }
svg.dg .halo { fill: var(--card); stroke: none; }
svg.dg .arrowhead { fill: var(--primary); }
svg.dg .arrowhead.hl { fill: var(--correct); }

/* ---------- cover & results ---------- */
.page { max-width: 1000px; margin: 0 auto; padding: 26px 18px 60px; }
.cover-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 34px; }
.cover-head { text-align: center; border-bottom: 2px solid var(--heading); padding-bottom: 16px; margin-bottom: 16px; }
.cover-head .inst { font: 600 0.86rem var(--sans); letter-spacing: 0.05em; color: var(--primary); }
.cover-head h1 { font: 700 1.8rem/1.25 var(--serif); color: var(--heading); margin: 8px 0 4px; }
.cover-head .meta { color: var(--muted); }
.cover-card h2 { font: 700 1.05rem var(--serif); color: var(--heading); margin: 18px 0 6px; }
.cover-card ul { margin: 0; padding-left: 22px; } .cover-card li { margin-bottom: 4px; }
.papers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
.pcard { border: 1.5px solid var(--border); border-radius: 12px; padding: 18px; background: var(--bg); }
.pcard h3 { font: 700 1.2rem var(--serif); color: var(--heading); margin: 0 0 4px; }
.pcard .status { font-weight: 600; color: var(--primary); }
.pcard .best { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }
.bar-mini { height: 8px; border-radius: 4px; background: var(--code-bg); overflow: hidden; min-width: 70px; margin-top: 10px; }
.bar-mini > div { height: 100%; background: var(--primary); }
table.plain { border-collapse: collapse; width: 100%; font-size: 0.92rem; margin: 6px 0; }
table.plain th, table.plain td { border-bottom: 1px solid var(--border); padding: 7px 8px; text-align: left; }
table.plain th { color: var(--primary); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
table.plain td.num, table.plain th.num { text-align: right; font-variant-numeric: tabular-nums; }
.bigscore { text-align: center; margin: 6px 0 16px; }
.bigscore .val { font: 700 3rem/1.1 var(--serif); color: var(--heading); }
.bigscore .sub { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0; }
.stat { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.stat .k { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.stat .v { font: 700 1.25rem var(--serif); color: var(--primary); }
.breakdowns { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
.weak { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 6px; }
.weak a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); text-decoration: none; }
.weak a:hover { border-color: var(--primary); }
.weak .sc { font-weight: 700; white-space: nowrap; color: var(--wrong); }

/* ---------- drawer ---------- */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 92vw); background: var(--card); border-left: 1px solid var(--border);
    z-index: 50; overflow: auto; padding: 16px 20px 40px; box-shadow: -10px 0 30px rgba(0, 0, 0, 0.18); }
.drawer h2 { font: 700 1.2rem var(--serif); color: var(--heading); margin: 0; }
.drawer .dhead { display: flex; justify-content: space-between; align-items: center; position: sticky; top: -16px; background: var(--card); padding: 10px 0; border-bottom: 2px solid var(--heading); margin-bottom: 8px; }
.proc h3 { font: 700 0.95rem var(--sans); color: var(--primary); margin: 16px 0 2px; }
.proc .src { font-size: 0.76rem; color: var(--muted); }
#selftest { display: none; white-space: pre-wrap; font: 0.78rem var(--mono); background: var(--card); color: var(--text);
    border: 2px solid var(--heading); padding: 10px; border-radius: 8px; margin: 16px auto; max-width: 1280px; }

/* ---------- print ---------- */
#print-area { display: none; }
@media print {
    @page { size: A4; margin: 16mm 15mm 16mm 15mm; }
    body { background: #FFFFFF; font-size: 11pt; }
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; color: var(--text); }
    .pp-cover { text-align: center; border-bottom: 2px solid var(--heading); padding-bottom: 10px; margin-bottom: 14px; }
    .pp-cover h1 { font: 700 18pt var(--serif); color: var(--heading); margin: 4px 0; }
    .pp-cover .meta { font-size: 10pt; }
    .pp-q { break-before: page; }
    .pp-q:first-of-type { break-before: auto; }
    .qhead { break-after: avoid; }
    .part { padding: 10px 0 4px; break-inside: avoid; }
    .pp-ans { height: 20mm; }
    figure.fig, .code, table { break-inside: avoid; }
    .pp-app { break-before: page; }
    .pp-app .proc { break-inside: avoid; }
    svg.dg { max-width: 100% !important; min-width: 0 !important; }
    .code, .mline, figure.fig, .tablewrap { overflow: visible !important; }
    .code pre { white-space: pre-wrap; font-size: 8.6pt; padding-left: 3.2em; text-indent: -2.4em; }
    .pdata, .pfig { margin-left: 0; }
}
</style>

<script>
"use strict";
const DATA = {"papers":[{"id":1,"title":"Paper 1","appendix":["QUICKSORT","KNAPSACK","MCM","NAIVE","RABIN-KARP","AUTOMATON","HUFFMAN","SHANNON-FANO","KRUSKAL","PRIM"],"questions":[{"num":1,"marks":15,"title":"Recursion and Algorithm Design","lectures":["L01","L02","L03","L04"],"context":"Arrays are 1-based. Procedures named in a part are printed with that part or in the Algorithms appendix at the end of the paper.","parts":[{"label":"a","marks":1,"tier":1,"minutes":2,"archetype":"D11","pattern":["T1-Q1.1","FM-Q1.1"],"lecture":"L01","rows":["R1"],"topic":"Properties of an algorithm, applied","stem":"<p>MAX-OF is meant to return the largest element of an array A[1..n], n ≥ 1.<\/p><div class=\"code\"><pre>     MAX-OF(A, n)\n<span class=\"ln\"> 1<\/span>  max ← 0\n<span class=\"ln\"> 2<\/span>  for i ← 1 to n\n<span class=\"ln\"> 3<\/span>      do if A[i] &gt; max\n<span class=\"ln\"> 4<\/span>            then max ← A[i]\n<span class=\"ln\"> 5<\/span>  return max\n<\/pre><\/div><p>Which <em>one<\/em> of the lecture's properties of an algorithm does MAX-OF fail? Support your answer with an input of size 3 and the value MAX-OF returns for it.<\/p>","solution":{"html":"<p>It fails <b>“give the correct solution for all cases”<\/b>. MAX-OF is correct whenever A holds at least one value ≥ 0, so it is not wrong for every input — only for some.<\/p><p>Input A = [-7, -3, -5]: max starts at 0 and no element is &gt; 0, so MAX-OF returns <b>0<\/b>, but the largest element is <b>-3<\/b> — 0 is not even in the array.<\/p><p>The other properties hold: the for loop runs exactly n times, so it terminates; every step is unambiguous; it is simple. Fix: line 1 should be max ← A[1].<\/p>","figures":[]},"rubric":[{"text":"Names the property “give the correct solution for all cases” (not “must terminate” or “unambiguous”).","marks":0.5},{"text":"Gives an input of size 3 whose elements are all negative (e.g. [-7, -3, -5]) and shows MAX-OF returns 0 instead of the true maximum.","marks":0.5}],"mistakes":[{"text":"Says it fails “must terminate”: the for loop always stops after n iterations, so termination holds.","trap":null},{"text":"Gives an input with a non-negative element, e.g. [3, −1, 2] → MAX-OF returns 3, which is correct, so the example proves nothing.","trap":null}],"source":"Lecture01.ppt, slide 7","check":{"algo":"maxof","input":[-7,-3,-5],"expect":{"returned":0,"true":-3}},"procs":[],"block":null,"data":null,"figure":null,"id":"p1-q1a","cover":[]},{"label":"b","marks":2,"tier":1,"minutes":3,"archetype":"D6","pattern":["FM-Q1.6","T1-Q1.6"],"lecture":"L02","rows":["R4"],"topic":"Θ of a sum with a decoy term (ratio theorems)","stem":"<p>Find the Θ value of<\/p><div class=\"mline\">f(n) = 500 n<sup>2<\/sup> lg n + n<sup>3<\/sup>/20 + 7<\/div><p>using the ratio theorems. Justify your answer.<\/p>","solution":{"html":"<p>The dominant term is <b>n<sup>3<\/sup><\/b>, even though its coefficient (1/20) is tiny and 500 n<sup>2<\/sup> lg n has a large coefficient and a log factor: lg n grows slower than n, so n<sup>2<\/sup> lg n grows slower than n<sup>3<\/sup>.<\/p><div class=\"mline\">lim<sub>n→∞<\/sub> f(n)/n<sup>3<\/sup> = lim ( 500 lg n / n + 1/20 + 7/n<sup>3<\/sup> ) = 0 + 1/20 + 0 = 1/20 &nbsp; (finite) ⇒ f(n) = O(n<sup>3<\/sup>)<\/div><div class=\"mline\">lim<sub>n→∞<\/sub> n<sup>3<\/sup>/f(n) = 1 / (1/20) = 20 &nbsp; (finite) ⇒ f(n) = Ω(n<sup>3<\/sup>)<\/div><p>Both ratio limits are finite, so by the Θ ratio theorem <b>f(n) = Θ(n<sup>3<\/sup>)<\/b>. (The step lg n / n → 0 is what kills the decoy term.)<\/p>","figures":[]},"rubric":[{"text":"Answer Θ(n³) with n³ named as the dominant term (not n² lg n).","marks":1},{"text":"Both ratios shown: f(n)/n³ → 1/20 and n³/f(n) → 20 (finite), including lg n / n → 0.","marks":1}],"mistakes":[{"text":"Picks the term with the biggest coefficient → Θ(n² lg n). But f(n)/(n² lg n) = 500 + n/(20 lg n) + … → ∞, so f is not even O(n² lg n).","trap":"T2"},{"text":"Gives only O(n³) from the first limit. Θ also needs the second ratio n³/f(n) → 20 (the Ω part).","trap":null}],"source":"Lecture02.pptx, slides 21, 32 and 36","check":{"algo":"ratio","expect":{"limit":0.05,"observed":0.05}},"procs":[],"block":null,"data":null,"figure":null,"id":"p1-q1b","cover":[]},{"label":"c","marks":4,"tier":2,"minutes":8,"archetype":"D1","pattern":["FM-Q2.a","T1-Q2.a"],"lecture":"L04","rows":["R9"],"topic":"QUICKSORT with Partition Algorithm 02 (Lomuto)","procs":["QUICKSORT","PARTITION"],"stem":"<p>QUICKSORT and PARTITION (Partition Algorithm 02) are given at the end of the paper. Illustrate the operations of QUICKSORT(A, 1, 6) for the array with the given set of elements. (For the illustration process assign the values only once to the given algorithm codes and then use diagrammatic way to reach the answer.)<\/p>","data":"<table class=\"arr\"><tr><th class=\"ix\">i<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><\/tr><tr><th class=\"rowlab\">A<\/th><td class=\"\">47<\/td><td class=\"\">53<\/td><td class=\"\">29<\/td><td class=\"\">34<\/td><td class=\"\">57<\/td><td class=\"\">49<\/td><\/tr><\/table>","solution":{"html":"<p>Each PARTITION call below shows the array after every iteration of the for loop (lines 3–6); the pivot x = A[r] is boxed, exchanged cells are shaded, and i, j mark the two indices. Cells outside A[p..r] are greyed.<\/p><div class=\"callhead\">PARTITION(A, 1, 6) &nbsp;·&nbsp; x ← A[6] = <b>49<\/b>, i ← 0<\/div><table class=\"snap\"><tr><th>step<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th>what happens<\/th><\/tr><tr><th>start<\/th><td class=\"\">47<\/td><td class=\"\">53<\/td><td class=\"\">29<\/td><td class=\"\">34<\/td><td class=\"\">57<\/td><td class=\"piv\">49<\/td><td>pivot x = 49<\/td><\/tr><tr><th>j = 1<\/th><td class=\"\">47<span class=\"ij\">i,j<\/span><\/td><td class=\"\">53<\/td><td class=\"\">29<\/td><td class=\"\">34<\/td><td class=\"\">57<\/td><td class=\"piv\">49<\/td><td>A[1] = 47 ≤ 49: i ← 1, exchange A[1] ↔ A[1] (itself)<\/td><\/tr><tr><th>j = 2<\/th><td class=\"\">47<span class=\"ij\">i<\/span><\/td><td class=\"\">53<span class=\"ij\">j<\/span><\/td><td class=\"\">29<\/td><td class=\"\">34<\/td><td class=\"\">57<\/td><td class=\"piv\">49<\/td><td>A[2] = 53 &gt; 49: no change<\/td><\/tr><tr><th>j = 3<\/th><td class=\"\">47<\/td><td class=\"hl\">29<span class=\"ij\">i<\/span><\/td><td class=\"hl\">53<span class=\"ij\">j<\/span><\/td><td class=\"\">34<\/td><td class=\"\">57<\/td><td class=\"piv\">49<\/td><td>A[3] = 29 ≤ 49: i ← 2, exchange A[2] ↔ A[3]<\/td><\/tr><tr><th>j = 4<\/th><td class=\"\">47<\/td><td class=\"\">29<\/td><td class=\"hl\">34<span class=\"ij\">i<\/span><\/td><td class=\"hl\">53<span class=\"ij\">j<\/span><\/td><td class=\"\">57<\/td><td class=\"piv\">49<\/td><td>A[4] = 34 ≤ 49: i ← 3, exchange A[3] ↔ A[4]<\/td><\/tr><tr><th>j = 5<\/th><td class=\"\">47<\/td><td class=\"\">29<\/td><td class=\"\">34<span class=\"ij\">i<\/span><\/td><td class=\"\">53<\/td><td class=\"\">57<span class=\"ij\">j<\/span><\/td><td class=\"piv\">49<\/td><td>A[5] = 57 &gt; 49: no change<\/td><\/tr><tr class=\"final\"><th>line 7<\/th><td class=\"\">47<\/td><td class=\"\">29<\/td><td class=\"\">34<\/td><td class=\"hl piv\">49<\/td><td class=\"\">57<\/td><td class=\"hl\">53<\/td><td>exchange A[4] ↔ A[6]; return q = <b>4<\/b><\/td><\/tr><\/table><div class=\"callhead\">PARTITION(A, 1, 3) &nbsp;·&nbsp; x ← A[3] = <b>34<\/b>, i ← 0<\/div><table class=\"snap\"><tr><th>step<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th>what happens<\/th><\/tr><tr><th>start<\/th><td class=\"\">47<\/td><td class=\"\">29<\/td><td class=\"piv\">34<\/td><td class=\"out\">49<\/td><td class=\"out\">57<\/td><td class=\"out\">53<\/td><td>pivot x = 34<\/td><\/tr><tr><th>j = 1<\/th><td class=\"\">47<span class=\"ij\">j<\/span><\/td><td class=\"\">29<\/td><td class=\"piv\">34<\/td><td class=\"out\">49<\/td><td class=\"out\">57<\/td><td class=\"out\">53<\/td><td>A[1] = 47 &gt; 34: no change<\/td><\/tr><tr><th>j = 2<\/th><td class=\"hl\">29<span class=\"ij\">i<\/span><\/td><td class=\"hl\">47<span class=\"ij\">j<\/span><\/td><td class=\"piv\">34<\/td><td class=\"out\">49<\/td><td class=\"out\">57<\/td><td class=\"out\">53<\/td><td>A[2] = 29 ≤ 34: i ← 1, exchange A[1] ↔ A[2]<\/td><\/tr><tr class=\"final\"><th>line 7<\/th><td class=\"\">29<\/td><td class=\"hl piv\">34<\/td><td class=\"hl\">47<\/td><td class=\"out\">49<\/td><td class=\"out\">57<\/td><td class=\"out\">53<\/td><td>exchange A[2] ↔ A[3]; return q = <b>2<\/b><\/td><\/tr><\/table><div class=\"nocall\">QUICKSORT(A, 1, 1): p ≥ r, so no PARTITION call (one element).<\/div><div class=\"nocall\">QUICKSORT(A, 3, 3): p ≥ r, so no PARTITION call (one element).<\/div><div class=\"callhead\">PARTITION(A, 5, 6) &nbsp;·&nbsp; x ← A[6] = <b>53<\/b>, i ← 4<\/div><table class=\"snap\"><tr><th>step<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th>what happens<\/th><\/tr><tr><th>start<\/th><td class=\"out\">29<\/td><td class=\"out\">34<\/td><td class=\"out\">47<\/td><td class=\"out\">49<\/td><td class=\"\">57<\/td><td class=\"piv\">53<\/td><td>pivot x = 53<\/td><\/tr><tr><th>j = 5<\/th><td class=\"out\">29<\/td><td class=\"out\">34<\/td><td class=\"out\">47<\/td><td class=\"out\">49<\/td><td class=\"\">57<span class=\"ij\">j<\/span><\/td><td class=\"piv\">53<\/td><td>A[5] = 57 &gt; 53: no change<\/td><\/tr><tr class=\"final\"><th>line 7<\/th><td class=\"out\">29<\/td><td class=\"out\">34<\/td><td class=\"out\">47<\/td><td class=\"out\">49<\/td><td class=\"hl piv\">53<\/td><td class=\"hl\">57<\/td><td>exchange A[5] ↔ A[6]; return q = <b>5<\/b><\/td><\/tr><\/table><div class=\"nocall\">QUICKSORT(A, 5, 4): p ≥ r, so no PARTITION call (empty).<\/div><div class=\"nocall\">QUICKSORT(A, 6, 6): p ≥ r, so no PARTITION call (one element).<\/div><p>Sorted array: <b>[29, 34, 47, 49, 53, 57]<\/b>.<\/p>","figures":[]},"rubric":[{"text":"First call PARTITION(A, 1, 6): x = 49; exchanges 53 ↔ 29 (j = 3) and 53 ↔ 34 (j = 4) shown; line 7 gives [47, 29, 34, 49, 57, 53] and q = 4.","marks":1.5},{"text":"PARTITION(A, 1, 3): x = 34, 47 ↔ 29 at j = 2, then A[2] ↔ A[3] → [29, 34, 47], q = 2.","marks":1},{"text":"PARTITION(A, 5, 6): x = 53, 57 &gt; 53 so only line 7 → [53, 57], q = 5.","marks":0.5},{"text":"States that the one-element or empty sub-arrays (A[1..1], A[3..3], A[5..4], A[6..6]) make no PARTITION call.","marks":0.5},{"text":"Final sorted array [29, 34, 47, 49, 53, 57].","marks":0.5}],"mistakes":[{"text":"Takes the pivot as A[p] = 47 (Partition Algorithm 01 habit): the first split becomes q = 3 with [29, 34, 47, 53, 57, 49] — a different trace. Line 1 is x ← A[r].","trap":"T5"},{"text":"Forgets line 7: the pivot 49 stays in A[6], leaving [47, 29, 34, 53, 57, 49] after the first call.","trap":"T5"},{"text":"Calls PARTITION on one-element sub-arrays too (6 calls instead of 3): QUICKSORT tests p &lt; r first.","trap":"T5"}],"source":"Lecture04.ppt, slides 8, 10 and 11","check":{"algo":"quicksort","a":[47,53,29,34,57,49],"expect":{"calls":[[1,6,49,4,[47,29,34,49,57,53]],[1,3,34,2,[29,34,47,49,57,53]],[5,6,53,5,[29,34,47,49,53,57]]],"final":[29,34,47,49,53,57]}},"block":null,"figure":null,"id":"p1-q1c","cover":[]},{"label":"d","marks":1,"tier":2,"minutes":2,"archetype":"D5","pattern":["FM-Q2.b","FM-Q2.c"],"lecture":"L04","rows":["R9"],"topic":"Quicksort: comparisons, best and worst partitioning","procs":["PARTITION"],"stem":"<p>Line 4 of PARTITION compares A[j] with the pivot. How many times is line 4 executed in your answer to (c)? How many times would it be executed if the same six values were given in ascending order? Name the kind of partitioning each case shows.<\/p>","solution":{"html":"<p>In (c): line 4 runs r − p times per call: 5 + 2 + 1 = <b>8<\/b>. The splits are 3 : 2, then 1 : 1 and 0 : 1 — close to the balanced (best-case) partitioning.<\/p><p>Ascending input [29, 34, 47, 49, 53, 57]: every pivot A[r] is the largest value of its sub-array, so each split is (n − 1) : 0. Line 4 runs 5 + 4 + 3 + 2 + 1 = <b>15<\/b> = n(n − 1)/2 times. This is the worst-case (unbalanced) partitioning, T(n) = T(n − 1) + Θ(n) = Θ(n<sup>2<\/sup>).<\/p>","figures":[]},"rubric":[{"text":"8 comparisons for (c), shown as 5 + 2 + 1.","marks":0.5},{"text":"15 comparisons for ascending input, named worst-case (n − 1 : 0) partitioning; (c) named near-balanced (best-case type).","marks":0.5}],"mistakes":[{"text":"Counts r − p + 1 per call (includes the pivot): 11 instead of 8. The for loop stops at r − 1.","trap":null},{"text":"Calls ascending input the best case — that is insertion sort's best case; for Lomuto quicksort it is the worst.","trap":"T5"}],"source":"Lecture04.ppt, slides 12–17","check":{"algo":"qs-count","a":[47,53,29,34,57,49],"expect":{"comps":8,"sorted":15}},"block":null,"data":null,"figure":null,"id":"p1-q1d","cover":[]},{"label":"e","marks":3,"tier":2,"minutes":5,"archetype":"D3","pattern":["FM-Q1.7a","FM-Q1.7b","T1-Q1.7a"],"lecture":"L03","rows":["R5"],"topic":"New recursive definition: relation, initial condition, pseudo-code","stem":"<p>ONES(n) is the number of 1-bits in the binary form of a non-negative integer n; for example 13 = 1101<sub>2<\/sub>, so ONES(13) = 3. The last bit of n is n mod 2, and the remaining bits are the binary form of ⌊n/2⌋.<\/p><ol class=\"roman\"><li>Write a recursive relation for ONES(n). Clearly define the initial condition.<\/li><li>Write a recursive algorithm in pseudo code for the relation in (i).<\/li><li>List the calls your algorithm makes for ONES(22), and its result.<\/li><\/ol>","solution":{"html":"<table class=\"cases\"><tr><td rowspan=\"2\" class=\"brace\">ONES(n) =<\/td><td>0<\/td><td>if n = 0 &nbsp; ⊲ initial condition<\/td><\/tr><tr><td>(n mod 2) + ONES(⌊n/2⌋)<\/td><td>if n &gt; 0<\/td><\/tr><\/table><div class=\"code\"><pre>     ONES(n)\n<span class=\"ln\"> 1<\/span>  if n = 0\n<span class=\"ln\"> 2<\/span>     then return 0\n<span class=\"ln\"> 3<\/span>     else return (n mod 2) + ONES(⌊n/2⌋)\n<\/pre><\/div><p>ONES(22) calls: ONES(22) → ONES(11) → ONES(5) → ONES(2) → ONES(1) → ONES(0) — <b>6 calls<\/b>.<\/p><p>Result: 0 + 1 + 1 + 0 + 1 + 0 = <b>3<\/b> (22 = 10110<sub>2<\/sub>).<\/p>","figures":[]},"rubric":[{"text":"Recursive case ONES(n) = (n mod 2) + ONES(⌊n/2⌋) for n &gt; 0.","marks":1},{"text":"Initial condition ONES(0) = 0 stated (a relation that fixes only ONES(1) = 1 leaves ONES(0) undefined).","marks":0.5},{"text":"Pseudo-code that tests the base case before the recursive call and returns (n mod 2) + ONES(⌊n/2⌋).","marks":1},{"text":"Calls 22, 11, 5, 2, 1, 0 listed and result 3.","marks":0.5}],"mistakes":[{"text":"Uses ONES(1) = 1 as the only initial condition: then ONES(0) calls ONES(0) forever — the code fails the “must terminate” property for n = 0.","trap":null},{"text":"Writes ONES(n/2) without the floor: ONES(11) would call ONES(5.5), which is not an integer.","trap":null},{"text":"Adds 1 at every call instead of n mod 2 → counts the bits (5 for 22), not the 1-bits (3).","trap":null}],"source":"Lecture03.ppt, slides 3–12","check":{"algo":"ones","n":22,"expect":{"value":3,"calls":[22,11,5,2,1,0]}},"procs":[],"block":null,"data":null,"figure":null,"id":"p1-q1e","cover":[]},{"label":"f","marks":2,"tier":3,"minutes":4,"archetype":"D4","pattern":["FM-Q1.7c","FM-Q2.d","T1-Q2.d"],"lecture":"L03","rows":["R6"],"topic":"Recurrence of the ONES code, solved by repeated substitution","stem":"<p>Write a recurrence equation that describes the running time T(n) of your algorithm in (e)(ii), and use the repeated substitution method to solve it. (You may assume n is a power of 2.)<\/p>","solution":{"html":"<table class=\"cases\"><tr><td rowspan=\"2\" class=\"brace\">T(n) =<\/td><td>d<\/td><td>n = 0<\/td><\/tr><tr><td>T(n/2) + c<\/td><td>n ≥ 1<\/td><\/tr><\/table><p>One call does a test, a mod, an addition and a return (constant c) plus <b>one<\/b> recursive call on ⌊n/2⌋.<\/p><div class=\"mline\">T(n) = T(n/2) + c<\/div><div class=\"mline\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= [T(n/4) + c] + c = T(n/4) + 2c<\/div><div class=\"mline\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= [T(n/8) + c] + 2c = T(n/8) + 3c<\/div><div class=\"mline\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= T(n/2<sup>k<\/sup>) + kc<\/div><p>Stop when n/2<sup>k<\/sup> = 1, i.e. k = lg n:<\/p><div class=\"mline\">T(n) = T(1) + c lg n = (T(0) + c) + c lg n = c lg n + c + d<\/div><p>So <b>T(n) = O(lg n)<\/b>. Check: ONES(16) makes lg 16 + 2 = 6 calls (16, 8, 4, 2, 1, 0).<\/p>","figures":[]},"rubric":[{"text":"Recurrence T(n) = T(n/2) + c with an initial condition (T(0) = d or T(1) = constant).","marks":0.5},{"text":"At least three substitution lines leading to the general form T(n/2^k) + kc.","marks":1},{"text":"k = lg n substituted, giving c lg n + constant = O(lg n).","marks":0.5}],"mistakes":[{"text":"Writes T(n) = 2T(n/2) + c (as if there were two recursive calls) → O(n). ONES makes one call per level.","trap":null},{"text":"Writes T(n) = T(n − 1) + c → O(n): the argument halves, it does not drop by 1.","trap":null},{"text":"Stops at T(n/2^k) + kc without choosing k = lg n, so no closed form or Big oh.","trap":null}],"source":"Lecture03.ppt, slides 17–23","check":{"algo":"halving","expect":{"calls":{"2":3,"4":4,"8":5,"16":6,"32":7,"64":8}}},"procs":[],"block":null,"data":null,"figure":null,"id":"p1-q1f","cover":[]},{"label":"g","marks":2,"tier":3,"minutes":4,"archetype":"D7","pattern":["FM-Q1.3","T1-Q1.3"],"lecture":"L01","rows":["R2"],"topic":"RAM-model step count with an initialisation outside the loop","stem":"<p>Analyze the running time of the following program fragment assuming a RAM model of computation. Use the lecture's convention:<\/p><ul><li>every assignment, comparison, addition and memory access is one step;<\/li><li>a loop <span class=\"mono\">for i ← a to b<\/span> that runs t times costs (t + 1) assignments, (t + 1) comparisons and t additions for its control (so <span class=\"mono\">for i ← 0 to n<\/span> costs n + 2, n + 2 and n + 1);<\/li><li>each test of a while condition is one comparison.<\/li><\/ul><div class=\"code\"><pre><span class=\"ln\"> 1<\/span>  s ← 0\n<span class=\"ln\"> 2<\/span>  k ← 1\n<span class=\"ln\"> 3<\/span>  for i ← 1 to n\n<span class=\"ln\"> 4<\/span>      while k ≤ i\n<span class=\"ln\"> 5<\/span>          s ← s + A[k]\n<span class=\"ln\"> 6<\/span>          k ← k + 1\n<\/pre><\/div><p>Give the number of steps as a function of n, and the Big oh.<\/p>","solution":{"html":"<table class=\"grid\"><thead><tr><th>line<\/th><th>statement<\/th><th>cost per execution<\/th><th>times<\/th><th>steps<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>s ← 0<\/td><td>1 assignment<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>k ← 1<\/td><td>1 assignment<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>3<\/td><td>for i ← 1 to n<\/td><td>loop control<\/td><td>n iterations<\/td><td>(n+1) + (n+1) + n = 3n + 2<\/td><\/tr><tr><td>4<\/td><td>while k ≤ i<\/td><td>1 comparison<\/td><td>2 per i<\/td><td>2n<\/td><\/tr><tr><td>5<\/td><td>s ← s + A[k]<\/td><td>assignment + addition + memory access<\/td><td>n in total<\/td><td>3n<\/td><\/tr><tr><td>6<\/td><td>k ← k + 1<\/td><td>assignment + addition<\/td><td>n in total<\/td><td>2n<\/td><\/tr><\/tbody><\/table><p><b>The twist:<\/b> k ← 1 is executed once, before the for loop, so k is never reset. When iteration i starts, k = i: the while test is true once (the body runs once, k becomes i + 1) and then false. So the inner loop body runs only n times in total, not 1 + 2 + … + n times.<\/p><p>Total = 1 + 1 + (3n + 2) + 2n + 3n + 2n = <b>10n + 4<\/b> ⇒ <b>O(n)<\/b>. (For n = 5 that is 54 steps.)<\/p><p class=\"note\">If line 2 were moved inside the for loop, k would restart at 1 for every i and the body would run i times: 3n² + 8n + 3 steps, O(n²). Compare the lecture's slides 24 and 25.<\/p>","figures":[]},"rubric":[{"text":"Lines 1–3 counted as 1, 1 and 3n + 2.","marks":0.5},{"text":"While test counted 2n times and lines 5–6 n times each (3n and 2n), because k ← 1 is outside the loop and k keeps its value.","marks":1},{"text":"Total 10n + 4 and O(n).","marks":0.5}],"mistakes":[{"text":"Treats the loops as fully nested (body runs 1 + 2 + … + n times): 3n² + 8n + 3 steps, O(n²). That count belongs to the version with k ← 1 inside the for loop.","trap":"T1"},{"text":"Counts the for line as n steps instead of 3n + 2 → 8n + 2; the loop control has assignments, comparisons and additions.","trap":null}],"source":"Lecture01.ppt, slides 22–25","check":{"algo":"ram","expect":{"a":10,"b":4,"n5":54}},"procs":[],"block":null,"data":null,"figure":null,"id":"p1-q1g","cover":[]}]},{"num":2,"marks":15,"title":"Dynamic Programming","lectures":["L09"],"context":"<p>Use the recursive solution and the algorithms given at the end of the paper, and these data:<\/p><ul><li><b>0/1 knapsack<\/b>: n = 4, c = 10, w = [3, 5, 2, 3], p = [15, 13, 9, 8].<\/li><li><b>Matrix chain<\/b>: A<sub>1<\/sub>A<sub>2<\/sub>A<sub>3<\/sub>A<sub>4<\/sub> where A<sub>i<\/sub> has dimension p<sub>i−1<\/sub> × p<sub>i<\/sub> and p<sub>0<\/sub> = 5, p<sub>1<\/sub> = 4, p<sub>2<\/sub> = 8, p<sub>3<\/sub> = 3, p<sub>4<\/sub> = 3.<\/li><\/ul>","parts":[{"label":"a","marks":1,"tier":1,"minutes":2,"archetype":"D11","pattern":["FM-Q5.1"],"lecture":"L09","topic":"Overlapping subproblems in the KNAPSACK-RECURSE tree","procs":["KNAPSACK-RECURSE"],"stem":"<p>The figure shows the first three levels of the recursion tree of KNAPSACK-RECURSE(1, 10, 4, p, w) for the knapsack data. An edge labelled (w<sub>i<\/sub>, p<sub>i<\/sub>) puts item i in the bag; an edge labelled ¬(w<sub>i<\/sub>, p<sub>i<\/sub>) leaves it out. Expand the four P(3, ·) calls by one more level. Which call is m line=\"central\" font-size=\"13\">¬(5, 13)<\/text><rect class=\"halo\" x=\"639.7\" y=\"161.7\" width=\"62.0\" height=\"16.9\" rx=\"3\"/><text class=\"wt\" x=\"670.7\" y=\"170.1\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"13\">(5, 13)<\/text><rect class=\"grp\" x=\"358.0\" y=\"44.0\" width=\"80.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"398.0\" y=\"58.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(1, 10)<\/text><rect class=\"grp\" x=\"159.0\" y=\"136.0\" width=\"80.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"199.0\" y=\"150.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(2, 10)<\/text><rect class=\"grp\" x=\"561.0\" y=\"136.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"597.0\" y=\"150.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(2, 7)<\/text><rect class=\"grp\" x=\"59.5\" y=\"228.0\" width=\"80.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"99.5\" y=\"242.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(3, 10)<\/text><rect class=\"grp\" x=\"262.5\" y=\"228.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"298.5\" y=\"242.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(3, 5)<\/text><rect class=\"grp\" x=\"461.5\" y=\"228.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"497.5\" y=\"242.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(3, 7)<\/text><rect class=\"grp\" x=\"660.5\" y=\"228.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"696.5\" y=\"242.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(3, 2)<\/text><rect class=\"grp\" x=\"9.8\" y=\"320.0\" width=\"80.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"49.8\" y=\"334.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(4, 10)<\/text><rect class=\"grp\" x=\"113.2\" y=\"320.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"149.2\" y=\"334.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(4, 8)<\/text><rect class=\"grp\" x=\"212.8\" y=\"320.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"248.8\" y=\"334.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(4, 5)<\/text><rect class=\"grp\" x=\"312.2\" y=\"320.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"348.2\" y=\"334.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(4, 3)<\/text><rect class=\"grp\" x=\"411.8\" y=\"320.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"447.8\" y=\"334.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(4, 7)<\/text><rect class=\"grp\" x=\"511.2\" y=\"320.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"547.2\" y=\"334.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(4, 5)<\/text><rect class=\"grp\" x=\"610.8\" y=\"320.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"646.8\" y=\"334.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(4, 2)<\/text><rect class=\"grp\" x=\"710.2\" y=\"320.0\" width=\"72.0\" height=\"28\" rx=\"5\"/><text class=\"lbl\" x=\"746.2\" y=\"334.0\" text-anchor=\"middle\" dominant-baseline=\"central\">P(4, 0)<\/text><\/svg><\/figure><p>Level 4 (item 3 left out / put in, w<sub>3<\/sub> = 2): P(4, 10), P(4, 8), P(4, 5), P(4, 3), P(4, 7), P(4, 5), P(4, 2), P(4, 0).<\/p><p><b>P(4, 5)<\/b> is called twice: (leave item 1, take item 2, leave item 3) and (take item 1, leave item 2, take item 3) — because w<sub>2<\/sub> = w<sub>1<\/sub> + w<sub>3<\/sub> = 5.<\/p><p>This is <b>overlapping subproblems<\/b>: the recursive algorithm revisits the same sub-problem. Dynamic programming computes P(4, 5) once, stores it in the table and reuses it.<\/p>","figures":[]},"rubric":[{"text":"The level-4 calls expanded correctly, with P(4, 5) found on the two paths (leave 1, take 2, leave 3) and (take 1, leave 2, take 3).","marks":0.5},{"text":"Names overlapping subproblems (and that DP stores the value once).","marks":0.5}],"mistakes":[{"text":"Names “optimal substructure”: that is about an optimal solution containing optimal sub-solutions. A repeated call is the overlapping-subproblems element.","trap":null},{"text":"Subtracts the profit instead of the weight on a take edge (e.g. P(2, 10 − 15)) — k is the remaining capacity, so only weights are subtracted.","trap":null}],"source":"Lecture09.ppt, slides 8 and 17–20","check":{"algo":"ks-tree","w":[3,5,2,3],"c":10,"expect":{"level4":[10,8,5,3,7,5,2,0],"repeated":[5]}},"rows":[],"block":null,"data":null,"id":"p1-q2a","cover":[]},{"label":"b","marks":6,"tier":2,"minutes":9,"archetype":"D2","pattern":["FM-Q5.2","WB-2"],"lecture":"L09","topic":"0/1 knapsack table from P(i, k)","procs":["P(i, k)"],"stem":"<p>Construct a table for the 0/1 knapsack problem above using Dynamic Programming with the recursive solution P(i, k) given at the end of the paper. Use the lecture's layout: rows i = 4 down to 1, columns k = 0 … 10. Mark every cell whose value comes from the “take item i” branch (write +p<sub>i<\/sub> in it).<\/p>","solution":{"html":"<table class=\"dp\"><thead><tr><th>i\\k<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><th>9<\/th><th>10<\/th><\/tr><\/thead><tbody><tr><th>4<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"take\">8<span class=\"plus\">+8<\/span><\/td><td class=\"take\">8<span class=\"plus\">+8<\/span><\/td><td class=\"take\">8<span class=\"plus\">+8<\/span><\/td><td class=\"take\">8<span class=\"plus\">+8<\/span><\/td><td class=\"take\">8<span class=\"plus\">+8<\/span><\/td><td class=\"take\">8<span class=\"plus\">+8<\/span><\/td><td class=\"take\">8<span class=\"plus\">+8<\/span><\/td><td class=\"take\">8<span class=\"plus\">+8<\/span><\/td><\/tr><tr><th>3<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"take\">9<span class=\"plus\">+9<\/span><\/td><td class=\"take\">9<span class=\"plus\">+9<\/span><\/td><td class=\"take\">9<span class=\"plus\">+9<\/span><\/td><td class=\"take\">17<span class=\"plus\">+9<\/span><\/td><td class=\"take\">17<span class=\"plus\">+9<\/span><\/td><td class=\"take\">17<span class=\"plus\">+9<\/span><\/td><td class=\"take\">17<span class=\"plus\">+9<\/span><\/td><td class=\"take\">17<span class=\"plus\">+9<\/span><\/td><td class=\"take\">17<span class=\"plus\">+9<\/span><\/td><\/tr><tr><th>2<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">9<\/td><td class=\"\">9<\/td><td class=\"\">9<\/td><td class=\"\">17<\/td><td class=\"\">17<\/td><td class=\"take\">22<span class=\"plus\">+13<\/span><\/td><td class=\"take\">22<span class=\"plus\">+13<\/span><\/td><td class=\"take\">22<span class=\"plus\">+13<\/span><\/td><td class=\"take\">30<span class=\"plus\">+13<\/span><\/td><\/tr><tr><th>1<\/th><td class=\"\">0<\/td><td class=\"\">0<\/td><td class=\"\">9<\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">15<span class=\"plus\">+15<\/span><\/td><td class=\"take\">24<span class=\"plus\">+15<\/span><\/td><td class=\"take\">24<span class=\"plus\">+15<\/span><\/td><td class=\"take\">24<span class=\"plus\">+15<\/span><\/td><td class=\"take\">32<span class=\"plus\">+15<\/span><\/td><td class=\"take\">32<span class=\"plus\">+15<\/span><\/td><td class=\"take\">37<span class=\"plus\">+15<\/span><\/td><\/tr><\/tbody><\/table><p>A shaded cell with +p<sub>i<\/sub> took item i. Sample cells:<\/p><div class=\"mline\">P(3, 3) = max( P(4, 3), p3 + P(4, 3 − 2) ) = max( 8, 9 + 0 ) = max( 8, 9 ) = <b>9<\/b> &nbsp;← take wins by only 1<\/div><div class=\"mline\">P(2, 10) = max( P(3, 10), p2 + P(3, 10 − 5) ) = max( 17, 13 + 17 ) = max( 17, 30 ) = <b>30<\/b><\/div><div class=\"mline\">P(1, 10) = max( P(2, 10), p1 + P(2, 10 − 3) ) = max( 30, 15 + 22 ) = max( 30, 37 ) = <b>37<\/b><\/div>","figures":[]},"rubric":[{"text":"Row i = 4: 0 0 0 8 8 8 8 8 8 8 8.","marks":1},{"text":"Row i = 3: 0 0 9 9 9 17 17 17 17 17 17.","marks":1.5},{"text":"Row i = 2: 0 0 9 9 9 17 17 22 22 22 30.","marks":1.5},{"text":"Row i = 1: 0 0 9 15 15 24 24 24 32 32 37 (so P(1, 10) = 37).","marks":1.5},{"text":"The take-branch cells are marked (+p_i), including P(3, 3) and P(3, 4) where taking item 3 wins 9 to 8.","marks":0.5}],"mistakes":[{"text":"Uses the slide's 1-D loop with k increasing: items can be reused (unbounded knapsack) → P[10] = 48 instead of 37.","trap":null},{"text":"Fills the rows from i = 1 downwards using items 1..i — the recursion is defined on the suffix i..n, so the rows (and every read-off) come out different.","trap":"T7"},{"text":"Forgets the i = n case: row 4 must be p₄ = 8 wherever w₄ = 3 ≤ k, not 0.","trap":null}],"source":"Lecture09.ppt, slides 13–16 and 23–32","check":{"algo":"knapsack","w":[3,5,2,3],"p":[15,13,9,8],"c":10,"expect":{"rows":{"4":[0,0,0,8,8,8,8,8,8,8,8],"3":[0,0,9,9,9,17,17,17,17,17,17],"2":[0,0,9,9,9,17,17,22,22,22,30],"1":[0,0,9,15,15,24,24,24,32,32,37]},"x":[1,1,1,0],"best":37,"optimalSubsets":1}},"rows":[],"block":null,"data":null,"figure":null,"id":"p1-q2b","cover":[]},{"label":"c","marks":2,"tier":2,"minutes":3,"archetype":"D9","pattern":["FM-Q5.3","FM-Q5.4"],"lecture":"L09","topic":"Read-off P(3, 8) and the trace-back","procs":["P(i, k)"],"stem":"<ol class=\"roman\"><li>Find P(3, 8) using the recursive equations, writing out the line you used.<\/li><li>Briefly explain how you obtain the items of the optimal solution from your table, and give the solution vector x.<\/li><\/ol>","solution":{"html":"<div class=\"mline\">P(3, 8) = max( P(4, 8), p3 + P(4, 8 − 2) ) = max( 8, 9 + 8 ) = max( 8, 17 ) = <b>17<\/b><\/div><p>P(3, 8) uses only items 3 and 4 (the suffix 3..n): both fit, 9 + 8 = 17.<\/p><p>Trace back from P(1, 10): if P(i, k) ≠ P(i + 1, k) the take branch was used, so x<sub>i<\/sub> = 1 and k drops by w<sub>i<\/sub>; otherwise x<sub>i<\/sub> = 0.<\/p><div class=\"mline\">P(1, 10) = 37 ≠ P(2, 10) = 30 ⇒ x1 = 1, k ← 10 − 3 = 7<br>P(2, 7) = 22 ≠ P(3, 7) = 17 ⇒ x2 = 1, k ← 7 − 5 = 2<br>P(3, 2) = 9 ≠ P(4, 2) = 0 ⇒ x3 = 1, k ← 2 − 2 = 0<br>i = 4: last item, w4 = 3 &gt; k = 0 ⇒ x4 = 0<\/div><p>x = <b>[1, 1, 1, 0]<\/b>: profit 37, weight 10 ≤ 10.<\/p>","figures":[]},"rubric":[{"text":"P(3, 8) = max(P(4, 8), 9 + P(4, 6)) = max(8, 17) = 17, with the recursion line written.","marks":1},{"text":"Trace-back comparing P(i, k) with P(i + 1, k) and reducing k after each taken item; x = [1, 1, 1, 0].","marks":1}],"mistakes":[{"text":"Uses items 1..3 for P(3, 8) → 28 (items 1 and 2) instead of 17. P(i, k) is defined on items i..n.","trap":"T7"},{"text":"Forgets to reduce k after taking an item → x = [1, 1, 1, 1], total weight 13 &gt; 10.","trap":null}],"source":"Lecture09.ppt, slides 16 and 32","check":{"algo":"knapsack-cell","w":[3,5,2,3],"p":[15,13,9,8],"c":10,"cell":[3,8],"expect":{"value":17,"x":[1,1,1,0]}},"rows":[],"block":null,"data":null,"figure":null,"id":"p1-q2c","cover":[]},{"label":"d","marks":4,"tier":2,"minutes":9,"archetype":"D2","pattern":["FM-Q5.5","WB-1"],"lecture":"L09","topic":"Matrix-chain m and s tables (p given as p0 … p4)","procs":["MATRIX_CHAIN_ORDER","PRINT-OPTIMAL-PARENS"],"stem":"<p>Draw the m and s tables for the matrix chain above using MATRIX_CHAIN_ORDER given at the end of the paper. Hence find the optimal parenthesizing and the optimal number of scalar multiplications.<\/p>","solution":{"html":"<p>Chain lengths 2: m[1,2] = 5·4·8 = 160, m[2,3] = 4·8·3 = 96, m[3,4] = 8·3·3 = 72.<\/p><div class=\"mline\">m[1, 3] = min { k = 1: m[1,1] + m[2,3] + p0·p1·p3 = 0 + 96 + 5·4·3 = 156<br>&nbsp;&nbsp;&nbsp;&nbsp;k = 2: m[1,2] + m[3,3] + p0·p2·p3 = 160 + 0 + 5·8·3 = 280 } = <b>156<\/b> &nbsp;⇒ s[1, 3] = <b>1<\/b><\/div><div class=\"mline\">m[2, 4] = min { k = 2: m[2,2] + m[3,4] + p1·p2·p4 = 0 + 72 + 4·8·3 = 168<br>&nbsp;&nbsp;&nbsp;&nbsp;k = 3: m[2,3] + m[4,4] + p1·p3·p4 = 96 + 0 + 4·3·3 = 132 } = <b>132<\/b> &nbsp;⇒ s[2, 4] = <b>3<\/b><\/div><div class=\"mline\">m[1, 4] = min { k = 1: m[1,1] + m[2,4] + p0·p1·p4 = 0 + 132 + 5·4·3 = 192<br>&nbsp;&nbsp;&nbsp;&nbsp;k = 2: m[1,2] + m[3,4] + p0·p2·p4 = 160 + 72 + 5·8·3 = 352<br>&nbsp;&nbsp;&nbsp;&nbsp;k = 3: m[1,3] + m[4,4] + p0·p3·p4 = 156 + 0 + 5·3·3 = 201 } = <b>192<\/b> &nbsp;⇒ s[1, 4] = <b>1<\/b><\/div><div class=\"figrow\"><table class=\"dp tri\"><caption>m[i, j]<\/caption><thead><tr><th>i\\j<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody><tr><th>1<\/th><td>0<\/td><td>160<\/td><td>156<\/td><td>192<\/td><\/tr><tr><th>2<\/th><td class=\"blank\"><\/td><td>0<\/td><td>96<\/td><td>132<\/td><\/tr><tr><th>3<\/th><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td>0<\/td><td>72<\/td><\/tr><tr><th>4<\/th><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td>0<\/td><\/tr><\/tbody><\/table><table class=\"dp tri\"><caption>s[i, j]<\/caption><thead><tr><th>i\\j<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody><tr><th>1<\/th><td class=\"blank\"><\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><th>2<\/th><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td>2<\/td><td>3<\/td><\/tr><tr><th>3<\/th><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td>3<\/td><\/tr><tr><th>4<\/th><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td class=\"blank\"><\/td><td class=\"blank\"><\/td><\/tr><\/tbody><\/table><\/div><p>PRINT-OPTIMAL-PARENS(s, 1, 4): s[1,4] = 1 splits A1 | A2A3A4; s[2,4] = 3 splits A2A3 | A4; s[2,3] = 2. Optimal parenthesizing <b>(A1((A2A3)A4))<\/b> with <b>192<\/b> scalar multiplications.<\/p><p class=\"note\">The k = 3 candidate has the cheapest final product (5·3·3 = 45) but loses, 201 against 192: the minimising k is not the one with the cheapest last multiplication.<\/p>","figures":[]},"rubric":[{"text":"m[1,2] = 160, m[2,3] = 96, m[3,4] = 72.","marks":1},{"text":"m[1,3] = 156 (s = 1) and m[2,4] = 132 (s = 3), each with its min{…} expansion.","marks":1},{"text":"m[1,4] = 192 with all three candidates 192, 352, 201 and s[1,4] = 1.","marks":1},{"text":"Complete s table and the parenthesizing (A1((A2A3)A4)) with 192 scalar multiplications.","marks":1}],"mistakes":[{"text":"Uses p<sub>i<\/sub>·p<sub>k<\/sub>·p<sub>j<\/sub> instead of p<sub>i−1<\/sub>·p<sub>k<\/sub>·p<sub>j<\/sub> → every entry shifts; m[1,4] comes out 251.","trap":"T8"},{"text":"Stores the cost in s[i, j] instead of the splitting k — PRINT-OPTIMAL-PARENS then cannot be run.","trap":"T8"},{"text":"Picks k = 3 for m[1,4] because its last product 45 is the smallest → 201 instead of 192.","trap":null}],"source":"Lecture09.ppt, slides 42–49","check":{"algo":"mcm","p":[5,4,8,3,3],"expect":{"m":{"1,1":0,"1,2":160,"1,3":156,"1,4":192,"2,2":0,"2,3":96,"2,4":132,"3,3":0,"3,4":72,"4,4":0},"s":{"1,2":1,"1,3":1,"1,4":1,"2,3":2,"2,4":3,"3,4":3},"parens":"(A1((A2A3)A4))","best":192,"unique":true}},"rows":[],"block":null,"data":null,"figure":null,"id":"p1-q2d","cover":[]},{"label":"e","marks":2,"tier":3,"minutes":4,"archetype":"D9","pattern":["FM-Q5.4","FM-C.5"],"lecture":"L09","topic":"A classmate's greedy rules against your tables","stem":"<p>A classmate suggests two “quick” rules instead of the tables: (i) for the knapsack, keep taking the item with the largest profit/weight ratio that still fits; (ii) for the chain, always multiply the adjacent pair whose product is cheapest. Apply each rule to the data above and use your answers to (b) and (d) to say by how much each rule loses.<\/p>","solution":{"html":"<p>(i) Ratios: item 1: 15/3 = 5.00, item 2: 13/5 = 2.60, item 3: 9/2 = 4.50, item 4: 8/3 = 2.67. Order 1, 3, 4, 2: item 1 taken; item 3 taken; item 4 taken; item 2 does not fit. Profit <b>32<\/b> against P(1, 10) = 37 — the rule loses <b>5<\/b>. Item 4 (ratio 2.67) uses the 3 kg that item 2 needed.<\/p><p>(ii) A3A4 costs 8·3·3 = 72; A2(A3A4) costs 4·8·3 = 96; A1(A2(A3A4)) costs 5·4·3 = 60. Order (A1(A2(A3A4))), total <b>228<\/b> against m[1,4] = 192 — the rule loses <b>36<\/b>. Multiplying A3A4 first (the cheapest single product) is not part of the optimal order.<\/p>","figures":[]},"rubric":[{"text":"Knapsack rule: items taken in ratio order 1, 3, 4; item 2 no longer fits; profit 32, i.e. 5 less than 37.","marks":1},{"text":"Chain rule: 72 + 96 + 60 = 228, i.e. 36 more than m[1,4] = 192.","marks":1}],"mistakes":[{"text":"Sorts by profit alone (15, 13, 9, 8): that happens to reach 37 here, but it is not the rule asked for, and it fails on other data.","trap":null},{"text":"Compares the greedy chain cost with m[1,3] or with a single product instead of with m[1,4].","trap":null}],"source":"Lecture09.ppt, slides 23–32 and 45–49; Lecture07, slide 9 (greedy ≠ optimal)","check":{"algo":"greedy-dp","w":[3,5,2,3],"p":[15,13,9,8],"c":10,"pdim":[5,4,8,3,3],"expect":{"ks":32,"mcm":228}},"procs":[],"rows":[],"block":null,"data":null,"figure":null,"id":"p1-q2e","cover":[]}]},{"num":3,"marks":15,"title":"String Matching Algorithms","lectures":["L06"],"context":"<p>Indices are 1-based. A shift s lines P[1..m] up under T[s + 1..s + m]. Character comparisons are counted left to right, stopping at the first mismatch (a full match costs m comparisons). The algorithms are given at the end of the paper.<\/p><p>For (a) and (b):<\/p><table class=\"arr\"><tr><th class=\"ix\">i<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th class=\"ix\">7<\/th><th class=\"ix\">8<\/th><th class=\"ix\">9<\/th><th class=\"ix\">10<\/th><th class=\"ix\">11<\/th><th class=\"ix\">12<\/th><th class=\"ix\">13<\/th><th class=\"ix\">14<\/th><\/tr><tr><th class=\"rowlab\">T<\/th><td class=\"\">D<\/td><td class=\"\">C<\/td><td class=\"\">C<\/td><td class=\"\">D<\/td><td class=\"\">C<\/td><td class=\"\">A<\/td><td class=\"\">C<\/td><td class=\"\">D<\/td><td class=\"\">C<\/td><td class=\"\">D<\/td><td class=\"\">C<\/td><td class=\"\">A<\/td><td class=\"\">C<\/td><td class=\"\">D<\/td><\/tr><\/table><p>P = <span class=\"mono\">CDCA<\/span> (m = 4).<\/p>","parts":[{"label":"a","marks":2,"tier":1,"minutes":3,"archetype":"D11","pattern":["FM-C.1"],"lecture":"L06","topic":"Valid shift definition, applied","stem":"<p>For T and P above, state whether each of the shifts s = 2, s = 6 and s = 12 is a valid shift. Justify each answer from the definition of a valid shift.<\/p>","solution":{"html":"<p>n − m = 14 − 4 = 10. A shift s is valid if 0 ≤ s ≤ n − m and T[s + 1..s + m] = P[1..m].<\/p><ul><li>s = 2: 0 ≤ 2 ≤ 10 and T[3..6] = CDCA = P ⇒ <b>valid<\/b>.<\/li><li>s = 6: in range, but T[7..10] = CDCD ≠ CDCA (T[10] = D but P[4] = A) ⇒ <b>invalid<\/b>.<\/li><li>s = 12: 12 &gt; n − m = 10 ⇒ <b>invalid<\/b>. T[13..14] = CD looks like the start of P, but the window would run past T[14].<\/li><\/ul>","figures":[]},"rubric":[{"text":"n − m = 10 worked out and used.","marks":0.5},{"text":"s = 2 valid: T[3..6] = CDCA = P.","marks":0.5},{"text":"s = 6 invalid: the 4th character differs (T[10] = D, P[4] = A).","marks":0.5},{"text":"s = 12 invalid because 12 &gt; n − m, even though T[13..14] = CD.","marks":0.5}],"mistakes":[{"text":"Accepts s = 12 because T[13..14] = CD matches P[1..2]: the range condition 0 ≤ s ≤ n − m fails.","trap":"T-L06c"},{"text":"Reads the shift as the starting position: tests T[2..5] for s = 2. With shift s the pattern starts at position s + 1.","trap":null}],"source":"Lecture06 (1).ppt, slides 7–9","check":{"algo":"validshift","T":"DCCDCACDCDCACD","P":"CDCA","shifts":[2,6,12],"expect":[true,false,false]},"procs":[],"rows":[],"block":null,"data":null,"figure":null,"id":"p1-q3a","cover":[]},{"label":"b","marks":3,"tier":2,"minutes":5,"archetype":"D1","pattern":["FM-Q1.5","FM-Q2.a"],"lecture":"L06","topic":"NAIVE-STRING-MATCHER: valid shifts and comparisons","procs":["NAIVE-STRING-MATCHER"],"stem":"<p>Illustrate the operations of NAIVE-STRING-MATCHER(T, P) for T and P above. List every valid shift and find the total number of character comparisons it makes.<\/p>","solution":{"html":"<table class=\"snap mono\"><tr><th><\/th><th class=\"ix\">1<\/th ss=\"out\"><\/td><td>4 ✓ valid<\/td><\/tr><tr class=\"\"><th>s = 9<\/th><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"bad\">C<\/td><td class=\"skip\">D<\/td><td class=\"skip\">C<\/td><td class=\"skip\">A<\/td><td class=\"out\"><\/td><td>1<\/td><\/tr><tr class=\"\"><th>s = 10<\/th><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"out\"><\/td><td class=\"ok\">C<\/td><td class=\"bad\">D<\/td><td class=\"skip\">C<\/td><td class=\"skip\">A<\/td><td>2<\/td><\/tr><tr class=\"final\"><th>total<\/th><td colspan=\"14\"><\/td><td><b>23<\/b><\/td><\/tr><\/table><p>Shifts s = 0 … 10 are tried (11 shifts). Valid shifts: <b>2, 8<\/b>. Comparisons: 1 + 2 + 4 + 1 + 2 + 1 + 4 + 1 + 4 + 1 + 2 = <b>23<\/b>.<\/p>","figures":[]},"rubric":[{"text":"All 11 shifts s = 0 … 10 tried (pattern written under each shift, or a per-shift table).","marks":1},{"text":"Valid shifts 2 and 8 only.","marks":1},{"text":"Per-shift counts 1 2 4 1 2 1 4 1 4 1 2 and total 23.","marks":1}],"mistakes":[{"text":"Counts m = 4 comparisons for every shift → 44: that is the worst-case bound (n − m + 1)m, not this text's count.","trap":null},{"text":"Stops at s = 9 (loop bound off by one) → misses the last shift; total 21.","trap":"T-L06c"}],"source":"Lecture06 (1).ppt, slides 9–12","check":{"algo":"naive","T":"DCCDCACDCDCACD","P":"CDCA","expect":{"valid":[2,8],"comps":23,"per":[1,2,4,1,2,1,4,1,4,1,2]}},"rows":[],"block":null,"data":null,"figure":null,"id":"p1-q3b","cover":[]},{"label":"c","marks":5,"tier":2,"minutes":9,"archetype":"D1","pattern":["FM-C.2","FM-Q5.3"],"lecture":"L06","topic":"Rabin-Karp: rolling window values, valid match vs spurious hit","procs":["Rabin-Karp"],"stem":"<p>Use the Rabin-Karp method given at the end of the paper (decimal digits, d = 10, modulus q = 11) to find every occurrence of P = <span class=\"mono\">8128<\/span> in<\/p><table class=\"arr\"><tr><th class=\"ix\">i<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th class=\"ix\">7<\/th><th class=\"ix\">8<\/th><th class=\"ix\">9<\/th><th class=\"ix\">10<\/th><th class=\"ix\">11<\/th><th class=\"ix\">12<\/th><th class=\"ix\">13<\/th><\/tr><tr><th class=\"rowlab\">T<\/th><td class=\"\">6<\/td><td class=\"\">5<\/td><td class=\"\">7<\/td><td class=\"\">0<\/td><td class=\"\">8<\/td><td class=\"\">1<\/td><td class=\"\">2<\/td><td class=\"\">8<\/td><td class=\"\">9<\/td><td class=\"\">9<\/td><td class=\"\">6<\/td><td class=\"\">2<\/td><td class=\"\">2<\/td><\/tr><\/table><ol class=\"roman\"><li>Find p = P mod 11 and h = 10<sup>m−1<\/sup> mod 11.<\/li><li>Find every window value t<sub>s<\/sub> mod 11. Compute at least two of them with the rolling formula, showing each step.<\/li><li>Label every hit as a valid match or a spurious hit, and state how many explicit character-by-character checks are made.<\/li><\/ol>","solution":{"html":"<p>p = 8128 mod 11 = <b>10<\/b> &nbsp;(8128 = 11·738 + 10); &nbsp; h = 10<sup>3<\/sup> mod 11 = 1000 mod 11 = <b>10<\/b>; &nbsp; t<sub>0<\/sub> = 6570 mod 11 = <b>3<\/b>.<\/p><p>Rolling formula t<sub>s+1<\/sub> = (d(t<sub>s<\/sub> − T[s + 1]·h) + T[s + m + 1]) mod q — drop the old high-order digit, shift, add the new low-order digit:<\/p><div class=\"mline\">t<sub>1<\/sub> = (10·(t<sub>0<\/sub> − T[1]·h) + T[5]) mod 11 = (10·(3 − 6·10) + 8) mod 11 = (-562) mod 11 = <b>10<\/b> &nbsp;&nbsp;[check: 5708 mod 11 = 10]<\/div><div class=\"mline\">t<sub>4<\/sub> = (10·(t<sub>3<\/sub> − T[4]·h) + T[8]) mod 11 = (10·(9 − 0·10) + 8) mod 11 = (98) mod 11 = <b>10<\/b> &nbsp;&nbsp;[check: 8128 mod 11 = 10]<\/div><table class=\"snap mono\"><tr><th>s<\/th><th class=\"ix\">0<\/th><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th class=\"ix\">7<\/th><th class=\"ix\">8<\/th><th class=\"ix\">9<\/th><\/tr><tr><th>window<\/th><td>6570<\/td><td>5708<\/td><td>7081<\/td><td>0812<\/td><td>8128<\/td><td>1289<\/td><td>2899<\/td><td>8996<\/td><td>9962<\/td><td>9622<\/td><\/tr><tr><th>t<sub>s<\/sub> mod 11<\/th><td class=\"\">3<\/td><td class=\"hit\">10<\/td><td class=\"\">8<\/td><td class=\"\">9<\/td><td class=\"hit\">10<\/td><td class=\"\">2<\/td><td class=\"\">6<\/td><td class=\"\">9<\/td><td class=\"\">7<\/td><td class=\"\">8<\/td><\/tr><tr><th><\/th><td><\/td><td class=\"bad\">spurious hit<\/td><td><\/td><td><\/td><td class=\"ok\">valid match<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><p>Hits (t<sub>s<\/sub> = 10) at s = 1 and s = 4. Explicit checks: T[2..5] = 5708 ≠ 8128 ⇒ <b>spurious hit<\/b>; T[5..8] = 8128 = P ⇒ <b>valid match<\/b> (P occurs with shift 4). <b>2 explicit checks<\/b> — one per hit; the other 8 windows are rejected by their value alone.<\/p>","figures":[]},"rubric":[{"text":"p = 10 and h = 10.","marks":1},{"text":"Two rolling steps written in full (old high-order digit times h removed, multiplied by 10, new digit added, reduced mod 11, negative values brought into 0..10).","marks":1},{"text":"All 10 window values 3 10 8 9 10 2 6 9 7 8.","marks":1.5},{"text":"s = 1 labelled spurious hit (5708 ≠ 8128) and s = 4 valid match.","marks":1},{"text":"2 explicit checks (one per hit).","marks":0.5}],"mistakes":[{"text":"Reports s = 1 as an occurrence without the explicit check: a hit is not a match.","trap":"T-L06a"},{"text":"Uses h = 10<sup>m<\/sup> mod 11 = 1 instead of 10<sup>m−1<\/sup> mod 11 → wrong windows from s = 1 on (0 6 3 5 …).","trap":"T-L06b"},{"text":"Keeps a negative remainder: (-562) mod 11 written as -1 instead of 10, so the hit at s = 1 is missed.","trap":"T-L06b"}],"source":"Lecture06 (1).ppt, slides 15–21","check":{"algo":"rk","T":"6570812899622","P":"8128","q":11,"expect":{"p":10,"h":10,"windows":[3,10,8,9,10,2,6,9,7,8],"valid":[4],"spurious":[1]}},"rows":[],"block":null,"data":null,"figure":null,"id":"p1-q3c","cover":[]},{"label":"d","marks":5,"tier":3,"minutes":10,"archetype":"D1","pattern":["FM-Q2.a","FM-Q5.3"],"lecture":"L06","topic":"String-matching automaton: δ table, state sequence, non-zero fallback","procs":["automaton"],"stem":"<p>P = <span class=\"mono\">aabac<\/span> over Σ = {a, b, c}. Use the string-matching automaton given at the end of the paper.<\/p><ol class=\"roman\"><li>Construct the transition function δ (states 0 … 5, state 5 accepting) as a table. A state-transition diagram is optional.<\/li><li>Give the state sequence φ(T<sub>i<\/sub>) for T = <span class=\"mono\">aaabaaaabac<\/span> and the shift(s) at which P occurs.<\/li><li>Explain why δ(4, a) is 2 and not 0.<\/li><\/ol>","solution":{"html":"<div class=\"figrow\"><table class=\"dp\"><thead><tr><th>state<\/th><th>a<\/th><th>b<\/th><th>c<\/th><th>P<\/th><\/tr><\/thead><tbody><tr><th>0<\/th><td class=\"take\">1<\/td><td class=\"\">0<\/td><td class=\"\">0<\/td><td>a<\/td><\/tr><tr><th>1<\/th><td class=\"take\">2<\/td><td class=\"\">0<\/td><td class=\"\">0<\/td><td>a<\/td><\/tr><tr><th>2<\/th><td class=\"hl\">2<\/td><td class=\"take\">3<\/td><td class=\"\">0<\/td><td>b<\/td><\/tr><tr><th>3<\/th><td class=\"take\">4<\/td><td class=\"\">0<\/td><td class=\"\">0<\/td><td>a<\/td><\/tr><tr><th>4<\/th><td class=\"hl\">2<\/td><td class=\"\">0<\/td><td class=\"take\">5<\/td><td>c<\/td><\/tr><tr><th>5<\/th><td class=\"\">1<\/td><td class=\"\">0<\/td><td class=\"\">0<\/td><td><\/td><\/tr><\/tbody><\/table><figure class=\"fig\"><svg class=\"dg\" viewBox=\"0 0 570 340\" style=\"min-width:570px;max-width:627px\" role=\"img\" aria-label=\"string-matching automaton for P = aabac (edges to state 0 not drawn)\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id d><th class=\"ix\">1<\/th><th class=\"ix\">2<\/th><th class=\"ix\">3<\/th><th class=\"ix\">4<\/th><th class=\"ix\">5<\/th><th class=\"ix\">6<\/th><th class=\"ix\">7<\/th><th class=\"ix\">8<\/th><th class=\"ix\">9<\/th><th class=\"ix\">10<\/th><th class=\"ix\">11<\/th><\/tr><tr><th>T[i]<\/th><td>—<\/td><td>a<\/td><td>a<\/td><td>a<\/td><td>b<\/td><td>a<\/td><td>a<\/td><td>a<\/td><td>a<\/td><td>b<\/td><td>a<\/td><td>c<\/td><\/tr><tr><th>state φ(T<sub>i<\/sub>)<\/th><td class=\"\">0<\/td><td class=\"\">1<\/td><td class=\"\">2<\/td><td class=\"\">2<\/td><td class=\"\">3<\/td><td class=\"\">4<\/td><td class=\"\">2<\/td><td class=\"\">2<\/td><td class=\"\">2<\/td><td class=\"\">3<\/td><td class=\"\">4<\/td><td class=\"acc\">5<\/td><\/tr><\/table><p>φ reaches 5 only at i = 11, so P occurs once, with shift 11 − 5 = <b>6<\/b> (T[7..11] = aabac).<\/p><p><b>δ(4, a) = 2:<\/b> in state 4 the automaton has just read “aaba” (P[1..4]). Reading a gives a text ending in “aabaa”. The longest prefix of P that is also a suffix of “aabaa” is “aa” (“aaba”, “aab” are not suffixes; “a” is shorter). So the automaton keeps the two a's it has already seen and continues from state 2 — only “bac” is still needed.<\/p><p>Going back to 0 (or 1) would lose an occurrence: on T = aabaabac the correct run is 0 1 2 3 4 2 3 4 5 and finds P at shift 3, while a reset-on-mismatch run gives 0 1 2 3 4 1 0 1 0 and finds nothing.<\/p>","figures":[]},"rubric":[{"text":"δ rows for states 0, 1, 2 correct, columns a b c (0: 1 0 0 · 1: 2 0 0 · 2: 2 3 0).","marks":1},{"text":"δ rows for states 3, 4, 5 correct (3: 4 0 0 · 4: 2 0 5 · 5: 1 0 0).","marks":1},{"text":"State sequence 0 1 2 2 3 4 2 2 2 3 4 5.","marks":1},{"text":"One occurrence, ending at position 11, i.e. shift s = 6.","marks":1},{"text":"δ(4, a) = 2 explained as the longest prefix of P that is a suffix of P[1..4]a = aabaa, which is “aa”.","marks":1}],"mistakes":[{"text":"Sends every mismatch back to state 0 (or to 1 on an a): the run becomes 0 1 2 1 0 1 2 1 2 3 4 5, wrong from i = 3 on (δ(2, a) must stay 2). It still ends in 5 on this text, but on aabaabac it misses P completely.","trap":"T-L06d"},{"text":"Gives the end position 11 as the shift. The shift is end − m = 6.","trap":null},{"text":"Writes δ(2, a) = 3 (treating a as the next pattern letter) — P[3] is b; after “aaa” the longest prefix-suffix is “aa”, so δ(2, a) = 2.","trap":"T-L06d"}],"source":"Lecture06 (1).ppt, slides 22–27","check":{"algo":"fa","P":"aabac","sigma":"abc","T":"aaabaaaabac","expect":{"delta":{"0,a":1,"0,b":0,"0,c":0,"1,a":2,"1,b":0,"1,c":0,"2,a":2,"2,b":3,"2,c":0,"3,a":4,"3,b":0,"3,c":0,"4,a":2,"4,b":0,"4,c":5,"5,a":1,"5,b":0,"5,c":0},"states":[0,1,2,2,3,4,2,2,2,3,4,5],"ends":[11]}},"rows":[],"block":null,"data":null,"figure":null,"id":"p1-q3d","cover":[]}]},{"num":4,"marks":15,"title":"Data Compression Algorithms and Greedy Algorithms","lectures":["L08","L07"],"context":"<p><b>Compression.<\/b> A traffic sensor reports one of six events A–F. In a 90-event log the counts are:<\/p><table class=\"grid num\"><thead><tr><th>event<\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><th>E<\/th><th>F<\/th><\/tr><\/thead><tbody><tr><td>count<\/td><td>12<\/td><td>36<\/td><td>6<\/td><td>17<\/td><td>11<\/td><td>8<\/td><\/tr><\/tbody><\/table><p><b>Greedy.<\/b> The weighted undirected graph below is used in parts (e) and (f).<\/p>","parts":[{"label":"a","marks":1,"tier":1,"minutes":2,"archetype":"D11","pattern":["FM-C.1"],"lecture":"L08","topic":"Fixed-length code size","block":"compression","stem":"<p>How many bits per event does a fixed-length code need for these six events, and how many bits for the whole 90-event log?<\/p>","solution":{"html":"<p>⌈log<sub>2<\/sub> 6⌉ = ⌈2.585⌉ = <b>3 bits<\/b> per event (2 bits give only 4 codewords). Whole log: 3 × 90 = <b>270 bits<\/b>.<\/p>","figures":[]},"rubric":[{"text":"⌈log₂ 6⌉ = 3 bits per event (rounded up).","marks":0.5},{"text":"3 × 90 = 270 bits.","marks":0.5}],"mistakes":[{"text":"Uses log₂ 6 = 2.585 without rounding up → 232.7 bits: a codeword has a whole number of bits.","trap":"T10"},{"text":"Uses 8-bit ASCII → 720 bits: fixed-length, but not the shortest fixed-length code for six symbols.","trap":null}],"source":"Lecture08.ppt, slides 9–13","check":{"algo":"fixed","n":6,"N":90,"expect":{"bits":3,"total":270}},"procs":[],"rows":[],"data":null,"figure":null,"id":"p1-q4a","cover":["fixed-length"]},{"label":"b","marks":3,"tier":2,"minutes":6,"archetype":"D1","pattern":["FM-C.2","FM-C.3"],"lecture":"L08","topic":"Huffman code and total bits","block":"compression","procs":["HUFFMAN"],"stem":"<p>Construct the codeword for each event using the Huffman algorithm HUFFMAN(C) given at the end of the paper. The first EXTRACT-MIN of each step becomes the left child, labelled 0. Show the forest after every merge. How many bits are needed for the log?<\/p>","solution":{"html":"<p>Merges (two smallest frequencies each time): 6 + 8 = 14, 11 + 12 = 23, 14 + 17 = 31, 23 + 31 = 54, 36 + 54 = 90.<\/p><div class=\"figrow\"><figure class=\"fig\"><svg class=\"dg\" viewBox=\"0 0 472 84\" style=\"min-width:472px;max-width:519px\" role=\"img\" aria-label=\"(a)\" xmlns=\"http://www.w3.org/2000/svg\"><text class=\"ttl\" x=\"236.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"central\">(a)<\/text><rect class=\"leaf\" x=\"22.0\" y=\"41.0\" width=\"36.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"40.0\" y=\"54.0\" text-anchor=\"middle\" dominant-baseline=\"central\">C:6<\/text><rect class=\"leaf\" x=\"94.0\" y=\"41.0\" width=\"36.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"112.0\" y=\"54.0\" text-anchor=\"middle\" dominant-baseline=\"central\">F:8<\/text><rect class=\"leaf\" x=\"162.0\" y=\"41.0\" width=\"44.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"184.0\" y=\"54.0\" text-anchor=\"middle\" dominant-baseline=\"central\">E:11<\/text><rect class=\"leaf\" x=\"234.0\" y=\"41.0\" width=\"44.0\" height=\"26\" rx=\"5\"/><text class=\"lbl\" x=\"256.0\" y=\"54.0\" tex
