<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CN Final Mock v2</title>
<script>
/* apply a saved theme before first paint, so the page never flashes the wrong colours */
try {
    var savedTheme = localStorage.getItem("cn-theme");
    if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", savedTheme);
    }
} catch (e) { /* storage blocked: follow the device setting */ }
</script>
<style>
:root {
    color-scheme: light;
    --bg: #FAF7F0; --card: #FFFDF8; --heading: #7A1E2C; --primary: #2B3A55; --border: #E3DCCB;
    --text: #1F1F1F; --code-bg: #F1ECE1; --code-text: #2B2B2B; --correct: #2E7D32; --wrong: #B3261E;
    --partial: #B7791F; --on-primary: #FFFFFF; --correct-text: #276E2B; --partial-text: #8A5A12;
    --muted: rgba(31, 31, 31, 0.68); --correct-tint: #E6EEE0; --wrong-tint: #F6E3DE; --partial-tint: #F6EDDE;
    --primary-tint: #E6E6E4;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #1B1814; --card: #24201B; --heading: #E39AA5; --primary: #A9BCE0; --border: #3A342C;
        --text: #ECE6DA; --code-bg: #2B2620; --code-text: #E8E1D3; --correct: #7CC47F; --wrong: #F08A80;
        --partial: #E3B25A; --on-primary: #1B1814; --correct-text: #7CC47F; --partial-text: #E3B25A;
        --muted: rgba(236, 230, 218, 0.68); --correct-tint: #323A2B; --wrong-tint: #45312B; --partial-tint: #433725;
        --primary-tint: #39393B;
    }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1B1814; --card: #24201B; --heading: #E39AA5; --primary: #A9BCE0; --border: #3A342C;
    --text: #ECE6DA; --code-bg: #2B2620; --code-text: #E8E1D3; --correct: #7CC47F; --wrong: #F08A80;
    --partial: #E3B25A; --on-primary: #1B1814; --correct-text: #7CC47F; --partial-text: #E3B25A;
    --muted: rgba(236, 230, 218, 0.68); --correct-tint: #323A2B; --wrong-tint: #45312B; --partial-tint: #433725;
    --primary-tint: #39393B;
}

:root {
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", "Courier New", monospace;
}
* { box-sizing: border-box; }
html { overflow-x: hidden; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 var(--sans);
    overflow-x: hidden;
}
button { font-family: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
code.inline {
    font: 0.88em var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
}

/* ---------- top bar ---------- */
.topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--border);
}
.brand { font: 700 1rem var(--serif); color: var(--heading); white-space: nowrap; }
.where { flex: 1; font: 600 0.9rem var(--sans); color: var(--primary); min-width: 0; }
.tools { display: flex; align-items: center; gap: 10px; }
.pill {
    font: 600 0.82rem var(--sans); color: var(--primary); background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; white-space: nowrap;
}
.timer {
    font: 700 1rem var(--mono); color: var(--primary); min-width: 92px; text-align: right;
    white-space: nowrap;
}
.timer.low { color: var(--partial-text); }
.timer.over { color: var(--wrong); }

/* ---------- banners ---------- */
.banner {
    position: sticky; top: 57px; z-index: 19;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 20px; font-weight: 600; border-bottom: 1px solid var(--border);
}
.banner.warn { background: var(--partial-tint); color: var(--partial-text); }
.banner.over { background: var(--wrong-tint); color: var(--wrong); }
.banner.info { background: var(--primary-tint); color: var(--primary); }

/* ---------- buttons ---------- */
.btn {
    font: 600 0.92rem var(--sans); color: var(--on-primary); background: var(--primary);
    border: 1px solid var(--primary); border-radius: 8px; padding: 0 16px;
    min-height: 40px; cursor: pointer;
}
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.secondary { background: var(--card); color: var(--primary); }
.btn.danger { background: var(--card); color: var(--wrong); border-color: var(--wrong); }
.btn-small {
    font: 600 0.8rem var(--sans); color: var(--primary); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; padding: 0 10px;
    min-height: 32px; cursor: pointer;
}
.btn-small:hover, .btn.secondary:hover { border-color: var(--primary); }
.btn-small.on { background: var(--heading); color: var(--on-primary); border-color: var(--heading); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }

/* ---------- layout ---------- */
.shell {
    display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px;
    max-width: 1280px; margin: 0 auto; padding: 20px;
}
.side {
    position: sticky; top: 76px; align-self: start;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    max-height: calc(100vh - 96px); overflow: auto;
}
.side h3 { font: 700 0.78rem var(--sans); color: var(--heading); text-transform: uppercase;
    letter-spacing: 0.05em; margin: 12px 0 6px; }
.side h3:first-child { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.grid.wide { grid-template-columns: repeat(5, 1fr); }
.navbtn {
    position: relative; height: 30px; border-radius: 6px; cursor: pointer; padding: 0;
    font: 700 0.74rem var(--sans); color: var(--primary);
    background: var(--card); border: 1.5px solid var(--border);
}
.navbtn:hover { border-color: var(--primary); }
.navbtn.answered { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.navbtn.correct { background: var(--correct-tint); color: var(--correct-text); border-color: var(--correct); }
.navbtn.partial { background: var(--partial-tint); color: var(--partial-text); border-color: var(--partial); }
.navbtn.wrong { background: var(--wrong-tint); color: var(--wrong); border-color: var(--wrong); }
.navbtn.flagged { border-color: var(--heading); border-width: 2.5px; }
.navbtn .flag { position: absolute; top: -8px; right: -4px; font-size: 0.7rem; color: var(--heading); }
.navbtn .mark { position: absolute; bottom: -2px; right: 2px; font-size: 0.6rem; }
.navbtn.current { box-shadow: 0 0 0 2px var(--primary-tint), 0 0 0 3.5px var(--primary); }
.navbtn:disabled { opacity: 0.3; cursor: default; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.78rem; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-block; width: 14px; height: 14px; border-radius: 4px;
    vertical-align: -2px; margin-right: 6px; border: 1.5px solid var(--border); }
.legend .l-ans { background: var(--primary); border-color: var(--primary); }
.legend .l-flag { border: 2.5px solid var(--heading); }
.legend .l-ok { background: var(--correct-tint); border-color: var(--correct); }
.legend .l-part { background: var(--partial-tint); border-color: var(--partial); }
.legend .l-bad { background: var(--wrong-tint); border-color: var(--wrong); }
.side label.toggle { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; margin-top: 12px; cursor: pointer; }
.side .actions { display: grid; gap: 8px; margin-top: 14px; }

/* ---------- question card ---------- */
.q {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 26px 26px;
}
.qtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.badge {
    font: 600 0.75rem/1 var(--sans); padding: 5px 8px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--primary); background: var(--bg);
}
.badge.sec { color: var(--heading); border-color: var(--heading); }
.badge.marks { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.qhead { font: 700 1.25rem/1.3 var(--serif); color: var(--heading); margin: 2px 0 10px; }
.qhead small { font: 600 0.85rem var(--sans); color: var(--primary); margin-left: 8px; }
.stem { font-family: var(--serif); font-size: 1.05rem; }
.stem p { margin: 0 0 10px; }
.stem ul { margin: 0 0 10px; padding-left: 22px; }
.stem li { margin-bottom: 4px; }
.lead { font-style: italic; color: var(--primary); }
.instr { font: 600 0.85rem var(--sans); color: var(--primary); margin: 14px 0 8px; }
.label-sm {
    font: 700 0.78rem var(--sans); color: var(--primary); text-transform: uppercase;
    letter-spacing: 0.04em; margin-top: 16px;
}
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 16px 0 40px; }

/* ---------- code ---------- */
figure.code {
    margin: 12px 0; border: 1px solid var(--border); border-radius: 8px;
    background: var(--code-bg); overflow: hidden;
}
figure.code figcaption {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font: 600 0.8rem var(--sans); color: var(--primary);
    padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--border);
}
figure.code pre {
    margin: 0; padding: 10px 0; overflow-x: auto;
    font: 0.86rem/1.55 var(--mono); color: var(--code-text); tab-size: 4;
}
figure.code code { display: block; min-width: max-content; }
.cl { display: block; white-space: pre; padding-right: 16px; }
.ln {
    display: inline-block; width: 4ch; padding-right: 1ch; margin-right: 1.2ch;
    text-align: right; color: var(--muted); border-right: 1px solid var(--border);
    user-select: none; -webkit-user-select: none;
}
.nonum .cl { padding-left: 14px; }

/* ---------- figures ---------- */
figure.diagram {
    margin: 12px 0; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); padding: 10px; overflow-x: auto;
}
figure.diagram figcaption { font: 600 0.8rem var(--sans); color: var(--muted); margin-top: 4px; text-align: center; }
figure.diagram svg.net { display: block; width: 100%; min-width: 600px; height: auto; margin: 0 auto; }
.net text { font-family: Arial, Helvetica, "Liberation Sans", sans-serif; font-size: 13px; fill: var(--text); }
.net .ln { stroke: var(--text); stroke-width: 1.5; fill: none; }
.net .ln.dash { stroke-dasharray: 5 4; }
.net .ln.tl { stroke-width: 1.4; }
.net .ln-p { stroke: var(--primary); stroke-width: 1.8; fill: none; }
.net .ln-x { stroke: var(--wrong); stroke-width: 2.4; }
.net .grid { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
.net .wave { stroke: var(--primary); stroke-width: 2.6; fill: none; stroke-linejoin: miter; }
.net .ah { fill: var(--text); }
.net .ah-p { fill: var(--primary); }
.net .box { fill: var(--card); stroke: var(--text); stroke-width: 1.3; }
.net .range { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 7 5; }
.net .ic { fill: var(--card); stroke: var(--text); stroke-width: 1.4; }
.net .ic-screen { fill: var(--primary-tint); stroke: var(--text); stroke-width: 1; }
.net .ic-line { stroke: var(--text); stroke-width: 1.4; fill: none; }
.net .ic-arrow { stroke: var(--primary); stroke-width: 1.8; }
.net .ic-ah { fill: var(--primary); }
.net .ic-dot { fill: var(--text); }
.net .ic-wave { fill: none; stroke: var(--primary); stroke-width: 1.4; }


/* ---------- options ---------- */
.opts { display: grid; gap: 8px; margin: 6px 0 12px; }
.opt {
    display: flex; gap: 12px; align-items: flex-start;
    min-height: 44px; padding: 10px 12px; cursor: pointer;
    border: 1.5px solid var(--border); border-radius: 10px; background: var(--card);
    font-family: var(--serif); font-size: 1rem;
}
.opt:hover { border-color: var(--primary); }
.opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
.opt .key { font: 700 0.75rem var(--sans); color: var(--muted); min-width: 1.2em; margin-top: 3px; }
.opt .otext { flex: 1; min-width: 0; }
.opt .mono { font: 0.92rem/1.5 var(--mono); }
.opt.sel { border-color: var(--primary); background: var(--primary-tint); }
.opt.locked { cursor: default; }
.opt.locked:hover { border-color: var(--border); }
.opt .fb { display: block; font: 600 0.8rem var(--sans); margin-top: 4px; }
.opt.ok, .opt.ok:hover { border-color: var(--correct); background: var(--correct-tint); }
.opt.ok .fb { color: var(--correct-text); }
.opt.bad, .opt.bad:hover { border-color: var(--wrong); background: var(--wrong-tint); }
.opt.bad .fb { color: var(--wrong); }
.opt.miss, .opt.miss:hover { border-color: var(--partial); background: var(--partial-tint); border-style: dashed; }
.opt.miss .fb { color: var(--partial-text); }
.opt.neutral .fb { color: var(--muted); }
.warn3 {
    border-left: 4px solid var(--partial); background: var(--partial-tint); color: var(--partial-text);
    border-radius: 6px; padding: 8px 12px; margin: 4px 0 10px; font: 600 0.88rem var(--sans);
}
pre.out {
    font: 0.86rem/1.5 var(--mono); color: var(--code-text); background: var(--code-bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; margin: 4px 0 10px; overflow-x: auto;
}
.ptier { font: 600 0.75rem var(--sans); color: var(--muted); margin-left: 8px; }

/* ---------- verdict / explanation ---------- */
.verdict {
    border-left: 5px solid; border-radius: 8px; padding: 10px 14px; margin: 14px 0 10px;
    font-weight: 600;
}
.verdict .vlabel { font-size: 1.05rem; margin-right: 8px; }
.verdict .vdetail { display: block; font-weight: 500; font-size: 0.9rem; margin-top: 2px; color: var(--text); }
.verdict.correct { border-color: var(--correct); background: var(--correct-tint); color: var(--correct-text); }
.verdict.partial { border-color: var(--partial); background: var(--partial-tint); color: var(--partial-text); }
.verdict.wrong { border-color: var(--wrong); background: var(--wrong-tint); color: var(--wrong); }
details.expl {
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
    padding: 0 16px; margin-top: 8px;
}
details.expl > summary {
    cursor: pointer; font: 700 0.95rem var(--sans); color: var(--heading);
    min-height: 44px; display: flex; align-items: center;
}
details.expl h4 { font: 700 0.8rem var(--sans); color: var(--primary); margin: 14px 0 4px;
    text-transform: uppercase; letter-spacing: 0.04em; }
details.expl p, details.expl li { font-size: 0.95rem; }
details.expl ul { padding-left: 20px; margin: 4px 0 10px; }
details.expl li { margin-bottom: 6px; }
.src { font-size: 0.85rem; color: var(--muted); margin: 10px 0 14px; }
.tablewrap { overflow-x: auto; }
table.trace { border-collapse: collapse; width: 100%; font-size: 0.88rem; margin: 6px 0 10px; }
table.trace th, table.trace td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
table.trace th { background: var(--code-bg); color: var(--primary); }
table.trace code { font: 0.92em var(--mono); }
.stem table.trace { font-family: var(--sans); font-size: 0.9rem; }

/* ---------- written answers ---------- */
.part { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px; }
.part-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.part-head .plabel { font: 700 1.05rem var(--serif); color: var(--heading); }
.part-head .pmarks { font: 600 0.85rem var(--sans); color: var(--primary); white-space: nowrap; }
.part .pprompt { font-family: var(--serif); margin: 4px 0 8px; }
.part .pprompt p { margin: 0 0 8px; }
.part .pprompt ul { margin: 0 0 8px; padding-left: 22px; }
textarea.ans {
    width: 100%; min-height: 170px; resize: vertical; display: block;
    font: 0.88rem/1.5 var(--mono); color: var(--code-text); tab-size: 4;
    background: var(--code-bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px;
}
textarea.ans.code { min-height: 260px; }
textarea.ans:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
textarea.ans[readonly] { opacity: 0.85; }
.counter { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
table.fields { border-collapse: collapse; width: 100%; font-size: 0.92rem; margin: 6px 0 12px; }
table.fields th, table.fields td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: middle; }
table.fields th { background: var(--code-bg); color: var(--primary); font: 700 0.82rem var(--sans); }
input.fld {
    font: 0.9rem var(--mono); color: var(--code-text); background: var(--code-bg);
    border: 1.5px solid var(--border); border-radius: 6px; padding: 5px 8px; max-width: 100%;
}
input.fld:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
input.fld[readonly] { opacity: 0.9; }
td.fok { background: var(--correct-tint); }
td.fbad { background: var(--wrong-tint); }
.fmark { display: inline-block; font: 700 0.85rem var(--sans); margin-left: 6px; }
td.fok .fmark { color: var(--correct-text); }
td.fbad .fmark { color: var(--wrong); }
.facc { display: block; font: 0.78rem var(--sans); color: var(--muted); margin-top: 3px; }
.fover { font: 600 0.72rem var(--sans); margin-left: 4px; min-height: 22px; padding: 0 6px; }
.rubric { list-style: none; padding: 0; margin: 6px 0 10px; display: grid; gap: 6px; }
.rubric li {
    display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card);
}
.rubric li.on { border-color: var(--correct); background: var(--correct-tint); }
.rubric input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--correct); flex: none; }
.rubric .rtext { flex: 1; font-size: 0.93rem; }
.rubric .rmarks { font: 600 0.82rem var(--sans); white-space: nowrap; color: var(--primary); }
.tag {
    display: inline-block; font: 700 0.68rem/1 var(--sans); text-transform: uppercase;
    letter-spacing: 0.05em; padding: 3px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px;
}
.tag.auto { background: var(--primary); color: var(--on-primary); }
.tag.manual { background: var(--code-bg); color: var(--primary); border: 1px solid var(--border); }
.tag.edited { background: var(--heading); color: var(--on-primary); }
.qtotal {
    margin-top: 20px; padding: 10px 14px; border-radius: 8px; background: var(--code-bg);
    font: 600 0.95rem var(--sans); color: var(--primary);
}

/* ---------- cover & results ---------- */
.page { max-width: 920px; margin: 0 auto; padding: 28px 20px 60px; }
.cover-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 30px 34px;
}
.cover-head { text-align: center; border-bottom: 2px solid var(--heading); padding-bottom: 18px; margin-bottom: 18px; }
.cover-head .inst { font: 600 0.9rem var(--sans); letter-spacing: 0.05em; color: var(--primary); }
.cover-head h1 { font: 700 1.9rem/1.25 var(--serif); color: var(--heading); margin: 8px 0 4px; }
.cover-head .meta { color: var(--muted); }
.cover-card h2 { font: 700 1.05rem var(--serif); color: var(--heading); margin: 20px 0 6px; }
.cover-card ul { margin: 0; padding-left: 22px; }
.cover-card li { margin-bottom: 4px; }
table.plain { border-collapse: collapse; width: 100%; font-size: 0.92rem; margin: 6px 0; }
table.plain th, table.plain td { border-bottom: 1px solid var(--border); padding: 7px 8px; text-align: left; }
table.plain th { color: var(--primary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
table.plain td.num, table.plain th.num { text-align: right; font-variant-numeric: tabular-nums; }
.bigscore { text-align: center; margin: 6px 0 18px; }
.bigscore .val { font: 700 3rem/1.1 var(--serif); color: var(--heading); }
.bigscore .sub { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
.stat { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.stat .k { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.stat .v { font: 700 1.3rem var(--serif); color: var(--primary); }
.missed { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 6px; }
.missed a {
    display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); text-decoration: none;
}
.missed a:hover { border-color: var(--primary); }
.missed .sc { font-weight: 700; white-space: nowrap; }
.bar-mini { height: 8px; border-radius: 4px; background: var(--code-bg); overflow: hidden; min-width: 80px; }
.bar-mini > div { height: 100%; background: var(--primary); }
#selftest { display: none; white-space: pre-wrap; font: 0.8rem var(--mono); background: var(--card);
    border: 2px solid var(--heading); padding: 10px; border-radius: 8px; margin: 16px auto; max-width: 1200px; }
</style>
</head>

  ],
  "explanation": {
   "verdict": "The two correct options: “Each now picks K from 0 to 3, then waits K × 512 bit times” and “Picking the same K again is now less likely than after 1 collision”. Idea: binary exponential backoff doubles the range of random waits after each collision.",
   "reasoning": "<p>After a collision both hosts abort, send a jam signal and back off. After the mth collision each picks K at random from {0, 1, …, 2^m − 1} and waits K × 512 bit times before sensing the channel again. After the 2nd collision the range is {0, 1, 2, 3}. If both pick the same K they are likely to collide again, but because the range keeps growing with m, that becomes less likely with every collision.<\/p>",
   "source": "04-LANs, slides 4-14 to 4-16"
  }
 },

  "stem": "<p>Switches X and Y in the figure start with empty MAC address tables and follow the lecture's learning and\nforwarding rules. These events happen in order:<\/p>\n<ol><li>frame 1: P → T<\/li><li>frame 2: T → P<\/li><li>P is unplugged from X port 1 and plugged into Y port 4<\/li>\n<li>frame 3: P → U<\/li><li>frame 4: U → P<\/li><\/ol>\n<p>Which TWO statements are correct?<\/p>",

  "stemAfter": null,
  "options": [
   {

    "correct": true,
    "note": "True. X receives frame 3 from Y on port 4. P is already in X's table but on a different port, so X updates the entry to port 4."

    "note": "False. The forwarding decision uses the destination (P), which Y learned on port 1 from frame 1, so Y forwards selectively. T, the source, is simply learned."

    "text": "Frame 1 is forwarded by X out of port 4, toward T",
    "correct": false,
    "note": "False. The tables start empty, so X has no entry for T and floods frame 1 out of ports 2, 3 and 4. This forgets the flooding rule."
   },

  "explanation": {
   "verdict": "The two correct options: “After frame 3, switch X's table lists P on port 4” and “Frame 3 is flooded by both X and Y, so R gets a copy”. Idea: a switch learns from the source address, updates an entry when a host appears on a new port, and floods unknown destinations.",
   "reasoning": "<div class=\"tablewrap\"><table class=\"trace\"><tr><th>Frame<\/th><th>X: learns / decision<\/th><th>Y: learns / decision<\/th><\/tr><tr><td>1 P→T<\/td><td>P on 1 · flood 2, 3, 4<\/td><td>P on 1 · flood 2, 3, 4<\/td><\/tr><tr><td>2 T→P<\/td><td>T on 4 · forward to 1<\/td><td>T on 2 · forward to 1<\/td><\/tr><tr><td>(P moves to Y port 4)<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>3 P→U<\/td><td>P updated to 4 · flood 1, 2, 3<\/td><td>P updated to 4 · flood 1, 2, 3<\/td><\/tr><tr><td>4 U→P<\/td><td>(not reached)<\/td><td>U on 3 · forward to 4<\/td><\/tr><\/table><\/div><p>Rule 2 of the lecture's algorithm (address known but on a different port: update the entry) is what keeps the tables correct after P moves.<\/p>",
   "source": "04-LANs, slides 4-28, 4-29, 4-32"
  }

    "text": "A VLAN 20 host reaches VLAN 30 hosts via its default router",

   "verdict": "The two correct options: “An ARP request from a VLAN 20 host never reaches any VLAN 30 port” and “A VLAN 20 host reaches VLAN 30 hosts via its default router”. Idea: a VLAN is its own broadcast domain and IP subnet, so traffic between VLANs is routed.",
   "reasoning": "<p>Port-based VLANs make one switch operate as several virtual switches: frames, including broadcasts such as ARP requests, stay inside their VLAN, and MAC tables are kept per VLAN. Two hosts in different VLANs therefore cannot talk directly even on the same physical switch. Because each VLAN here is also its own IP subnet, a VLAN 20 host sends traffic for 10.30.0.0/24 to its default router, which routes it into VLAN 30.<\/p>",

  "stem": "<p>A frame from a host on a VLAN 30 access port crosses an 802.1Q trunk to a second switch and leaves through\nanother VLAN 30 access port to the destination host. Which TWO statements are NOT true?<\/p>",

  "options": [

    "text": "The CRC is not recomputed, as the payload has not changed",
    "correct": true,
    "note": "Not true, so it is an answer. Adding the tag changes the frame, so the CRC is recomputed (and again when the tag is removed)."

    "correct": false,
    "note": "This is true: 12 bits give 2¹² = 4096 values. Ticking it means mistaking the VLAN ID for the 3-bit priority field."

   {
    "text": "The receiving host gets the frame back with no tag on it",
    "correct": false,
    "note": "This is true: an access port transmits outgoing frames untagged. Ticking it means thinking hosts must understand tags."

  "explanation": {
   "verdict": "The two correct options: “On the trunk, the 4-byte tag sits ahead of both MAC addresses” and “The CRC is not recomputed, as the payload has not changed”. Idea: the tag goes after the source address and the CRC is recalculated.",
   "reasoning": "<p>Access ports send and receive untagged frames, because end devices are connected to them. A trunk port sends and receives tagged frames: the switch inserts a 4-byte 802.1Q tag (2-byte TPID and 2-byte TCI with 3-bit priority, 1-bit flag and 12-bit VLAN ID) after the source address. Because the frame's bytes change, the CRC is recomputed. The second switch removes the tag before sending the frame out of its access port.<\/p>",
   "source": "04-LANs, slides 4-42 to 4-44"
  }

    "text": "Wireless frames are too short for a collision to waste time",

    "note": "Not a reason, so it is an answer. The lecture never says this; collisions waste airtime, which is why 802.11 tries to avoid them."

    "note": "This is a reason the lecture gives (the hidden terminal problem), so it is not an answer."
   },
   {
    "text": "Fading means some collisions are never sensed by the sender",
    "correct": false,
    "note": "This is a reason the lecture gives: fading is listed with hidden terminals as a reason not all collisions can be sensed."
   }

  "explanation": {
   "verdict": "The two correct options: “Radios are full duplex, so frames cannot collide in the air” and “Wireless frames are too short for a collision to waste time”. Idea: 802.11 avoids collisions because it cannot reliably detect them.",
   "reasoning": "<p>The lecture lists why 802.11 has no collision detection: it is difficult to sense collisions while transmitting, because the station's own signal is strong and received signals are weak due to fading, and some collisions cannot be sensed at all (hidden terminal, fading). The goal is therefore to avoid collisions with CSMA/CA. Neither full-duplex radios nor 'harmless' short frames appear in that reasoning.<\/p>",
   "source": "04-LANs, slides 4-66, 4-67"
  }
 },
 {
  "id": "A17",
  "section": 1,

  "marks": 0.9,
  "tier": 2,
  "lecture": "L04",
  "lec2": null,
  "topic": "L04 LANs",
  "kind": "applied",
  "forms": [
   "calc"
  ],
  "stem": "<p>A 5 GHz Wi-Fi network uses slot time = 9 µs and SIFS = 16 µs. The lecture defines\nPIFS = SIFS + slot time and DIFS = SIFS + 2 × slot time. A station has just received a data frame correctly. Which TWO\nstatements are correct?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "Stations with new data wait 34 µs of idle medium first",
    "correct": true,
    "note": "True. DIFS = 16 + 2 × 9 = 34 µs is the minimum wait for stations contending to send a frame."
   },
   {
    "text": "The ACK starts 18 µs before any new data could start",
    "correct": true,
    "note": "True. The ACK goes after SIFS (16 µs); contending data must wait DIFS (34 µs): 34 − 16 = 18 µs earlier."
   },
   {
    "text": "Stations with new data wait 25 µs of idle medium first",
    "correct": false,
    "note": "False. 25 µs = SIFS + one slot, which is PIFS. Contending data frames wait DIFS, with two slots."
   },
   {
    "text": "The ACK waits DIFS too, so new data can grab the channel",
    "correct": false,
    "note": "False. Immediate responses such as ACK and CTS use SIFS, the shortest IFS, precisely so that no contending station can get in first."
   },
   {
    "text": "An AP's poll after PIFS loses to data waiting DIFS",
    "correct": false,
    "note": "False. PIFS (25 µs) is shorter than DIFS (34 µs), so a poll sent after PIFS wins. This reverses the ordering SIFS < PIFS < DIFS < EIFS."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “Stations with new data wait 34 µs of idle medium first” and “The ACK starts 18 µs before any new data could start”. Idea: shorter IFS means higher priority; ACKs use SIFS.",
   "reasoning": "<div class=\"tablewrap\"><table class=\"trace\"><tr><th>Step<\/th><th>What happens<\/th><th>Value<\/th><\/tr><tr><td>1<\/td><td>SIFS (given)<\/td><td>16 µs<\/td><\/tr><tr><td>2<\/td><td>PIFS = SIFS + slot<\/td><td>16 + 9 = 25 µs<\/td><\/tr><tr><td>3<\/td><td>DIFS = SIFS + 2 × slot<\/td><td>16 + 18 = 34 µs<\/td><\/tr><tr><td>4<\/td><td>ACK lead over contending data = DIFS − SIFS<\/td><td>18 µs<\/td><\/tr><\/table><\/div><p>802.11 uses the different IFS values as a priority scheme: SIFS &lt; PIFS &lt; DIFS &lt; EIFS. The receiver returns the ACK after only SIFS, so stations that must wait DIFS cannot start first.<\/p>",
   "source": "04-LANs, slides 4-64, 4-65, 4-67"
  }
 },

  "stem": "<p>In the figure, X wants to send a large frame to the AP, so it first sends an RTS and the AP replies with a CTS.\nZ cannot hear X. Which TWO statements are correct?<\/p>",

    "note": "True. RTS frames may still collide with each other, but they are short, so little airtime is wasted; the long data frame is protected."

    "note": "False. CTS is an immediate response and uses SIFS, the shortest IFS."

   {
    "text": "With RTS/CTS the ACK is dropped, since the CTS confirms the channel",
    "correct": false,
    "note": "False. The four-frame exchange is RTS, CTS, data, then ACK. The CTS reserves the channel; the ACK still confirms the data arrived."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “Z defers on hearing the AP's CTS, though it never heard the RTS” and “If X and Z sent RTS frames together, only short frames would be lost”. Idea: the receiver's CTS reaches hidden stations, and only short frames are at risk.",
   "reasoning": "<p>X and Z are hidden from each other: both are in range of the AP but not of each other, so carrier sensing alone cannot stop them colliding at the AP. With RTS/CTS the sender reserves the channel with a short RTS; the receiver answers with a CTS that every station near the receiver hears, including Z, which then defers. RTSs can still collide, but they are short. The exchange is RTS, CTS, data and ACK, with the responses sent after SIFS.<\/p>",

  "forms": [
   "fig"
  ],
  "stem": "<p>Laptop L in BSS 1 sends a data frame to laptop M in BSS 2. It travels from L to AP1, across the wired\ndistribution system, and from AP2 to M. Which TWO statements about the 802.11 address fields are correct?<\/p>",
  "svg": "q_ds",
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "On L's hop, Address 1 holds AP1's MAC, Address 3 holds M's",
    "correct": true,
    "note": "True. L → AP1 is To DS = 1, From DS = 0: Address 1 is the receiving AP (the next device), Address 2 the source L, Address 3 the final destination M."
   },
   {
    "text": "On AP2's hop, Address 2 holds AP2's MAC, Address 3 holds L's",
    "correct": true,
    "note": "True. AP2 → M is To DS = 0, From DS = 1: Address 1 is M, Address 2 the sending AP (the previous device), Address 3 the original source L."
   },
   {
    "text": "On L's hop, Address 1 holds M's MAC, as M is the destination",
    "correct": false,
    "note": "False. Address 1 is always the next device the frame will visit, which is AP1, not the final destination."
   },
   {
    "text": "On AP2's hop, Address 2 holds L's MAC, the original source",
    "correct": false,
    "note": "False. Address 2 is always the device the frame has just left, which is AP2. L's address goes in Address 3."
   },
   {
    "text": "On L's hop, Address 4 holds L's MAC, as the frame enters a DS",
    "correct": false,
    "note": "False. Address 4 is used only when the distribution system itself is wireless (To DS = 1 and From DS = 1). Here the DS is wired."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “On L's hop, Address 1 holds AP1's MAC, Address 3 holds M's” and “On AP2's hop, Address 2 holds AP2's MAC, Address 3 holds L's”. Idea: Address 1 = next device, Address 2 = previous device, Address 3 = the end not covered by 1 or 2.",
   "reasoning": "<div class=\"tablewrap\"><table class=\"trace\"><tr><th>Hop<\/th><th>To DS / From DS<\/th><th>Address 1<\/th><th>Address 2<\/th><th>Address 3<\/th><\/tr><tr><td>L → AP1<\/td><td>1 / 0<\/td><td>AP1 (receiving AP)<\/td><td>L (source)<\/td><td>M (destination)<\/td><\/tr><tr><td>AP2 → M<\/td><td>0 / 1<\/td><td>M (destination)<\/td><td>AP2 (sending AP)<\/td><td>L (source)<\/td><\/tr><\/table><\/div><p>Between AP1 and AP2 the frame crosses the wired distribution system as an ordinary Ethernet frame.<\/p>",
   "source": "04-LANs, slides 4-74, 4-77 to 4-80"
  }
 },

  "stem": "<p>A phone enters a building served by several access points, some with SSID \"Staff\" and some with SSID \"Guest\".\nWhich TWO statements about how it can find an AP are correct?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "Passive scanning learns SSID and BSSID without transmitting",
    "correct": true,
    "note": "True. In passive scanning the phone just listens to beacon frames, which carry the SSID and the AP's MAC address (BSSID)."
   },
   {
    "text": "A null probe request draws a probe response from every AP",
    "correct": true,
    "note": "True. A null probe request names no SSID, so all APs receiving it respond."
   },
   {
    "text": "Active scanning works only after the phone has associated",
    "correct": false,
    "note": "False. Scanning (passive or active) comes before authentication and association; it is how the phone chooses an AP."
   },
   {
    "text": "APs send beacons in reply to a station's probe requests",
    "correct": false,
    "note": "False. APs broadcast beacons on their own, about every 102.4 ms. Probe responses are the replies to probe requests."
   },
   {
    "text": "A directed probe request draws replies from APs of any SSID",
    "correct": false,
    "note": "False. A directed probe request names an SSID, and only APs of that SSID respond."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “Passive scanning learns SSID and BSSID without transmitting” and “A null probe request draws a probe response from every AP”. Idea: passive scanning listens to beacons; active scanning sends probes (null or directed).",
   "reasoning": "<p>Before joining, a station must find an AP. In passive scanning it listens for the beacons each AP broadcasts (SSID, BSSID and more), then sends an association request to the chosen AP. In active scanning it broadcasts a probe request: a null probe (no SSID) gets a probe response from every AP that hears it, while a directed probe (for example for \"Staff\") gets responses only from APs of that SSID.<\/p>",
   "source": "04-LANs, slides 4-85, 4-86, 4-89, 4-90"
  }
 },

  "stem": "<p>A laptop has completed Open System authentication and association with a WPA2-Personal (PSK) access point,\nbut RSN authentication has not finished yet. Which TWO statements are NOT true?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "Its passphrase was already verified when it reached state 2",
    "correct": true,
    "note": "Not true, so it is an answer. State 2 is reached through Open System authentication, which performs no client verification; it is a null authentication, essentially an exchange of hellos."
   },
   {
    "text": "It can now send a DHCP Discover and lease an IP address",
    "correct": true,
    "note": "Not true, so it is an answer. With RSN, a client in state 3 has not yet joined the BSS; only without RSN could it move beyond layer 2 and request an IP address."
   },
   {
    "text": "It is in state 3: authenticated and associated, RSN pending",
    "correct": false,
    "note": "This is true (state 3), so it is not an answer. Ticking it means confusing state 3 with state 2 (authenticated, not associated)."
   },
   {
    "text": "Its pairwise master key comes from the PSK it shares with the AP",
    "correct": false,
    "note": "This is true: the PMK is a by-product of PSK, SAE or 802.1X authentication. Ticking it means thinking the PMK is chosen at random by the AP."
   },
   {
    "text": "The 4-way handshake will give it a unicast encryption key, the PTK",
    "correct": false,
    "note": "This is true: the 4-way handshake, seeded by the PMK, creates the dynamic keys, including the PTK. Ticking it means confusing it with the RTS/CTS four-frame exchange."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “Its passphrase was already verified when it reached state 2” and “It can now send a DHCP Discover and lease an IP address”. Idea: with RSN, state 3 is not yet network access; the passphrase-based keys come from the PSK and the 4-way handshake.",
   "reasoning": "<p>The client state machine runs: state 1 (unauthenticated, unassociated), state 2 (authenticated), state 3 (authenticated and associated, RSN authentication pending) and state 4. Open System authentication checks nothing. With WPA2-Personal, the passphrase and SSID give the PSK, the PSK gives the PMK, and the PMK seeds the 4-way handshake that creates the PTK and delivers the GTK. Only then can the client use the network, for example to send a DHCP Discover.<\/p>",
   "source": "04-LANs, slides 4-83, 4-91, 4-95, 4-98, 4-100 · 05-IP, slide 5-65"
  },
  "topic2": "L05 IPv4"
 },

  "forms": [],
  "stem": "<p>A café runs WPA2-Personal (PSK) with its passphrase printed on the menu. A university wants every student to\nlog in to Wi-Fi with their own username and password. Which TWO statements are correct?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "SAE would protect the café's passphrase from dictionary attacks",
    "correct": true,
    "note": "True. The SAE exchange protects the passphrase from brute-force dictionary attacks, and the passphrase is never sent between the stations."
   },
   {
    "text": "With 802.1X, only EAP traffic gets through until the user is approved",
    "correct": true,
    "note": "True. The authenticator (AP) lets EAP traffic through its uncontrolled port and blocks everything else until the authentication server approves the supplicant."
   },
   {
    "text": "With SAE, the passphrase is sent to the AP encrypted in the commit",
    "correct": false,
    "note": "False. With SAE the passphrase is never sent between 802.11 stations; the commit and confirm messages are exchanged instead."
   },
   {
    "text": "With 802.1X, the AP itself stores and checks every user's password",
    "correct": false,
    "note": "False. The AP is the authenticator; an authentication server (normally RADIUS, perhaps using an LDAP database) validates the credentials."
   },
   {
    "text": "With PSK, each customer has a different key of their own",
    "correct": false,
    "note": "False. With PSK the passphrase used on the client and the AP must match, so everyone shares the same passphrase."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “SAE would protect the café's passphrase from dictionary attacks” and “With 802.1X, only EAP traffic gets through until the user is approved”. Idea: SAE hardens a shared passphrase; 802.1X/EAP authenticates each user through a server.",
   "reasoning": "<p>PSK (WPA/WPA2-Personal) derives the key from a passphrase that every user shares, which suits small offices and homes. SAE (WPA3-Personal) still uses a passphrase but never sends it, and its exchange protects the passphrase from brute-force dictionary attacks. For per-user logins, 802.1X/EAP is used: the supplicant presents its credentials, the authenticator blocks all non-EAP traffic, and the authentication server checks the credentials and tells the authenticator to open the controlled port.<\/p>",
   "source": "04-LANs, slides 4-99 to 4-105"
  }
 },
 {
  "id": "A23",

  "stem": "<p>After 802.1X/EAP authentication succeeds, a station and its access point run the 4-way handshake. Which TWO\nstatements are correct?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "Both ends derive the PTK independently; it never crosses the air",
    "correct": true,
    "note": "True. The lecture notes that the PTK is derived independently by both entities."
   },
   {
    "text": "The AP sends the GTK to the station, encrypted with the PTK",
    "correct": true,
    "note": "True. The GTK is derived by the authenticator and sent to the supplicant encrypted using the PTK."
   },
   {
    "text": "The PMK itself is transmitted to the station during the handshake",
    "correct": false,
    "note": "False. The PMK is the seeding material both ends already hold after authentication; it is not sent in the handshake."
   },
   {
    "text": "It is the RTS, CTS, data and ACK exchange used to reserve the air",
    "correct": false,
    "note": "False. That is the four-frame exchange used in DCF; the lecture warns not to confuse it with the 4-way handshake."
   },
   {
    "text": "Afterwards, beacons and other management frames are encrypted",
    "correct": false,
    "note": "False. Data from the upper layers is encrypted; management and control frames are usually not encrypted."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “Both ends derive the PTK independently; it never crosses the air” and “The AP sends the GTK to the station, encrypted with the PTK”. Idea: the 4-way handshake turns the PMK into per-session keys without sending them in the clear.",
   "reasoning": "<p>Every RSN method (PSK, SAE or 802.1X/EAP) ends with a PMK on both sides. The 4-way handshake uses it to create dynamic encryption keys: the pairwise transient key (PTK), which each side computes for itself, and the group temporal key (GTK), which the authenticator creates and sends encrypted with the PTK. These symmetric keys then encrypt the frame body of data frames; management and control frames are usually left unencrypted.<\/p>",
   "source": "04-LANs, slides 4-96 to 4-98, 4-106"
  }
 },

  "stem": "<p>A router forwards a datagram and has to split it into three fragments. Which TWO header fields does the router\nNOT change in any of the three fragments, compared with the datagram it received?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "Identification, so the receiver can group the pieces",
    "correct": true,
    "note": "Unchanged, so it is an answer. Every fragment carries the original datagram's ID, which (with the addresses and protocol) lets the destination match the pieces."
   },
   {
    "text": "Protocol, so the reassembled data reaches TCP or UDP",
    "correct": true,
    "note": "Unchanged, so it is an answer. The upper-layer protocol of the payload is the same in every piece."
   },
   {
    "text": "Total Length, which still describes the whole datagram",
    "correct": false,
    "note": "Changed, so not an answer. Each fragment is an independent datagram, and its Total Length is its own header plus its own data."
   },
   {
    "text": "Header Checksum, since only the payload was cut up",
    "correct": false,
    "note": "Changed, so not an answer. TTL, Total Length, MF and Fragment Offset differ from the original, so the checksum over the header must be recomputed."
   },
   {
    "text": "Fragment Offset, which each piece copies from the original",
    "correct": false,
    "note": "Changed, so not an answer. The offset gives each piece's position in the original (first byte ÷ 8), so it differs from piece to piece."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “Identification, so the receiver can group the pieces” and “Protocol, so the reassembled data reaches TCP or UDP”. Idea: fields that identify the datagram stay; fields that describe each piece, or depend on them, change.",
   "reasoning": "<p>When a router fragments a datagram, each fragment becomes an independent datagram with its own header. The fields that say which datagram the piece belongs to and what it carries (Identification, source and destination address, Protocol) are copied unchanged. The fields that describe the piece itself change: Total Length, the MF flag (1 on all but the last piece), the Fragment Offset, and also TTL (decremented by the router). Because the header bytes change, the header checksum is recomputed.<\/p>",
   "source": "05-IP, slides 5-11 to 5-13, 5-16, 5-17"
  }
 },

  "stem": "<p>H runs traceroute to S along the path in the figure. Which TWO statements are correct?<\/p>",
  "svg": "q_trace",
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "The probes with TTL = 3 are discarded by R3, which reports back",
    "correct": true,
    "note": "True. R1 and R2 each decrement TTL by 1; R3 reduces it to 0, discards the probe and sends an ICMP TTL-expired message to H."
   },
   {
    "text": "Probes reaching S trigger ICMP port unreachable; H stops",
    "correct": true,
    "note": "True. The probes are UDP segments to an unused port, so S returns ICMP port unreachable, which is traceroute's stopping signal."
   },
   {
    "text": "Each router reports to H whenever it forwards a probe onward",
    "correct": false,
    "note": "False. A router sends an ICMP message only when it discards a probe because its TTL expired, not every time it forwards one."
   },
   {
    "text": "S answers with an echo reply, as the probes are echo requests",
    "correct": false,
    "note": "False. In the lecture, traceroute sends UDP segments; echo request and reply are what ping uses."
   },
   {
    "text": "The probes with TTL = 2 make it through to R3 before expiring",
    "correct": false,
    "note": "False. TTL 2 is decremented to 1 at R1 and to 0 at R2, so R2 discards them. This miscounts by one hop."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “The probes with TTL = 3 are discarded by R3, which reports back” and “Probes reaching S trigger ICMP port unreachable; H stops”. Idea: traceroute raises TTL one hop at a time and listens for ICMP replies.",
   "reasoning": "<p>Traceroute sends sets of UDP probes with TTL = 1, 2, 3, …. Each router decrements TTL; the router that takes it to 0 discards the datagram and returns ICMP type 11 code 0 (TTL expired), which tells H that router's address and the round-trip time. In the figure, TTL 1 reaches R1, TTL 2 R2 and TTL 3 R3. The set that reaches S is answered with ICMP port unreachable (type 3, code 3), and traceroute stops.<\/p>",
   "source": "05-IP, slides 5-12, 5-59 · 06-Routing, slide 6-3"
  },
  "topic2": "L06 Routing"
 },
 {
  "id": "A26",
  "section": 1,

  "lecture": "L05",
  "lec2": null,
  "topic": "L05 IPv4",
  "kind": "applied",
  "forms": [
   "calc"
  ],
  "stem": "<p>A router receives a datagram with ID 0x3C1A, total length 1,420 bytes (a 20-byte header with no options),\nMF = 1 and fragment offset 100. Its outgoing link has an MTU of 620 bytes. Which TWO statements about the fragments it\nsends are correct?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "The third new fragment has offset 250 and must keep MF = 1",
    "correct": true,
    "note": "True. Its data starts at byte 2,000 of the original datagram (2,000 ÷ 8 = 250). MF stays 1 because the received datagram was itself not the last piece."
   },
   {
    "text": "The second new fragment has offset 175, length 620",
    "correct": true,
    "note": "True. It carries bytes 1,400–1,999 of the original: 1,400 ÷ 8 = 175, and 600 data + 20 header = 620 bytes."
   },
   {
    "text": "The second new fragment has offset 75 and length 620",
    "correct": false,
    "note": "False. 75 measures from the start of the received piece (600 ÷ 8) and ignores its own offset of 100. Offsets are positions in the original datagram."
   },
   {
    "text": "The first new fragment has offset 800, length 620",
    "correct": false,
    "note": "False. 800 is the byte position; the offset field holds it divided by 8, which is 100."
   },
   {
    "text": "The third new fragment has offset 250 and length 200",
    "correct": false,
    "note": "False. 200 is only the data; each fragment also carries a 20-byte header, so the total length is 220."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “The third new fragment has offset 250 and must keep MF = 1” and “The second new fragment has offset 175, length 620”. Idea: a fragment of a fragment keeps counting from the original datagram, and keeps MF = 1 if the received piece was not the last.",
   "reasoning": "<div class=\"tablewrap\"><table class=\"trace\"><tr><th>New fragment<\/th><th>Data bytes (original numbering)<\/th><th>Total length<\/th><th>Offset<\/th><th>MF<\/th><\/tr><tr><td>1<\/td><td>800–1399<\/td><td>620<\/td><td>800 ÷ 8 = 100<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1400–1999<\/td><td>620<\/td><td>1400 ÷ 8 = 175<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>2000–2199<\/td><td>220<\/td><td>2000 ÷ 8 = 250<\/td><td>1<\/td><\/tr><\/table><\/div><p>The received datagram holds 1,400 data bytes starting at byte 100 × 8 = 800 of the original. With an MTU of 620, each fragment can carry 620 − 20 = 600 data bytes (a multiple of 8), so the pieces carry 600, 600 and 200 bytes. The ID 0x3C1A is copied into all three.<\/p>",
   "source": "05-IP, slides 5-15 to 5-18"
  }
 },

  "stem": "<p>A lab subnet must hold 61 PCs, 1 printer and the router's interface. Which TWO statements are correct?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "A /26 is one address short: it has 62 usable addresses",
    "correct": true,
    "note": "True. A /26 has 2⁶ = 64 addresses, minus the network and broadcast addresses: 62. The lab needs 63."
   },
   {
    "text": "The smallest fitting block is a /25, mask 255.255.255.128",
    "correct": true,
    "note": "True. A /25 has 126 usable addresses, and 25 ones followed by 7 zeros is 255.255.255.128."
   },
   {
    "text": "A /26 fits exactly, because all 64 of its addresses are usable",
    "correct": false,
    "note": "False. The all-0s host part (network address) and the all-1s host part (broadcast address) are reserved, so only 62 are usable."
   },
   {
    "text": "A /27 is big enough, because 2^7 = 128 is more than 63",
    "correct": false,
    "note": "False. This reads the 7 in /27 as the number of host bits. A /27 leaves 32 − 27 = 5 host bits: 32 addresses, 30 of them usable."
   },
   {
    "text": "The smallest fitting block is a /25, mask 255.255.255.192",
    "correct": false,
    "note": "False. 255.255.255.192 is the /26 mask. The /25 mask is 255.255.255.128."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “A /26 is one address short: it has 62 usable addresses” and “The smallest fitting block is a /25, mask 255.255.255.128”. Idea: usable hosts = 2^h − 2, and the router interface needs an address too.",
   "reasoning": "<div class=\"tablewrap\"><table class=\"trace\"><tr><th>Step<\/th><th>What happens<\/th><th>Value<\/th><\/tr><tr><td>1<\/td><td>Addresses needed: 61 PCs + 1 printer + 1 router interface<\/td><td>63<\/td><\/tr><tr><td>2<\/td><td>/26: 2⁶ − 2 usable<\/td><td>62 (too few)<\/td><\/tr><tr><td>3<\/td><td>/25: 2⁷ − 2 usable<\/td><td>126 (fits)<\/td><\/tr><tr><td>4<\/td><td>/25 netmask<\/td><td>255.255.255.128<\/td><\/tr><\/table><\/div><p>63 = 2⁶ − 1 is the classic trap: one more than a /26 can hold, because two of its 64 addresses are reserved.<\/p>",
   "source": "05-IP, slides 5-27, 5-30, 5-31"
  }
 },
 {
  "id": "A28",
  "section": 1,

  "topic": "L05 IPv4",
  "kind": "concept",
  "forms": [
   "x"
  ],
  "stem": "<p>Subnet 172.20.8.0/22 sits behind router R. Host K, on another network elsewhere on the Internet, sends a\ndatagram to 172.20.11.255. Host J, inside 172.20.8.0/22, sends a datagram to 255.255.255.255. Which TWO statements are\ncorrect?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "R delivers K's datagram to every host in 172.20.8.0/22",
    "correct": true,
    "note": "True. 172.20.11.255 is the subnet's directed broadcast address (host part all 1s for a /22 covering .8.0–.11.255), which any host on the Internet may use."
   },
   {
    "text": "R does not forward J's datagram off its own network",
    "correct": true,
    "note": "True. 255.255.255.255 is the limited broadcast address: the datagram does not go outside the subnet in which it originated."

  "stem": "<p>A router must forward a 1,400-byte datagram that has its Don't Fragment (DF) bit set onto a link with an MTU\nof 1,000 bytes. Which TWO statements are correct?<\/p>",

  "code": null,

  "stemAfter": null,
  "options": [
   {
    "text": "The router discards it and sends an ICMP error to the source",
    "correct": true,
    "note": "True. It cannot fragment the datagram and cannot send it whole, so it drops it and reports 'fragmentation needed but DF bit is set' (type 3, code 4)."
   },
   {
    "text": "The ICMP message quotes the header and first 8 bytes of it",
    "correct": true,
    "note": "True. A destination-unreachable message carries the header and the first 8 bytes of the datagram that caused the error, so the source can tell which one failed."

   {
    "text": "The router fragments it anyway, as any router may fragment",
    "correct": false,
    "note": "False. Routers may fragment only when DF is not set; that is the purpose of the DF bit."

    "text": "The destination reports the error once reassembly times out",
    "correct": false,
    "note": "False. The datagram never reaches the destination; the router that cannot forward it reports the problem."
   },
   {
    "text": "The router drops it silently, since IP has no error reports",
    "correct": false,
    "note": "False. IP itself is best effort, but ICMP exists for error reporting such as unreachable destinations."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “The router discards it and sends an ICMP error to the source” and “The ICMP message quotes the header and first 8 bytes of it”. Idea: DF forbids fragmentation, so the router drops the datagram and reports it with ICMP.",
   "reasoning": "<p>The DF flag tells routers not to fragment the datagram. If it is larger than the outgoing MTU, the router must discard it, and it uses ICMP to tell the source: destination unreachable, code 'fragmentation needed but DF bit is set'. Like all destination-unreachable messages, it includes the original header and first 8 bytes so the source can match it.<\/p>",
   "source": "05-IP, slides 5-12, 5-16, 5-55, 5-56, 5-58"
  }
 },

  "stem": "<p>Compared with IPv4, the IPv6 header has no header checksum and routers no longer fragment packets. Which TWO\nconsequences are correct?<\/p>",

    "note": "True. IPv4 routers must recompute the checksum after decrementing TTL; IPv6 removed the checksum to speed processing at routers."

    "text": "A too-large packet is never split by a router on the path",
    "correct": true,
    "note": "True. In IPv6 only the source may fragment; it uses Path MTU discovery, or 1280, to choose a size that fits."

    "correct": false,
    "note": "False. The header checksum was removed, not moved, so that routers have less work per packet. Options are what moved to extension headers."

  "explanation": {

   "reasoning": "<p>The IPv6 base header is a fixed 40 bytes with no checksum, no fragmentation fields and no options. Routers still decrement the hop limit, but they have no header checksum to recompute, which speeds processing. A packet too large for the next link cannot be fragmented by a router; the source fragments (with a fragmentation extension header) after finding the path MTU, or uses 1280, the minimum MTU in IPv6.<\/p>",

  }

   "reasoning": "<p>The lecture's address types are identified by their prefixes: 2000::/3 global unicast (first hex digit 2 or 3), fe80::/10 link-local, ff00::/8 multicast. A link-local address only works on the subnet where it is used, and ff02::1 replaces IPv4's limited broadcast within the local network. Routers forward the global unicast destinations using their routing tables, wherever ff02 or other digits appear later in the address.<\/p>",

  "options": [
   {

    "note": "True. At first N may use only its link-local address, and it sends a router solicitation (RS) asking for a prefix."
   },
   {
    "text": "N's global address is the advertised prefix plus its own ID",
    "correct": true,
    "note": "True. The router advertisement gives the /64 prefix; N appends its own interface ID to form its global unicast address."

    "correct": false,

   {
    "text": "Once it has a global address, N stops using its link-local one",

    "note": "False. The host uses both: the link-local address within the subnet and the global address for all communication."

  "explanation": {
   "verdict": "The two correct options: “① is a router solicitation sent from N's link-local address” and “N's global address is the advertised prefix plus its own ID”. Idea: SLAAC combines a router-advertised prefix with a host-made interface ID.",
   "reasoning": "<p>With SLAAC, a host starts with only its link-local address and sends a router solicitation (RS). A router replies with a router advertisement (RA) listing global prefixes the host may use, here 2001:db8:5:20::/64. The host forms its global address from that prefix and its own interface ID and keeps using both addresses. Prefixes are valid for a finite time, after which the process repeats.<\/p>",
   "source": "05A-IPv6, slides 5A-25, 5A-30, 5A-31"

  "stem": "<p>A student's laptop forms its IPv6 interface ID with modified EUI-64 and connects on campus, at home and at a\ncafé. Five classmates discuss the privacy risk. Which TWO claims are correct?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "Amali: the ID stays the same everywhere, so sites can link its visits",
    "correct": true,
    "note": "Correct. The interface ID comes from the MAC address, so it is identical in every network, and a site can recognise the same device and track its movements."
   },
   {
    "text": "Dinuka: a random MAC with EUI-64 would give a new ID in each network",
    "correct": true,
    "note": "Correct. The lecture notes that using EUI-64 with a randomly generated MAC address gives different interface IDs."
   },
   {
    "text": "Kavindu: it is fixed because the /64 prefix changes at each network",
    "correct": false,
    "note": "Wrong. The prefix already changes from network to network; it is the unchanged interface ID that lets the device be tracked."
   },
   {
    "text": "Nethmi: a web server should also take a fresh random ID each time",
    "correct": false,
    "note": "Wrong. A server that accepts incoming connections needs an interface ID that does not change, so it keeps a stable address."
   },
   {
    "text": "Sahan: EUI-64 is safe, since the MAC can't be seen in the address",
    "correct": false,
    "note": "Wrong. EUI-64 places the MAC's OUI and device identifier in the ID (with fffe inserted and one bit flipped), so it is easily recognised."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “Amali: the ID stays the same everywhere, so sites can link its visits” and “Dinuka: a random MAC with EUI-64 would give a new ID in each network”. Idea: EUI-64 exposes a constant, MAC-based ID; pseudo-random IDs fix that for client traffic.",
   "reasoning": "<p>An EUI-64 interface ID is built from the MAC, so the low 64 bits of the address stay the same wherever the laptop connects; only the prefix changes. A site seeing visits from campus, home and café can link them to one device, track movements and target the user. The fix is a pseudo-random interface ID, or a random MAC, for outgoing connections (temporary addresses), while a stable EUI-64 address is kept for accepting incoming connections, as servers must.<\/p>",
   "source": "05A-IPv6, slides 5A-27, 5A-32, 5A-33"
  }
 },

   "reasoning": "<div class=\"tablewrap\"><table class=\"trace\"><tr><th>MAC<\/th><th>Insert fffe<\/th><th>Invert 7th bit of first byte<\/th><th>Interface ID<\/th><\/tr><tr><td>3c:22:fb:07:5e:a1<\/td><td>3c22:fbff:fe07:5ea1<\/td><td>3c → 3e<\/td><td>3e22:fbff:fe07:5ea1<\/td><\/tr><tr><td>02:5f:19:c4:80:0d<\/td><td>025f:19ff:fec4:800d<\/td><td>02 → 00<\/td><td>005f:19ff:fec4:800d<\/td><\/tr><\/table><\/div><p>The lecture's steps: split the MAC into the 24-bit OUI and 24-bit device identifier, insert fffe between them, and invert the 7th bit (the universal/local bit), which is the 0x02 bit of the first byte.<\/p>",

 {

  "kind": "concept",
  "forms": [],
  "stem": "<p>Which TWO statements correctly separate routing from forwarding?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "Forwarding moves every arriving packet to the right output link",
    "correct": true,
    "note": "True. Forwarding is the per-packet job of moving a packet from a router's input link to the appropriate output link."
   },
   {
    "text": "Routing works out the paths and fills in the routing table",
    "correct": true,
    "note": "True. Routing determines the route packets take from source to destination; its result is the routing table that forwarding uses."
   },
   {
    "text": "Routing is done per packet, and forwarding is done once at start-up",
    "correct": false,
    "note": "False. This swaps the two: forwarding happens for every packet, while routing builds and updates the table."
   },
   {
    "text": "Forwarding plans the whole path from source to destination",
    "correct": false,
    "note": "False. Planning the whole trip is routing (the road-map analogy); forwarding is getting through a single junction."
   },
   {
    "text": "Hosts skip both, since routing tables are kept by routers",
    "correct": false,
    "note": "False. Even a host has a routing table, usually with a few rows such as its own subnet and a default route."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “Forwarding moves every arriving packet to the right output link” and “Routing works out the paths and fills in the routing table”. Idea: routing plans the trip; forwarding gets each packet through one junction.",
   "reasoning": "<p>The lecture's analogy: forwarding is the process of getting through a single interchange, routing is planning the trip from source to destination. In a router, forwarding happens for every packet: look up the destination in the table and send it out of the right interface. Routing, by an administrator (static) or a routing protocol (dynamic), decides what the table contains. Hosts have small routing tables too.<\/p>",
   "source": "06-Routing, slides 6-3, 6-13, 6-14"
  }
 },

   "reasoning": "<p>Static routing means an administrator enters the routes manually: fine for a 3-router branch with one path, but time-consuming for large networks, and unable to react when links go down or become congested. Dynamic routing protocols exchange routing information so routes follow the state of the network. Of the two classes, distance vector is simple but bad news travels slowly; link state converges faster but needs more memory and processing to compute paths from its map.<\/p>",

  "stem": "<p>A router receives a datagram whose destination matches no entry in its routing table, and the table has no\ndefault route. Which TWO statements are correct?<\/p>",
  "svg": null,
  "code": null,
  "codeTitle": null,
  "optionsMono": false,
  "stemAfter": null,
  "options": [
   {
    "text": "The router must discard the datagram instead of forwarding it",
    "correct": true,
    "note": "True. With no matching entry there is no output link to forward it to, so the datagram cannot be delivered."
   },
   {
    "text": "The router may send the source an ICMP unreachable message",
    "correct": true,
    "note": "True. ICMP destination unreachable is usually sent by an intermediate router when a datagram cannot be sent to its destination (for example, network unreachable)."
   },
   {
    "text": "The router floods it out of its other interfaces, like a switch",
    "correct": false,
    "note": "False. Flooding unknown destinations is what a switch does with frames; routers do not flood datagrams."
   },
   {
    "text": "The router uses the entry whose prefix matches most bits",
    "correct": false,
    "note": "False. An entry W.X.Y.Z/P matches only if all of its first P bits match. A 'nearly matching' entry is not a match."
   },
   {
    "text": "The router returns it out of the interface it arrived on",
    "correct": false,
    "note": "False. There is no rule that sends unroutable datagrams back; it is discarded."
   }
  ],
  "explanation": {
   "verdict": "The two correct options: “The router must discard the datagram instead of forwarding it” and “The router may send the source an ICMP unreachable message”. Idea: no match and no default means the datagram cannot be forwarded; ICMP reports it.",
   "reasoning": "<p>The router compares the destination against all entries and selects the longest prefix that matches; a default route (0.0.0.0/0) matches everything. Without a default route and without any matching entry, the router has nowhere to send the datagram, so it discards it, and ICMP lets it report the problem to the source with a destination unreachable message.<\/p>",
   "source": "06-Routing, slides 6-14, 6-19 · 05-IP, slides 5-55, 5-58"
  },
  "topic2": "L05 IPv4"
 },

  "code": "from socket import *\nserverSocket = socket(AF_INET, SOCK_STREAM)\nserverSocket.bind(('', 7070))\nserverSocket.listen(1)\nconnectionSocket, addr = serverSocket.accept()\nconnectionSocket.settimeout(3)\ncount = 0\nwhile True:\n    try:\n        data = connectionSocket.recv(1024)\n    except timeout:\n        print('idle', count)\n        break\n    if not data:\n        print('closed', count)\n        break\n    count += 1\n    connectionSocket.send(data.upper())\nconnectionSocket.close()\nserverSocket.close()",

   },

    "text": "One message, then silence with the connection open: idle 1",

    "note": "Correct. After the first message, the next recv() waits; after 3 s with nothing received, the timeout exception is caught and 'idle 1' is printed."

    "text": "The client connects, then closes without sending: idle 0",
    "correct": false,
    "note": "Wrong. A closed connection is not a timeout: recv() returns an empty bytes object at once, so the server prints 'closed 0'."

    "text": "Two messages, each answered, then the client closes: closed 3",
    "correct": false,
    "note": "Wrong. The empty bytes object that signals the close is caught by 'if not data' before count is increased, so only the two messages are counted."

  "explanation": {
   "verdict": "The two correct options: “Two messages, each answered, then the client closes: closed 2” and “One message, then silence with the connection open: idle 1”. Idea: settimeout applies to the socket it is called on, and a closed connection makes recv return empty bytes rather than time out.",
   "reasoning": "<p>The server blocks in accept() until a client connects; only then does it set a 3-second timeout, on the new connectionSocket. In the loop, recv() either returns data (count it and send it back), returns an empty bytes object (the client disconnected, so print 'closed' and the count), or raises the timeout exception after 3 s of silence (print 'idle' and the count). Running the code against real clients gave exactly 'closed 2', 'idle 1', 'closed 0' and no output for the four situations described.<\/p>",

  "topic": "L04 LANs",

    "calc": false,
    "modelAnswer": "A transmitting station's own signal is strong while the signals it receives are weak (fading), so it is difficult to sense a collision while transmitting. And some collisions cannot be sensed at all: K and J are hidden from each other, so if both transmit to AP their frames collide at AP without either of them hearing the other. So 802.11 uses CSMA/CA to avoid collisions.",

  "title": "B9",
  "stem": "<p>Compared with the IPv4 header, the IPv6 base header is a fixed 40 bytes and has no\nheader checksum, no fragmentation fields and no options.<\/p>",

    "prompt": "<p>Explain why the checksum was dropped and what happened to the options.<\/p>",

     "Saying IPv6 has no use for error checking at all loses point 1: the reason given is faster processing at routers."

    "kind": "prose",
    "calc": false,
    "modelAnswer": "The checksum was dropped to speed up processing at routers: an IPv4 router has to recompute the header checksum at every hop because the TTL changes, while an IPv6 router just decrements the hop limit.\nOptions (and some other IPv4 fields) were moved out of the base header into extension headers, which follow the fixed 40-byte base header, so the base header is simpler and always the same size.",
    "rubric": [

  "stem": "<p>Laptop H in Figure B13 asks its local DNS server L for the IP address of\n<strong>portal.seabreeze.lk<\/strong>. L's cache is empty, and every server behaves as the lecture describes.<\/p>",
  "svg": "b13",
  "svgCaption": "Figure B13",
  "parts": [
   {
    "label": "(a)",
    "marks": 1,
    "tier": 2,
    "prompt": "<p>Describe the queries and replies in order. Say which query is recursive and which are\niterative, and what each server returns.<\/p>",
    "source": "08-Application, slides 8-28 to 8-32",
    "commonMistakes": [
     "Making the root or TLD server resolve the whole name loses point 2: they do not honour requests for recursion and return referrals.",
     "Having H query the root server itself loses point 1: hosts usually send the query to their local DNS server."
    ],
    "kind": "prose",
    "calc": false,
    "modelAnswer": "H sends a recursive query (recursion desired set) to L, and L does the whole job and finally returns the address to H.\nL then queries iteratively: the root server replies with a referral to the .lk TLD servers; the .lk TLD server replies with a referral to the authoritative server for seabreeze.lk; the authoritative server returns the IP address of portal.seabreeze.lk. Root, TLD and authoritative servers do not honour requests for recursion.",
    "rubric": [
     {
      "text": "H → L is recursive: L does all the work and returns the final answer to H",
      "marks": 0.5,
      "auto": true,
      "check": {
       "ci": true,
       "any": [
        "(h|host|laptop)[^.\\n]{0,80}recursive|recursive[^.\\n]{0,80}(\\bl\\b|local)",
        "recursion desired"
       ]
      }
     },
     {
      "text": "L queries root → referral to .lk TLD → referral to authoritative → address (iterative)",
      "marks": 0.5,
      "auto": true,
      "check": {
       "ci": true,
       "all": [
        "root",
        "tld|\\.lk",
        "authoritative"
       ],
       "any": [
        "iterat",
        "referral|refer"
       ]
      }
     }
    ],
    "fields": [],
    "wrongAnswers": [
     "H asks the root server, which asks the TLD server, which asks the authoritative server, and the answer comes back the same way.",
     "L knows the address already."
    ]
   },
   {
    "label": "(b)",
    "marks": 1,
    "tier": 3,
    "prompt": "<p>Ten minutes later another laptop asks L for <strong>mail.seabreeze.lk<\/strong>. The next day\nseabreeze.lk changes portal.seabreeze.lk to a new IP address while L still holds the old record. Predict which servers\nL contacts for the new name, and what L's users see for portal.seabreeze.lk until the change reaches them.<\/p>",
    "source": "08-Application, slides 8-29, 8-35",
    "commonMistakes": [
     "Saying L starts again at the root loses point 1: it has cached the referrals.",
     "Saying the change is seen at once everywhere loses point 2: cached records stay until their TTL expires."
    ],
    "kind": "prose",
    "calc": false,
    "modelAnswer": "L has cached what it learned: the .lk TLD servers and the authoritative server for seabreeze.lk. So it can go straight to the authoritative server for mail.seabreeze.lk, skipping the root and TLD servers, and the answer comes faster.\nFor portal.seabreeze.lk, L keeps answering from its cache with the old, out-of-date address until that record's TTL expires; only then does it ask again and get the new address. DNS is a best-effort name-to-address translation.",
    "rubric": [
     {
      "text": "L uses its cache: goes straight to the authoritative server for seabreeze.lk, skipping root and TLD",
      "marks": 0.5,
      "auto": true,
      "check": {
       "ci": true,
       "any": [
        "(straight|directly)[^.\\n]{0,60}authoritative",
        "skip[^.\\n]{0,40}(root|tld)",
        "(cache|cached)[^.\\n]{0,100}(authoritative|tld|referral)"
       ]
      }
     },
     {
      "text": "Old cached address returned (out of date) until the TTL expires",
      "marks": 0.5,
      "auto": true,
      "check": {
       "ci": true,
       "all": [
        "ttl|expir|time to live"
       ],
       "any": [
        "old|out[- ]of[- ]date|stale|cache"
       ]
      }
     }
    ],
    "fields": [],
    "wrongAnswers": [
     "L asks the root server again, and users immediately get the new address.",
     "Caching only helps the laptop that asked first."
    ]
   }
  ]

  "topic": "L08 Application",
  "title": "B14",
  "stem": "<p>A web page consists of a base HTML file that references 6 small images, all stored on\nthe same server. Ignore transmission times.<\/p>",

   {

    "modelAnswer": "Non-persistent HTTP: every object needs its own TCP connection, so each costs 2 RTTs, one to set up the connection and one for the request and the start of the response. The base file and the 6 images are 7 objects, so about 14 RTTs.\nPersistent HTTP: the server leaves the connection open after the base file (2 RTTs), and the client requests the images as soon as it finds the references, so all 6 can come back in as little as one more RTT: about 3 RTTs.",

   {

    "marks": 1,
    "tier": 3,
    "prompt": "<p>The page is changed to one large video (O1) followed by three small images. Explain the\nhead-of-line (HOL) blocking this causes with HTTP/1.1, how HTTP/2 reduces it, and what problem remains over a single\nTCP connection that HTTP/3 over QUIC addresses.<\/p>",

    "kind": "prose",
    "calc": false,
