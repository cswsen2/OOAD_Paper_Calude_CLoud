<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OOAD Final Mock</title>
<script>
/* apply a saved theme before first paint, so the page never flashes the wrong colours */
try {
    var savedTheme = localStorage.getItem("ooad-theme");
    if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", savedTheme);
    }
} catch (e) { /* storage blocked: follow the device setting */ }
</script>
<style>
:root {
    color-scheme: light;
    --bg: #FAF7F0;
    --card: #FFFDF8;
    --heading: #7A1E2C;
    --primary: #2B3A55;
    --border: #E3DCCB;
    --text: #1F1F1F;
    --code-bg: #F1ECE1;
    --code-text: #2B2B2B;
    --correct: #2E7D32;
    --wrong: #B3261E;
    --partial: #B7791F;
    --on-primary: #FFFFFF;
    --correct-text: #276E2B;
    --partial-text: #8A5A12;
    --muted: rgba(31, 31, 31, 0.68);
    --correct-tint: #E6EEE0;
    --wrong-tint: #F6E3DE;
    --partial-tint: #F6EDDE;
    --primary-tint: #E6E6E4;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", "Courier New", monospace;
}
/* Night Ink: same token names, dark values. Follows the device unless the toggle chose light. */
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #1B1814;
        --card: #24201B;
        --heading: #E39AA5;
        --primary: #A9BCE0;
        --border: #3A342C;
        --text: #ECE6DA;
        --code-bg: #2B2620;
        --code-text: #E8E1D3;
        --correct: #7CC47F;
        --wrong: #F08A80;
        --partial: #E3B25A;
        --on-primary: #1B1814;
        --correct-text: #7CC47F;
        --partial-text: #E3B25A;
        --muted: rgba(236, 230, 218, 0.68);
        --correct-tint: #323A2B;
        --wrong-tint: #45312B;
        --partial-tint: #433725;
        --primary-tint: #39393B;
    }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1B1814;
    --card: #24201B;
    --heading: #E39AA5;
    --primary: #A9BCE0;
    --border: #3A342C;
    --text: #ECE6DA;
    --code-bg: #2B2620;
    --code-text: #E8E1D3;
    --correct: #7CC47F;
    --wrong: #F08A80;
    --partial: #E3B25A;
    --on-primary: #1B1814;
    --correct-text: #7CC47F;
    --partial-text: #E3B25A;
    --muted: rgba(236, 230, 218, 0.68);
    --correct-tint: #323A2B;
    --wrong-tint: #45312B;
    --partial-tint: #433725;
    --primary-tint: #39393B;
}

* { box-sizing: border-box; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 var(--sans);
}
button { font-family: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
code.inline {
    font: 0.88em var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
}

/* ---------- top bar ---------- */
.topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--border);
}
.brand { font: 700 1rem var(--serif); color: var(--heading); white-space: nowrap; }
.where { flex: 1; font: 600 0.9rem var(--sans); color: var(--primary); }
.tools { display: flex; align-items: center; gap: 10px; }
.pill {
    font: 600 0.82rem var(--sans); color: var(--primary); background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; white-space: nowrap;
}
.timer {
    font: 700 1rem var(--mono); color: var(--primary); min-width: 92px; text-align: right;
    white-space: nowrap;
}
.timer.low { color: var(--partial-text); }
.timer.over { color: var(--wrong); }

/* ---------- banners ---------- */
.banner {
    position: sticky; top: 57px; z-index: 19;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 20px; font-weight: 600; border-bottom: 1px solid var(--border);
}
.banner.warn { background: var(--partial-tint); color: var(--partial-text); }
.banner.over { background: var(--wrong-tint); color: var(--wrong); }
.banner.info { background: var(--primary-tint); color: var(--primary); }

/* ---------- buttons ---------- */
.btn {
    font: 600 0.92rem var(--sans); color: var(--on-primary); background: var(--primary);
    border: 1px solid var(--primary); border-radius: 8px; padding: 0 16px;
    min-height: 40px; cursor: pointer;
}
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.secondary { background: var(--card); color: var(--primary); }
.btn.danger { background: var(--card); color: var(--wrong); border-color: var(--wrong); }
.btn-small {
    font: 600 0.8rem var(--sans); color: var(--primary); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; padding: 0 10px;
    min-height: 32px; cursor: pointer;
}
.btn-small:hover, .btn.secondary:hover { border-color: var(--primary); }
.btn-small.on { background: var(--heading); color: var(--on-primary); border-color: var(--heading); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }

/* ---------- layout ---------- */
.shell {
    display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 24px;
    max-width: 1240px; margin: 0 auto; padding: 20px;
}
.side {
    position: sticky; top: 76px; align-self: start;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    max-height: calc(100vh - 96px); overflow: auto;
}
.side h3 { font: 700 0.78rem var(--sans); color: var(--heading); text-transform: uppercase;
    letter-spacing: 0.05em; margin: 12px 0 6px; }
.side h3:first-child { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.navbtn {
    position: relative; height: 36px; border-radius: 7px; cursor: pointer;
    font: 700 0.85rem var(--sans); color: var(--primary);
    background: var(--card); border: 1.5px solid var(--border);
}
.navbtn:hover { border-color: var(--primary); }
.navbtn.answered { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.navbtn.correct { background: var(--correct-tint); color: var(--correct-text); border-color: var(--correct); }
.navbtn.partial { background: var(--partial-tint); color: var(--partial-text); border-color: var(--partial); }
.navbtn.wrong { background: var(--wrong-tint); color: var(--wrong); border-color: var(--wrong); }
.navbtn.flagged { outline: 2px solid var(--heading); outline-offset: 1px; }
.navbtn .flag { position: absolute; top: -7px; right: -5px; font-size: 0.75rem; color: var(--heading); }
.navbtn .mark { position: absolute; bottom: -1px; right: 3px; font-size: 0.68rem; }
.navbtn.current { box-shadow: 0 0 0 3px var(--primary-tint), 0 0 0 4px var(--primary); }
.navbtn:disabled { opacity: 0.3; cursor: default; }
.legend { display: grid; gap: 4px; font-size: 0.78rem; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-block; width: 14px; height: 14px; border-radius: 4px;
    vertical-align: -2px; margin-right: 6px; border: 1.5px solid var(--border); }
.legend .l-ans { background: var(--primary); border-color: var(--primary); }
.legend .l-flag { outline: 2px solid var(--heading); }
.legend .l-ok { background: var(--correct-tint); border-color: var(--correct); }
.legend .l-part { background: var(--partial-tint); border-color: var(--partial); }
.legend .l-bad { background: var(--wrong-tint); border-color: var(--wrong); }
.side label.toggle { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; margin-top: 12px; cursor: pointer; }
.side .actions { display: grid; gap: 8px; margin-top: 14px; }

/* ---------- question card ---------- */
.q {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 26px 26px;
}
.qtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.badge {
    font: 600 0.75rem/1 var(--sans); padding: 5px 8px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--primary); background: var(--bg);
}
.badge.sec { color: var(--heading); border-color: var(--heading); }
.badge.marks { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.qhead { font: 700 1.25rem/1.3 var(--serif); color: var(--heading); margin: 2px 0 10px; }
.qhead small { font: 600 0.85rem var(--sans); color: var(--primary); margin-left: 8px; }
.stem { font-family: var(--serif); font-size: 1.05rem; }
.stem p { margin: 0 0 10px; }
.stem ul { margin: 0 0 10px; padding-left: 22px; }
.stem li { margin-bottom: 4px; }
.lead { font-style: italic; color: var(--primary); }
.scenario {
    border-left: 4px solid var(--border); padding: 4px 0 4px 14px; margin: 10px 0;
    font-style: italic;
}
.instr { font: 600 0.85rem var(--sans); color: var(--primary); margin: 14px 0 8px; }
.label-sm {
    font: 700 0.78rem var(--sans); color: var(--primary); text-transform: uppercase;
    letter-spacing: 0.04em; margin-top: 16px;
}
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 16px 0 40px; }

/* ---------- code ---------- */
figure.code {
    margin: 12px 0; border: 1px solid var(--border); border-radius: 8px;
    background: var(--code-bg); overflow: hidden;
}
figure.code figcaption {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font: 600 0.8rem var(--sans); color: var(--primary);
    padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--border);
}
figure.code figcaption .btns { display: flex; gap: 6px; }
figure.code pre {
    margin: 0; padding: 10px 0; overflow-x: auto;
    font: 0.86rem/1.55 var(--mono); color: var(--code-text); tab-size: 4;
}
figure.code code { display: block; min-width: max-content; }
.cl { display: block; white-space: pre; padding-right: 16px; }
.ln {
    display: inline-block; width: 4ch; padding-right: 1ch; margin-right: 1.2ch;
    text-align: right; color: var(--muted); border-right: 1px solid var(--border);
    user-select: none; -webkit-user-select: none;
}
.nonum .cl { padding-left: 14px; }
pre.plain {
    margin: 10px 0; padding: 10px 14px; overflow-x: auto; border-radius: 8px;
    font: 0.86rem/1.55 var(--mono); color: var(--code-text); background: var(--code-bg);
    border: 1px solid var(--border);
}

/* ---------- diagrams ---------- */
figure.diagram {
    margin: 12px 0; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); padding: 10px; overflow-x: auto;
}
figure.diagram svg { display: block; width: 100%; min-width: 600px; height: auto; margin: 0 auto; }
figure.diagram figcaption { font: 0.78rem var(--sans); color: var(--muted); margin-top: 4px; }
.uml text { font-family: Arial, Helvetica, "Liberation Sans", sans-serif; font-size: 12.5px; fill: var(--text); }
.uml .cname { font-weight: 700; font-size: 13px; text-anchor: middle; }
.uml .italic { font-style: italic; }
.uml .centre { text-anchor: middle; }
.uml .mult { text-anchor: end; }
.uml .mult.start { text-anchor: start; }
.uml .stereo { font-size: 12px; font-style: italic; }
.uml .guard { font-size: 12px; }
.uml .crchead { font-size: 11px; font-weight: 700; }
.uml .box { fill: var(--card); stroke: var(--text); stroke-width: 1.4; }
.uml .container { fill: none; stroke: var(--text); stroke-width: 1; }
.uml line, .uml polyline { stroke: var(--text); stroke-width: 1.4; fill: none; }
.uml .dashed { stroke-dasharray: 6 4; }
.uml .hollow { fill: var(--card); stroke: var(--text); stroke-width: 1.4; }
.uml .filled { fill: var(--text); stroke: var(--text); stroke-width: 1.4; }
.uml .bar { fill: var(--text); }
.uml .head { fill: none; stroke: var(--text); stroke-width: 1.4; }

/* ---------- options ---------- */
.opts { display: grid; gap: 8px; margin: 6px 0 12px; }
.opt {
    display: flex; gap: 12px; align-items: flex-start;
    min-height: 44px; padding: 10px 12px; cursor: pointer;
    border: 1.5px solid var(--border); border-radius: 10px; background: var(--card);
    font-family: var(--serif); font-size: 1rem;
}
.opt:hover { border-color: var(--primary); }
.opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
.opt .key { font: 700 0.75rem var(--sans); color: var(--muted); min-width: 1.2em; margin-top: 3px; }
.opt .otext { flex: 1; }
.opt pre.optpre { margin: 0; font: 0.9rem/1.5 var(--mono); white-space: pre; }
.opt.sel { border-color: var(--primary); background: var(--primary-tint); }
.opt.locked { cursor: default; }
.opt.locked:hover { border-color: var(--border); }
.opt .fb { display: block; font: 600 0.8rem var(--sans); margin-top: 4px; }
.opt.ok, .opt.ok:hover { border-color: var(--correct); background: var(--correct-tint); }
.opt.ok .fb { color: var(--correct-text); }
.opt.bad, .opt.bad:hover { border-color: var(--wrong); background: var(--wrong-tint); }
.opt.bad .fb { color: var(--wrong); }
.opt.miss, .opt.miss:hover { border-color: var(--partial); background: var(--partial-tint); border-style: dashed; }
.opt.miss .fb { color: var(--partial-text); }
.opt.neutral .fb { color: var(--muted); }

/* ---------- verdict / explanation ---------- */
.verdict {
    border-left: 5px solid; border-radius: 8px; padding: 10px 14px; margin: 14px 0 10px;
    font-weight: 600;
}
.verdict .vlabel { font-size: 1.05rem; margin-right: 8px; }
.verdict .vdetail { display: block; font-weight: 500; font-size: 0.9rem; margin-top: 2px; color: var(--text); }
.verdict.correct { border-color: var(--correct); background: var(--correct-tint); color: var(--correct-text); }
.verdict.partial { border-color: var(--partial); background: var(--partial-tint); color: var(--partial-text); }
.verdict.wrong { border-color: var(--wrong); background: var(--wrong-tint); color: var(--wrong); }
details.expl {
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
    padding: 0 16px; margin-top: 8px;
}
details.expl > summary {
    cursor: pointer; font: 700 0.95rem var(--sans); color: var(--heading);
    min-height: 44px; display: flex; align-items: center;
}
details.expl h4 { font: 700 0.8rem var(--sans); color: var(--primary); margin: 14px 0 4px;
    text-transform: uppercase; letter-spacing: 0.04em; }
details.expl p, details.expl li { font-size: 0.95rem; }
details.expl ul { padding-left: 20px; margin: 4px 0 10px; }
details.expl li { margin-bottom: 6px; }
.src { font-size: 0.85rem; color: var(--muted); margin: 10px 0 14px; }
.tablewrap { overflow-x: auto; }
table.trace { border-collapse: collapse; width: 100%; font-size: 0.88rem; margin: 6px 0 10px; }
table.trace th, table.trace td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
table.trace th { background: var(--code-bg); color: var(--primary); }
table.trace code { font: 0.92em var(--mono); }
td.ok { color: var(--correct-text); font-weight: 600; }
td.bad { color: var(--wrong); font-weight: 600; }

/* ---------- written answers ---------- */
.part { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px; }
.part-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.part-head .plabel { font: 700 1.05rem var(--serif); color: var(--heading); }
.part-head .pmarks { font: 600 0.85rem var(--sans); color: var(--primary); white-space: nowrap; }
.part .pprompt { font-family: var(--serif); margin: 4px 0 8px; }
.part .pprompt pre { font: 0.88rem/1.5 var(--mono); background: var(--code-bg); padding: 6px 10px;
    border-radius: 6px; overflow-x: auto; margin: 6px 0; }
textarea.ans {
    width: 100%; min-height: 200px; resize: vertical; display: block;
    font: 0.88rem/1.5 var(--mono); color: var(--code-text); tab-size: 4;
    background: var(--code-bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px;
}
textarea.ans:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
textarea.ans[readonly] { opacity: 0.85; }
.counter { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
.rubric { list-style: none; padding: 0; margin: 6px 0 10px; display: grid; gap: 6px; }
.rubric li {
    display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card);
}
.rubric li.on { border-color: var(--correct); background: var(--correct-tint); }
.rubric input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--correct); flex: none; }
.rubric .rtext { flex: 1; font-size: 0.93rem; }
.rubric .rmarks { font: 600 0.82rem var(--sans); white-space: nowrap; color: var(--primary); }
.tag {
    display: inline-block; font: 700 0.68rem/1 var(--sans); text-transform: uppercase;
    letter-spacing: 0.05em; padding: 3px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px;
}
.tag.auto { background: var(--primary); color: var(--on-primary); }
.tag.manual { background: var(--code-bg); color: var(--primary); border: 1px solid var(--border); }
.tag.edited { background: var(--heading); color: var(--on-primary); }
.qtotal {
    margin-top: 20px; padding: 10px 14px; border-radius: 8px; background: var(--code-bg);
    font: 600 0.95rem var(--sans); color: var(--primary);
}

/* ---------- cover & results ---------- */
.page { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
.cover-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 30px 34px;
}
.cover-head { text-align: center; border-bottom: 2px solid var(--heading); padding-bottom: 18px; margin-bottom: 18px; }
.cover-head .inst { font: 600 0.9rem var(--sans); letter-spacing: 0.05em; color: var(--primary); }
.cover-head h1 { font: 700 1.9rem/1.25 var(--serif); color: var(--heading); margin: 8px 0 4px; }
.cover-head .meta { color: var(--muted); }
.cover-card h2 { font: 700 1.05rem var(--serif); color: var(--heading); margin: 20px 0 6px; }
.cover-card ul { margin: 0; padding-left: 22px; }
.cover-card li { margin-bottom: 4px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.mode {
    display: flex; gap: 10px; align-items: flex-start; padding: 14px; cursor: pointer;
    border: 1.5px solid var(--border); border-radius: 10px;
}
.mode:has(input:checked) { border-color: var(--primary); background: var(--primary-tint); }
.mode input { margin-top: 4px; accent-color: var(--primary); }
.mode strong { display: block; color: var(--primary); }
.mode span { font-size: 0.88rem; color: var(--muted); }
table.plain { border-collapse: collapse; width: 100%; font-size: 0.92rem; margin: 6px 0; }
table.plain th, table.plain td { border-bottom: 1px solid var(--border); padding: 7px 8px; text-align: left; }
table.plain th { color: var(--primary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
table.plain td.num, table.plain th.num { text-align: right; font-variant-numeric: tabular-nums; }
.bigscore { text-align: center; margin: 6px 0 18px; }
.bigscore .val { font: 700 3rem/1.1 var(--serif); color: var(--heading); }
.bigscore .sub { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
.stat { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.stat .k { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.stat .v { font: 700 1.3rem var(--serif); color: var(--primary); }
.missed { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 6px; }
.missed a {
    display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); text-decoration: none;
}
.missed a:hover { border-color: var(--primary); }
.missed .sc { font-weight: 700; white-space: nowrap; }
.bar-mini { height: 8px; border-radius: 4px; background: var(--code-bg); overflow: hidden; min-width: 80px; }
.bar-mini > div { height: 100%; background: var(--primary); }
#selftest { display: none; white-space: pre-wrap; font: 0.8rem var(--mono); background: var(--card);
    border: 2px solid var(--heading); padding: 10px; border-radius: 8px; margin: 16px auto; max-width: 1200px; }
</style>
</head>
<body>
<header class="topbar">
    <div class="brand">SE2012 OOAD · Final (Mock)</div>
    <div class="where" id="where"></div>
    <div class="tools">
        <span class="pill" id="scorepill" hidden></span>
        <span class="timer" id="timer" title="Time remaining"></span>
        <button id="theme-toggle" class="btn-small" type="button">☾ Dark</button>
        <button id="results-btn" class="btn secondary" type="button" hidden>Results</button>
        <button id="finish-btn" class="btn" type="button" hidden>Finish exam</button>
    </div>
</header>
<div id="banner" class="banner" hidden><span id="banner-text"></span>
    <button class="btn-small" type="button" id="banner-close">Dismiss</button></div>
<div id="app"></div>
<pre id="selftest"></pre>

<script>
"use strict";

        { text: "Bridge: Receipt is the abstraction and Printer the implementor, so each side can vary alone.", correct: true,

                  check: { all: [R`string`, R`priced`], any: [R`bound`, R`extends priced`, R`not (a )?(subtype|subclass|priced)`, R`does not implement`, R`doesn't implement`, R`isn't priced`], ci: true } }
            ],
            commonMistakes: [
                "Calling Flight / Room the Commands: the commands are BookFlightCommand, BookRoomCommand and PackageCommand. Flight and Room do the real work, so they are the Receivers. Loses point 3.",

            ],

/*  STATE                                                              */

const STORE_KEY = "ooad-final-mock-v1";
const DURATION = 3 * 60 * 60 * 1000;
QUESTIONS.forEach((q, i) => { q.index = i; q.num = i + 1; });
const BY_ID = {};
QUESTIONS.forEach(q => { BY_ID[q.id] = q; });

function load() {
    try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        return s && s.v === 1 ? s : null;
    } catch (e) {
        return null;
    }
}

function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage blocked */ }
}

let state = load();
let view = "cover";
let timerHandle = null;

function freshState(mode) {
    const keep = state || {};
    return {
        v: 1, mode: mode, active: true, startedAt: Date.now(), finishedAt: null, finished: false,
        seed: Math.floor(Math.random() * 2147483647), current: 0, flags: {}, mcq: {}, written: {},
        warned: {}, retry: null, flaggedOnly: false,
        attempts: keep.attempts || [], best: keep.best == null ? null : keep.best
    };
}

/* ================================================================== */
/*  HELPERS                                                            */
/* ================================================================== */

function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function el(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) {
        for (const k in attrs) {
            if (k === "class") e.className = attrs[k];
            else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
        }
    }
    if (html !== undefined) e.innerHTML = html;
    return e;
}

function fmt(n) {
    return (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
}

function fmtTime(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

/* seeded shuffle so option order survives a refresh */
function mulberry32(a) {
    return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
}

function optionOrder(q) {
    const rnd = mulberry32((state.seed ^ hashStr(q.id)) >>> 0);
    const a = q.options.map((_, i) => i);
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

async function copyText(text, btn) {
    try {
        await navigator.clipboard.writeText(text);
    } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e2) { /* ignore */ }
        ta.remove();
    }
    const old = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = old; }, 1200);
}

function codeBlock(src, title, numbered, extraBtn) {
    const fig = el("figure", { class: "code" + (numbered ? "" : " nonum") });
    const cap = el("figcaption");
    cap.appendChild(el("span", null, esc(title)));
    const btns = el("span", { class: "btns" });
    if (extraBtn) btns.appendChild(extraBtn);
    const btn = el("button", { class: "btn-small", type: "button" }, "Copy");
    btn.addEventListener("click", () => copyText(src, btn));
    btns.appendChild(btn);
    cap.appendChild(btns);
    fig.appendChild(cap);
    const body = src.split("\n").map((l, i) =>
        `<span class="cl">${numbered ? `<span class="ln">${i + 1}</span>` : ""}${esc(l)}</span>`).join("");
    fig.appendChild(el("pre", null, `<code>${body}</code>`));
    return fig;
}

function diagram(svg, caption) {
    const fig = el("figure", { class: "diagram" }, svg);
    if (caption) fig.appendChild(el("figcaption", null, esc(caption)));
    return fig;
}

/* ================================================================== */
/*  MARKING                                                            */
/* ================================================================== */

function stripComments(src) {
    let out = "", i = 0;
    const n = src.length;
    while (i < n) {
        const c = src[i], d = src[i + 1];
        if (c === '"' || c === "'") {
            const q = c;
            out += c; i++;
            while (i < n && src[i] !== q && src[i] !== "\n") {
                if (src[i] === "\\" && i + 1 < n) { out += src[i] + src[i + 1]; i += 2; continue; }
                out += src[i++];
            }
            if (i < n) out += src[i++];
        } else if (c === "/" && d === "/") {
            while (i < n && src[i] !== "\n") i++;
        } else if (c === "/" && d === "*") {
            i += 2;
            while (i < n && !(src[i] === "*" && src[i + 1] === "/")) i++;
            i += 2;
            out += " ";
        } else {
            out += c; i++;
        }
    }
    return out;
}

function runCheck(check, answer, kind) {
    if (!check || !answer || !answer.trim()) return false;
    if (!check.all && !check.any) return false;
    const text = kind === "code" ? stripComments(answer) : answer;
    const flags = check.ci ? "i" : "";
    const t = s => new RegExp(s, flags).test(text);
    if (check.all && !check.all.every(t)) return false;
    if (check.any && !check.any.some(t)) return false;
    if (check.none && check.none.some(t)) return false;
    return true;
}

function autoTicks(part, text) {
    return part.rubric.map(r => !!(r.auto && runCheck(r.check, text, part.kind)));
}

function mcqState(q) {
    if (!state.mcq[q.id]) state.mcq[q.id] = { sel: [], submitted: false };
    return state.mcq[q.id];
}

function partState(q, pi) {
    if (!state.written[q.id]) state.written[q.id] = { parts: q.parts.map(() => ({ text: "", submitted: false, ticks: null, edited: null })) };
    return state.written[q.id].parts[pi];
}

function mcqResult(q) {
    const s = mcqState(q);
    const sel = new Set(s.sel);
    if (q.type === "best") {
        const ok = q.options.findIndex(o => o.correct);
        const right = sel.size === 1 && sel.has(ok);
        return { score: right ? q.marks : 0, plus: right ? q.marks : 0, minus: 0, lost: 0 };
    }
    const k = q.options.filter(o => o.correct).length;
    const unit = q.marks / k;
    let plus = 0, minus = 0, nOk = 0, nBad = 0;
    q.options.forEach((o, i) => {
        if (!sel.has(i)) return;
        if (o.correct) { plus += unit; nOk++; } else { minus += unit; nBad++; }
    });
    const score = Math.min(q.marks, Math.max(0, plus - minus));
    return { score, plus, minus, nOk, nBad, unit, lost: plus - score };
}

function partScore(q, pi) {
    const p = partState(q, pi);
    if (!p.submitted || !p.ticks) return 0;
    return q.parts[pi].rubric.reduce((a, r, i) => a + (p.ticks[i] ? r.marks : 0), 0);
}

function isSubmitted(q) {
    if (q.section === 1) return mcqState(q).submitted;
    return q.parts.every((_, pi) => partState(q, pi).submitted);
}

function isAnswered(q) {
    if (q.section === 1) return mcqState(q).sel.length > 0;
    return q.parts.some((_, pi) => partState(q, pi).text.trim() !== "");
}

function questionScore(q) {
    if (q.section === 1) return mcqState(q).submitted ? mcqResult(q).score : 0;
    return q.parts.reduce((a, _, pi) => a + partScore(q, pi), 0);
}

function feedbackVisible(q) {
    if (state.finished) return true;
    return state.mode === "practice" && isSubmitted(q);
}

function verdictOf(score, max) {
    if (score >= max - 1e-9) return "correct";
    if (score <= 1e-9) return "wrong";
    return "partial";
}

function verdictBox(score, max, detail) {
    const v = verdictOf(score, max);
    const label = { correct: "✓ Correct", partial: "◐ Partial", wrong: "✗ Wrong" }[v];
    return el("div", { class: "verdict " + v, role: "status" },
        `<span class="vlabel">${label}</span>${fmt(score)} / ${fmt(max)}` +
        (detail ? `<span class="vdetail">${detail}</span>` : ""));
}

function inScope(q) {
    return !state.retry || state.retry.ids.indexOf(q.id) !== -1;
}

function scopeQuestions() {
    return QUESTIONS.filter(inScope);
}

function showBanner(text, kind) {
    const b = document.getElementById("banner");
    document.getElementById("banner-text").textContent = text;
    b.className = "banner " + kind;
    b.hidden = false;
}

document.getElementById("banner-close").addEventListener("click", () => {
    document.getElementById("banner").hidden = true;
});

function updateTopbar() {
    const where = document.getElementById("where");
    const pill = document.getElementById("scorepill");
    const fin = document.getElementById("finish-btn");
    const res = document.getElementById("results-btn");
    if (view === "cover" || !state || !state.active) {
        where.textContent = "";
        pill.hidden = true; fin.hidden = true; res.hidden = true;
        document.getElementById("timer").textContent = "";
        return;
    }
    const q = QUESTIONS[state.current];
    const secName = { 1: "Section 1 · MCQs", 2: "Section 2 · Structured", 3: "Section 3 · Coding" }[q.section];
    where.textContent = view === "results" ? "Results" :
        `${secName} · Question ${q.num} of ${QUESTIONS.length}` + (state.retry ? " · Retry of missed questions" : "");
    const scope = scopeQuestions();
    if (state.mode === "practice" || state.finished) {
        const done = scope.filter(isSubmitted);
        const got = done.reduce((a, x) => a + questionScore(x), 0);
        const max = done.reduce((a, x) => a + x.marks, 0);
        pill.textContent = `Score ${fmt(got)} / ${fmt(max)} marked`;
    } else {
        pill.textContent = `Answered ${scope.filter(isAnswered).length} / ${scope.length}`;
    }
    pill.hidden = false;
    fin.hidden = state.finished;
    fin.textContent = state.retry ? "Finish retry" : "Finish exam";
    res.hidden = !state.finished || view === "results";
    tick();
}

function tick() {
    const t = document.getElementById("timer");
    if (!state || !state.active || view === "cover") { t.textContent = ""; return; }
    const now = state.finished ? state.finishedAt : Date.now();
    if (state.retry) {
        t.textContent = fmtTime(now - state.retry.startedAt);
        t.className = "timer";
        t.title = "Time spent on this retry";
        return;
    }
    const left = DURATION - (now - state.startedAt);
    t.title = "Time remaining";
    if (left >= 0) {
        t.textContent = fmtTime(left);
        t.className = "timer" + (left <= 15 * 60 * 1000 ? " low" : "");
    } else {
        t.textContent = "+" + fmtTime(-left);
        t.className = "timer over";
        t.title = "Overtime";
    }
    if (state.finished) return;
    if (left <= 15 * 60 * 1000 && left > 5 * 60 * 1000 && !state.warned.w15) {
        state.warned.w15 = true; save();
        showBanner("15 minutes left.", "warn");
    } else if (left <= 5 * 60 * 1000 && left > 0 && !state.warned.w5) {
        state.warned.w5 = true; save();
        showBanner("5 minutes left.", "warn");
    } else if (left <= 0 && !state.warned.over) {
        state.warned.over = true; save();
        showBanner("Time's up. You can keep going; the overtime is being recorded.", "over");
    }
}

function startTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(tick, 1000);
}

function renderExam() {
    view = "exam";
    if (state.retry && !inScope(QUESTIONS[state.current])) {
        state.current = BY_ID[state.retry.ids[0]].index;
    }
    const app = document.getElementById("app");
    app.innerHTML = "";
    const shell = el("div", { class: "shell" });
    shell.appendChild(el("aside", { class: "side", id: "side" }));
    shell.appendChild(el("main", { id: "qpane" }));
    app.appendChild(shell);
    renderNav();
    renderQuestion();
    startTimer();
    updateTopbar();
}

function navStatus(q) {
    if (feedbackVisible(q) && isSubmitted(q)) return verdictOf(questionScore(q), q.marks);
    if (state.mode === "practice" && !state.finished && q.section > 1 && q.parts.some((_, pi) => partState(q, pi).submitted)) {
        return "answered";
    }
    return isAnswered(q) ? "answered" : "";
}

function renderNav() {
    const side = document.getElementById("side");
    if (!side) return;
    side.innerHTML = "";
    const groups = [[1, "Section 1 · MCQs"], [2, "Section 2 · Structured"], [3, "Section 3 · Coding"]];
    groups.forEach(([sec, title]) => {
        side.appendChild(el("h3", null, title));
        const grid = el("div", { class: "grid" });
        QUESTIONS.filter(q => q.section === sec).forEach(q => {
            const st = navStatus(q);
            const flagged = !!state.flags[q.id];
            const hide = state.flaggedOnly && !flagged;
            const b = el("button", {
                class: "navbtn " + st + (flagged ? " flagged" : "") + (q.index === state.current ? " current" : ""),
                type: "button", "aria-label": `Question ${q.num}${flagged ? ", flagged" : ""}${st ? ", " + st : ""}`,
                "aria-current": q.index === state.current ? "true" : false,
                disabled: !inScope(q) || hide
            }, String(q.num));
            if (flagged) b.appendChild(el("span", { class: "flag", "aria-hidden": "true" }, "⚑"));
            const icon = { correct: "✓", partial: "◐", wrong: "✗" }[st];
            if (icon) b.appendChild(el("span", { class: "mark", "aria-hidden": "true" }, icon));
            b.addEventListener("click", () => goTo(q.index));
            grid.appendChild(b);
        });
        side.appendChild(grid);
    });
    side.appendChild(el("div", { class: "legend" },
        `<div><span></span>Unanswered</div><div><span class="l-ans"></span>Answered</div>
         <div><span class="l-flag"></span>Flagged</div><div><span class="l-ok"></span>Correct</div>
         <div><span class="l-part"></span>Partial</div><div><span class="l-bad"></span>Wrong</div>`));
    const lab = el("label", { class: "toggle" });
    const cb = el("input", { type: "checkbox" });
    cb.checked = !!state.flaggedOnly;
    cb.addEventListener("change", () => { state.flaggedOnly = cb.checked; save(); renderNav(); });
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(`Show flagged only (${Object.keys(state.flags).filter(k => state.flags[k]).length})`));
    side.appendChild(lab);
    const acts = el("div", { class: "actions" });
    const reset = el("button", { class: "btn danger", type: "button" }, "Reset attempt");
    reset.addEventListener("click", () => {
        if (!confirm("Reset this attempt? All answers, flags and the timer will be cleared. Your best score is kept.")) return;
        state = Object.assign(freshState(state.mode), { active: false });
        save();
        document.getElementById("banner").hidden = true;
        renderCover();
    });
    acts.appendChild(reset);
    side.appendChild(acts);
}

function goTo(i) {
    if (i < 0 || i >= QUESTIONS.length || !inScope(QUESTIONS[i])) return;
    state.current = i;
    save();
    if (view !== "exam") renderExam();
    else { renderNav(); renderQuestion(); updateTopbar(); }
    window.scrollTo(0, 0);
}

function step(dir) {
    let i = state.current + dir;
    while (i >= 0 && i < QUESTIONS.length && !inScope(QUESTIONS[i])) i += dir;
    goTo(i);
}

function toggleFlag() {
    const q = QUESTIONS[state.current];
    state.flags[q.id] = !state.flags[q.id];
    if (!state.flags[q.id]) delete state.flags[q.id];
    save();
    renderNav();
    const fb = document.getElementById("flagbtn");
    if (fb) {
        fb.classList.toggle("on", !!state.flags[q.id]);
        fb.textContent = state.flags[q.id] ? "⚑ Flagged" : "⚐ Flag for review";
    }
}

function badges(q) {
    const b = el("div", { class: "badges" });
    const sec = { 1: "Section 1 · MCQ", 2: "Section 2 · Structured", 3: "Section 3 · Coding" }[q.section];
    b.appendChild(el("span", { class: "badge sec" }, sec));
    if (q.section === 1) {
        b.appendChild(el("span", { class: "badge" }, q.type === "multi" ? "Multi-answer" : "Best-answer"));
        b.appendChild(el("span", { class: "badge" }, `Tier ${q.tier}`));
    }
    b.appendChild(el("span", { class: "badge" }, esc(q.topic)));
    b.appendChild(el("span", { class: "badge marks" }, `${q.marks} marks`));
    return b;
}

function renderQuestion() {
    const pane = document.getElementById("qpane");
    const q = QUESTIONS[state.current];
    pane.innerHTML = "";
    const card = el("article", { class: "q", id: q.id });
    const top = el("div", { class: "qtop" });
    top.appendChild(badges(q));
    const flag = el("button", { class: "btn-small" + (state.flags[q.id] ? " on" : ""), type: "button", id: "flagbtn" },
        state.flags[q.id] ? "⚑ Flagged" : "⚐ Flag for review");
    flag.addEventListener("click", toggleFlag);
    top.appendChild(flag);
    card.appendChild(top);
    const title = q.section === 1 ? `Question ${q.num}` : q.title;
    card.appendChild(el("h2", { class: "qhead" }, `${esc(title)}<small>${q.marks} marks</small>`));
    card.appendChild(el("div", { class: "stem" }, q.stem));
    if (q.section === 1) renderMCQBody(q, card);
    else renderWrittenBody(q, card);
    pane.appendChild(card);

    const pager = el("div", { class: "pager" });
    const prev = el("button", { class: "btn secondary", type: "button" }, "← Previous");
    prev.addEventListener("click", () => step(-1));
    const next = el("button", { class: "btn secondary", type: "button" }, "Next →");
    next.addEventListener("click", () => step(1));
    const scope = scopeQuestions();
    prev.disabled = scope[0].index === q.index;
    next.disabled = scope[scope.length - 1].index === q.index;
    pager.appendChild(prev);
    pager.appendChild(el("span", { class: "pill" }, `${scope.indexOf(q) + 1} of ${scope.length}`));
    pager.appendChild(next);
    pane.appendChild(pager);
}

/* ---------------- Section 1 ---------------- */

function renderMCQBody(q, card) {
    if (q.code) card.appendChild(codeBlock(q.code, q.codeTitle || "Code", true));
    if (q.codes) q.codes.forEach(c => card.appendChild(codeBlock(c.code, c.title, true)));
    if (q.svg) card.appendChild(diagram(q.svg, q.svgCaption));
    if (q.stemAfter) card.appendChild(el("div", { class: "stem" }, q.stemAfter));
    const multi = q.type === "multi";
    card.appendChild(el("div", { class: "instr" },
        multi ? "Select all that apply. Negative marking applies; a question never scores below 0."
              : "Select the BEST answer."));
    const s = mcqState(q);
    const locked = s.submitted || state.finished;
    const show = feedbackVisible(q);
    const order = optionOrder(q);
    const box = el("div", { class: "opts", role: multi ? "group" : "radiogroup" });
    const rows = [];
    const res = show ? mcqResult(q) : null;
    order.forEach((idx, pos) => {
        const o = q.options[idx];
        const lab = el("label", { class: "opt" + (locked ? " locked" : "") });
        const inp = el("input", { type: multi ? "checkbox" : "radio", name: "opt-" + q.id, value: String(idx) });
        inp.checked = s.sel.indexOf(idx) !== -1;
        inp.disabled = locked;
        if (inp.checked && !show) lab.classList.add("sel");
        inp.addEventListener("change", () => {
            if (multi) {
                s.sel = rows.filter(r => r.inp.checked).map(r => r.idx);
            } else {
                s.sel = [idx];
            }
            rows.forEach(r => r.lab.classList.toggle("sel", r.inp.checked));
            save();
            renderNav();
            updateTopbar();
        });
        lab.appendChild(inp);
        lab.appendChild(el("span", { class: "key", "aria-hidden": "true" }, String(pos + 1)));
        const txt = el("span", { class: "otext" },
            q.optionsMono ? `<pre class="optpre">${esc(o.text)}</pre>` : esc(o.text));
        lab.appendChild(txt);
        if (show) {
            const ticked = inp.checked;
            let cls, msg;
            if (ticked && o.correct) { cls = "ok"; msg = multi ? `✓ Correct, ticked (+${fmt(res.unit)})` : "✓ Correct answer, chosen"; }
            else if (ticked && !o.correct) { cls = "bad"; msg = multi ? `✗ Incorrect, ticked (−${fmt(res.unit)})` : "✗ Your answer, incorrect"; }
            else if (!ticked && o.correct) { cls = "miss"; msg = multi ? "◐ Missed: this option is correct" : "◐ This was the correct answer"; }
            else { cls = "neutral"; msg = "Not ticked, correctly left out"; }
            lab.classList.add(cls);
            txt.appendChild(el("span", { class: "fb" }, msg));
        }
        box.appendChild(lab);
        rows.push({ lab, inp, o, idx });
    });
    card.appendChild(box);

    if (!locked && state.mode === "practice") {
        const row = el("div", { class: "row" });
        const submit = el("button", { class: "btn", type: "button", id: "submit-mcq" }, "Submit answer");
        submit.addEventListener("click", () => submitMCQ(q));
        row.appendChild(submit);
        card.appendChild(row);
    } else if (!locked) {
        card.appendChild(el("p", { class: "counter" }, "Exam mode: your selection is saved. It will be marked when you finish."));
    }

    if (show) {
        const detail = multi
            ? `${res.nOk} correct tick${res.nOk === 1 ? "" : "s"} +${fmt(res.plus)}, ${res.nBad} wrong tick${res.nBad === 1 ? "" : "s"} −${fmt(res.minus)} (clamped to 0–${q.marks})`
            : (s.sel.length ? "" : "No option was chosen.");
        card.appendChild(verdictBox(res.score, q.marks, detail));
        const ex = q.explanation;
        const notes = order.map(i => q.options[i]).map(o =>
            `<li><strong>${q.optionsMono ? `<code class="inline">${esc(o.text).replace(/\n/g, " / ")}</code>` : esc(o.text)}</strong><br>${esc(o.note)}</li>`).join("");
        card.appendChild(el("details", { class: "expl", open: true },
            `<summary>Explanation</summary>
             <h4>Verdict</h4><p>${esc(ex.verdict)}</p>
             <h4>Reasoning</h4>${ex.reasoning}
             <h4>Every option</h4><ul>${notes}</ul>
             <p class="src"><strong>Source:</strong> ${esc(ex.source)}</p>`));
    }
}

function submitMCQ(q) {
    const s = mcqState(q);
    if (s.submitted || state.finished) return;
    if (!s.sel.length && !confirm("No option selected. Submit with 0 marks?")) return;
    s.submitted = true;
    save();
    renderNav();
    renderQuestion();
    updateTopbar();
}

/* ---------------- Sections 2–3 ---------------- */

function wireTab(ta) {
    ta.addEventListener("keydown", e => {
        if (e.key !== "Tab") return;
        e.preventDefault();
        const s = ta.selectionStart, v = ta.value;
        if (e.shiftKey) {
            const lineStart = v.lastIndexOf("\n", s - 1) + 1;
            const m = v.slice(lineStart).match(/^ {1,4}/);
            if (m) {
                ta.value = v.slice(0, lineStart) + v.slice(lineStart + m[0].length);
                ta.selectionStart = ta.selectionEnd = Math.max(lineStart, s - m[0].length);
            }
        } else {
            ta.value = v.slice(0, s) + "    " + v.slice(ta.selectionEnd);
            ta.selectionStart = ta.selectionEnd = s + 4;
        }
        ta.dispatchEvent(new Event("input"));
    });
}

function renderWrittenBody(q, card) {
    if (q.svg) card.appendChild(diagram(q.svg, q.svgCaption));
    if (q.files && q.files.length) {
        if (q.files.length === 1 && q.section === 2) {
            card.appendChild(codeBlock(q.files[0].code, q.files[0].name, true));
        } else {
            if (q.classList) {
                card.appendChild(el("div", { class: "label-sm" }, "Package hierarchy"));
                card.appendChild(el("pre", { class: "plain" }, esc(q.classList)));
            }
            card.appendChild(el("div", { class: "label-sm" }, "Starter code"));
            q.files.forEach(f => card.appendChild(codeBlock(f.code, f.name, true)));
        }
    }
    if (q.sampleOutput) {
        card.appendChild(el("div", { class: "label-sm" }, "Sample output (your program must print exactly this)"));
        card.appendChild(el("pre", { class: "plain" }, esc(q.sampleOutput)));
    }
    const total = el("div", { class: "qtotal" });
    q.parts.forEach((p, pi) => card.appendChild(renderPart(q, p, pi, total)));
    refreshTotal(q, total);
    card.appendChild(total);
}

function refreshTotal(q, total) {
    const done = q.parts.filter((_, pi) => partState(q, pi).submitted).length;
    if (feedbackVisible(q) || (state.mode === "practice" && done)) {
        total.textContent = `Question total: ${fmt(questionScore(q))} / ${q.marks}  ·  ${done} of ${q.parts.length} parts marked`;
    } else {
        const typed = q.parts.filter((_, pi) => partState(q, pi).text.trim()).length;
        total.textContent = `${typed} of ${q.parts.length} parts answered` + (state.mode === "exam" ? " · marked when you finish" : "");
    }
}

function renderPart(q, p, pi, total) {
    const ps = partState(q, pi);
    const locked = ps.submitted || state.finished;
    const wrap = el("section", { class: "part" });
    wrap.appendChild(el("div", { class: "part-head" },
        `<span class="plabel">${esc(p.label)}</span><span class="pmarks">(${String(p.marks).padStart(2, "0")} marks)</span>`));
    wrap.appendChild(el("div", { class: "pprompt" }, p.prompt));
    const ta = el("textarea", {
        class: "ans", spellcheck: "false", autocomplete: "off", autocorrect: "off", autocapitalize: "off",
        "aria-label": `Answer for ${q.title} ${p.label}`,
        placeholder: p.kind === "code" ? "Type your Java code here…" : "Type your answer here…"
    });
    ta.value = ps.text;
    ta.readOnly = locked;
    wireTab(ta);
    wrap.appendChild(ta);
    const counter = el("div", { class: "counter" });
    const count = () => {
        const v = ta.value;
        counter.textContent = `${v ? v.split("\n").length : 0} lines · ${v.length} characters`;
    };
    count();
    let saveTimer = null;
    ta.addEventListener("input", () => {
        ps.text = ta.value;
        count();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => { save(); renderNav(); updateTopbar(); refreshTotal(q, total); }, 400);
    });
    wrap.appendChild(counter);

    const fb = el("div");
    if (!locked) {
        const row = el("div", { class: "row" });
        if (state.mode === "practice") {
            const submit = el("button", { class: "btn", type: "button" }, "Submit answer");
            submit.addEventListener("click", () => {
                ps.text = ta.value;
                if (!ps.text.trim() && !confirm("Your answer is empty. Submit with 0 marks?")) return;
                submitPart(q, pi);
                save();
                const fresh = renderPart(q, p, pi, total);
                wrap.replaceWith(fresh);
                refreshTotal(q, total);
                renderNav();
                updateTopbar();
            });
            row.appendChild(submit);
        }
        if (p.starter) {
            const ins = el("button", { class: "btn secondary", type: "button" }, "Insert starter code");
            ins.addEventListener("click", () => {
                if (ta.value.trim() && !confirm("Replace what you have typed with the starter code?")) return;
                ta.value = p.starter;
                ta.dispatchEvent(new Event("input"));
                ta.focus();
            });
            row.appendChild(ins);
        }
        if (row.children.length) wrap.appendChild(row);
    }
    if (feedbackVisible(q) || ps.submitted && state.mode === "practice") renderPartFeedback(q, p, pi, fb, total);
    wrap.appendChild(fb);
    return wrap;
}

function submitPart(q, pi) {
    const ps = partState(q, pi);
    ps.submitted = true;
    ps.ticks = autoTicks(q.parts[pi], ps.text);
    ps.edited = q.parts[pi].rubric.map(() => false);
}

function renderPartFeedback(q, p, pi, fb, total) {
    const ps = partState(q, pi);
    if (!ps.submitted) return;
    const vSlot = el("div");
    fb.appendChild(vSlot);
    const recompute = () => {
        vSlot.innerHTML = "";
        vSlot.appendChild(verdictBox(partScore(q, pi), p.marks,
            "Ticked by keyword check where possible. Change any tick that is wrong."));
        refreshTotal(q, total);
    };
    fb.appendChild(el("div", { class: "label-sm" }, "Marking rubric"));
    const ul = el("ul", { class: "rubric" });
    p.rubric.forEach((r, i) => {
        const li = el("li", { class: ps.ticks[i] ? "on" : "" });
        const cb = el("input", { type: "checkbox", "aria-label": r.text });
        cb.checked = !!ps.ticks[i];
        const tagCls = ps.edited[i] ? "edited" : (r.auto ? "auto" : "manual");
        const tagTxt = ps.edited[i] ? "edited" : (r.auto ? "auto" : "tick yourself");
        const tag = el("span", { class: "tag " + tagCls }, tagTxt);
        cb.addEventListener("change", () => {
            ps.ticks[i] = cb.checked;
            ps.edited[i] = true;
            li.classList.toggle("on", cb.checked);
            tag.className = "tag edited";
            tag.textContent = "edited";
            save();
            recompute();
            renderNav();
            updateTopbar();
        });
        li.appendChild(cb);
        const t = el("span", { class: "rtext" }, esc(r.text));
        t.appendChild(tag);
        li.appendChild(t);
        li.appendChild(el("span", { class: "rmarks" }, `${fmt(r.marks)} mark${r.marks === 1 ? "" : "s"}`));
        ul.appendChild(li);
    });
    fb.appendChild(ul);
    recompute();
    const d = el("details", { class: "expl", open: true }, "<summary>Model answer & explanation</summary>");
    d.appendChild(codeBlock(p.modelAnswer, "Model answer", p.kind === "code"));
    if (p.explain) d.appendChild(el("div", null, p.explain));
    d.appendChild(el("h4", null, "Common mistakes"));
    d.appendChild(el("ul", null, p.commonMistakes.map(m => `<li>${esc(m)}</li>`).join("")));
    d.appendChild(el("p", { class: "src" }, `<strong>Source:</strong> ${esc(p.source)}`));
    fb.appendChild(d);
}

/* ================================================================== */
/*  FINISH & RESULTS                                                   */
/* ================================================================== */

function finish() {
    const scope = scopeQuestions();
    const flagged = scope.filter(q => state.flags[q.id]).length;
    const unanswered = scope.filter(q => !isAnswered(q)).length;
    const unsubmitted = state.mode === "practice" ? scope.filter(q => isAnswered(q) && !isSubmitted(q)).length : 0;
    let msg = `You have ${flagged} flagged and ${unanswered} unanswered question${unanswered === 1 ? "" : "s"}`;
    if (unsubmitted) msg += `, and ${unsubmitted} answered but not yet submitted (they will be marked now)`;
    msg += ". Finish anyway?";
    if (!confirm(msg)) return;
    scope.forEach(q => {
        if (q.section === 1) mcqState(q).submitted = true;
        else q.parts.forEach((_, pi) => { if (!partState(q, pi).submitted) submitPart(q, pi); });
    });
    state.finished = true;
    state.finishedAt = Date.now();
    const score = scope.reduce((a, q) => a + questionScore(q), 0);
    const max = scope.reduce((a, q) => a + q.marks, 0);
    const started = state.retry ? state.retry.startedAt : state.startedAt;
    state.attempts.push({
        when: state.finishedAt, mode: state.mode, retry: !!state.retry, score: score, max: max,
        timeMs: state.finishedAt - started,
        overMs: state.retry ? 0 : Math.max(0, state.finishedAt - state.startedAt - DURATION)
    });
    if (!state.retry && (state.best == null || score > state.best)) state.best = score;
    save();
    document.getElementById("banner").hidden = true;
    renderResults();
}

function renderResults() {
    view = "results";
    updateTopbar();
    const app = document.getElementById("app");
    app.innerHTML = "";
    const page = el("div", { class: "page" });
    const card = el("div", { class: "cover-card" });
    const scope = scopeQuestions();
    const score = scope.reduce((a, q) => a + questionScore(q), 0);
    const max = scope.reduce((a, q) => a + q.marks, 0);
    const started = state.retry ? state.retry.startedAt : state.startedAt;
    const used = state.finishedAt - started;
    const over = state.retry ? 0 : Math.max(0, used - DURATION);
    card.appendChild(el("div", { class: "cover-head" },
        `<div class="inst">${state.retry ? "RETRY OF MISSED QUESTIONS" : "RESULTS"} · ${state.mode.toUpperCase()} MODE</div>
         <h1>${state.retry ? "Retry results" : "Your results"}</h1>`));
    card.appendChild(el("div", { class: "bigscore" },
        `<div class="val">${fmt(score)} / ${fmt(max)}</div><div class="sub">${fmt(max ? score / max * 100 : 0)}%</div>`));

    const sec = [1, 2, 3].map(sn => {
        const qs = scope.filter(q => q.section === sn);
        return { sn, got: qs.reduce((a, q) => a + questionScore(q), 0), max: qs.reduce((a, q) => a + q.marks, 0), n: qs.length };
    }).filter(x => x.n);
    const mcqs = scope.filter(q => q.section === 1);
    const best = mcqs.filter(q => q.type === "best"), multi = mcqs.filter(q => q.type === "multi");
    const lost = multi.reduce((a, q) => a + mcqResult(q).lost, 0);
    const stats = el("div", { class: "stats" });
    stats.innerHTML = `
      <div class="stat"><div class="k">Time used</div><div class="v">${fmtTime(used)}</div></div>
      <div class="stat"><div class="k">Overtime</div><div class="v">${state.retry ? "—" : fmtTime(over)}</div></div>
      <div class="stat"><div class="k">Lost to negative marking</div><div class="v">${fmt(lost)}</div></div>
      <div class="stat"><div class="k">Best-answer MCQs</div><div class="v">${fmt(best.reduce((a, q) => a + questionScore(q), 0))} / ${fmt(best.reduce((a, q) => a + q.marks, 0))}</div></div>
      <div class="stat"><div class="k">Multi-answer MCQs</div><div class="v">${fmt(multi.reduce((a, q) => a + questionScore(q), 0))} / ${fmt(multi.reduce((a, q) => a + q.marks, 0))}</div></div>
      <div class="stat"><div class="k">Best score (full paper)</div><div class="v">${state.best == null ? "—" : fmt(state.best) + " / 100"}</div></div>`;
    card.appendChild(stats);

    card.appendChild(el("h2", null, "By section"));
    const names = { 1: "Section 1 — MCQs", 2: "Section 2 — Structured", 3: "Section 3 — Coding" };
    card.appendChild(el("table", { class: "plain" },
        `<tr><th>Section</th><th class="num">Marks</th><th></th></tr>` + sec.map(x =>
            `<tr><td>${names[x.sn]}</td><td class="num">${fmt(x.got)} / ${fmt(x.max)}</td>
             <td><div class="bar-mini"><div style="width:${x.max ? x.got / x.max * 100 : 0}%"></div></div></td></tr>`).join("")));

    const topics = {};
    scope.forEach(q => {
        const t = topics[q.topic] || (topics[q.topic] = { got: 0, max: 0 });
        t.got += questionScore(q);
        t.max += q.marks;
    });
    card.appendChild(el("h2", null, "By topic"));
    card.appendChild(el("table", { class: "plain" },
        `<tr><th>Topic</th><th class="num">Marks</th><th class="num">%</th></tr>` +
        Object.keys(topics).map(k => `<tr><td>${esc(k)}</td><td class="num">${fmt(topics[k].got)} / ${fmt(topics[k].max)}</td>
            <td class="num">${fmt(topics[k].got / topics[k].max * 100)}</td></tr>`).join("")));

    const missed = scope.filter(q => questionScore(q) < q.marks - 1e-9);
    card.appendChild(el("h2", null, `Missed or partly missed (${missed.length})`));
    if (missed.length) {
        const ul = el("ul", { class: "missed" });
        missed.forEach(q => {
            const li = el("li");
            const a = el("a", { href: "#" },
                `<span>Q${q.num} · ${esc(q.section === 1 ? "Question " + q.num : q.title)} · ${esc(q.topic)}</span>
                 <span class="sc">${fmt(questionScore(q))} / ${q.marks}</span>`);
            a.addEventListener("click", e => { e.preventDefault(); goTo(q.index); });
            li.appendChild(a);
            ul.appendChild(li);
        });
        card.appendChild(ul);
    } else {
        card.appendChild(el("p", null, "Nothing missed. Full marks on every question in this attempt."));
    }

    const row = el("div", { class: "row" });
    const review = el("button", { class: "btn secondary", type: "button" }, "Review all answers");
    review.addEventListener("click", () => goTo(scope[0].index));
    row.appendChild(review);
    if (missed.length) {
        const retry = el("button", { class: "btn", type: "button" }, `Retry missed only (${missed.length})`);
        retry.addEventListener("click", () => startRetry(missed.map(q => q.id)));
        row.appendChild(retry);
    }
    const fresh = el("button", { class: "btn secondary", type: "button" }, "New attempt");
    fresh.addEventListener("click", () => {
        if (!confirm("Start a new attempt? This attempt's answers will be cleared; its score stays in the history.")) return;
        state = Object.assign(freshState(state.mode), { active: false });
        save();
        renderCover();
    });
    row.appendChild(fresh);
    card.appendChild(row);

    if (state.attempts.length) {
        card.appendChild(el("h2", null, "Attempt history"));
        card.appendChild(el("table", { class: "plain" },
            `<tr><th>When</th><th>Type</th><th class="num">Score</th><th class="num">Time</th></tr>` +
            state.attempts.slice().reverse().map(a =>
                `<tr><td>${esc(new Date(a.when).toLocaleString())}</td><td>${a.retry ? "Retry (practice)" : esc(a.mode) + " · full paper"}</td>
                 <td class="num">${fmt(a.score)} / ${fmt(a.max)}</td><td class="num">${fmtTime(a.timeMs)}${a.overMs ? " (+" + fmtTime(a.overMs) + ")" : ""}</td></tr>`).join("")));
    }
    page.appendChild(card);
    app.appendChild(page);
    window.scrollTo(0, 0);
}

function startRetry(ids) {
    ids.forEach(id => {
        const q = BY_ID[id];
        if (q.section === 1) state.mcq[id] = { sel: [], submitted: false };
        else delete state.written[id];
    });
    state.retry = { ids: ids, startedAt: Date.now() };
    state.mode = "practice";
    state.finished = false;
    state.finishedAt = null;
    state.current = BY_ID[ids[0]].index;
    save();
    showBanner(`Retry: ${ids.length} question${ids.length === 1 ? "" : "s"} you missed, in practice mode. Your original score stays in the attempt history.`, "info");
    renderExam();
}

/* ================================================================== */
/*  WIRING                                                             */
/* ================================================================== */

document.getElementById("finish-btn").addEventListener("click", finish);
document.getElementById("results-btn").addEventListener("click", renderResults);

document.addEventListener("keydown", e => {
    if (view !== "exam") return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "textarea" || tag === "input" && e.target.type === "text") return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const q = QUESTIONS[state.current];
    if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
    else if (e.key === "f" || e.key === "F") { toggleFlag(); e.preventDefault(); }
    else if (q.section === 1 && /^[1-5]$/.test(e.key)) {
        const inputs = document.querySelectorAll(`#${q.id} .opt input`);
        const inp = inputs[Number(e.key) - 1];
        if (inp && !inp.disabled) {
            if (inp.type === "radio") inp.checked = true;
            else inp.checked = !inp.checked;
            inp.dispatchEvent(new Event("change"));
            e.preventDefault();
        }
    } else if (e.key === "Enter" && q.section === 1 && tag !== "button") {
        const b = document.getElementById("submit-mcq");
        if (b) { b.click(); e.preventDefault(); }
    }
});

(function themeToggle() {
    const root = document.documentElement;
    const btn = document.getElementById("theme-toggle");
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const current = () => root.getAttribute("data-theme") || (mq.matches ? "dark" : "light");
    const label = () => {
        const dark = current() === "dark";
        btn.textContent = dark ? "☀ Light" : "☾ Dark";
        btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    };
    btn.addEventListener("click", () => {
        const next = current() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("ooad-theme", next); } catch (e) { /* storage blocked */ }
        label();
    });
    mq.addEventListener("change", label);
    label();
})();

/* ================================================================== */
/*  SELF-TEST  (open with ?selftest=1)                                 */
/* ================================================================== */

function selfTest() {
    const lines = [];
    let fails = 0;
    const check = (ok, msg) => { if (!ok) fails++; lines.push(`${ok ? "PASS" : "FAIL"} ${msg}`); };
    const total = QUESTIONS.reduce((a, q) => a + q.marks, 0);
    const bySec = [1, 2, 3].map(s => QUESTIONS.filter(q => q.section === s).reduce((a, q) => a + q.marks, 0));
    check(total === 100 && bySec.join() === "30,30,40", `marks total ${total} (sections ${bySec.join(" / ")})`);
    const mcq = QUESTIONS.filter(q => q.section === 1);
    const multi = mcq.filter(q => q.type === "multi"), best = mcq.filter(q => q.type === "best");
    check(mcq.length === 14 && multi.length === 9 && best.length === 5, `MCQ counts: ${mcq.length} total, ${multi.length} multi, ${best.length} best`);
    check(multi.every(q => q.options.length === 5) && best.every(q => q.options.length === 4), "multi-answer has 5 options, best-answer has 4");
    check(best.every(q => q.options.filter(o => o.correct).length === 1), "every best-answer question has exactly one correct option");
    const ks = multi.map(q => q.options.filter(o => o.correct).length);
    const dist = [1, 2, 3, 4].map(k => ks.filter(x => x === k).length).join(",");
    check(dist === "1,3,3,2", `multi-answer correct-count distribution (1,2,3,4 correct): ${dist}`);
    const tiers = [1, 2, 3].map(t => mcq.filter(q => q.tier === t).length).join(",");
    check(tiers === "2,5,7", `tiers 1/2/3: ${tiers}`);
    const three = mcq.filter(q => q.marks === 3);
    check(three.length === 2 && three.every(q => q.type === "multi" && q.tier === 3), "the two 3-mark questions are Tier-3 multi-answer");
    let longest = 0, shortest = 0;
    mcq.forEach(q => {
        const L = q.options.map(o => o.text.length);
        const mx = Math.max(...L), mn = Math.min(...L);
        check(mx / mn <= 1.25, `${q.id} option length ratio ${(mx / mn).toFixed(3)}`);
        if (q.options.some((o, i) => o.correct && L[i] === mx)) longest++;
        if (q.options.some((o, i) => o.correct && L[i] === mn)) shortest++;
        check(q.options.every(o => o.note && o.note.length > 20), `${q.id} every option has a note`);
    });
    check(longest <= 6, `longest option is correct in ${longest} questions (limit 6)`);
    check(shortest >= 5, `shortest option is correct in ${shortest} questions (need >= 5)`);
    const code = mcq.filter(q => q.code || q.codes).length, svg = mcq.filter(q => q.svg).length;
    check(code >= 6 && svg >= 3, `MCQs with code: ${code} (>= 6), with diagrams: ${svg} (>= 3)`);
    QUESTIONS.filter(q => q.parts).forEach(q => {
        const partSum = q.parts.reduce((a, p) => a + p.marks, 0);
        check(Math.abs(partSum - q.marks) < 1e-9, `${q.id}: parts sum to ${partSum} / ${q.marks}`);
        q.parts.forEach(p => {
            const rubricSum = p.rubric.reduce((a, r) => a + r.marks, 0);
            const autoMax = p.rubric.reduce((a, r) => a + (r.auto ? r.marks : 0), 0);
            const sc = t => p.rubric.reduce((a, r) => a + (r.auto && runCheck(r.check, t, p.kind) ? r.marks : 0), 0);
            const model = sc(p.modelAnswer), empty = sc("");
            const wrong = p.wrongAnswers.map(sc);
            const ok = Math.abs(rubricSum - p.marks) < 1e-9 && Math.abs(model - autoMax) < 1e-9 &&
                empty === 0 && wrong.length > 0 && wrong.every(w => w < p.marks) &&
                p.rubric.every(r => r.marks >= 0.5 && r.marks <= 2);
            check(ok, `${q.id} ${p.label}: rubric ${rubricSum}/${p.marks} · model ${model}/${autoMax} · empty ${empty} · wrong [${wrong.join(", ")}]`);
        });
    });
    lines.unshift(`SELF-TEST: ${fails} failure${fails === 1 ? "" : "s"}`);
    const out = lines.join("\n");
    console.log(out);
    const box = document.getElementById("selftest");
    box.textContent = out;
    box.style.display = "block";
    window.__selftest = { fails, out };
}

/* ================================================================== */
/*  START                                                              */
/* ================================================================== */

if (/[?&]selftest=1/.test(location.search)) selfTest();
if (state && state.active && !state.finished && /[?&]resume=1/.test(location.search)) renderExam();
else renderCover();
startTimer();
</script>
