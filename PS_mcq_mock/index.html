546.3,232.9 548.7,233.0 551.0,233.1 553.3,233.2 555.7,233.3 558.0,233.4 560.3,233.5 562.7,233.5 565.0,233.6 567.3,233.6 569.7,233.7 572.0,233.7 574.3,233.7 576.7,233.8 579.0,233.8 581.3,233.8 583.7,233.8 586.0,233.9 588.3,233.9 590.7,233.9 593.0,233.9 595.3,233.9 597.7,233.9 600.0,233.9\" class=\"curve\"/>\n<line x1=\"40.0\" y1=\"234.0\" x2=\"600.0\" y2=\"234.0\" class=\"ax\"/>\n<line x1=\"110.0\" y1=\"234.0\" x2=\"110.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"110.0\" y=\"261.0\" text-anchor=\"middle\">55<\/text>\n<line x1=\"180.0\" y1=\"234.0\" x2=\"180.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"180.0\" y=\"261.0\" text-anchor=\"middle\">70<\/text>\n<line x1=\"250.0\" y1=\"234.0\" x2=\"250.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"250.0\" y=\"261.0\" text-anchor=\"middle\">85<\/text>\n<line x1=\"320.0\" y1=\"234.0\" x2=\"320.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"320.0\" y=\"261.0\" text-anchor=\"middle\">100<\/text>\n<line x1=\"390.0\" y1=\"234.0\" x2=\"390.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"390.0\" y=\"261.0\" text-anchor=\"middle\">115<\/text>\n<line x1=\"460.0\" y1=\"234.0\" x2=\"460.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"460.0\" y=\"261.0\" text-anchor=\"middle\">130<\/text>\n<line x1=\"530.0\" y1=\"234.0\" x2=\"530.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"530.0\" y=\"261.0\" text-anchor=\"middle\">145<\/text>\n<text x=\"320.0\" y=\"288.0\" text-anchor=\"middle\" class=\"axlab\">Score<\/text>\n<\/svg>","figcap":null,"options":[{"text":"P(X > 115) is equal to P(X < 85), by the symmetry of the curve.","correct":true,"note":"TRUE. 85 and 115 are 1 SD either side of the mean, and the curve is symmetric."},{"text":"The shaded area equals 2Φ(1.00) − 1 ≈ 0.6826 of the total.","correct":true,"note":"TRUE. Φ(1) − Φ(−1) = Φ(1) − (1 − Φ(1)) = 2Φ(1) − 1 = 0.6826."},{"text":"P(X > 130) is half of P(X > 115), being twice as far out.","correct":false,"note":"FALSE. Normal tails shrink much faster than linearly: P(Z > 2) = 0.0228 against P(Z > 1) = 0.1587, about a seventh."},{"text":"The mean, the median and the mode of the scores are all 100.","correct":true,"note":"TRUE. The normal curve is symmetric and has a single peak, so all three coincide (L3 slide 69)."},{"text":"P(X ≤ 100) = 0.5, as half of the scores lie at or below 100.","correct":true,"note":"TRUE. 100 is the centre of symmetry. (P(X = 100) itself is 0, so ≤ and < give the same value.)"}],"explanation":{"verdict":"Tick all except 'P(X > 130) is half of P(X > 115)'. The skill tested is using symmetry and standardising with a normal curve.","reasoning":"<p>For X ~ N(μ, σ²), z = (x − μ)/σ standardises to the Z table (L3 slide 70). The curve is symmetric with mean = median = mode, and 50% of the area lies on each side (L3 slide 69). So P(Z &gt; z) = P(Z &lt; −z) and P(−z &lt; Z &lt; z) = 2Φ(z) − 1. Tail areas are not proportional to distance from the mean.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 69–73"},"forms":["fig"],"paper":2,"num":25},{"id":"p2-l6c","type":"multi","marks":2,"lecture":"L6","lectures":["L6"],"kind":"theory","tier":1,"archetype":"A1","trap":null,"pattern":["A1","MOCK-Q15a"],"topic":"Additive vs multiplicative models","stem":"<p>Which statements about the two time-series models are <strong>INCORRECT<\/strong>?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"In an additive model the gap between peak and trough is about the same size every year.","correct":false,"note":"Correct statement, so leave it. 'Difference between peak and lowest values is similar each year' (L6 slide 11)."},{"text":"In a multiplicative model the seasonal effect is a fixed amount added to the trend.","correct":true,"note":"Incorrect, so tick it. In a multiplicative model S is an index that multiplies the trend. Fixed added units describe the additive model."},{"text":"In a multiplicative model a higher trend brings larger seasonal swings in the series.","correct":false,"note":"Correct statement. 'Higher trend results in larger seasonal fluctuations' (L6 slide 13)."},{"text":"A series with a strong upward trend has to be modelled multiplicatively.","correct":true,"note":"Incorrect, so tick it. A trend alone does not decide it. The slides' additive Trend + Seasonality example also rises; what matters is whether the swings grow."},{"text":"In an additive model the seasonal effects are measured in the series' own units.","correct":false,"note":"Correct statement. Y = T + S + C + I adds S to T, so S is in the same units (e.g. thousands of visitors)."}],"explanation":{"verdict":"Tick the two incorrect statements: 'multiplicative S is a fixed amount' and 'a trend means multiplicative'. The skill tested is the defining difference between the two models.","reasoning":"<p>The slides' comparison table (L6 slide 14): additive has a constant seasonal effect, uses addition and has constant variation; multiplicative has a seasonal effect that changes with the trend, uses multiplication and has proportional variation.<\/p>","source":"L6 · L6 - Time Series Analysis.pdf, slides 10–14, 16"},"forms":["neg"],"paper":2,"num":26},{"id":"p2-l1c","type":"best","marks":2,"lecture":"L1","lectures":["L1","L4"],"kind":"theory","tier":3,"archetype":"A8","trap":null,"pattern":["A8","F2024-Q1a","MOCK-Q11c"],"topic":"Sampling frame and inference","stem":"<p>A city council wants the mean weekly hours that residents spend volunteering. It draws a simple random sample of 500 numbers from the city's landline directory. About 40% of households, mostly younger renters, have no landline. The resulting 95% confidence interval for the mean is (3.1, 3.7) hours.<\/p><div class=\"claims\"><p><span class=\"who\">Student A:<\/span> “The numbers were drawn at random, so this is a probability sample and the interval describes all residents.”<\/p><p><span class=\"who\">Student B:<\/span> “The randomness only covers people in the directory. Households without landlines had no chance of being chosen, so the interval may miss the residents' true mean.”<\/p><\/div><p>Who is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Student B, because a sample can only represent the units listed in its sampling frame.","correct":true,"note":"Correct. The sampling frame is 'the list … from which a sample is drawn' (L1 slide 16). People missing from it had zero chance of selection, so the results generalise only to people on the list."},{"text":"Student A, because random selection removes every possible source of bias from a survey.","correct":false,"note":"Random selection removes selection bias only within the frame. It cannot reach the 40% the frame leaves out."},{"text":"Student B, because a confidence interval needs a sample of far more than 500 people.","correct":false,"note":"Right student, wrong reason. A sample of 500 is plenty for a confidence interval. The problem is the coverage of the frame, not the sample size."},{"text":"Student A, because a 95% interval already allows for anyone the frame happened to miss.","correct":false,"note":"A confidence interval accounts for random sampling error only (L4 slide 4). Systematic under-coverage is a bias it cannot detect."}],"explanation":{"verdict":"Student B is correct. Inference reaches only the population the sampling frame covers.","reasoning":"<p>For simple random sampling 'your sampling frame should include the whole population' (L1 slide 25). Here the frame (landline directory) misses a group that may volunteer differently, so the estimate can be biased. The confidence interval's 95% is about repeated random samples from the same frame (L4 slides 4–5), so it describes the frame's population only.<\/p>","source":"L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slides 16, 24–25; L4 · L4 – Statistical Inference (2).pdf, slides 4–5"},"forms":["ab","combo"],"paper":2,"num":27},{"id":"p2-l3d","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"calculation","tier":2,"archetype":"A4","trap":null,"pattern":["A4","MOCK-Q06b","MOCK-Q06c","MOCK-Q06a"],"topic":"Binomial probabilities and moments","stem":"<p>20% of calls to an internet provider's helpline are complaints, independently of each other. In a run of 8 calls, X is the number of complaints.<\/p><p>Which statements are TRUE (3 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"P(X = 2) ≈ 0.294, using the binomial pmf with n = 8.","correct":true,"note":"TRUE. C(8, 2) × 0.2² × 0.8⁶ = 28 × 0.04 × 0.262144 = 0.2936."},{"text":"P(X = 2) ≈ 0.010, from 0.2² × 0.8⁶ for the two complaints.","correct":false,"note":"FALSE. This leaves out C(8, 2) = 28, the number of orders in which 2 complaints can occur among 8 calls."},{"text":"E(X) = 1.6 and V(X) = 1.28 for the number of complaints.","correct":true,"note":"TRUE. E(X) = np = 8 × 0.2 = 1.6 and V(X) = np(1 − p) = 1.6 × 0.8 = 1.28."},{"text":"V(X) = 1.6, the same as E(X), as holds for any count of events.","correct":false,"note":"FALSE. Mean = variance is a Poisson property. The binomial variance is np(1 − p), which is smaller than np."},{"text":"P(at least one complaint) = 1 − 0.2⁸ ≈ 1.000 for the 8 calls.","correct":false,"note":"FALSE. 'None' means all 8 calls are NOT complaints, with probability 0.8⁸. So P(X ≥ 1) = 1 − 0.8⁸ = 0.832."}],"explanation":{"verdict":"Tick two: P(X = 2) ≈ 0.294, and E = 1.6, V = 1.28. The skill tested is the binomial pmf and its moments, and the complement rule.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>P(X = 2)<\/td><td>C(8,2) p² (1 − p)⁶<\/td><td class=\"num\">0.2936<\/td><\/tr><tr><td>E(X)<\/td><td>np<\/td><td class=\"num\">1.6<\/td><\/tr><tr><td>V(X)<\/td><td>np(1 − p)<\/td><td class=\"num\">1.28<\/td><\/tr><tr><td>P(X ≥ 1)<\/td><td>1 − (1 − p)⁸<\/td><td class=\"num\">0.8322<\/td><\/tr><\/table><\/div>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 18, 62–64"},"forms":[],"paper":2,"num":28},{"id":"p2-l3g","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":3,"archetype":"A2","trap":null,"pattern":["A2","F2025-Q3a"],"topic":"Variance of a difference (derivation)","stem":"<p>The net weight N of a packed cheese is its gross weight G minus its packaging weight W. G and W are independent, with V(G) = 9 g² and V(W) = 4 g². A student argues:<\/p><ol class=\"derivation\"><li>N = G − W<\/li><li>E(N) = E(G) − E(W)<\/li><li>V(N) = V(G) − V(W) = 9 − 4 = 5 g²<\/li><li>SD(N) = √5 ≈ 2.24 g<\/li><\/ol><p>Which step is the first wrong one?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Step 3: for independent G and W, V(G − W) = V(G) + V(W) = 13 g²","correct":true,"note":"Correct. Var(X − Y) = Var(X) + Var(Y) − 2Cov(X, Y), and Cov = 0 for independent variables, so V(N) = 13 g² and SD = 3.61 g."},{"text":"Step 2: E(G − W) = E(G) − E(W) is valid only when G and W are independent","correct":false,"note":"The difference rule for expectations holds even for dependent variables (L3 slide 56). Step 2 is fine."},{"text":"Step 4: the SD of a difference is SD(G) − SD(W) = 3 − 2 = 1 g, not √5","correct":false,"note":"Standard deviations do not add or subtract. Variances combine first, and then you take the square root."},{"text":"No step is wrong: subtracting a variable subtracts its variance as well","correct":false,"note":"Subtracting a variable adds its variance, because the uncertainty from both parts builds up."}],"explanation":{"verdict":"Step 3 is the first wrong step: V(G − W) = V(G) + V(W) = 13 g² for independent variables. The idea tested is the variance property for a difference.","reasoning":"<p>From the slides' variance table: Var(X − Y) = Var(X) + Var(Y) − 2Cov(X, Y), and for independent variables the covariance term is 0 (L3 slide 57). Intuitively, each weight brings its own random error, and taking a difference cannot cancel independent errors. The expectation rule E(X − Y) = E(X) − E(Y) holds even for dependent variables (L3 slide 56).<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 56–57"},"forms":[],"paper":2,"num":29},{"id":"p2-l4g","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":3,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q12b","F2024-Q3d.ii"],"topic":"Reading a t-test decision","stem":"<p>A two-tailed one-sample t-test with n = 15 gives t<sub>cal<\/sub> = 2.41. Critical values: t<sub>(14), 0.025<\/sub> = 2.145 and t<sub>(14), 0.005<\/sub> = 2.977.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 640 306\" style=\"max-width:704px\" role=\"img\" aria-label=\"t distribution with 14 df, both 2.5% tails shaded, and a dashed line at t = 2.41\">\n<path d=\"M40.0,240.0 L40.0,239.4 L43.5,239.3 L47.0,239.2 L50.5,239.1 L54.0,239.1 L57.5,239.0 L61.0,238.8 L64.5,238.7 L68.0,238.6 L71.5,238.4 L75.0,238.3 L78.5,238.1 L82.0,237.9 L85.5,237.7 L89.0,237.4 L92.5,237.2 L96.0,236.9 L99.5,236.6 L103.0,236.2 L106.5,235.8 L110.0,235.4 L113.5,234.9 L117.0,234.4 L120.5,233.8 L124.0,233.2 L127.5,232.5 L131.0,231.7 L134.5,230.9 L138.0,230.0 L141.5,229.0 L145.0,228.0 L148.5,226.8 L152.0,225.5 L155.5,224.2 L159.0,222.7 L162.5,221.1 L166.0,219.3 L169.5,217.5 L169.5,240.0 Z\" class=\"shade\"/>\n<path d=\"M470.5,240.0 L470.5,217.5 L474.0,219.3 L477.5,221.1 L481.0,222.7 L484.5,224.2 L488.0,225.5 L491.5,226.8 L495.0,228.0 L498.5,229.0 L502.0,230.0 L505.5,230.9 L509.0,231.7 L512.5,232.5 L516.0,233.2 L519.5,233.8 L523.0,234.4 L526.5,234.9 L530.0,235.4 L533.5,235.8 L537.0,236.2 L540.5,236.6 L544.0,236.9 L547.5,237.2 L551.0,237.4 L554.5,237.7 L558.0,237.9 L561.5,238.1 L565.0,238.3 L568.5,238.4 L572.0,238.6 L575.5,238.7 L579.0,238.8 L582.5,239.0 L586.0,239.1 L589.5,239.1 L593.0,239.2 L596.5,239.3 L600.0,239.4 L600.0,240.0 Z\" class=\"shade\"/>\n<polyline points=\"40.0,239.4 43.5,239.3 47.0,239.2 50.5,239.1 54.0,239.1 57.5,239.0 61.0,238.8 64.5,238.7 68.0,238.6 71.5,238.4 75.0,238.3 78.5, >\n<text x=\"110.0\" y=\"267.0\" text-anchor=\"middle\">−3<\/text>\n<line x1=\"169.8\" y1=\"240.0\" x2=\"169.8\" y2=\"245.0\" class=\"ax\"/>\n<text x=\"169.8\" y=\"267.0\" text-anchor=\"middle\">−2.145<\/text>\n<line x1=\"320.0\" y1=\"240.0\" x2=\"320.0\" y2=\"245.0\" class=\"ax\"/>\n<text x=\"320.0\" y=\"267.0\" text-anchor=\"middle\">0<\/text>\n<line x1=\"470.1\" y1=\"240.0\" x2=\"470.1\" y2=\"245.0\" class=\"ax\"/>\n<text x=\"470.1\" y=\"267.0\" text-anchor=\"middle\">2.145<\/text>\n<line x1=\"565.0\" y1=\"240.0\" x2=\"565.0\" y2=\"245.0\" class=\"ax\"/>\n<text x=\"565.0\" y=\"267.0\" text-anchor=\"middle\">3.5<\/text>\n<text x=\"320.0\" y=\"294.0\" text-anchor=\"middle\" class=\"axlab\">t (14 df)<\/text>\n<rect x=\"43.5\" y=\"30\" width=\"22\" height=\"12\" class=\"shade\"/>\n<text x=\"73.5\" y=\"40.5\" text-anchor=\"start\" class=\"legend\">rejection region, α = 0.05<\/text>\n<line x1=\"54.5\" y1=\"58.0\" x2=\"54.5\" y2=\"74.0\" class=\"marker\"/>\n<text x=\"73.5\" y=\"70.5\" text-anchor=\"start\" class=\"legend\">observed t = 2.41<\/text>\n<\/svg>","figcap":null,"options":[{"text":"H0 is rejected at the 5% significance level (two-tailed).","correct":true,"note":"TRUE. 2.41 > 2.145, so t_cal falls in the upper rejection region."},{"text":"H0 is rejected at the 1% significance level (two-tailed).","correct":false,"note":"FALSE. At 1% the two-tailed cut-off is 2.977, and 2.41 < 2.977."},{"text":"A right-tailed 5% test, with cut-off 1.761, would also reject H0.","correct":true,"note":"TRUE. 2.41 > 1.761. A one-tailed cut-off is less extreme than the two-tailed one at the same α."},{"text":"The test uses 15 degrees of freedom, one for each observation.","correct":false,"note":"FALSE. A one-sample t-test has n − 1 = 14 degrees of freedom (L4 slide 25)."},{"text":"Rejecting H0 at 5% means there is a 5% chance that H0 is true.","correct":false,"note":"FALSE. α = 0.05 is the probability of rejecting H0 WHEN it is true. It is not the probability that H0 is true."}],"explanation":{"verdict":"Tick two: reject at 5% two-tailed, and the right-tailed test also rejects. The skill tested is reading a t decision at different α and tails.","reasoning":"<p>Two-tailed t-test: reject H0 if t_cal &gt; t(n−1, α/2) or t_cal &lt; −t(n−1, α/2) (L4 slide 26). One-tailed (right): reject if t_cal &gt; t(n−1, α) (L4 slide 27). The significance level is P(Type I error) = P(reject H0 | H0 true) (L4 slides 15–16).<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 15–16, 25–30"},"forms":["fig"],"paper":2,"num":30},{"id":"p2-l1b","type":"multi","marks":2,"lecture":"L1","lectures":["L1"],"kind":"calculation","tier":2,"archetype":"A4","trap":null,"pattern":["A4","MOCK-Q01c","MOCK-Q01b"],"topic":"Proportionate vs equal allocation","stem":"<p>A water board serves 10,000 households: Urban 5,000, Semi-urban 3,000 and Rural 2,000. It wants a sample of 300 to estimate mean daily water use. Plan X takes 100 households at random from each area.<\/p><p>Which statements are <strong>FALSE<\/strong>?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Proportionate allocation would take 150 urban, 90 semi-urban and 60 rural homes in total.","correct":false,"note":"TRUE statement, so leave it. 5,000/10,000 × 300 = 150, 3,000/10,000 × 300 = 90, 2,000/10,000 × 300 = 60."},{"text":"Under Plan X, a rural household is 2.5 times as likely to be chosen as an urban one.","correct":false,"note":"TRUE statement. Rural: 100/2,000 = 5%; urban: 100/5,000 = 2%; 5%/2% = 2.5."},{"text":"Plan X is not a probability sample, since the areas get unequal shares of it.","correct":true,"note":"FALSE, so tick it. Households are still chosen at random within each area, each with a known non-zero chance. Unequal shares do not make the plan non-probability."},{"text":"If rural homes use less water, Plan X's unweighted mean will understate overall use.","correct":false,"note":"TRUE statement. Rural homes are over-represented (100 sampled instead of 60), so their lower use drags the unweighted mean down unless results are weighted."},{"text":"Plan X is proportionate, since each area gets the same one-third share of the sample.","correct":true,"note":"FALSE, so tick it. Proportionate means each area's sample share matches its population share (50%, 30%, 20%), not equal shares."}],"explanation":{"verdict":"Tick the two FALSE claims: 'not a probability sample' and 'Plan X is proportionate'. The skill tested is computing proportionate allocation and judging what equal allocation does to representativeness.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Urban<\/td><td>5,000 / 10,000 × 300<\/td><td class=\"num\">150<\/td><\/tr><tr><td>Semi-urban<\/td><td>3,000 / 10,000 × 300<\/td><td class=\"num\">90<\/td><\/tr><tr><td>Rural<\/td><td>2,000 / 10,000 × 300<\/td><td class=\"num\">60<\/td><\/tr><tr><td>Plan X chance (rural)<\/td><td>100 / 2,000<\/td><td class=\"num\">0.05<\/td><\/tr><tr><td>Plan X chance (urban)<\/td><td>100 / 5,000<\/td><td class=\"num\">0.02<\/td><\/tr><\/table><\/div>","source":"L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slides 24, 26"},"forms":["neg"],"paper":2,"num":31},{"id":"p2-l2a","type":"multi","marks":2,"lecture":"L2","lectures":["L2"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","F2025-Q1c","MOCK-Q02c"],"topic":"Skewness from mean, median and mode","stem":"<p>For the ages at which 400 employees of a firm retired, the summary is: mean 58.3, median 60.5 and mode 62 years.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The distribution of these retirement ages is negatively (left) skewed.","correct":true,"note":"TRUE. mean < median < mode is the signature of negative skew."},{"text":"A few employees who retired much earlier pull the mean below the median.","correct":true,"note":"TRUE. The long left tail of early retirements drags the mean down, while the median resists."},{"text":"Its skewness coefficient is positive, as the mode is the largest value.","correct":false,"note":"FALSE. The skew is named after the tail. Mode > median > mean means the tail is on the left, so skewness is negative."},{"text":"Kurtosis is a separate measure: it describes the tails, not the skew's direction.","correct":true,"note":"TRUE. The slides give skewness and kurtosis as two different shape measures. Kurtosis classifies tails as light (platykurtic) or heavy (leptokurtic)."},{"text":"The median is a better 'typical age' here, as early retirees affect it less.","correct":true,"note":"TRUE. With skew, the median represents the centre better than the mean."}],"explanation":{"verdict":"Tick all except 'the skewness is positive'. The skill tested is reading skew from the order of mean, median and mode.","reasoning":"<p>Symmetric: mean = median = mode. Positive (right) skew: mode &lt; median &lt; mean. Negative (left) skew: mean &lt; median &lt; mode (L2 slide 23; the May 2025 final asked for exactly these patterns). Kurtosis is a second, separate measure of shape: mesokurtic (excess 0), platykurtic (light tails, negative) and leptokurtic (heavy tails, positive).<\/p>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 4–7, 22–23"},"forms":[],"paper":2,"num":32},{"id":"p2-l3a","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":1,"archetype":"A5","trap":3,"pattern":["A5","F2024-Q2b","MOCK-Q04a"],"topic":"Mutually exclusive check","stem":"<p>In a city survey, P(a respondent owns a car) = 0.70 and P(a respondent uses public transport weekly) = 0.45.<\/p><p>Which conclusion is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"They cannot be mutually exclusive, as P(A) + P(B) = 1.15 exceeds 1","correct":true,"note":"Correct. If they were exclusive, P(A ∪ B) = P(A) + P(B) = 1.15 > 1, which is impossible. So P(A ∩ B) ≥ 0.15."},{"text":"They must be mutually exclusive, as car owners rarely need public transport","correct":false,"note":"This uses intuition instead of the arithmetic test. The numbers force an overlap of at least 0.15."},{"text":"They must be independent, as P(A) + P(B) = 1.15 is larger than 1","correct":false,"note":"The sum tells you about overlap. Independence needs P(A ∩ B) = P(A)P(B), which is not given here."},{"text":"They are exclusive only if P(A ∩ B) = 0.70 × 0.45 = 0.315 exactly","correct":false,"note":"P(A)P(B) is the independence condition. Exclusive means P(A ∩ B) = 0."}],"explanation":{"verdict":"They cannot be mutually exclusive, because the probabilities sum to 1.15 > 1.","reasoning":"<p>For mutually exclusive events P(A ∪ B) = P(A) + P(B) (L3 slide 18), but no probability can exceed 1 (L3 slide 15). So whenever P(A) + P(B) &gt; 1 the events must overlap: P(A ∩ B) = P(A) + P(B) − P(A ∪ B) ≥ 0.15. This is the October 2024 final's 0.8 + 0.9 question with new numbers.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 7, 15, 18"},"forms":[],"paper":2,"num":33},{"id":"p2-l4b","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","F2024-Q3c","F2025-Q3d"],"topic":"Interpreting a CI for a difference","stem":"<p>Two teaching formats are compared. A 95% pooled-variance confidence interval for μ<sub>online<\/sub> − μ<sub>classroom<\/sub> (exam marks) is (−4.2, 2.6).<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"It contains 0, so there is no evidence at 5% that the mean marks differ.","correct":true,"note":"TRUE. 0 is a plausible value of the difference, as in the lecturer's pooled-CI question, where the interval (−9.43, 33.43) included 0."},{"text":"Most of the interval is below 0, so the online mean is lower.","correct":false,"note":"FALSE. The interval contains 0, so the data cannot tell which mean is larger. How much of it lies below 0 does not matter."},{"text":"The difference in sample means, online minus classroom, was −0.8.","correct":true,"note":"TRUE. The interval is centred on x̄1 − x̄2: (−4.2 + 2.6)/2 = −0.8."},{"text":"A 99% interval from the same data would also contain the value 0.","correct":true,"note":"TRUE. A 99% interval is wider and has the same centre, so it still covers 0."},{"text":"The pooled method assumes the two populations have equal variances.","correct":true,"note":"TRUE. Pooling (Case C) is for σ1² = σ2² unknown, combining both samples into Sp."}],"explanation":{"verdict":"Tick all except the 'online is lower' reading. The skill tested is reading a difference-of-means interval against 0, and the pooled method's assumption.","reasoning":"<p>For μ1 − μ2 the pooled interval is (X̄ − Ȳ) ± t(n+m−2, α/2)·Sp·√(1/n + 1/m), used when the variances are equal but unknown (L4 slide 34). If 0 lies inside, 'no difference' is plausible, so there is no evidence of a difference at that level. A wider (higher-confidence) interval with the same centre keeps 0 inside.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 33–38"},"forms":[],"paper":2,"num":34},{"id":"p2-l6d","type":"multi","marks":2,"lecture":"L6","lectures":["L6"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q15a","MOCK-Q15c"],"topic":"Choosing a model from the swings","stem":"<p>For a quarterly sales series, an analyst tabulates each year's trend level and its seasonal swing (peak minus trough), in units:<\/p><div class=\"tablewrap\"><table class=\"data\"><tr><th>Year<\/th><th class=\"num\">Trend level<\/th><th class=\"num\">Peak − trough<\/th><\/tr><tr><td>2021<\/td><td class=\"num\">200<\/td><td class=\"num\">40<\/td><\/tr><tr><td>2022<\/td><td class=\"num\">310<\/td><td class=\"num\">62<\/td><\/tr><tr><td>2023<\/td><td class=\"num\">425<\/td><td class=\"num\">85<\/td><\/tr><tr><td>2024<\/td><td class=\"num\">540<\/td><td class=\"num\">108<\/td><\/tr><\/table><\/div><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The swing grows roughly in step with the trend, so a multiplicative model fits.","correct":true,"note":"TRUE. The swing is about 20% of the trend every year (40/200, 62/310, 85/425, 108/540), i.e. 'proportional variation'."},{"text":"An additive model fits, since the swing grows by about the same amount each year.","correct":false,"note":"FALSE. An additive model needs the swing itself to stay constant. A swing that keeps growing, even by equal steps, rules it out."},{"text":"The swing as a share of the trend falls each year, from 20% to about 10%.","correct":false,"note":"FALSE. The share stays at about 20% (0.20, 0.20, 0.20, 0.20)."},{"text":"Because the trend is rising, this series has no seasonal component at all.","correct":false,"note":"FALSE. There is a clear peak-to-trough swing every year, i.e. seasonality, on top of the trend."},{"text":"With a 2025 trend level of 650, the swing should again be about 108.","correct":false,"note":"FALSE. That is additive thinking. Multiplicatively the swing scales with the trend: about 0.2 × 650 = 130."}],"explanation":{"verdict":"Only 'multiplicative, as the swing grows in step with the trend' is true. The skill tested is diagnosing additive vs multiplicative from numbers.","reasoning":"<p>Additive: 'seasonal fluctuations remain approximately constant over time'. Multiplicative: 'seasonal fluctuations increase or decrease proportionally with the trend' (L6 slides 10, 12). A constant ratio of swing to trend level is exactly proportional variation (L6 slide 14).<\/p>","source":"L6 · L6 - Time Series Analysis.pdf, slides 10–14"},"forms":[],"paper":2,"num":35},{"id":"p2-l3f","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"calculation","tier":3,"archetype":"A5","trap":6,"pattern":["A5","MOCK-Q09c","MOCK-Q09a","MOCK-Q09b"],"topic":"Memorylessness of the exponential","stem":"<p>The time between failures of a cloud server is exponential with a mean of 6 weeks. The server has now run for 5 weeks without failing.<\/p><p>Which statements are TRUE (3 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"P(no failure in the next 3 weeks) ≈ 0.607, given its survival so far.","correct":true,"note":"TRUE. P(X > 8 | X > 5) = e^(−8/6)/e^(−5/6) = e^(−3/6) = 0.6065."},{"text":"This is lower than for a brand-new server, as this one has aged 5 weeks.","correct":false,"note":"FALSE. For an exponential the conditional probability equals the unconditional P(X > 3) = 0.607. Past running time does not matter (memorylessness)."},{"text":"P(no failure in the next 3 weeks) = P(X > 8) ≈ 0.264 for this server.","correct":false,"note":"FALSE. This ignores the information that the server has already survived 5 weeks. P(X > 8) is the probability for a server that has just started."},{"text":"After 5 failure-free weeks the server is 'due', so failure soon is more likely.","correct":false,"note":"FALSE. 'Due to fail' reasoning does not apply to the exponential: the failure rate λ = 1/6 per week is constant."},{"text":"The expected remaining time to failure is 1 week, as 5 of the 6 have passed.","correct":false,"note":"FALSE. By memorylessness the remaining time is again exponential with mean 6 weeks."}],"explanation":{"verdict":"Only P(no failure in the next 3 weeks) ≈ 0.607 is true. The idea tested is memorylessness: the past survival time drops out.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Rate<\/td><td>λ = 1/mean<\/td><td class=\"num\">1/6 per week<\/td><\/tr><tr><td>Conditional survival<\/td><td>P(X > 8 | X > 5) = P(X > 8)/P(X > 5)<\/td><td class=\"num\">0.2636 / 0.4346<\/td><\/tr><tr><td>Simplifies to<\/td><td>e^(−λ·3) = P(X > 3)<\/td><td class=\"num\">0.6065<\/td><\/tr><\/table><\/div>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 27, 74–75"},"forms":[],"paper":2,"num":36},{"id":"p2-l2d","type":"best","marks":2,"lecture":"L2","lectures":["L2","L5"],"kind":"theory","tier":1,"archetype":"A5","trap":9,"pattern":["A5","F2024-Q1d","F2025-Q4d","F2024-Q4d"],"topic":"Correlation is not causation","stem":"<p>Across 25 towns, the number of fast-food outlets and the number of gym memberships have correlation r = 0.86, and a regression of memberships on outlets has R² = 0.74.<\/p><div class=\"claims\"><p><span class=\"who\">Student A:<\/span> “More fast-food outlets cause people to join gyms.”<\/p><p><span class=\"who\">Student B:<\/span> “A third factor, such as town population, may drive both counts, so the data do not show causation.”<\/p><\/div><p>Who is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Student B, because a lurking variable like population can push both counts up together.","correct":true,"note":"Correct. Bigger towns have more outlets AND more gym members. A confounder creates the correlation without any causal link between the two."},{"text":"Student A, because an R² of 0.74 means outlets explain 74% of memberships causally.","correct":false,"note":"R² is the 'fraction of variation explained by the estimated model' (L5 slide 11), a measure of fit, not of cause."},{"text":"Student A, because a correlation above 0.8 is strong enough to prove a causal link.","correct":false,"note":"No correlation, however strong, proves causation. It measures linear association only."},{"text":"Student B, because a correlation of 0.86 is too weak to say anything about the variables.","correct":false,"note":"Right student, wrong reason. r = 0.86 is a strong positive correlation (the slides' examples treat 0.8 as highly correlated). Strength is not the issue: causation is."}],"explanation":{"verdict":"Student B is correct. Correlation and R² measure association and fit, never causation.","reasoning":"<p>Correlation measures how strong a linear relationship is (L2 slides 34–35), and R² measures how much variation a fitted model captures (L5 slide 11). Neither can rule out a confounding variable, reverse causation, or coincidence. Causation needs a controlled experiment (L1 slide 4). 'Correlation does not imply causation' was set as an essay question in BOTH finals.<\/p>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 34–35; L5 · L5 - Linear Regression (1).pdf, slide 11; L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slide 4"},"forms":["ab","combo"],"paper":2,"num":37},{"id":"p2-l4m","type":"multi","marks":2,"lecture":"L4","lectures":["L4","L3"],"kind":"theory","tier":3,"archetype":"A2","trap":null,"pattern":["A2","F2024-Q3a","F2025-Q3b.a","F2025-Q3b.b"],"topic":"Unbiased and efficient estimators (derivation)","stem":"<p>X1 and X2 are independent observations, each with mean μ and variance σ². Compare T = (2X1 + X2)/3 with X̄ = (X1 + X2)/2.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"E(T) = μ, so T is an unbiased estimator of the mean μ.","correct":true,"note":"TRUE. E(T) = (2μ + μ)/3 = μ, using E(aX + bY) = aE(X) + bE(Y)."},{"text":"V(T) = 5σ²/9, which is larger than V(X̄) = σ²/2.","correct":true,"note":"TRUE. V(T) = (4σ² + σ²)/9 = 5σ²/9 ≈ 0.556σ² > 0.5σ²."},{"text":"T is biased, since it weights X1 twice as heavily as X2.","correct":false,"note":"FALSE. Unequal weights that sum to 1 still give E(T) = μ."},{"text":"V(T) = σ²/3, since the weights 2/3 and 1/3 sum to 1.","correct":false,"note":"FALSE. This adds the weights without squaring them. V(aX) = a²V(X), so V(T) = (4/9 + 1/9)σ²."},{"text":"T is more efficient than X̄, since both are unbiased.","correct":false,"note":"FALSE. Efficiency compares variances, and T's variance is the larger one, so X̄ is more efficient."}],"explanation":{"verdict":"Tick two: T is unbiased, and V(T) = 5σ²/9 > σ²/2. The skill tested is checking bias with E() and efficiency with V().","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>E(T)<\/td><td>(2E(X1) + E(X2))/3<\/td><td class=\"num\">μ<\/td><\/tr><tr><td>V(T)<\/td><td>(2²σ² + 1²σ²)/3²<\/td><td class=\"num\">5σ²/9 ≈ 0.556σ²<\/td><\/tr><tr><td>V(X̄)<\/td><td>(σ² + σ²)/2²<\/td><td class=\"num\">σ²/2 = 0.5σ²<\/td><\/tr><tr><td>Verdict<\/td><td>both unbiased; compare variances<\/td><td class=\"num\">X̄ more efficient<\/td><\/tr><\/table><\/div>","source":"L4 · L4 – Statistical Inference (2).pdf, slide 3; L3 · L3 - Probability Theory and Distributions (1).pdf, slides 56–57"},"forms":["combo"],"paper":2,"num":38},{"id":"p2-l3e","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":2,"archetype":"A1","trap":null,"pattern":["A1","MOCK-Q07a","F2024-Q2d.i"],"topic":"Properties of the Poisson distribution","stem":"<p>A hospital models the number of emergency admissions per hour as Poisson with λ = 3.<\/p><p>Which statements are <strong>FALSE<\/strong>?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The variance of the number of admissions per hour is 3, the same as the mean.","correct":false,"note":"TRUE statement, so leave it. For a Poisson distribution E(X) = V(X) = λ (L3 slide 65)."},{"text":"The number of admissions per hour can only take whole-number values 0, 1, 2, ….","correct":false,"note":"TRUE statement, so leave it. X counts events, so it is discrete. Its mean of 3 need not be a typical single value, but every possible value is a whole number."},{"text":"A Poisson model can approximate binomial counts when n is small and p is large.","correct":true,"note":"FALSE, so tick it. The condition is reversed: the slides use the Poisson approximation when n is LARGE and p is SMALL (L3 slide 65)."},{"text":"The standard deviation of the number of admissions per hour is also 3.","correct":true,"note":"FALSE, so tick it. SD = √λ = √3 ≈ 1.732. It is the variance that equals λ."},{"text":"With a mean of 3, an hour with no admissions at all has a probability of zero.","correct":true,"note":"FALSE, so tick it. P(X = 0) = e^(−3) = 0.0498. Every count 0, 1, 2, … has positive probability under a Poisson model."}],"explanation":{"verdict":"Tick the three FALSE statements: SD = 3, P(no admissions) = 0, and the reversed approximation condition. The skill tested is the Poisson model's moments, its support, and when it approximates the binomial.","reasoning":"<p>Poisson: P(X = x) = e^(−λ)λ^x/x! for x = 0, 1, 2, …, with E(X) = V(X) = λ (L3 slide 65), so the SD is √λ, not λ. Every whole number, 0 included, has positive probability: P(X = 0) = e^(−λ). The model also approximates the binomial when n is large and p small.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 65–67"},"forms":["neg"],"paper":2,"num":39},{"id":"p2-l3l","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":3,"archetype":"A2","trap":null,"pattern":["A2","F2025-Q3a","MOCK-Q08b"],"topic":"Standardising (derivation)","stem":"<p>A student shows that Z = (X − μ)/σ has mean 0 and variance 1, where E(X) = μ and V(X) = σ²:<\/p><ol class=\"derivation\"><li>Z = (1/σ)X − μ/σ<\/li><li>E(Z) = (1/σ)E(X) − μ/σ = μ/σ − μ/σ = 0<\/li><li>V(Z) = (1/σ)V(X) = σ²/σ = σ<\/li><li>So V(Z) = σ, which equals 1 only when σ = 1<\/li><\/ol><p>Which step is the first wrong one?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Step 3: V(aX + b) = a²V(X), so V(Z) = σ²/σ² = 1","correct":true,"note":"Correct. The scale factor 1/σ comes out of the variance squared, and the shift −μ/σ has no effect, so V(Z) = 1 for every σ."},{"text":"Step 2: the constant −μ/σ should be dropped from E(Z) too","correct":false,"note":"E(aX + b) = aE(X) + b keeps the constant. Only a variance ignores a shift."},{"text":"Step 1: Z must first be written as (1/σ)(X + μ) to begin","correct":false,"note":"(X − μ)/σ = X/σ − μ/σ. Step 1 is correct algebra."},{"text":"Step 4: nothing is wrong, since Z tables assume σ = 1","correct":false,"note":"Z tables are for the standard normal, which every normal reaches after standardising. That only works because V(Z) = 1 for any σ."}],"explanation":{"verdict":"Step 3 is the first wrong step: the scale factor must be squared. The idea tested is using E(aX + b) and V(aX + b) to justify standardising.","reasoning":"<p>With a = 1/σ and b = −μ/σ: E(Z) = aE(X) + b = 0 and V(Z) = a²V(X) = σ²/σ² = 1 (L3 slides 56–57). This is why every normal variable can be turned into the standard normal and read from the same Z table (L3 slide 70).<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 56–57, 70"},"forms":[],"paper":2,"num":40},{"id":"p2-l4h","type":"best","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":3,"archetype":"A10","trap":null,"pattern":["A10","F2024-Q3c","F2025-Q3d"],"topic":"Pooled-variance interval: set it up","stem":"<p>Group 1: n = 8, x̄1 = 64.0, s1² = 30. Group 2: m = 6, x̄2 = 58.5, s2² = 24. Both populations are normal with equal but unknown variances.<\/p><p>Which expression gives the 95% confidence interval for μ1 − μ2? Do not evaluate it.<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"5.5 ± t(12, 0.025) × √27.5 × √(1/8 + 1/6)","correct":true,"note":"Correct. Sp² = (7 × 30 + 5 × 24)/12 = 27.5, df = n + m − 2 = 12, and the SE is Sp·√(1/n + 1/m).","math":"<math><mn>5.5<\/mn><mo>±<\/mo><msub><mrow><mi>t<\/mi><\/mrow><mrow><mrow><mn>12<\/mn><mo>,<\/mo><mn>0.025<\/mn><\/mrow><\/mrow><\/msub><mo>×<\/mo><msqrt><mn>27.5<\/mn><\/msqrt><mo>×<\/mo><msqrt><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mrow><\/msqrt><\/math>"},{"text":"5.5 ± t(12, 0.025) × √(30/8 + 24/6)","correct":false,"note":"Runner-up. This is the slides' Case D form for UNEQUAL variances (which also needs its own df formula). With equal variances assumed, Case C pools the variances.","math":"<math><mn>5.5<\/mn><mo>±<\/mo><msub><mrow><mi>t<\/mi><\/mrow><mrow><mrow><mn>12<\/mn><mo>,<\/mo><mn>0.025<\/mn><\/mrow><\/mrow><\/msub><mo>×<\/mo><msqrt><mrow><mfrac><mrow><mn>30<\/mn><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>24<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mrow><\/msqrt><\/math>"},{"text":"5.5 ± t(14, 0.025) × √27.5 × √(1/8 + 1/6)","correct":false,"note":"The pooled t has n + m − 2 = 12 degrees of freedom, not n + m = 14.","math":"<math><mn>5.5<\/mn><mo>±<\/mo><msub><mrow><mi>t<\/mi><\/mrow><mrow><mrow><mn>14<\/mn><mo>,<\/mo><mn>0.025<\/mn><\/mrow><\/mrow><\/msub><mo>×<\/mo><msqrt><mn>27.5<\/mn><\/msqrt><mo>×<\/mo><msqrt><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mrow><\/msqrt><\/math>"},{"text":"5.5 ± t(12, 0.025) × 27.5 × √(1/8 + 1/6)","correct":false,"note":"This uses Sp² = 27.5 where Sp = √27.5 belongs: the square root is missing.","math":"<math><mn>5.5<\/mn><mo>±<\/mo><msub><mrow><mi>t<\/mi><\/mrow><mrow><mrow><mn>12<\/mn><mo>,<\/mo><mn>0.025<\/mn><\/mrow><\/mrow><\/msub><mo>×<\/mo><mn>27.5<\/mn><mo>×<\/mo><msqrt><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mrow><\/msqrt><\/math>"}],"explanation":{"verdict":"5.5 ± t(12, 0.025)·√27.5·√(1/8 + 1/6). The skill tested is building the slides' Case C pooled interval: the right Sp, the right df, and the right SE.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Difference<\/td><td>x̄1 − x̄2<\/td><td class=\"num\">5.5<\/td><\/tr><tr><td>Pooled variance<\/td><td>[(n − 1)s1² + (m − 1)s2²]/(n + m − 2)<\/td><td class=\"num\">27.5<\/td><\/tr><tr><td>df<\/td><td>n + m − 2<\/td><td class=\"num\">12<\/td><\/tr><tr><td>SE<\/td><td>Sp √(1/n + 1/m)<\/td><td class=\"num\">2.8321<\/td><\/tr><\/table><\/div>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 34–38"},"forms":["runner"],"paper":2,"num":41},{"id":"p2-l1a","type":"multi","marks":2,"lecture":"L1","lectures":["L1"],"kind":"theory","tier":2,"archetype":"A1","trap":null,"pattern":["A1","F2024-Q1b","MOCK-Q01a"],"topic":"When stratified sampling is valid","stem":"<p>A telecom company wants the mean monthly bill of its 50,000 customers. They are on three plans: Prepaid (30,000), Postpaid (15,000) and Business (5,000). Bills differ greatly between the plans, and an analyst proposes stratified random sampling by plan.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Stratifying by plan suits these data well, as the plans differ in an important way: bill size.","correct":true,"note":"TRUE. The slides describe strata as 'subpopulations that may differ in important ways'. Stratifying on them gives more precise estimates."},{"text":"Customers must be drawn at random from every plan, not from only some of the plans.","correct":true,"note":"TRUE. Stratified sampling ensures 'every subgroup is properly represented', so every stratum is sampled."},{"text":"Picking two plans at random and surveying all their customers is the same design.","correct":false,"note":"FALSE. Selecting whole subgroups at random and surveying everyone in them is cluster sampling. It would leave one plan out entirely."},{"text":"Stratifying is still worthwhile even though the three plans differ greatly in size.","correct":true,"note":"TRUE. Unequal stratum sizes are normal. Proportionate allocation simply gives bigger strata more places, as in the slides' 800/200 example."},{"text":"Within each plan, simple random sampling can then be used to choose the customers.","correct":true,"note":"TRUE. 'Simple random sampling or systematic sampling can be used for getting samples from each stratum' (L1 slide 26)."}],"explanation":{"verdict":"Tick all except 'picking two plans and surveying everyone is the same design', which describes cluster sampling. The skill tested is what makes stratification appropriate and how it is carried out.","reasoning":"<p>Stratified sampling divides the population into strata on a characteristic that matters (here, plan), then samples randomly within <em>every<\/em> stratum (L1 slide 26). It is most useful when the strata differ, which is the opposite of what cluster sampling needs: there each cluster should resemble the whole and only some clusters are surveyed (L1 slide 27).<\/p>","source":"L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slides 26–27"},"forms":[],"paper":2,"num":42},{"id":"p2-l5a","type":"best","marks":2,"lecture":"L5","lectures":["L5"],"kind":"theory","tier":2,"archetype":"A5","trap":8,"pattern":["A5","F2024-Q4e.a","F2025-Q4e.i","MOCK-Q14a"],"topic":"Interpreting the intercept","stem":"<p>A fisheries officer regresses fish weight y (g) on length x (cm) for fish 18–40 cm long:<\/p><p><math display=\"block\"><mover accent=\"true\"><mrow><mi>y<\/mi><\/mrow><mo>^<\/mo><\/mover><mo>=<\/mo><mo>−<\/mo><mn>120<\/mn><mo>+<\/mo><mn>15<\/mn><mi>x<\/mi><\/math><\/p><p>How should the intercept −120 be read?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"As the prediction at 0 cm: an extrapolation far beyond 18–40 cm, with no real meaning","correct":true,"note":"Correct. Literally the intercept is ŷ at x = 0, but no fish is 0 cm long and the data cover 18–40 cm only. A negative weight shows the line cannot be extended that far."},{"text":"As the weight a fish loses for each centimetre shorter it is, compared with a fish of 40 cm","correct":false,"note":"That describes the slope (15 g per cm), not the intercept."},{"text":"As proof that the model is wrong, since a fitted line has to pass through the origin (0, 0)","correct":false,"note":"Least squares does not force the line through (0, 0). A model can fit well inside its data range even if its intercept is meaningless."},{"text":"As the average weight of the smallest fish in the sample, which is −120 g in this model","correct":false,"note":"The smallest fish is 18 cm long, so its predicted weight is −120 + 15 × 18 = 150 g. The intercept refers to x = 0, not to the smallest x in the data."}],"explanation":{"verdict":"It is the prediction at 0 cm, an extrapolation with no real meaning. This is the extrapolated-intercept trap.","reasoning":"<p>ŷ = β̂0 + β̂1x (L5 slide 6). β̂0 is the predicted y when x = 0, and it is only interpretable if x = 0 is within, or near, the observed range. Both finals asked students to interpret an intercept (GPA at 0 study hours). A careful answer always adds that x = 0 may be an extrapolation.<\/p>","source":"L5 · L5 - Linear Regression (1).pdf, slides 3, 6"},"forms":[],"paper":2,"num":43},{"id":"p2-l3m","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":3,"archetype":"A10","trap":null,"pattern":["A10","F2024-Q2d.iii","F2025-Q2b.iv"],"topic":"PDF: set up the variance integral","stem":"<p>X has density f(x) = (3/8)x² for 0 &lt; x &lt; 2 (0 otherwise), and E(X) = 1.5.<\/p><p>Which expression gives V(X)? Do not evaluate it.<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"∫ from 0 to 2 of (x − 1.5)² · (3/8)x² dx","correct":true,"note":"Correct. V(X) = ∫(x − μ)² f(x) dx with μ = 1.5 and f(x) = (3/8)x² (L3 slide 55).","math":"<math><msubsup><mrow><mo>∫<\/mo><\/mrow><mrow><mn>0<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msubsup><msup><mrow><mo>(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>1.5<\/mn><mo>)<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msup><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><msup><mrow><mi>x<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><\/math>"},{"text":"∫ from 0 to 2 of x² · (3/8)x² dx − 1.5","correct":false,"note":"This is E(X²) − 1.5. The identity is V(X) = E(X²) − [E(X)]², so it should subtract 1.5² = 2.25, not 1.5.","math":"<math><msubsup><mrow><mo>∫<\/mo><\/mrow><mrow><mn>0<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msubsup><msup><mrow><mi>x<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msup><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><msup><mrow><mi>x<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><mo>−<\/mo><mn>1.5<\/mn><\/math>"},{"text":"∫ from 0 to 2 of (x − 1)² · (3/8)x² dx","correct":false,"note":"This measures deviations from 1, the midpoint of 0 to 2. The variance uses deviations from the mean, μ = 1.5, and this density is not symmetric about 1.","math":"<math><msubsup><mrow><mo>∫<\/mo><\/mrow><mrow><mn>0<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msubsup><msup><mrow><mo>(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>1<\/mn><mo>)<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msup><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><msup><mrow><mi>x<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><\/math>"},{"text":"∫ from 0 to 2 of (x − 1.5) · (3/8)x² dx","correct":false,"note":"The deviation is not squared. ∫(x − μ)f(x)dx always equals 0.","math":"<math><msubsup><mrow><mo>∫<\/mo><\/mrow><mrow><mn>0<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msubsup><mo>(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>1.5<\/mn><mo>)<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><msup><mrow><mi>x<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><\/math>"}],"explanation":{"verdict":"∫₀² (x − 1.5)²(3/8)x² dx. The skill tested is writing the continuous variance definition with the right integrand and limits.","reasoning":"<p>The slides define V(X) = ∫ (x − μX)² f(x) dx for a continuous random variable (L3 slide 55), with the integral over the support (here 0 to 2). E(X) = ∫₀² x(3/8)x² dx = (3/8)(16/4) = 1.5. Each wrong option breaks one ingredient: subtracting μ instead of μ², centring on the midpoint instead of μ, or leaving the deviation unsquared.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slide 55"},"forms":[],"paper":2,"num":44},{"id":"p2-l4i","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":2,"archetype":"A1","trap":null,"pattern":["A1","F2024-Q3c"],"topic":"The paired-samples design","stem":"<p>Ten runners each ran 5 km once in old shoes and once in new shoes. A paired t-test was applied to their time differences.<\/p><p>Which statements are <strong>FALSE<\/strong>?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The test statistic uses the mean and SD of the 10 differences.","correct":false,"note":"TRUE statement, so leave it. T = (d̄ − μ_d)/(S_d/√n) with n = number of pairs (L4 slide 48)."},{"text":"The test has 18 degrees of freedom, as there are 20 times in total.","correct":true,"note":"FALSE, so tick it. df = number of pairs − 1 = 9."},{"text":"With 10 pairs, no normality check is needed, as the paired t is exact.","correct":true,"note":"FALSE, so tick it. With fewer than 30 pairs, the slides require checking that the DIFFERENCES are normal."},{"text":"Each shoe type's times must be shown to be normal, as in the pooled test.","correct":true,"note":"FALSE, so tick it. 'We do not need to check for the normality of each population'. Only the differences matter (L4 slide 47)."},{"text":"Pairing is not needed, as the two sets of times are independent.","correct":true,"note":"FALSE, so tick it. The same runner produced both times, so the samples are dependent, which is exactly the paired case."}],"explanation":{"verdict":"Tick the four FALSE statements; only 'the statistic uses the differences' is true. The skill tested is when and how the paired t-test is used.","reasoning":"<p>Paired samples are related (the same subjects measured twice), and 'the key to analyse a matched sample design is to use the difference data' (L4 slide 47). The statistic follows t with n − 1 df, where n is the number of pairs (L4 slide 48). If there are fewer than 30 pairs, check that the differences are normal; the individual populations need no check.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 47–51"},"forms":["neg"],"paper":2,"num":45},{"id":"p2-l5c","type":"multi","marks":2,"lecture":"L5","lectures":["L5"],"kind":"theory","tier":3,"archetype":"A9","trap":null,"pattern":["A9","F2024-Q4a","F2025-Q4a","F2024-Q1e"],"topic":"When a straight line does not fit","stem":"<p>The plot shows fuel efficiency against engine speed for 14 test runs, with the least-squares line ŷ = 13.57 − 0.01x (R² below 0.01).<\/p><p>Which statements are <strong>FALSE<\/strong>?<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 640 360\" style=\"max-width:704px\" role=\"img\" aria-label=\"Scatter plot with an inverted-U pattern and a nearly flat fitted line\">\n<line x1=\"87.0\" y1=\"248.0\" x2=\"616.0\" y2=\"248.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"202.0\" x2=\"616.0\" y2=\"202.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"156.0\" x2=\"616.0\" y2=\"156.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"110.0\" x2=\"616.0\" y2=\"110.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"64.0\" x2=\"616.0\" y2=\"64.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"18.0\" x2=\"616.0\" y2=\"18.0\" class=\"grid\"/>\n<polyline points=\"86.0,138.0 616.0,139.0\" class=\"fitline\"/>\n<circle cx=\"152.2\" cy=\"253.8\" r=\"4\" class=\"pt\"/>\n<circle cx=\"185.4\" cy=\"208.9\" r=\"4\" class=\"pt\"/>\n<circle cx=\"218.5\" cy=\"153.7\" r=\"4\" class=\"pt\"/>\n<circle cx=\"251.6\" cy=\"122.7\" r=\"4\" class=\"pt\"/>\n<circle cx=\"284.8\" cy=\"87.0\" r=\"4\" class=\"pt\"/>\n<circle cx=\"317.9\" cy=\"78.9\" r=\"4\" class=\"pt\"/>\n<circle cx=\"351.0\" cy=\"62.8\" r=\"4\" class=\"pt\"/>\n<circle cx=\"384.1\" cy=\"61.7\" r=\"4\" class=\"pt\"/>\n<circle cx=\"417.2\" cy=\"80.1\" r=\"4\" class=\"pt\"/>\n<circle cx=\"450.4\" cy=\"88.2\" r=\"4\" class=\"pt\"/>\n<circle cx=\"483.5\" cy=\"123.8\" r=\"4\" class=\"pt\"/>\n<circle cx=\"516.6\" cy=\"154.8\" r=\"4\" class=\"pt\"/>\n<circle cx=\"549.8\" cy=\"207.8\" r=\"4\" class=\"pt\"/>\n<circle cx=\"582.9\" cy=\"254.9\" r=\"4\" class=\"pt\"/>\n<line x1=\"86.0\" y1=\"294.0\" x2=\"616.0\" y2=\"294.0\" class=\"ax\"/>\n<line x1=\"86.0\" y1=\"294.0\" x2=\"86.0\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"86.0\" y=\"321.0\" text-anchor=\"middle\">0<\/text>\n<line x1=\"152.2\" y1=\"294.0\" x2=\"152.2\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"152.2\" y=\"321.0\" text-anchor=\"middle\">1<\/text>\n<line x1=\"218.5\" y1=\"294.0\" x2=\"218.5\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"218.5\" y=\"321.0\" text-anchor=\"middle\">2<\/text>\n<line x1=\"284.8\" y1=\"294.0\" x2=\"284.8\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"284.8\" y=\"321.0\" text-anchor=\"middle\">3<\/text>\n<line x1=\"351.0\" y1=\"294.0\" x2=\"351.0\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"351.0\" y=\"321.0\" text-anchor=\"middle\">4<\/text>\n<line x1=\"417.2\" y1=\"294.0\" x2=\"417.2\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"417.2\" y=\"321.0\" text-anchor=\"middle\">5<\/text>\n<line x1=\"483.5\" y1=\"294.0\" x2=\"483.5\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"483.5\" y=\"321.0\" text-anchor=\"middle\">6<\/text>\n<line x1=\"549.8\" y1=\"294.0\" x2=\"549.8\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"549.8\" y=\"321.0\" text-anchor=\"middle\">7<\/text>\n<line x1=\"616.0\" y1=\"294.0\" x2=\"616.0\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"616.0\" y=\"321.0\" text-anchor=\"middle\">8<\/text>\n<text x=\"351.0\" y=\"348.0\" text-anchor=\"middle\" class=\"axlab\">Engine speed (× 1,000 rpm)<\/text>\n<line x1=\"86.0\" y1=\"18.0\" x2=\"86.0\" y2=\"294.0\" class=\"ax\"/>\n<line x1=\"81.0\" y1=\"294.0\" x2=\"86.0\" y2=\"294.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"298.5\" text-anchor=\"end\">0<\/text>\n<line x1=\"81.0\" y1=\"248.0\" x2=\"86.0\" y2=\"248.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"252.5\" text-anchor=\"end\">4<\/text>\n<line x1=\"81.0\" y1=\"202.0\" x2=\"86.0\" y2=\"202.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"206.5\" text-anchor=\"end\">8<\/text>\n<line x1=\"81.0\" y1=\"156.0\" x2=\"86.0\" y2=\"156.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"160.5\" text-anchor=\"end\">12<\/text>\n<line x1=\"81.0\" y1=\"110.0\" x2=\"86.0\" y2=\"110.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"114.5\" text-anchor=\"end\">16<\/text>\n<line x1=\"81.0\" y1=\"64.0\" x2=\"86.0\" y2=\"64.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"68.5\" text-anchor=\"end\">20<\/text>\n<line x1=\"81.0\" y1=\"18.0\" x2=\"86.0\" y2=\"18.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"22.5\" text-anchor=\"end\">24<\/text>\n<text x=\"46.8\" y=\"156.0\" text-anchor=\"middle\" class=\"axlab\" transform=\"rotate(-90 46.8 156.0)\">Fuel efficiency (km/L)<\/text>\n<\/svg>","figcap":null,"options":[{"text":"A straight line fits poorly: the linear model assumes y changes linearly with x.","correct":false,"note":"TRUE statement, so leave it. The slides define linear regression as 'a model that assumes a linear relationship' between x and y (L5 slide 2). This curve breaks that assumption."},{"text":"Residuals y − ŷ are mostly negative at both ends and positive in the middle.","correct":false,"note":"TRUE statement. The points rise above the flat line in the middle and fall below it at both ends."},{"text":"R² is close to 0, so engine speed and fuel efficiency are simply unrelated.","correct":true,"note":"FALSE, so tick it. R² measures LINEAR fit. There is a strong curved relationship that a straight line cannot capture."},{"text":"Adding more test runs over the same speed range would make the straight line fit well.","correct":true,"note":"FALSE, so tick it. More data from the same curve shows the same curve. The problem is the model's form, not the sample size."},{"text":"Least squares minimises the sum of absolute residuals, which is why it misses the curve.","correct":true,"note":"FALSE, so tick it. Least squares minimises the sum of SQUARED errors, SSE = Σ(y − ŷ)² (L5 slide 6). It misses the curve because the model is a straight line."}],"explanation":{"verdict":"Tick the three FALSE statements: 'unrelated', 'more data fixes it', and the claim about absolute residuals. The skill tested is the linearity assumption and how to read a low R².","reasoning":"<p>Least squares chooses β̂0 and β̂1 to minimise SSE = Σ(yᵢ − ŷᵢ)² (L5 slide 6), and R² = (TSS − SSE)/TSS shows how much variation the LINE explains (L5 slide 11). With a curved (inverted-U) pattern the best straight line is almost flat, the residuals show a systematic pattern, and R² is near 0 even though y depends strongly on x.<\/p>","source":"L5 · L5 - Linear Regression (1).pdf, slides 2, 6, 11"},"forms":["fig","neg"],"paper":2,"num":46},{"id":"p2-l1e","type":"multi","marks":2,"lecture":"L1","lectures":["L1"],"kind":"theory","tier":1,"archetype":"A1","trap":null,"pattern":["A1"],"topic":"Sources of data","stem":"<p>Several studies of a city's bus service are described.<\/p><p>Which descriptions are CORRECT?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Giving 20 of 40 randomly chosen routes a new timetable and comparing delays: an experiment.","correct":true,"note":"CORRECT. The researcher manipulates a variable (the timetable) and compares outcomes (L1 slide 4)."},{"text":"Counting passengers boarding at stops, without changing anything: an observational study.","correct":true,"note":"CORRECT. Data are recorded 'without interfering' and nothing is manipulated."},{"text":"Using the transport ministry's published ridership figures: primary data for this study team.","correct":false,"note":"INCORRECT. Data already collected and published by another organisation are secondary data (L1 slide 5)."},{"text":"Of these designs, only the timetable experiment can support a cause-and-effect claim.","correct":true,"note":"CORRECT. 'A controlled experiment is conducted to determine cause-and-effect relationships' (L1 slide 4)."},{"text":"The number of passengers on each bus is a continuous variable, since it can be averaged.","correct":false,"note":"INCORRECT. A count of passengers takes whole-number values, so it is discrete. Its average can be fractional, but that does not make the variable continuous."}],"explanation":{"verdict":"Tick three: the experiment, the observational study, and 'only the experiment supports cause and effect'. The skill tested is classifying how data were obtained and what each design can show.","reasoning":"<p>Primary data come from observational studies (no manipulation) or experimental studies (variables manipulated to find cause and effect). Secondary data were collected by someone else for another purpose (L1 slides 3–5). Counts are discrete variables (L1 slide 8).<\/p>","source":"L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slides 3–5, 8"},"forms":[],"paper":2,"num":47},{"id":"p2-l4l","type":"best","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":2,"archetype":"A1","trap":null,"pattern":["A1","MOCK-Q13c"],"topic":"What a chi-square test can conclude","stem":"<p>A 2 × 2 chi-square test comparing the proportion of defective parts from two machines rejects H0: p1 = p2 at the 5% level.<\/p><p>Which statement is <strong>NOT<\/strong> justified by this test?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Machine 1 has the higher proportion of defective parts","correct":true,"note":"Not justified, so this is the answer. 'Chi-square tests can't be used to determine evidence of a directional difference (such as p1 > p2)'. A one-tailed Z-test is needed for that."},{"text":"The two machines' proportions of defective parts differ","correct":false,"note":"Justified. That is exactly H1: p1 ≠ p2."},{"text":"A two-proportion Z-test on these data would give Z² = χ²","correct":false,"note":"Justified. With 1 degree of freedom the chi-square statistic equals the squared Z statistic."},{"text":"The test statistic here has 1 degree of freedom in total","correct":false,"note":"Justified. A 2 × 2 table gives (2 − 1)(2 − 1) = 1 degree of freedom."}],"explanation":{"verdict":"'Machine 1 has the higher proportion' is not justified: a chi-square test has no direction.","reasoning":"<p>The 'Important facts' slide (L4 slide 68): Z² = χ² for 1 df; expected counts at least 5 for a 2 × 2 table; no directional conclusions (use the Z-test); it can compare more than two groups; and it generalises to independence tests.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 65–68"},"forms":["neg"],"paper":2,"num":48},{"id":"p2-l5b","type":"multi","marks":2,"lecture":"L5","lectures":["L5","L6"],"kind":"theory","tier":3,"archetype":"A9","trap":null,"pattern":["A9","F2024-Q4b","F2025-Q4b","MOCK-Q15a"],"topic":"Dummy variables for seasons","stem":"<p>A retailer fits the model below to quarterly sales, where t is the quarter number (trend) and D2, D3, D4 are dummy variables for quarters 2, 3 and 4:<\/p><p><math display=\"block\"><mover accent=\"true\"><mrow><mi>y<\/mi><\/mrow><mo>^<\/mo><\/mover><mo>=<\/mo><mn>820<\/mn><mo>+<\/mo><mn>14<\/mn><mi>t<\/mi><mo>+<\/mo><mn>95<\/mn><msub><mrow><mi>D<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msub><mo>+<\/mo><mn>160<\/mn><msub><mrow><mi>D<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/msub><mo>−<\/mo><mn>40<\/mn><msub><mrow><mi>D<\/mi><\/mrow><mrow><mn>4<\/mn><\/mrow><\/msub><\/math><\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Quarter 1 is the baseline quarter: all three of its dummies are 0.","correct":true,"note":"TRUE. Four quarters need k − 1 = 3 dummies, and the category with all zeros is the baseline."},{"text":"Holding t fixed, Q3 sales are predicted to be 160 above Q1 sales.","correct":true,"note":"TRUE. Each dummy coefficient is that quarter's difference from the baseline quarter."},{"text":"Holding t fixed, Q4 sales are predicted to be 40 below Q3 sales.","correct":false,"note":"FALSE. Both are measured from Q1: Q4 − Q3 = −40 − 160 = −200."},{"text":"The seasonal effects are additive: fixed shifts that do not grow with t.","correct":true,"note":"TRUE. Constant shifts (+95, +160, −40) that don't grow with t are the additive pattern from L6."},{"text":"A fourth dummy D1 for quarter 1 should be added, so every quarter has one.","correct":false,"note":"FALSE. D1 = 1 − D2 − D3 − D4 is redundant. The slides code k categories with k − 1 dummies."}],"explanation":{"verdict":"Tick three: Q1 is the baseline, Q3 is 160 above Q1, and the seasonal effects are additive. The skill tested is reading dummy coefficients against the baseline, linked to the additive seasonal model.","reasoning":"<p>Dummy coding uses k − 1 indicator variables. The omitted category is the baseline, and each coefficient is a shift relative to it (L5 slides 9–10). Adding fixed seasonal shifts to a trend is the additive model Y = T + S (+ C + I), with seasonal effects that stay constant over time (L6 slides 10–11).<\/p>","source":"L5 · L5 - Linear Regression (1).pdf, slides 9–10; L6 · L6 - Time Series Analysis.pdf, slides 10–11"},"forms":["combo"],"paper":2,"num":49},{"id":"p2-l4a","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"calculation","tier":3,"archetype":"A6","trap":null,"pattern":["A6","MOCK-Q11b","MOCK-Q11c"],"topic":"z confidence interval for a mean","stem":"<p>A tyre maker knows that tread life has σ = 4,800 km. A random sample of 36 tyres gives x̄ = 52,300 km. Use z = 1.96.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The 95% confidence interval for μ is (50,732, 53,868) km.","correct":true,"note":"TRUE. σ/√n = 4,800/6 = 800; margin = 1.96 × 800 = 1,568; x̄ ± margin."},{"text":"The 95% confidence interval for μ is (42,892, 61,708) km.","correct":false,"note":"FALSE. This uses σ instead of σ/√n, so the margin is 9,408. That is the spread of single tyres, not of x̄."},{"text":"A 99% interval from these same data would be narrower than this one.","correct":false,"note":"FALSE. Higher confidence needs a larger z (2.576 > 1.96), so the interval is wider."},{"text":"About 95% of the maker's tyres last between 50,732 and 53,868 km.","correct":false,"note":"FALSE. The interval estimates the MEAN tread life. /* ================================================================== */
/*  STATE (one saved record per paper)                                 */
/* ================================================================== */

const PAPERS = { 1: DATA.papers["1"], 2: DATA.papers["2"] };
const PAST = DATA.past, ARCH = DATA.arch, TRAPS = DATA.traps;
const LECNAME = { L1: "Sampling & data", L2: "Descriptive statistics", L3: "Probability & distributions",
                  L4: "Statistical inference", L5: "Linear regression", L6: "Time series" };
const KEY = p => `ps-mcq-v1-paper${p}`;
const BY_ID = {};
[1, 2].forEach(p => PAPERS[p].forEach((q, i) => { q.index = i; BY_ID[q.id] = q; }));

function blank(p, keep) {
    keep = keep || {};
    return { v: 1, paper: p, started: false, finished: false, seed: Math.floor(Math.random() * 2147483647),
             current: 0, flags: {}, ans: {}, timeMs: 0, retry: null, flaggedOnly: false, finishedAt: null,
             attempts: keep.attempts || [], best: keep.best == null ? null : keep.best };
}

function loadPaper(p) {
    try {
        const raw = localStorage.getItem(KEY(p));
        if (raw) {
            const s = JSON.parse(raw);
            if (s && s.v === 1 && s.paper === p) return s;
        }
    } catch (e) { /* storage blocked or corrupt */ }
    return blank(p);
}

const ST = { 1: loadPaper(1), 2: loadPaper(2) };
let P = null;          // active paper number
let view = "cover";

function S() { return ST[P]; }
function QS() { return PAPERS[P]; }
function save(p) {
    p = p || P;
    try { localStorage.setItem(KEY(p), JSON.stringify(ST[p])); } catch (e) { /* storage blocked */ }
}

/*  HELPERS                                                            */
/* ================================================================== */

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function el(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
        if (k === "class") e.className = attrs[k];
        else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    if (html !== undefined) e.innerHTML = html;
    return e;
}
function fmt(n) { return (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1"); }
function fmtTime(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function mulberry32(a) {
    return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function optionOrder(q, st) {
    const rnd = mulberry32(((st || ST[q.paper]).seed ^ hashStr(q.id)) >>> 0);
    const a = q.options.map((_, i) => i);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}
function optHTML(o) { return o.math ? o.math : esc(o.text); }

function ans(q) {
    const st = ST[q.paper];
    if (!st.ans[q.id]) st.ans[q.id] = { sel: [], submitted: false };
    return st.ans[q.id];
}
function result(q) {
    const sel = new Set(ans(q).sel);
    if (q.type === "best") {
        const ok = q.options.findIndex(o => o.correct);
        const right = sel.size === 1 && sel.has(ok);
        return { score: right ? q.marks : 0, plus: right ? q.marks : 0, minus: 0, lost: 0, nOk: right ? 1 : 0, nBad: right ? 0 : sel.size };
    }
    const k = q.options.filter(o => o.correct).length;
    const unit = q.marks / k;
    let plus = 0, minus = 0, nOk = 0, nBad = 0;
    q.options.forEach((o, i) => { if (!sel.has(i)) return; if (o.correct) { plus += unit; nOk++; } else { minus += unit; nBad++; } });
    const score = Math.min(q.marks, Math.max(0, plus - minus));
    return { score, plus, minus, nOk, nBad, unit, k, lost: plus - score };
}
const submitted = q => ans(q).submitted;
const answered = q => ans(q).sel.length > 0;
const score = q => submitted(q) ? result(q).score : 0;
function verdictOf(sc, max) { if (sc >= max - 1e-9) return "correct"; if (sc <= 1e-9) return "wrong"; return "partial"; }
function inScope(q) { const st = ST[q.paper]; return !st.retry || st.retry.ids.indexOf(q.id) !== -1; }
function scope() { return QS().filter(inScope); }

function showBanner(text) {
    document.getElementById("banner-text").textContent = text;
    document.getElementById("banner").hidden = false;
}
document.getElementById("banner-close").addEventListener("click", () => { document.getElementById("banner").hidden = true; });

function updateTopbar() {
    const where = document.getElementById("where");
    const ids = ["scorepill", "clock", "switch-btn", "results-btn", "finish-btn"];
    if (view === "cover" || !P) {
        where.textContent = "";
        ids.forEach(i => { document.getElementById(i).hidden = true; });
        return;
    }
    const st = S();
    const q = QS()[st.current];
    where.textContent = view === "exam" ? `Paper ${P} · Question ${q.num} of 50` : `Paper ${P} · Results`;
    const sub = QS().filter(submitted);
    const pill = document.getElementById("scorepill");
    pill.hidden = false;
    pill.textContent = `Score ${fmt(sub.reduce((a, x) => a + score(x), 0))} / ${fmt(sub.reduce((a, x) => a + x.marks, 0))}`;
    const clock = document.getElementById("clock");
    clock.hidden = false;
    clock.textContent = "⏱ " + fmtTime(st.timeMs);
    document.getElementById("switch-btn").hidden = false;
    document.getElementById("finish-btn").hidden = view !== "exam" || st.finished;
    document.getElementById("results-btn").hidden = !st.finished || view === "results";
}

let lastTick = Date.now();
setInterval(() => {
    const now = Date.now();
    const dt = Math.min(5000, now - lastTick);
    lastTick = now;
    if (view === "exam" && P && !S().finished && document.visibilityState === "visible") {
        S().timeMs += dt;
        if (Math.floor(S().timeMs / 1000) % 5 === 0) save();
        const c = document.getElementById("clock");
        if (c) c.textContent = "⏱ " + fmtTime(S().timeMs);
    }
}, 1000);
document.addEventListener("visibilitychange", () => { lastTick = Date.now(); if (P) save(); });
window.addEventListener("beforeunload", () => { if (P) save(); });

function paperStatus(p) {
    const st = ST[p];
    if (st.finished) {
        const sc = PAPERS[p].reduce((a, q) => a + (st.ans[q.id] && st.ans[q.id].submitted ? scoreFor(q, st) : 0), 0);
        return { label: `Finished · ${fmt(sc)} / 100`, kind: "done", frac: 1 };
    }
    if (!st.started) return { label: "Not started", kind: "new", frac: 0 };
    const n = PAPERS[p].filter(q => st.ans[q.id] && st.ans[q.id].submitted).length;
    return { label: `In progress · ${n} of 50 submitted`, kind: "progress", frac: n / 50 };
}
function scoreFor(q, st) { const saveP = P; P = q.paper; const r = result(q).score; P = saveP; return r; }

function renderCover() {

}

function openPaper(p, fresh) {
    P = p;
    const st = S();
    if (fresh || !st.started) { st.started = true; st.current = 0; }
    save();
    renderExam();
}
