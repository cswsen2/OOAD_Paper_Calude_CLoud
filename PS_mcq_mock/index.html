<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IE2024 MCQ Mocks</title>
<script>
/* apply a saved theme before first paint, so the page never flashes the wrong colours */
try {
    var savedTheme = localStorage.getItem("ps-theme");
    if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", savedTheme);
    }
} catch (e) { /* storage blocked: follow the device setting */ }
</script>
<style>
:root {
    color-scheme: light;
    --bg: #FAF7F0;
    --card: #FFFDF8;
    --heading: #7A1E2C;
    --primary: #2B3A55;
    --border: #E3DCCB;
    --text: #1F1F1F;
    --code-bg: #F1ECE1;
    --code-text: #2B2B2B;
    --correct: #2E7D32;
    --wrong: #B3261E;
    --partial: #B7791F;
    --on-primary: #FFFFFF;
    --correct-text: #276E2B;
    --partial-text: #8A5A12;
    --muted: rgba(31, 31, 31, 0.68);
    --correct-tint: #E6EEE0;
    --wrong-tint: #F6E3DE;
    --partial-tint: #F6EDDE;
    --primary-tint: #E6E6E4;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #1B1814;
        --card: #24201B;
        --heading: #E39AA5;
        --primary: #A9BCE0;
        --border: #3A342C;
        --text: #ECE6DA;
        --code-bg: #2B2620;
        --code-text: #E8E1D3;
        --correct: #7CC47F;
        --wrong: #F08A80;
        --partial: #E3B25A;
        --on-primary: #1B1814;
        --correct-text: #7CC47F;
        --partial-text: #E3B25A;
        --muted: rgba(236, 230, 218, 0.68);
        --correct-tint: #323A2B;
        --wrong-tint: #45312B;
        --partial-tint: #433725;
        --primary-tint: #39393B;
    }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1B1814;
    --card: #24201B;
    --heading: #E39AA5;
    --primary: #A9BCE0;
    --border: #3A342C;
    --text: #ECE6DA;
    --code-bg: #2B2620;
    --code-text: #E8E1D3;
    --correct: #7CC47F;
    --wrong: #F08A80;
    --partial: #E3B25A;
    --on-primary: #1B1814;
    --correct-text: #7CC47F;
    --partial-text: #E3B25A;
    --muted: rgba(236, 230, 218, 0.68);
    --correct-tint: #323A2B;
    --wrong-tint: #45312B;
    --partial-tint: #433725;
    --primary-tint: #39393B;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); }
button { font-family: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
math { font-size: 1.06em; color: var(--text); font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", math; }
math[display="block"] { margin: 10px 0; }
.otext math, .optname math { math-style: normal; font-size: 1.12em; }

/* ---------- top bar ---------- */
.topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
    padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--border);
}
.brand { font: 700 1rem var(--serif); color: var(--heading); white-space: nowrap; }
.where { flex: 1; font: 600 0.9rem var(--sans); color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { display: flex; align-items: center; gap: 8px; }
.pill {
    font: 600 0.82rem var(--sans); color: var(--primary); background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; white-space: nowrap;
}
.clock { font: 700 0.95rem var(--mono); color: var(--primary); white-space: nowrap; }

.banner {
    position: sticky; top: 57px; z-index: 19; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 20px; font-weight: 600; border-bottom: 1px solid var(--border);
    background: var(--primary-tint); color: var(--primary);
}

/* ---------- buttons ---------- */
.btn {
    font: 600 0.92rem var(--sans); color: var(--on-primary); background: var(--primary);
    border: 1px solid var(--primary); border-radius: 8px; padding: 0 16px; min-height: 40px; cursor: pointer;
}
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.secondary { background: var(--card); color: var(--primary); }
.btn.danger { background: var(--card); color: var(--wrong); border-color: var(--wrong); }
.btn-small {
    font: 600 0.8rem var(--sans); color: var(--primary); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; min-height: 32px; cursor: pointer; white-space: nowrap;
}
.btn-small:hover, .btn.secondary:hover { border-color: var(--primary); }
.btn-small.on { background: var(--heading); color: var(--on-primary); border-color: var(--heading); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }

/* ---------- layout ---------- */
.shell {
    display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px;
    max-width: 1280px; margin: 0 auto; padding: 20px;
}
.side {
    position: sticky; top: 76px; align-self: start; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 14px; max-height: calc(100vh - 96px); overflow: auto;
}
.side h3 { font: 700 0.78rem var(--sans); color: var(--heading); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 8px; }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.navbtn {
    position: relative; height: 30px; padding: 0; border-radius: 6px; cursor: pointer;
    font: 700 0.74rem var(--sans); color: var(--primary); background: var(--card); border: 1.5px solid var(--border);
}
.navbtn:hover { border-color: var(--primary); }
.navbtn.answered { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.navbtn.correct { background: var(--correct-tint); color: var(--correct-text); border-color: var(--correct); }
.navbtn.partial { background: var(--partial-tint); color: var(--partial-text); border-color: var(--partial); }
.navbtn.wrong { background: var(--wrong-tint); color: var(--wrong); border-color: var(--wrong); }
.navbtn.flagged { border-color: var(--heading); border-width: 2px; }
.navbtn .flag { position: absolute; top: -8px; right: -4px; font-size: 0.7rem; color: var(--heading); }
.navbtn .mark { position: absolute; bottom: -2px; right: 2px; font-size: 0.6rem; }
.navbtn.current { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--primary); }
.navbtn:disabled { opacity: 0.28; cursor: default; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 0.76rem; color: var(--muted); margin-top: 12px; }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1.5px solid var(--border); font-style: normal; }
.legend .l-ans { background: var(--primary); border-color: var(--primary); }
.legend .l-flag { border: 2px solid var(--heading); }
.legend .l-ok { background: var(--correct-tint); border-color: var(--correct); }
.legend .l-part { background: var(--partial-tint); border-color: var(--partial); }
.legend .l-bad { background: var(--wrong-tint); border-color: var(--wrong); }
.side label.toggle { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; margin-top: 12px; cursor: pointer; }
.side .actions { display: grid; gap: 8px; margin-top: 14px; }
.side .meta { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }

/* ---------- question card ---------- */
.q { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 26px 26px; }
.qtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.badge { font: 600 0.75rem/1 var(--sans); padding: 5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--primary); background: var(--bg); }
.badge.lec { color: var(--heading); border-color: var(--heading); }
.badge.marks { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.qhead { font: 700 1.25rem/1.3 var(--serif); color: var(--heading); margin: 2px 0 10px; }
.stem { font-family: var(--serif); font-size: 1.05rem; }
.stem p { margin: 0 0 10px; }
.dataline { font-family: var(--mono); font-size: 0.95rem; background: var(--code-bg); color: var(--code-text); padding: 2px 8px; border-radius: 5px; }
.claims { border-left: 4px solid var(--border); padding: 2px 0 2px 14px; margin: 10px 0; }
.claims p { margin: 6px 0; }
.claims .who { font: 700 0.9rem var(--sans); color: var(--heading); }
ol.derivation { margin: 6px 0 12px; padding-left: 0; list-style: none; counter-reset: st; }
ol.derivation li { counter-increment: st; font-family: var(--mono); font-size: 0.92rem; background: var(--code-bg); color: var(--code-text);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; margin-bottom: 5px; }
ol.derivation li::before { content: "Step " counter(st) ":  "; font-family: var(--sans); font-weight: 700; color: var(--primary); }
.instr { font: 600 0.85rem var(--sans); color: var(--primary); margin: 16px 0 8px; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 16px 0 40px; }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; }
table.data, table.steps { border-collapse: collapse; margin: 8px 0 12px; font-size: 0.92rem; }
table.data th, table.data td, table.steps th, table.steps td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
table.data th, table.steps th { background: var(--code-bg); color: var(--primary); font: 700 0.82rem var(--sans); }
table.data td { font-family: var(--sans); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.steps td.num { font-family: var(--mono); font-size: 0.88rem; }

/* ---------- figures ---------- */
figure.fig { margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 10px; overflow-x: auto; }
figure.fig figcaption { font: 0.82rem var(--sans); color: var(--muted); margin-top: 4px; }
svg.chart { display: block; width: 100%; min-width: 560px; height: auto; margin: 0 auto; }
svg.chart text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; fill: var(--text); }
svg.chart text.axlab { font-weight: 600; fill: var(--primary); }
svg.chart text.legend { font-size: 12.5px; }
svg.chart .ax { stroke: var(--text); stroke-width: 1.2; }
svg.chart .grid { stroke: var(--border); stroke-width: 1; }
svg.chart .bar { fill: var(--primary); fill-opacity: 0.22; stroke: var(--primary); stroke-width: 1.3; }
svg.chart .curve { fill: none; stroke: var(--primary); stroke-width: 2.2; }
svg.chart .fitline { fill: none; stroke: var(--heading); stroke-width: 2; stroke-dasharray: 7 5; }
svg.chart .pt { fill: var(--primary); }
svg.chart .shade { fill: var(--partial); fill-opacity: 0.35; stroke: none; }
svg.chart .marker { stroke: var(--heading); stroke-width: 2.2; stroke-dasharray: 5 4; }
svg.chart .box { fill: var(--primary); fill-opacity: 0.16; stroke: var(--primary); stroke-width: 1.6; }
svg.chart .med { stroke: var(--heading); stroke-width: 3; }
svg.chart .whisk { stroke: var(--primary); stroke-width: 1.6; }
svg.chart .outl { fill: var(--card); stroke: var(--heading); stroke-width: 2; }

/* ---------- options ---------- */
.opts { display: grid; gap: 8px; margin: 6px 0 12px; }
.opt {
    display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 10px 12px; cursor: pointer;
    border: 1.5px solid var(--border); border-radius: 10px; background: var(--card); font-family: var(--serif); font-size: 1rem;
}
.opt:hover { border-color: var(--primary); }
.opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
.opt .key { font: 700 0.75rem var(--sans); color: var(--muted); min-width: 1.2em; margin-top: 3px; }
.opt .otext { flex: 1; }
.opt.sel { border-color: var(--primary); background: var(--primary-tint); }
.opt.locked { cursor: default; }
.opt.locked:hover { border-color: var(--border); }
.opt .fb { display: block; font: 600 0.8rem var(--sans); margin-top: 4px; }
.opt.ok, .opt.ok:hover { border-color: var(--correct); background: var(--correct-tint); }
.opt.ok .fb { color: var(--correct-text); }
.opt.bad, .opt.bad:hover { border-color: var(--wrong); background: var(--wrong-tint); }
.opt.bad .fb { color: var(--wrong); }
.opt.miss, .opt.miss:hover { border-color: var(--partial); background: var(--partial-tint); border-style: dashed; }
.opt.miss .fb { color: var(--partial-text); }
.opt.neutral .fb { color: var(--muted); }

/* ---------- verdict / explanation ---------- */
.verdict { border-left: 5px solid; border-radius: 8px; padding: 10px 14px; margin: 14px 0 10px; font-weight: 600; }
.verdict .vlabel { font-size: 1.05rem; margin-right: 8px; }
.verdict .vdetail { display: block; font-weight: 500; font-size: 0.9rem; margin-top: 2px; color: var(--text); }
.verdict.correct { border-color: var(--correct); background: var(--correct-tint); color: var(--correct-text); }
.verdict.partial { border-color: var(--partial); background: var(--partial-tint); color: var(--partial-text); }
.verdict.wrong { border-color: var(--wrong); background: var(--wrong-tint); color: var(--wrong); }
details.expl { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); padding: 0 16px 6px; margin-top: 8px; }
details.expl > summary { cursor: pointer; font: 700 0.95rem var(--sans); color: var(--heading); min-height: 44px; display: flex; align-items: center; }
details.expl h4 { font: 700 0.8rem var(--sans); color: var(--primary); margin: 14px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
details.expl p, details.expl li { font-size: 0.95rem; }
details.expl ul { padding-left: 20px; margin: 4px 0 10px; }
details.expl li { margin-bottom: 6px; }
details.expl .optname { font-family: var(--serif); font-weight: 700; }
.tag { display: inline-block; font: 700 0.68rem/1 var(--sans); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
.tag.t { background: var(--correct-tint); color: var(--correct-text); border: 1px solid var(--correct); }
.tag.f { background: var(--wrong-tint); color: var(--wrong); border: 1px solid var(--wrong); }
.src { font-size: 0.86rem; color: var(--muted); margin: 10px 0 4px; }
.past { font-size: 0.88rem; margin: 4px 0 10px; padding-left: 20px; }
.past li { margin-bottom: 4px; }
.past .pid { font-family: var(--mono); font-size: 0.82rem; color: var(--heading); }

/* ---------- cover & results ---------- */
.page { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
.cover-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 30px 34px; }
.cover-head { text-align: center; border-bottom: 2px solid var(--heading); padding-bottom: 18px; margin-bottom: 18px; }
.cover-head .inst { font: 600 0.88rem var(--sans); letter-spacing: 0.05em; color: var(--primary); }
.cover-head h1 { font: 700 1.85rem/1.25 var(--serif); color: var(--heading); margin: 8px 0 4px; }
.cover-head .meta { color: var(--muted); }
.cover-card h2 { font: 700 1.05rem var(--serif); color: var(--heading); margin: 20px 0 6px; }
.cover-card ul { margin: 0; padding-left: 22px; }
.cover-card li { margin-bottom: 4px; }
.papers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
.pcard { border: 1.5px solid var(--border); border-radius: 12px; padding: 18px; background: var(--bg); }
.pcard h3 { font: 700 1.2rem var(--serif); color: var(--heading); margin: 0 0 4px; }
.pcard .status { font-weight: 600; color: var(--primary); }
.pcard .best { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }
.pcard .bar-mini { margin-top: 10px; }
table.plain { border-collapse: collapse; width: 100%; font-size: 0.92rem; margin: 6px 0; }
table.plain th, table.plain td { border-bottom: 1px solid var(--border); padding: 7px 8px; text-align: left; }
table.plain th { color: var(--primary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
table.plain td.num, table.plain th.num { text-align: right; font-variant-numeric: tabular-nums; }
.bigscore { text-align: center; margin: 6px 0 18px; }
.bigscore .val { font: 700 3rem/1.1 var(--serif); color: var(--heading); }
.bigscore .sub { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
.stat { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.stat .k { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.stat .v { font: 700 1.3rem var(--serif); color: var(--primary); }
.breakdowns { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
.missed { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 6px; }
.missed a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); text-decoration: none; }
.missed a:hover { border-color: var(--primary); }
.missed .sc { font-weight: 700; white-space: nowrap; }
.bar-mini { height: 8px; border-radius: 4px; background: var(--code-bg); overflow: hidden; min-width: 70px; }
.bar-mini > div { height: 100%; background: var(--primary); }
#selftest { display: none; white-space: pre-wrap; font: 0.8rem var(--mono); background: var(--card); color: var(--text);
    border: 2px solid var(--heading); padding: 10px; border-radius: 8px; margin: 16px auto; max-width: 1240px; }
</style>
</head>
<body>
<header class="topbar">
    <div class="brand">IE2024 · MCQ Mocks</div>
    <div class="where" id="where"></div>
    <div class="tools">
        <span class="pill" id="scorepill" hidden title="Marks earned / marks of submitted questions"></span>
        <span class="clock" id="clock" hidden title="Time spent on this paper"></span>
        <button id="theme-toggle" class="btn-small" type="button">☾ Dark</button>
        <button id="switch-btn" class="btn secondary" type="button" hidden>Switch paper</button>
        <button id="results-btn" class="btn secondary" type="button" hidden>Results</button>
        <button id="finish-btn" class="btn" type="button" hidden>Finish paper</button>
    </div>
</header>
<div id="banner" class="banner" hidden><span id="banner-text"></span>
    <button class="btn-small" type="button" id="banner-close">Dismiss</button></div>
<div id="app"></div>
<pre id="selftest"></pre>

<script>

const DATA = {"papers":{"1":[{"id":"p1-l3m","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":2,"archetype":"A10","trap":null,"pattern":["A10","F2024-Q2d.iii","MOCK-Q09b"],"topic":"Exponential: set up the integral","stem":"<p>The lifetime X (years) of an LED street lamp is exponential with a mean of 5 years.<\/p><p>Which expression gives the probability that a lamp lasts <em>more than<\/em> 3 years? Do not evaluate it.<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"∫ from 3 to ∞ of 0.2e^(−0.2x) dx","correct":true,"note":"Correct. λ = 1/mean = 0.2, the density is 0.2e^(−0.2x), and 'more than 3' integrates from 3 to ∞.","math":"<math><msubsup><mrow><mo>∫<\/mo><\/mrow><mrow><mn>3<\/mn><\/mrow><mrow><mi>∞<\/mi><\/mrow><\/msubsup><mn>0.2<\/mn><msup><mrow><mi>e<\/mi><\/mrow><mrow><mrow><mo>−<\/mo><mn>0.2<\/mn><mi>x<\/mi><\/mrow><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><\/math>"},{"text":"∫ from 3 to ∞ of 5e^(−5x) dx","correct":false,"note":"This uses the mean (5) as the rate. For the exponential, E(X) = 1/λ, so λ = 1/5.","math":"<math><msubsup><mrow><mo>∫<\/mo><\/mrow><mrow><mn>3<\/mn><\/mrow><mrow><mi>∞<\/mi><\/mrow><\/msubsup><mn>5<\/mn><msup><mrow><mi>e<\/mi><\/mrow><mrow><mrow><mo>−<\/mo><mn>5<\/mn><mi>x<\/mi><\/mrow><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><\/math>"},{"text":"∫ from 0 to 3 of 0.2e^(−0.2x) dx","correct":false,"note":"These limits give P(X < 3), the opposite tail.","math":"<math><msubsup><mrow><mo>∫<\/mo><\/mrow><mrow><mn>0<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/msubsup><mn>0.2<\/mn><msup><mrow><mi>e<\/mi><\/mrow><mrow><mrow><mo>−<\/mo><mn>0.2<\/mn><mi>x<\/mi><\/mrow><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><\/math>"},{"text":"∫ from 3 to ∞ of 0.2x·e^(−0.2x) dx","correct":false,"note":"x·f(x) is the integrand for E(X). A probability integrates f(x) itself.","math":"<math><msubsup><mrow><mo>∫<\/mo><\/mrow><mrow><mn>3<\/mn><\/mrow><mrow><mi>∞<\/mi><\/mrow><\/msubsup><mn>0.2<\/mn><mi>x<\/mi><msup><mrow><mi>e<\/mi><\/mrow><mrow><mrow><mo>−<\/mo><mn>0.2<\/mn><mi>x<\/mi><\/mrow><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><\/math>"}],"explanation":{"verdict":"∫₃^∞ 0.2e^(−0.2x) dx. The skill tested is writing the right density, rate and limits without solving.","reasoning":"<p>Exponential density: f(x) = λe^(−λx), x ≥ 0, with E(X) = 1/λ (L3 slide 74). A mean of 5 years gives λ = 0.2. A probability is the integral of f over the event's range: P(X &gt; 3) = ∫₃^∞ f(x) dx (compare the slide's P(X &lt; 5) = ∫₀⁵ 0.28e^(−0.28x) dx). The October 2024 final asked for exactly this kind of unevaluated expression.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 55, 74–75"},"forms":[],"paper":1,"num":1},{"id":"p1-l5b","type":"multi","marks":2,"lecture":"L5","lectures":["L5"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","F2024-Q4e.a","F2024-Q4e.b","MOCK-Q14a","MOCK-Q14c"],"topic":"Interpreting slope and intercept","stem":"<p>For 30 days at a beach café, daily revenue y (Rs '000) was regressed on the day's maximum temperature x (°C), with temperatures between 24 °C and 34 °C:<\/p><p><math display=\"block\"><mover accent=\"true\"><mrow><mi>y<\/mi><\/mrow><mo>^<\/mo><\/mover><mo>=<\/mo><mn>12.5<\/mn><mo>+<\/mo><mn>3.2<\/mn><mi>x<\/mi><\/math><\/p><p>Which statements are <strong>FALSE<\/strong>?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Each extra 1 °C goes with about Rs 3,200 more predicted daily revenue on average.","correct":false,"note":"TRUE statement, so leave it. The slope is the change in predicted y per unit increase in x."},{"text":"On a 0 °C day the café can expect a daily revenue of about Rs 12,500.","correct":true,"note":"FALSE, so tick it. x = 0 is far outside the observed 24–34 °C, so reading the intercept as a prediction is an extrapolation."},{"text":"The model's predicted revenue on a 30 °C day is about Rs 108,500.","correct":false,"note":"TRUE statement. 12.5 + 3.2 × 30 = 108.5 thousand."},{"text":"A 28 °C day with revenue Rs 100,000 has residual +2.1 (under-predicted).","correct":true,"note":"FALSE, so tick it. ŷ = 102.1 and residual = y − ŷ = 100 − 102.1 = −2.1. The model OVER-predicted that day."},{"text":"Raising the temperature by 1 °C causes revenue to rise by Rs 3,200.","correct":true,"note":"FALSE, so tick it. Regression on observational data shows association. Hot days also bring more tourists, so the slope is not a causal effect."}],"explanation":{"verdict":"Tick three: the 0 °C prediction (extrapolation), the residual's sign, and the causal claim. The skill tested is reading slope, intercept and residual in context.","reasoning":"<p>Slope: change in mean predicted y per 1-unit rise in x. Intercept: predicted y at x = 0, which is meaningful only if 0 lies within the data range. Residual = actual − predicted, y − ŷ (L5 slide 6, SSE), so a negative residual means over-prediction. A fitted slope describes association, not cause and effect.<\/p>","source":"L5 · L5 - Linear Regression (1).pdf, slides 3, 6, 11"},"forms":["neg"],"paper":1,"num":2},{"id":"p1-l4g","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":3,"archetype":"A1","trap":null,"pattern":["A1","F2024-Q3b","MOCK-Q12a"],"topic":"Type I and Type II errors","stem":"<p>An email filter tests H0: 'the email is legitimate' against H1: 'the email is spam', and moves an email to the spam folder when H0 is rejected.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"A Type I error is a legitimate email being moved into the spam folder.","correct":true,"note":"TRUE. A Type I error rejects H0 when it is true: the email is legitimate but gets flagged."},{"text":"A Type II error is a spam email left sitting in the normal inbox.","correct":true,"note":"TRUE. A Type II error fails to reject H0 when H0 is false: the spam is not caught."},{"text":"Lowering α, with nothing else changed, lets more spam reach the inbox.","correct":true,"note":"TRUE. A smaller α shrinks the rejection region, so false H0s are rejected less often and β rises."},{"text":"The power 1 − β is the chance that a spam email is caught by the filter.","correct":true,"note":"TRUE. Power = 1 − β = P(reject H0 | H0 false) (L4 slide 15)."},{"text":"Since α + β = 1, a filter with α = 0.01 must have β = 0.99 exactly.","correct":false,"note":"FALSE. α and β are probabilities under different realities (H0 true vs H0 false). They do not sum to 1."}],"explanation":{"verdict":"Tick all except 'α + β = 1'. The skill tested is mapping Type I/II errors onto a real decision and understanding the α–β trade-off.","reasoning":"<p>Type I error: reject H0 when it is true, probability α. Type II error: do not reject H0 when it is false, probability β. Power = 1 − β (L4 slide 15). The significance level is the Type I risk 'we are willing to live with' (L4 slide 16). Making α smaller moves the critical value further out (compare 1.645 with 2.326), so a false H0 is harder to reject and β grows when n is fixed.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 15–16, 19–21"},"forms":[],"paper":1,"num":3},{"id":"p1-l3i","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":3,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q10a","MOCK-Q10b","MOCK-Q10c"],"topic":"Sampling distribution and the CLT","stem":"<p>Parcel weights at a sorting hub are strongly right-skewed with mean μ = 2.4 kg and standard deviation σ = 0.9 kg. Random samples of n = 36 parcels are taken repeatedly, and the sample mean x̄ is recorded each time.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The standard error of the sample mean x̄ is 0.15 kg for these samples.","correct":true,"note":"TRUE. SE = σ/√n = 0.9/√36 = 0.15."},{"text":"x̄ is approximately normal, even though individual weights are skewed.","correct":true,"note":"TRUE. This is the Central Limit Theorem: as n grows, x̄ is approximately N(μ, σ²/n) whatever the shape of the population."},{"text":"With n = 36, the individual parcel weights become approximately normal.","correct":false,"note":"FALSE. The CLT is about the distribution of x̄. Individual weights keep their skewed population shape however many are sampled."},{"text":"With samples of 144 parcels, the standard error would be half as large.","correct":true,"note":"TRUE. Four times the n halves σ/√n: 0.9/√144 = 0.075."},{"text":"The sampling distribution of x̄ is centred on the median weight, not on μ.","correct":false,"note":"FALSE. The mean of the sampling distribution of x̄ is μ = 2.4 kg. Skew affects the population's median, not the centre of x̄."}],"explanation":{"verdict":"Tick three: SE = 0.15 kg, x̄ approximately normal by the CLT, and n = 144 halving the SE. The skill tested is what the CLT does and does not say.","reasoning":"<p>Sample means are random variables with their own (sampling) distribution, whose standard deviation is the standard error (L3 slide 78). For a large enough sample, x̄ is approximately normal with mean μ and variance σ²/n, even from a non-normal population (L3 slide 79). The CLT changes the shape of the distribution of x̄, not of the individual observations. Because SE ∝ 1/√n, halving the SE needs four times the n.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 76–79"},"forms":[],"paper":1,"num":4},{"id":"p1-l6b","type":"best","marks":2,"lecture":"L6","lectures":["L6"],"kind":"calculation","tier":1,"archetype":"A4","trap":null,"pattern":["A4","MOCK-Q15b"],"topic":"Multiplicative model value","stem":"<p>A factory uses the multiplicative model Y = T × S × C × I. Its estimates for next quarter are T = 240 units, S = 0.85, C = 1.05 and I = 0.98.<\/p><p>What is the estimated output (1 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"209.9 units","correct":true,"note":"Correct. 240 × 0.85 × 1.05 × 0.98 = 209.916."},{"text":"242.9 units","correct":false,"note":"This adds the components. The indices are multipliers in this model, not amounts in units."},{"text":"284.0 units","correct":false,"note":"This reads S = 0.85 as '15% above'. An index below 1 means BELOW the trend, and 1.15 would be 15% above it."},{"text":"204.0 units","correct":false,"note":"This uses only T × S and drops the cyclical and irregular factors."}],"explanation":{"verdict":"209.9 units. All four components are multiplied in this model.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>T × S<\/td><td>240 × 0.85<\/td><td class=\"num\">204<\/td><\/tr><tr><td>× C<\/td><td>× 1.05<\/td><td class=\"num\">214.2<\/td><\/tr><tr><td>× I<\/td><td>× 0.98<\/td><td class=\"num\">209.916<\/td><\/tr><\/table><\/div>","source":"L6 · L6 - Time Series Analysis.pdf, slide 12"},"forms":[],"paper":1,"num":5},{"id":"p1-l5c","type":"multi","marks":2,"lecture":"L5","lectures":["L5","L2"],"kind":"calculation","tier":3,"archetype":"A9","trap":null,"pattern":["A9","F2024-Q4c","F2025-Q4c","F2024-Q4d"],"topic":"Coefficient of determination and correlation","stem":"<p>A simple linear regression of a used car's resale value y on its age x (years) has a negative slope, with TSS = 800 and SSE = 288.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"R² = 1 − SSE/TSS = 0.64, the share of variation explained.","correct":true,"note":"TRUE. (800 − 288)/800 = 0.64."},{"text":"The correlation between age and resale value is r = −0.8.","correct":true,"note":"TRUE. In simple regression R² = r², so |r| = √0.64 = 0.8. The negative slope makes r negative."},{"text":"The correlation between age and resale value is r = 0.64.","correct":false,"note":"FALSE. This confuses r with R². r = ±√R², with the sign of the slope."},{"text":"R² = SSE/TSS = 0.36, the share of variation explained.","correct":false,"note":"FALSE. SSE/TSS = 0.36 is the share left UNexplained. R² = 1 − SSE/TSS."},{"text":"Age causes 64% of the drop in a car's resale value.","correct":false,"note":"FALSE. R² measures how well the line fits. It says nothing about causation."}],"explanation":{"verdict":"Tick two: R² = 0.64 and r = −0.8. The skill tested is R² = 1 − SSE/TSS, its link to r, and what it does not mean.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>R²<\/td><td>(TSS − SSE)/TSS<\/td><td class=\"num\">0.64<\/td><\/tr><tr><td>|r|<\/td><td>√R² (simple regression)<\/td><td class=\"num\">0.8<\/td><\/tr><tr><td>Sign of r<\/td><td>same as the slope<\/td><td class=\"num\">negative<\/td><\/tr><tr><td>Unexplained share<\/td><td>SSE/TSS<\/td><td class=\"num\">0.36<\/td><\/tr><\/table><\/div>","source":"L5 · L5 - Linear Regression (1).pdf, slide 11; L2 · L2 - Descriptive Statistics.pdf, slide 34"},"forms":["combo"],"paper":1,"num":6},{"id":"p1-l3n","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":2,"archetype":"A10","trap":null,"pattern":["A10","MOCK-Q08b","F2024-Q2d.iii"],"topic":"Normal probability as Φ expressions","stem":"<p>Fill volumes on a bottling line are N(500, 4²) ml. The shaded area is the probability that a bottle holds between 494 and 508 ml.<\/p><p>Which expressions equal the shaded area? (Φ is the standard normal CDF, the value read from the Z table.)<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 640 300\" style=\"max-width:704px\" role=\"img\" aria-label=\"Normal curve with mean 500 and SD 4, shaded between 494 and 508\">\n<path d=\"M215.0,234.0 L215.0,170.4 L219.4,164.3 L223.8,157.9 L228.1,151.2 L232.5,144.3 L236.9,137.2 L241.2,130.0 L245.6,122.6 L250.0,115.2 L254.4,107.8 L258.8,100.4 L263.1,93.2 L267.5,86.2 L271.9,79.4 L276.2,72.9 L280.6,66.8 L285.0,61.2 L289.4,56.0 L293.8,51.5 L298.1,47.5 L302.5,44.2 L306.9,41.6 L311.2,39.7 L315.6,38.5 L320.0,38.2 L324.4,38.5 L328.8,39.7 L333.1,41.6 L337.5,44.2 L341.9,47.5 L346.2,51.5 L350.6,56.0 L355.0,61.2 L359.4,66.8 L363.8,72.9 L368.1,79.4 L372.5,86.2 L376.9,93.2 L381.2,100.4 L385.6,107.8 L390.0,115.2 L394.4,122.6 L398.8,130.0 L403.1,137.2 L407.5,144.3 L411.9,151.2 L416.2,157.9 L420.6,164.3 L425.0,170.4 L429.4,176.2 L433.8,181.7 L438.1,186.8 L442.5,191.6 L446.9,196.1 L451.2,200.2 L455.6,204.0 L460.0,207.5 L460.0,234.0 Z\" class=\"shade\"/>\n<polyline points=\"40.0,233.9 44.4,233.9 48.8,233.9 53.1,233.9 57.5,233.8 61.9,233.8 66.2,233.7 70.6,233.7 75.0,233.6 79.4,233.5 83.8,233.3 88.1,233.2 92.5,233.0 96.9,232.8 101.2,232.5 105.6,232.2 110.0,231.8 114.4,231.4 118.8,230.9 123.1,230.2 127.5,229.5 131.9,228.7 136.2,227.8 140.6,226.7 145.0,225.4 149.4,224.0 153.8,222.3 158.1,220.5 162.5,218.4 166.9,216.1 171.2,213.5 175.6,210.7 180.0,207.5 184.4,204.0 188.8,200.2 193.1,196.1 197.5,191.6 201.9,186.8 206.2,181.7 210.6,176.2 215.0,170.4 219.4,164.3 223.8,157.9 228.1,151.2 232.5,144.3 236.9,137.2 241.2,130.0 245.6,122.6 250.0,115.2 254.4,107.8 258.8,100.4 263.1,93.2 267.5,86.2 271.9,79.4 276.2,72.9 280.6,66.8 285.0,61.2 289.4,56.0 293.8,51.5 298.1,47.5 302.5,44.2 306.9,41.6 311.2,39.7 315.6,38.5 320.0,38.2 324.4,38.5 328.8,39.7 333.1,41.6 337.5,44.2 341.9,47.5 346.2,51.5 350.6,56.0 355.0,61.2 359.4,66.8 363.8,72.9 368.1,79.4 372.5,86.2 376.9,93.2 381.2,100.4 385.6,107.8 390.0,115.2 394.4,122.6 398.8,130.0 403.1,137.2 407.5,144.3 411.9,151.2 416.2,157.9 420.6,164.3 425.0,170.4 429.4,176.2 433.8,181.7 438.1,186.8 442.5,191.6 446.9,196.1 451.2,200.2 455.6,204.0 460.0,207.5 464.4,210.7 468.8,213.5 473.1,216.1 477.5,218.4 481.9,220.5 486.2,222.3 490.6,224.0 495.0,225.4 499.4,226.7 503.8,227.8 508.1,228.7 512.5,229.5 516.9,230.2 521.2,230.9 525.6,231.4 530.0,231.8 534.4,232.2 538.8,232.5 543.1,232.8 547.5,233.0 551.9,233.2 556.2,233.3 560.6,233.5 565.0,233.6 569.4,233.7 573.8,233.7 578.1,233.8 582.5,233.8 586.9,233.9 591.2,233.9 595.6,233.9 600.0,233.9\" class=\"curve\"/>\n<line x1=\"40.0\" y1=\"234.0\" x2=\"600.0\" y2=\"234.0\" class=\"ax\"/>\n<line x1=\"110.0\" y1=\"234.0\" x2=\"110.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"110.0\" y=\"261.0\" text-anchor=\"middle\">488<\/text>\n<line x1=\"215.0\" y1=\"234.0\" x2=\"215.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"215.0\" y=\"261.0\" text-anchor=\"middle\">494<\/text>\n<line x1=\"320.0\" y1=\"234.0\" x2=\"320.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"320.0\" y=\"261.0\" text-anchor=\"middle\">500<\/text>\n<line x1=\"460.0\" y1=\"234.0\" x2=\"460.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"460.0\" y=\"261.0\" text-anchor=\"middle\">508<\/text>\n<line x1=\"530.0\" y1=\"234.0\" x2=\"530.0\" y2=\"239.0\" class=\"ax\"/>\n<text x=\"530.0\" y=\"261.0\" text-anchor=\"middle\">512<\/text>\n<text x=\"320.0\" y=\"288.0\" text-anchor=\"middle\" class=\"axlab\">Fill volume (ml)<\/text>\n<\/svg>","figcap":null,"options":[{"text":"Φ(2.00) − Φ(−1.50)","correct":true,"note":"Correct. z = (508 − 500)/4 = 2.00 and z = (494 − 500)/4 = −1.50, so the area is Φ(2.00) − Φ(−1.50)."},{"text":"Φ(2.00) + Φ(1.50) − 1","correct":true,"note":"Correct. By symmetry Φ(−1.50) = 1 − Φ(1.50), so Φ(2.00) − Φ(−1.50) = Φ(2.00) + Φ(1.50) − 1."},{"text":"1 − Φ(2.00) + Φ(−1.50)","correct":false,"note":"This is 1 − [Φ(2.00) − Φ(−1.50)], the two unshaded tails P(X < 494) + P(X > 508). It is the complement of the shaded area."},{"text":"Φ(8.00) − Φ(−6.00)","correct":false,"note":"This forgets to divide by σ: 508 − 500 = 8 and 494 − 500 = −6 are raw distances, not z-scores."},{"text":"Φ(0.50) − Φ(−0.38)","correct":false,"note":"This divides by the variance 16 instead of the SD 4 (8/16 = 0.50, −6/16 ≈ −0.38)."}],"explanation":{"verdict":"Tick Φ(2.00) − Φ(−1.50) and its symmetric form Φ(2.00) + Φ(1.50) − 1 (both ≈ 0.9104). The skill tested is standardising with z = (x − μ)/σ and using symmetry.","reasoning":"<p>Standardise each bound with z = (x − μ)/σ (L3 slide 70), then take the difference of the table values, as in the slides' 'proportion between 42 and 58' example (L3 slides 72–73). Since the curve is symmetric about 0, Φ(−z) = 1 − Φ(z). The two distractor families both come from the standardising step: no division at all, or division by σ² instead of σ.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 69–73"},"forms":["fig"],"paper":1,"num":7},{"id":"p1-l4e","type":"best","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":1,"archetype":"A6","trap":null,"pattern":["A6","MOCK-Q11a"],"topic":"Choosing z or t","stem":"<p>A quality engineer measures the breaking strength of 12 randomly chosen cables. Strengths are known to be normally distributed, but the population standard deviation is unknown, so the engineer computes x̄ and s.<\/p><p>Which interval for μ follows the lecture's rule?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"A t-interval with 11 degrees of freedom, using s/√n","correct":true,"note":"Correct. σ unknown, so σ is estimated by s and the multiplier comes from t with n − 1 = 11 df (L4 slide 8)."},{"text":"A z-interval, because the population is known to be normal","correct":false,"note":"Runner-up. Normality is needed, but the slides' z-interval also requires σ to be known (L4 slide 6). Here σ is unknown, so t applies."},{"text":"A t-interval with 12 degrees of freedom, using s/√n","correct":false,"note":"Right family, wrong df. The t-interval uses n − 1 = 11 degrees of freedom."},{"text":"A z-interval, using s in place of σ since s estimates σ","correct":false,"note":"Swapping s into the z formula ignores the extra uncertainty from estimating σ. That is exactly why the t distribution is used."}],"explanation":{"verdict":"A t-interval with 11 df. The deciding fact is whether σ is known, not whether the data are normal.","reasoning":"<p>The slides give two one-sample intervals: σ known gives X̄ ± Z(1−α/2)·σ/√n, and σ unknown gives X̄ ± t(n−1, α/2)·S/√n (L4 slides 6, 8). Normal data are assumed in both, so normality cannot be the reason to choose z. The degrees of freedom are n − 1 because one degree of freedom is used up by estimating the mean.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 6, 8"},"forms":["runner"],"paper":1,"num":8},{"id":"p1-l4o","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"calculation","tier":3,"archetype":"A6","trap":null,"pattern":["A6","MOCK-Q13b","MOCK-Q13c"],"topic":"Chi-square test for two proportions","stem":"<p>A bank surveys 200 randomly chosen customers to compare the proportion who use online banking in two age groups.<\/p><div class=\"tablewrap\"><table class=\"data\"><tr><th>Age group<\/th><th class=\"num\">Uses online banking<\/th><th class=\"num\">Does not<\/th><th class=\"num\">Total<\/th><\/tr><tr><td>Under 40<\/td><td class=\"num\">90<\/td><td class=\"num\">30<\/td><td class=\"num\">120<\/td><\/tr><tr><td>40 and over<\/td><td class=\"num\">42<\/td><td class=\"num\">38<\/td><td class=\"num\">80<\/td><\/tr><tr><td>Total<\/td><td class=\"num\">132<\/td><td class=\"num\">68<\/td><td class=\"num\">200<\/td><\/tr><\/table><\/div><p>Test H0: p<sub>under 40<\/sub> = p<sub>40+<\/sub> at 5% with χ²<sub>0.05, 1<\/sub> = 3.841. Which statements are TRUE (2 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"χ²stat ≈ 10.83, which exceeds 3.841, so H0 is rejected at 5%.","correct":true,"note":"TRUE. Pooled p̄ = 132/200 = 0.66. The expected counts are 79.2, 40.8, 52.8, 27.2, and every |O − E| = 10.8, so χ² = 10.8² × Σ(1/E) = 10.83."},{"text":"The pooled proportion is p̄ = (90/120 + 42/80)/2 = 0.6375.","correct":false,"note":"FALSE. This averages the two sample proportions without weighting. The slides pool the counts: p̄ = (X1 + X2)/(n1 + n2) = 132/200 = 0.66."},{"text":"The expected count for 40+ 'uses online banking' is 66, half of 132.","correct":false,"note":"FALSE. This splits the 132 users equally between the groups. Under H0 the expected count is n2·p̄ = 80 × 0.66 = 52.8."},{"text":"χ²stat ≈ 3.68 from the two 'uses' cells, so H0 is not rejected.","correct":false,"note":"FALSE. The statistic sums (fo − fe)²/fe over ALL four cells, not only the 'yes' row."},{"text":"There are 4 − 1 = 3 degrees of freedom, one less than the cell count.","correct":false,"note":"FALSE. A 2 × 2 table has (2 − 1)(2 − 1) = 1 degree of freedom."}],"explanation":{"verdict":"Only 'χ² ≈ 10.83 > 3.841, reject H0' is true. The skill tested is the slides' chi-square procedure: pooled p̄, expected counts, and summing over all cells.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Pooled proportion<\/td><td>p̄ = (90 + 42)/(120 + 80)<\/td><td class=\"num\">0.66<\/td><\/tr><tr><td>Expected (under 40)<\/td><td>120 × 0.66, 120 × 0.34<\/td><td class=\"num\">79.2, 40.8<\/td><\/tr><tr><td>Expected (40+)<\/td><td>80 × 0.66, 80 × 0.34<\/td><td class=\"num\">52.8, 27.2<\/td><\/tr><tr><td>χ²stat<\/td><td>Σ (fo − fe)²/fe over 4 cells<\/td><td class=\"num\">10.8289<\/td><\/tr><tr><td>Decision<\/td><td>χ²stat vs 3.841 (1 df)<\/td><td class=\"num\">reject H0<\/td><\/tr><\/table><\/div>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 65–71"},"forms":[],"paper":1,"num":9},{"id":"p1-l6c","type":"multi","marks":2,"lecture":"L6","lectures":["L6"],"kind":"theory","tier":1,"archetype":"A1","trap":null,"pattern":["A1","MOCK-Q15a"],"topic":"Components of a time series","stem":"<p>An analyst labels the features of a city's monthly electricity demand.<\/p><p>Which labels are <strong>INCORRECT<\/strong>?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Demand peaks every April and May, the hottest months: seasonal (S).","correct":false,"note":"Correct label, so leave it. A regular pattern repeating within each year is seasonal."},{"text":"A two-week drop after a cyclone damaged power lines: cyclical (C).","correct":true,"note":"Incorrect label, so tick it. An unpredictable one-off shock is irregular (I), like the slides' natural disasters."},{"text":"Steady growth over 15 years as the city expands: cyclical (C).","correct":true,"note":"Incorrect label, so tick it. A long-term movement in one direction is the trend (T)."},{"text":"A rise and fall over 6–8 years tracking a boom and bust: irregular (I).","correct":true,"note":"Incorrect label, so tick it. Multi-year rises and falls driven by business cycles are cyclical (C)."},{"text":"Demand is higher every December holiday season: trend (T).","correct":true,"note":"Incorrect label, so tick it. A pattern that repeats every year in the same month is seasonal (S)."}],"explanation":{"verdict":"Tick the four incorrect labels. Only 'April–May peak = seasonal' is right. The skill tested is telling T, S, C and I apart by what drives each.","reasoning":"<p>Trend: long-term movement. Seasonal: regular patterns repeating within fixed periods (e.g. every summer, every December). Cyclical: long-term fluctuations from economic or business cycles (recession, expansion). Irregular: unexpected changes that cannot be predicted (disasters, pandemics) (L6 slides 5–8).<\/p>","source":"L6 · L6 - Time Series Analysis.pdf, slides 4–9"},"forms":["neg"],"paper":1,"num":10},{"id":"p1-l3k","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":1,"archetype":"A5","trap":4,"pattern":["A5","F2025-Q2a"],"topic":"Classical probability with a decoy","stem":"<p>A balanced prize wheel has 8 equal sectors numbered 1 to 8. At yesterday's fair it was spun 40 times and landed on 3 eleven times.<\/p><p>What is the probability that the next spin lands on 3?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"1/8, since each spin of a balanced wheel is equally likely to give each number","correct":true,"note":"Correct. 'Balanced' means equally likely outcomes, so the classical definition gives n(E)/n(S) = 1/8. Spins are independent, so yesterday's results do not change this."},{"text":"11/40, since the wheel's past results are the best guide to its probabilities","correct":false,"note":"Runner-up. A relative frequency would be reasonable if the wheel's fairness were unknown, but the question states it is balanced, so the classical definition applies (L3 slide 16). The 11 out of 40 is a decoy."},{"text":"Less than 1/8, since 3 has come up far too often and is now due to come up less","correct":false,"note":"This is the gambler's fallacy. Independent spins have no memory, so past 3s do not make a 3 less likely."},{"text":"1/40, since we want one favourable outcome out of the 40 spins already recorded","correct":false,"note":"This takes the 40 past spins as the sample space. The sample space of one spin is {1, …, 8}."}],"explanation":{"verdict":"1/8. The spin history is irrelevant detail for a balanced wheel with independent spins.","reasoning":"<p>The classical definition, P(E) = n(E)/n(S), applies when all outcomes are equally likely, which is what 'balanced' guarantees (L3 slide 16). Successive spins are independent trials, so earlier outcomes do not change the probability for the next spin (L3 slides 12–13). This mirrors the lecturer's May 2025 question in which a date range and an unknown year were decoys (the answer was 1/7).<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 12–13, 16"},"forms":["runner"],"paper":1,"num":11},{"id":"p1-l4c","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"calculation","tier":3,"archetype":"A6","trap":null,"pattern":["A6","MOCK-Q11b","MOCK-Q11c","MOCK-Q11a"],"topic":"t confidence interval for a mean","stem":"<p>A café weighs a random sample of 10 packs labelled '250 g': x̄ = 246.8 g and s = 4.2 g. Pack weights are normal and σ is unknown. Use t<sub>(9), 0.025<\/sub> = 2.262.<\/p><p>Which statements are TRUE (2 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The 95% confidence interval for the mean weight μ is (243.80, 249.80) g.","correct":true,"note":"TRUE. SE = 4.2/√10 = 1.3282; margin = 2.262 × 1.3282 = 3.00; x̄ ± margin."},{"text":"The 95% confidence interval for the mean weight μ is (244.20, 249.40) g.","correct":false,"note":"FALSE. This uses z = 1.96 instead of t. With σ unknown the slides use t with n − 1 = 9 df, which gives a wider interval."},{"text":"Since the interval excludes 250 g, the labelled mean is not supported.","correct":true,"note":"TRUE. The upper limit 249.80 is below 250, so 250 is not a plausible value of μ at the 95% level."},{"text":"t is used because the weights are skewed; normal data would use z = 1.96.","correct":false,"note":"FALSE. The weights are normal. t is used because σ is unknown and estimated by s (L4 slide 8). Normality is what the t method assumes."},{"text":"The margin of error is 2.262 × 4.2 = 9.50 g, using the sample's s.","correct":false,"note":"FALSE. This multiplies by s instead of the standard error s/√n. The correct margin is 3.00 g."}],"explanation":{"verdict":"Tick two: the interval (243.80, 249.80) and its reading that 250 g is not supported. The skill tested is the slides' t-interval x̄ ± t(n−1, α/2)·s/√n.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Standard error<\/td><td>s/√n = 4.2/√10<\/td><td class=\"num\">1.3282<\/td><\/tr><tr><td>Margin<\/td><td>t(9, 0.025) × SE = 2.262 × SE<\/td><td class=\"num\">3.0043<\/td><\/tr><tr><td>Lower limit<\/td><td>x̄ − margin<\/td><td class=\"num\">243.80<\/td><\/tr><tr><td>Upper limit<\/td><td>x̄ + margin<\/td><td class=\"num\">249.80<\/td><\/tr><\/table><\/div>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 8–9, 5"},"forms":[],"paper":1,"num":12},{"id":"p1-l2c","type":"multi","marks":2,"lecture":"L2","lectures":["L2"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","F2025-Q1c","MOCK-Q02c"],"topic":"Reading side-by-side boxplots","stem":"<p>The boxplots compare call-handling times at two call centres. Whiskers reach the most extreme values inside the 1.5 × IQR fences, and points beyond them are outliers.<\/p><p>Which statements are <strong>FALSE<\/strong>?<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 640 246\" style=\"max-width:704px\" role=\"img\" aria-label=\"Boxplots of call-handling times at two call centres\">\n<line x1=\"132.1\" y1=\"55.5\" x2=\"201.2\" y2=\"55.5\" class=\"whisk\"/>\n<line x1=\"304.9\" y1=\"55.5\" x2=\"443.2\" y2=\"55.5\" class=\"whisk\"/>\n<line x1=\"132.1\" y1=\"46.5\" x2=\"132.1\" y2=\"64.5\" class=\"whisk\"/>\n<line x1=\"443.2\" y1=\"46.5\" x2=\"443.2\" y2=\"64.5\" class=\"whisk\"/>\n<rect x=\"201.2\" y=\"40.5\" width=\"103.7\" height=\"30\" class=\"box\"/>\n<line x1=\"235.8\" y1=\"40.5\" x2=\"235.8\" y2=\"70.5\" class=\"med\"/>\n<circle cx=\"581.4\" cy=\"55.5\" r=\"4.5\" class=\"outl\"/>\n<text x=\"49.0\" y=\"60.0\" text-anchor=\"end\">North<\/text>\n<line x1=\"166.7\" y1=\"138.5\" x2=\"270.4\" y2=\"138.5\" class=\"whisk\"/>\n<line x1=\"374.1\" y1=\"138.5\" x2=\"477.8\" y2=\"138.5\" class=\"whisk\"/>\n<line x1=\"166.7\" y1=\"129.5\" x2=\"166.7\" y2=\"147.5\" class=\"whisk\"/>\n<line x1=\"477.8\" y1=\"129.5\" x2=\"477.8\" y2=\"147.5\" class=\"whisk\"/>\n<rect x=\"270.4\" y=\"123.5\" width=\"103.7\" height=\"30\" class=\"box\"/>\n<line x1=\"339.5\" y1=\"123.5\" x2=\"339.5\" y2=\"153.5\" class=\"med\"/>\n<text x=\"49.0\" y=\"143.0\" text-anchor=\"end\">South<\/text>\n<line x1=\"63.0\" y1=\"180.0\" x2=\"616.0\" y2=\"180.0\" class=\"ax\"/>\n<line x1=\"63.0\" y1=\"180.0\" x2=\"63.0\" y2=\"185.0\" class=\"ax\"/>\n<text x=\"63.0\" y=\"207.0\" text-anchor=\"middle\">0<\/text>\n<line x1=\"132.1\" y1=\"180.0\" x2=\"132.1\" y2=\"185.0\" class=\"ax\"/>\n<text x=\"132.1\" y=\"207.0\" text-anchor=\"middle\">2<\/text>\n<line x1=\"201.2\" y1=\"180.0\" x2=\"201.2\" y2=\"185.0\" class=\"ax\"/>\n<text x=\"201.2\" y=\"207.0\" text-anchor=\"middle\">4<\/text>\n<line x1=\"270.4\" y1=\"180.0\" x2=\"270.4\" y2=\"185.0\" class=\"ax\"/>\n<text x=\"270.4\" y=\"207.0\" text-anchor=\"middle\">6<\/text>\n<line x1=\"339.5\" y1=\"180.0\" x2=\"339.5\" y2=\"185.0\" class=\"ax\"/>\n<text x=\"339.5\" y=\"207.0\" text-anchor=\"middle\">8<\/text>\n<line x1=\"408.6\" y1=\"180.0\" x2=\"408.6\" y2=\"185.0\" class=\"ax\"/>\n<text x=\"408.6\" y=\"207.0\" text-anchor=\"middle\">10<\/text>\n<line x1=\"477.8\" y1=\"180.0\" x2=\"477.8\" y2=\"185.0\" class=\"ax\"/>\n<text x=\"477.8\" y=\"207.0\" text-anchor=\"middle\">12<\/text>\n<line x1=\"546.9\" y1=\"180.0\" x2=\"546.9\" y2=\"185.0\" class=\"ax\"/>\n<text x=\"546.9\" y=\"207.0\" text-anchor=\"middle\">14<\/text>\n<line x1=\"616.0\" y1=\"180.0\" x2=\"616.0\" y2=\"185.0\" class=\"ax\"/>\n<text x=\"616.0\" y=\"207.0\" text-anchor=\"middle\">16<\/text>\n<text x=\"339.5\" y=\"234.0\" text-anchor=\"middle\" class=\"axlab\">Call-handling time (minutes)<\/text>\n<\/svg>","figcap":null,"options":[{"text":"South has the larger IQR, since its box sits further to the right.","correct":true,"note":"FALSE, so tick it. Both boxes are 3 minutes wide (North 4–7, South 6–9). A box's position shows its location, not its spread."},{"text":"South's median handling time is 3 minutes higher than North's median.","correct":false,"note":"TRUE statement, so leave it. The medians are 8 and 5."},{"text":"About half of North's calls take between 4 and 7 minutes to handle.","correct":false,"note":"TRUE statement. The box runs from Q1 to Q3, which covers the middle 50% of the data."},{"text":"North's data are right-skewed: the upper whisker and tail are longer.","correct":false,"note":"TRUE statement. The median is near Q1, and the upper whisker plus the outlier stretch much further than the lower whisker."},{"text":"The 15-minute call makes North's median larger than it would be.","correct":true,"note":"FALSE, so tick it. The median depends only on the middle position. An extreme value at the end does not move it."}],"explanation":{"verdict":"Tick the two FALSE statements: 'South has the larger IQR' and 'the outlier raises North's median'. The skill tested is reading location, spread and skew correctly from boxplots.","reasoning":"<p>A boxplot shows the five-number summary. The box is the IQR (the middle 50%), the line inside is the median, the whiskers end at the extreme non-outlying values, and dots are outliers (L2 slide 24). Spread is the box's <em>width<\/em>, not where the box sits. Skew appears as a longer whisker or tail on one side. Outliers change the mean and range but not the median.<\/p>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 24, 29–30, 12"},"forms":["fig","neg"],"paper":1,"num":13},{"id":"p1-l3b","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":2,"archetype":"A3","trap":null,"pattern":["A3","F2024-Q2b"],"topic":"Valid probability mass functions","stem":"<p>Five tables are proposed as probability mass functions of a discrete random variable X.<\/p><p>Which of them <strong>CANNOT<\/strong> be valid pmfs?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"x = 0, 1, 2 with P = 0.5, 0.3, 0.2","correct":false,"note":"Valid, so leave it. Every probability is between 0 and 1 and they sum to 1.0."},{"text":"x = 1, 2, 3 with P = 0.5, 0.4, 0.2","correct":true,"note":"Cannot be valid, so tick it. The probabilities sum to 1.1, not 1."},{"text":"x = −1, 0, 1 with P = 0.25, 0.5, 0.25","correct":false,"note":"Valid, so leave it. Negative values of x are allowed. Only the probabilities must be non-negative and sum to 1."},{"text":"x = 0, 1, 2 with P = 0.6, −0.1, 0.5","correct":true,"note":"Cannot be valid, so tick it. It sums to 1, but a probability of −0.1 is impossible because every probability lies between 0 and 1."},{"text":"x = 2, 4, 6 with P(X = x) = x/12","correct":false,"note":"Valid, so leave it. 2/12 + 4/12 + 6/12 = 1, and all three values are positive."}],"explanation":{"verdict":"Tick the two invalid tables: the one summing to 1.1 and the one with a negative probability. The skill tested is checking both pmf conditions.","reasoning":"<p>A pmf must satisfy two conditions: every P(X = x) lies in [0, 1] (L3 slide 15) and the probabilities over the whole sample space sum to 1, because P(S) = 1. A table can fail either condition alone. The value of x itself can be negative. The traps are checking only the sum, or rejecting negative x.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 15, 50–51"},"forms":["neg"],"paper":1,"num":14},{"id":"p1-l2e","type":"best","marks":2,"lecture":"L2","lectures":["L2"],"kind":"theory","tier":1,"archetype":"A1","trap":null,"pattern":["A1","F2024-Q1e"],"topic":"Choosing a chart","stem":"<p>A university's student-affairs office prepares four charts.<\/p><p>Which pairing of purpose and chart is the <strong>LEAST<\/strong> appropriate?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"A pie chart to show how mean monthly spending changed across 12 months","correct":true,"note":"Least appropriate. A pie chart shows the parts of one whole at a single point in time. A change over time calls for a line chart, whose markers joined in order reveal the trend."},{"text":"A histogram to show the distribution of students' daily commute times","correct":false,"note":"Appropriate. Commute time is a numerical variable, and a histogram approximates its distribution."},{"text":"Side-by-side boxplots to compare GPA distributions across five faculties","correct":false,"note":"Appropriate. This shows one quantitative variable across the levels of a categorical variable, exactly the slides' use."},{"text":"A stacked bar chart to show each faculty's enrolment split by year of study","correct":false,"note":"Appropriate. Each bar is a total (faculty enrolment) broken into sub-amounts (years), which is the slides' definition of a stacked bar chart."}],"explanation":{"verdict":"The pie chart for a 12-month change is the least appropriate. The skill tested is matching a chart to the variable type and the purpose.","reasoning":"<p>The slides pair line charts with patterns over time (trend, seasonality), histograms with the distribution of one numerical variable, side-by-side boxplots with a quantitative variable across categories, and stacked bars with totals split into sub-amounts. A pie chart shows proportions of one whole, so it cannot show a sequence over time.<\/p>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 18–30"},"forms":["neg"],"paper":1,"num":15},{"id":"p1-l2a","type":"multi","marks":2,"lecture":"L2","lectures":["L2"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","F2025-Q1c","MOCK-Q02c"],"topic":"Skewness from a histogram","stem":"<p>The histogram shows the delivery distance of 80 food orders from one restaurant.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 640 330\" style=\"max-width:704px\" role=\"img\" aria-label=\"Histogram of delivery distances for 80 food orders\">\n<line x1=\"87.0\" y1=\"214.8\" x2=\"616.0\" y2=\"214.8\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"165.6\" x2=\"616.0\" y2=\"165.6\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"116.4\" x2=\"616.0\" y2=\"116.4\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"67.2\" x2=\"616.0\" y2=\"67.2\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"18.0\" x2=\"616.0\" y2=\"18.0\" class=\"grid\"/>\n<rect x=\"86.0\" y=\"205.0\" width=\"66.2\" height=\"59.0\" class=\"bar\"/>\n<rect x=\"152.2\" y=\"86.9\" width=\"66.2\" height=\"177.1\" class=\"bar\"/>\n<rect x=\"218.5\" y=\"27.8\" width=\"66.2\" height=\"236.2\" class=\"bar\"/>\n<rect x=\"284.8\" y=\"126.2\" width=\"66.2\" height=\"137.8\" class=\"bar\"/>\n<rect x=\"351.0\" y=\"185.3\" width=\"66.2\" height=\"78.7\" class=\"bar\"/>\n<rect x=\"417.2\" y=\"214.8\" width=\"66.2\" height=\"49.2\" class=\"bar\"/>\n<rect x=\"483.5\" y=\"234.5\" width=\"66.2\" height=\"29.5\" class=\"bar\"/>\n<rect x=\"549.8\" y=\"244.3\" width=\"66.2\" height=\"19.7\" class=\"bar\"/>\n<line x1=\"86.0\" y1=\"264.0\" x2=\"616.0\" y2=\"264.0\" class=\"ax\"/>\n<line x1=\"86.0\" y1=\"264.0\" x2=\"86.0\" y2=\"269.0\" class=\"ax\"/>\n<text x=\"86.0\" y=\"291.0\" text-anchor=\"middle\">0<\/text>\n<line x1=\"152.2\" y1=\"264.0\" x2=\"152.2\" y2=\"269.0\" class=\"ax\"/>\n<text x=\"152.2\" y=\"291.0\" text-anchor=\"middle\">2<\/text>\n<line x1=\"218.5\" y1=\"264.0\" x2=\"218.5\" y2=\"269.0\" class=\"ax\"/>\n<text x=\"218.5\" y=\"291.0\" text-anchor=\"middle\">4<\/text>\n<line x1=\"284.8\" y1=\"264.0\" x2=\"284.8\" y2=\"269.0\" class=\"ax\"/>\n<text x=\"284.8\" y=\"291.0\" text-anchor=\"middle\">6<\/text>\n<line x1=\"351.0\" y1=\"264.0\" x2=\"351.0\" y2=\"269.0\" class=\"ax\"/>\n<text x=\"351.0\" y=\"291.0\" text-anchor=\"middle\">8<\/text>\n<line x1=\"417.2\" y1=\"264.0\" x2=\"417.2\" y2=\"269.0\" class=\"ax\"/>\n<text x=\"417.2\" y=\"291.0\" text-anchor=\"middle\">10<\/text>\n<line x1=\"483.5\" y1=\"264.0\" x2=\"483.5\" y2=\"269.0\" class=\"ax\"/>\n<text x=\"483.5\" y=\"291.0\" text-anchor=\"middle\">12<\/text>\n<line x1=\"549.8\" y1=\"264.0\" x2=\"549.8\" y2=\"269.0\" class=\"ax\"/>\n<text x=\"549.8\" y=\"291.0\" text-anchor=\"middle\">14<\/text>\n<line x1=\"616.0\" y1=\"264.0\" x2=\"616.0\" y2=\"269.0\" class=\"ax\"/>\n<text x=\"616.0\" y=\"291.0\" text-anchor=\"middle\">16<\/text>\n<text x=\"351.0\" y=\"318.0\" text-anchor=\"middle\" class=\"axlab\">Delivery distance (km)<\/text>\n<line x1=\"86.0\" y1=\"18.0\" x2=\"86.0\" y2=\"264.0\" class=\"ax\"/>\n<line x1=\"81.0\" y1=\"264.0\" x2=\"86.0\" y2=\"264.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"268.5\" text-anchor=\"end\">0<\/text>\n<line x1=\"81.0\" y1=\"214.8\" x2=\"86.0\" y2=\"214.8\" class=\"ax\"/>\n<text x=\"74.0\" y=\"219.3\" text-anchor=\"end\">5<\/text>\n<line x1=\"81.0\" y1=\"165.6\" x2=\"86.0\" y2=\"165.6\" class=\"ax\"/>\n<text x=\"74.0\" y=\"170.1\" text-anchor=\"end\">10<\/text>\n<line x1=\"81.0\" y1=\"116.4\" x2=\"86.0\" y2=\"116.4\" class=\"ax\"/>\n<text x=\"74.0\" y=\"120.9\" text-anchor=\"end\">15<\/text>\n<line x1=\"81.0\" y1=\"67.2\" x2=\"86.0\" y2=\"67.2\" class=\"ax\"/>\n<text x=\"74.0\" y=\"71.7\" text-anchor=\"end\">20<\/text>\n<line x1=\"81.0\" y1=\"18.0\" x2=\"86.0\" y2=\"18.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"22.5\" text-anchor=\"end\">25<\/text>\n<text x=\"46.8\" y=\"141.0\" text-anchor=\"middle\" class=\"axlab\" transform=\"rotate(-90 46.8 141.0)\">Number of orders<\/text>\n<\/svg>","figcap":"Class intervals include the lower edge (e.g. 2 ≤ d < 4).","options":[{"text":"It is positively (right) skewed: the long tail runs toward larger distances.","correct":true,"note":"TRUE. Most orders are short, with a thin tail out to 16 km, which is the shape the slides label 'positively skewed'."},{"text":"The mean distance is likely to be larger than the median distance here.","correct":true,"note":"TRUE. The few long deliveries pull the mean toward the tail. From the class midpoints, mean ≈ 5.92 km and median ≈ 5.33 km."},{"text":"Counting up the bars from the left, the median lies in the 4–6 km class.","correct":true,"note":"TRUE. With n = 80 the median is between the 40th and 41st orders. The cumulative counts are 6, 24, 48, 62…, so both fall in the 4–6 km class."},{"text":"The distribution is negatively skewed, because most of the tall bars are on the left.","correct":false,"note":"FALSE. Skew is named after the tail, not after where the bulk is. A bulk on the left with a tail to the right is positive skew."},{"text":"The median is pulled further toward the tail than the mean, overstating a typical order.","correct":false,"note":"FALSE. It is the other way round. The mean is the measure pulled toward extreme values, while the median is resistant."}],"explanation":{"verdict":"Tick the three TRUE statements: right skew, mean > median, and the median in the 4–6 km class. The skill tested is reading skewness and the mean/median order from a histogram.","reasoning":"<p>For a positively skewed distribution mode &lt; median &lt; mean, because the long right tail drags the mean (L2 slide 23 shows the positively skewed curve). To locate the median class, count up the cumulative frequencies to the middle position, n/2. The common mistake is naming skew after the side where the bars are tallest. Skew is named after the tail.<\/p>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 21–23"},"forms":["fig"],"paper":1,"num":16},{"id":"p1-l3g","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"calculation","tier":2,"archetype":"A4","trap":null,"pattern":["A4","F2025-Q3a","MOCK-Q06c"],"topic":"Properties of E(X) and V(X)","stem":"<p>A courier's daily number of deliveries X has E(X) = 40 and V(X) = 25. Daily pay is P = 150X + 1,000 rupees.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The mean daily pay is E(P) = 150 × 40 = Rs 6,000.","correct":false,"note":"FALSE. E(aX + b) = aE(X) + b, so the constant stays in: E(P) = 6,000 + 1,000 = Rs 7,000."},{"text":"The standard deviation of daily pay is Rs 750.","correct":true,"note":"TRUE. V(P) = 150² × 25 = 562,500, and SD(P) = √562,500 = 750."},{"text":"The variance of daily pay is V(P) = 150 × 25 = 3,750.","correct":false,"note":"FALSE. A scale factor comes out of a variance squared: V(aX) = a²V(X) = 562,500."},{"text":"The standard deviation of daily pay is Rs 1,750.","correct":false,"note":"FALSE. This computes 150 × 5 + 1,000, adding the constant to the SD. Adding a constant shifts every value but not the spread, so SD(P) = 750."},{"text":"The variance of daily pay is 150² × 25 + 1,000 = 563,500.","correct":false,"note":"FALSE. V(aX + b) = a²V(X). The '+ b' has no effect on a variance."}],"explanation":{"verdict":"Only SD(P) = Rs 750 is true. The skill tested is the linear-transformation rules E(aX + b) = aE(X) + b and V(aX + b) = a²V(X).","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Mean<\/td><td>E(aX + b) = aE(X) + b<\/td><td class=\"num\">6,000 + 1,000 = 7,000<\/td><\/tr><tr><td>Variance<\/td><td>V(aX + b) = a²V(X)<\/td><td class=\"num\">22,500 × 25 = 562,500<\/td><\/tr><tr><td>Standard deviation<\/td><td>√V(P) = |a| × SD(X)<\/td><td class=\"num\">150 × 5 = 750<\/td><\/tr><\/table><\/div>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 56–57"},"forms":[],"paper":1,"num":17},{"id":"p1-l3h","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"calculation","tier":3,"archetype":"A4","trap":null,"pattern":["A4","F2025-Q2b.i","F2025-Q2b.ii","F2025-Q2b.iii"],"topic":"PDF: constant and probabilities","stem":"<p>A continuous random variable X has density f(x) = k(4 − x) for 0 &lt; x &lt; 4, and f(x) = 0 otherwise.<\/p><p>Which statements are <strong>FALSE<\/strong>?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"k = 1/8, chosen so that the total area under f is exactly 1.","correct":false,"note":"TRUE statement, so leave it. ∫₀⁴ k(4 − x) dx = k[4x − x²/2]₀⁴ = 8k = 1."},{"text":"P(X < 2) = 0.75, found by integrating f from 0 to 2.","correct":false,"note":"TRUE statement. (1/8)[4x − x²/2]₀² = (1/8)(8 − 2) = 0.75."},{"text":"P(X < 2) = 0.5, because 2 is halfway along the range.","correct":true,"note":"FALSE, so tick it. 'Halfway along the range' gives half the probability only for a flat (uniform) density. This density is highest near 0."},{"text":"k = 1/16, using area = f(0) × 4, as if under a rectangle.","correct":true,"note":"FALSE, so tick it. The region under f is a triangle (base 4, height 4k), so its area is 8k, not 16k."},{"text":"E(X) = 2, the midpoint of the range from 0 to 4.","correct":true,"note":"FALSE, so tick it. E(X) = ∫ x f(x) dx = (1/8)[2x² − x³/3]₀⁴ = 1.333. Weight near 0 pulls the mean below the midpoint."}],"explanation":{"verdict":"Tick the three FALSE statements: P(X < 2) = 0.5, k = 1/16, and E(X) = 2. The skill tested is working a PDF end to end: normalising, then integrating for probabilities and the mean.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Normalise<\/td><td>∫₀⁴ k(4 − x) dx = 8k = 1<\/td><td class=\"num\">k = 1/8<\/td><\/tr><tr><td>Probability<\/td><td>∫₀² (1/8)(4 − x) dx<\/td><td class=\"num\">0.75<\/td><\/tr><tr><td>Mean<\/td><td>∫₀⁴ x(1/8)(4 − x) dx<\/td><td class=\"num\">1.3333<\/td><\/tr><\/table><\/div>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 53, 55"},"forms":["neg"],"paper":1,"num":18},{"id":"p1-l2f","type":"best","marks":2,"lecture":"L2","lectures":["L2"],"kind":"theory","tier":2,"archetype":"A8","trap":null,"pattern":["A8","MOCK-Q02c","MOCK-Q02a"],"topic":"Robust vs sensitive measures","stem":"<p>Monthly earnings (Rs '000) of the eight people at a small design studio, the owner included:<\/p><p><span class=\"dataline\">85, 90, 92, 95, 98, 100, 104, 640<\/span><\/p><div class=\"claims\"><p><span class=\"who\">Student A:<\/span> “The typical earning is Rs 163,000, because the mean uses every value.”<\/p><p><span class=\"who\">Student B:<\/span> “The median, Rs 96,500, is more typical: the owner's 640 pulls the mean up but barely moves the median.”<\/p><\/div><p>Who is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Student B, because the median resists the single extreme value, which drags the mean upward.","correct":true,"note":"Correct. Seven of the eight earn 85–104, so the mean of 163 describes nobody. The median of 96.5 sits among the typical values."},{"text":"Student A, because a measure that uses every single value is the most representative one.","correct":false,"note":"Using every value is exactly why the mean is sensitive to one extreme value. 'Always' is false whenever there is an outlier."},{"text":"Student B, because the median is larger than the mean whenever the data contain an outlier.","correct":false,"note":"Right student, wrong reason. Here the median (96.5) is smaller than the mean (163). A high outlier pushes the mean above the median."},{"text":"Student A, because removing the owner would shift the median about as much as the mean.","correct":false,"note":"Removing 640 moves the mean from 163 to 94.9 but the median only from 96.5 to 95."}],"explanation":{"verdict":"Student B is correct. With an extreme value present, the median is the robust measure of a typical value and the mean is pulled toward the outlier.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Mean (all 8)<\/td><td>1304 / 8<\/td><td class=\"num\">163<\/td><\/tr><tr><td>Median (all 8)<\/td><td>(95 + 98) / 2<\/td><td class=\"num\">96.5<\/td><\/tr><tr><td>Mean without 640<\/td><td>664 / 7<\/td><td class=\"num\">94.86<\/td><\/tr><tr><td>Median without 640<\/td><td>4th of 7 values<\/td><td class=\"num\">95<\/td><\/tr><\/table><\/div>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 5–7"},"forms":["ab"],"paper":1,"num":19},{"id":"p1-l4h","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":3,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q12b","MOCK-Q12c","F2024-Q3d.ii"],"topic":"Reading a test decision","stem":"<p>A school tests whether its pupils' mean reading score is <em>below<\/em> the national mean of 72 (σ known). The test statistic is z<sub>cal<\/sub> = −1.52. Critical values: −1.645 (left tail, α = 0.05), −1.282 (left tail, α = 0.10), ±1.96 (two-tailed, α = 0.05).<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 640 306\" style=\"max-width:704px\" role=\"img\" aria-label=\"Standard normal curve with the left 5% tail shaded and a dashed line at z = −1.52\">\n<path d=\"M40.0,240.0 L40.0,239.7 L43.9,239.6 L47.8,239.6 L51.7,239.5 L55.6,239.4 L59.4,239.3 L63.3,239.2 L67.2,239.0 L71.1,238.8 L75.0,238.6 L78.9,238.4 L82.8,238.1 L86.7,237.8 L90.6,237.5 L94.4,237.1 L98.3,236.6 L102.2,236.1 L106.1,235.6 L110.0,234.9 L113.9,234.2 L117.8,233.4 L121.7,232.4 L125.6,231.4 L12
