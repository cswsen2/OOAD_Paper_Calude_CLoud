,246.7 526.6,246.9 529.9,247.1 533.2,247.3 536.5,247.4 539.8,247.6 543.1,247.8 546.4,247.9 549.8,248.1 553.1,248.2 556.4,248.4 559.7,248.5 563.0,248.6 566.3,248.8 569.6,248.9 572.9,249.0 576.2,249.1 579.6,249.3 582.9,249.4 586.2,249.5 589.5,249.6 592.8,249.7 596.1,249.8 599.4,249.9 602.8,250.0 606.1,250.1 609.4,250.2 612.7,250.3 616.0,250.4\" class=\"curve\"/>\n<line x1=\"218.5\" y1=\"254.0\" x2=\"218.5\" y2=\"181.7\" class=\"marker\"/>\n<line x1=\"86.0\" y1=\"254.0\" x2=\"616.0\" y2=\"254.0\" class=\"ax\"/>\n<line x1=\"86.0\" y1=\"254.0\" x2=\"86.0\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"86.0\" y=\"281.0\" text-anchor=\"middle\">0<\/text>\n<line x1=\"152.2\" y1=\"254.0\" x2=\"152.2\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"152.2\" y=\"281.0\" text-anchor=\"middle\">20<\/text>\n<line x1=\"218.5\" y1=\"254.0\" x2=\"218.5\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"218.5\" y=\"281.0\" text-anchor=\"middle\">40<\/text>\n<line x1=\"284.8\" y1=\"254.0\" x2=\"284.8\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"284.8\" y=\"281.0\" text-anchor=\"middle\">60<\/text>\n<line x1=\"351.0\" y1=\"254.0\" x2=\"351.0\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"351.0\" y=\"281.0\" text-anchor=\"middle\">80<\/text>\n<line x1=\"417.2\" y1=\"254.0\" x2=\"417.2\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"417.2\" y=\"281.0\" text-anchor=\"middle\">100<\/text>\n<line x1=\"483.5\" y1=\"254.0\" x2=\"483.5\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"483.5\" y=\"281.0\" text-anchor=\"middle\">120<\/text>\n<line x1=\"549.8\" y1=\"254.0\" x2=\"549.8\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"549.8\" y=\"281.0\" text-anchor=\"middle\">140<\/text>\n<line x1=\"616.0\" y1=\"254.0\" x2=\"616.0\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"616.0\" y=\"281.0\" text-anchor=\"middle\">160<\/text>\n<text x=\"351.0\" y=\"308.0\" text-anchor=\"middle\" class=\"axlab\">Charging time t (minutes)<\/text>\n<line x1=\"86.0\" y1=\"18.0\" x2=\"86.0\" y2=\"254.0\" class=\"ax\"/>\n<line x1=\"81.0\" y1=\"254.0\" x2=\"86.0\" y2=\"254.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"258.5\" text-anchor=\"end\">0.00<\/text>\n<line x1=\"81.0\" y1=\"175.3\" x2=\"86.0\" y2=\"175.3\" class=\"ax\"/>\n<text x=\"74.0\" y=\"179.8\" text-anchor=\"end\">0.01<\/text>\n<line x1=\"81.0\" y1=\"96.7\" x2=\"86.0\" y2=\"96.7\" class=\"ax\"/>\n<text x=\"74.0\" y=\"101.2\" text-anchor=\"end\">0.02<\/text>\n<line x1=\"81.0\" y1=\"18.0\" x2=\"86.0\" y2=\"18.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"22.5\" text-anchor=\"end\">0.03<\/text>\n<text x=\"31.6\" y=\"136.0\" text-anchor=\"middle\" class=\"axlab\" transform=\"rotate(-90 31.6 136.0)\">Density f(t)<\/text>\n<\/svg>","figcap":null,"options":[{"text":"P(T = 40) = 0, because T is a continuous random variable.","correct":true,"note":"TRUE. For a continuous variable, the probability of any single exact value is an area of zero width, which is 0."},{"text":"P(T = 40) = f(40) ≈ 0.009, the height of the density curve at t = 40.","correct":false,"note":"FALSE. f(40) = 0.0092 is a density (height), not a probability. Probabilities are areas under f."},{"text":"P(T < 40) and P(T ≤ 40) have exactly the same numerical value.","correct":true,"note":"TRUE. They differ only by P(T = 40), which is 0."},{"text":"P(T > 40) = e^(−1) ≈ 0.368, using the rate λ = 1/40 per minute.","correct":true,"note":"TRUE. With λ = 1/40, P(T > t) = e^(−λt), so P(T > 40) = e^(−1) = 0.3679."},{"text":"A charge is more likely to finish before 40 minutes than after.","correct":true,"note":"TRUE. P(T < 40) = 1 − e^(−1) = 0.632 > 0.5. For this right-skewed shape the mean exceeds the median."}],"explanation":{"verdict":"Tick all except 'P(T = 40) = f(40)'. This is the continuous point-probability trap: a single exact value has probability 0, and the curve's height is a density.","reasoning":"<p>For a continuous random variable, probabilities are areas: P(a &lt; X &lt; b) = ∫ f(x) dx. A single point has no width, so P(X = a) = 0, and &lt; versus ≤ makes no difference. The exponential density is f(x) = λe^(−λx) with E(X) = 1/λ (L3 slide 74), so λ = 1/40 here. The lecture's worked example (slide 75) writes f(X = 5) = 0.07. That number is a density value, and the October 2024 final marked P(X = exactly 2) = 0 for an exponential lifetime.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 53, 55, 74–75"},"forms":["fig"],"paper":1,"num":44},{"id":"p1-l4b","type":"best","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":2,"archetype":"A5","trap":10,"pattern":["A5","MOCK-Q11c"],"topic":"The confidence-interval misconception","stem":"<p>A 95% confidence interval for the mean nightly sleep of first-year students is (6.1, 6.9) hours.<\/p><div class=\"claims\"><p><span class=\"who\">Student A:<\/span> “There is a 95% probability that the true mean sleep time μ lies between 6.1 and 6.9 hours.”<\/p><p><span class=\"who\">Student B:<\/span> “μ is a fixed number, so this interval either contains it or not. The 95% describes how often intervals built this way capture μ.”<\/p><\/div><p>Who is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Student B, because the 95% is the method's long-run success rate, not a chance for this one interval.","correct":true,"note":"Correct. This is exactly the slide's 'Misconception' box: it does not mean a 95% chance that the true mean is in this range. Instead, 95% of intervals from repeated sampling would contain it."},{"text":"Student A, because that is precisely what being '95% confident' is defined to mean in the lecture.","correct":false,"note":"The lecture slide lists Student A's sentence as the misconception. 'Confident' refers to the procedure, not to a probability for one computed interval."},{"text":"Student A, because μ changes from sample to sample, so it has a 95% chance of falling inside.","correct":false,"note":"μ is a fixed population parameter. It is the interval's endpoints that vary between samples."},{"text":"Student B, because a confidence interval tells us nothing at all about where μ is likely to be.","correct":false,"note":"Right student, wrong reason. The interval does give a range of plausible values for μ. What it does not give is a probability statement about this particular interval."}],"explanation":{"verdict":"Student B is correct. This is the CI misconception the L4 slide warns about.","reasoning":"<p>The slide states: 'Interpretation: we are 95% confident that the true average lies between 165 and 175 cm. Misconception: it does not mean that there's a 95% chance the true mean is in that range. Instead, if we were to repeat this sampling process many times, 95% of those intervals would contain the true population mean' (L4 slide 5). Once the interval is computed, μ is either inside or outside. The 95% belongs to the method that produced it.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 4–5"},"forms":["ab"],"paper":1,"num":45},{"id":"p1-l4a","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q11c"],"topic":"Interpreting a confidence interval","stem":"<p>From a random sample of 64 office workers, a 95% confidence interval for the mean one-way commute time μ is (31.4, 36.2) minutes.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"If this sampling were repeated many times, about 95% of the intervals built would contain μ.","correct":true,"note":"TRUE. This is the slides' meaning of 95% confidence: the long-run proportion of such intervals that capture the true parameter."},{"text":"The margin of error of this interval is 2.4 minutes either side of the sample mean.","correct":true,"note":"TRUE. The half-width is (36.2 − 31.4)/2 = 2.4, and the interval is centred on x̄ = 33.8."},{"text":"There is a 95% probability that this sample's mean lies between 31.4 and 36.2 minutes.","correct":false,"note":"FALSE. The sample mean is known: it is 33.8, the centre of the interval. A confidence interval is a statement about μ, not about x̄."},{"text":"A claim that the mean commute is 30 minutes is not supported by this interval.","correct":true,"note":"TRUE. 30 lies outside (31.4, 36.2), so it is not a plausible value of μ at this confidence level (the lecturer's mock reads a CI this way)."},{"text":"A second random sample of 64 workers would give the same interval, (31.4, 36.2).","correct":false,"note":"FALSE. The limits L and U are functions of the sample, so they change from sample to sample. That variation is why 'repeated sampling' appears in the interpretation."}],"explanation":{"verdict":"Tick three: the repeated-sampling meaning, the margin of error 2.4, and that 30 minutes is not supported. The skill tested is what a confidence interval is a statement about.","reasoning":"<p>The slides define the interval through P(L ≤ θ ≤ U) = 1 − α, where L and U are functions of the sample, and explain it 'in simple words' as: over many repeated random samples, (1 − α)100% of the intervals contain θ (L4 slide 4). The interval is centred on x̄, which is known exactly, and its half-width is the margin of error. A value outside the interval, such as 30, is not supported as the population mean.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 4–5"},"forms":[],"paper":1,"num":46},{"id":"p1-l2d","type":"multi","marks":2,"lecture":"L2","lectures":["L2","L5"],"kind":"theory","tier":3,"archetype":"A1","trap":null,"pattern":["A1","F2024-Q1e","F2024-Q4d"],"topic":"Covariance vs correlation","stem":"<p>For 14 delivery riders, X = distance ridden per day (km) and Y = fuel used (litres). Using the slides' formulas, COV(X, Y) = 5.65 km·L and CORR(X, Y) = 0.95.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 640 360\" style=\"max-width:704px\" role=\"img\" aria-label=\"Scatter plot of fuel used against distance for 14 riders\">\n<line x1=\"87.0\" y1=\"248.0\" x2=\"616.0\" y2=\"248.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"202.0\" x2=\"616.0\" y2=\"202.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"156.0\" x2=\"616.0\" y2=\"156.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"110.0\" x2=\"616.0\" y2=\"110.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"64.0\" x2=\"616.0\" y2=\"64.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"18.0\" x2=\"616.0\" y2=\"18.0\" class=\"grid\"/>\n<circle cx=\"136.5\" cy=\"216.7\" r=\"4\" class=\"pt\"/>\n<circle cx=\"174.3\" cy=\"244.3\" r=\"4\" class=\"pt\"/>\n<circle cx=\"212.2\" cy=\"183.6\" r=\"4\" class=\"pt\"/>\n<circle cx=\"237.4\" cy=\"205.7\" r=\"4\" class=\"pt\"/>\n<circle cx=\"262.7\" cy=\"159.7\" r=\"4\" class=\"pt\"/>\n<circle cx=\"300.5\" cy=\"186.4\" r=\"4\" class=\"pt\"/>\n<circle cx=\"325.8\" cy=\"147.7\" r=\"4\" class=\"pt\"/>\n<circle cx=\"363.6\" cy=\"158.8\" r=\"4\" class=\"pt\"/>\n<circle cx=\"388.9\" cy=\"106.3\" r=\"4\" class=\"pt\"/>\n<circle cx=\"426.7\" cy=\"126.6\" r=\"4\" class=\"pt\"/>\n<circle cx=\"464.6\" cy=\"88.8\" r=\"4\" class=\"pt\"/>\n<circle cx=\"489.8\" cy=\"113.7\" r=\"4\" class=\"pt\"/>\n<circle cx=\"527.7\" cy=\"69.5\" r=\"4\" class=\"pt\"/>\n<circle cx=\"565.5\" cy=\"67.7\" r=\"4\" class=\"pt\"/>\n<line x1=\"86.0\" y1=\"294.0\" x2=\"616.0\" y2=\"294.0\" class=\"ax\"/>\n<line x1=\"111.2\" y1=\"294.0\" x2=\"111.2\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"111.2\" y=\"321.0\" text-anchor=\"middle\">10<\/text>\n<line x1=\"237.4\" y1=\"294.0\" x2=\"237.4\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"237.4\" y=\"321.0\" text-anchor=\"middle\">20<\/text>\n<line x1=\"363.6\" y1=\"294.0\" x2=\"363.6\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"363.6\" y=\"321.0\" text-anchor=\"middle\">30<\/text>\n<line x1=\"489.8\" y1=\"294.0\" x2=\"489.8\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"489.8\" y=\"321.0\" text-anchor=\"middle\">40<\/text>\n<line x1=\"616.0\" y1=\"294.0\" x2=\"616.0\" y2=\"299.0\" class=\"ax\"/>\n<text x=\"616.0\" y=\"321.0\" text-anchor=\"middle\">50<\/text>\n<text x=\"351.0\" y=\"348.0\" text-anchor=\"middle\" class=\"axlab\">Distance ridden per day (km)<\/text>\n<line x1=\"86.0\" y1=\"18.0\" x2=\"86.0\" y2=\"294.0\" class=\"ax\"/>\n<line x1=\"81.0\" y1=\"294.0\" x2=\"86.0\" y2=\"294.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"298.5\" text-anchor=\"end\">0.0<\/text>\n<line x1=\"81.0\" y1=\"248.0\" x2=\"86.0\" y2=\"248.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"252.5\" text-anchor=\"end\">0.5<\/text>\n<line x1=\"81.0\" y1=\"202.0\" x2=\"86.0\" y2=\"202.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"206.5\" text-anchor=\"end\">1.0<\/text>\n<line x1=\"81.0\" y1=\"156.0\" x2=\"86.0\" y2=\"156.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"160.5\" text-anchor=\"end\">1.5<\/text>\n<line x1=\"81.0\" y1=\"110.0\" x2=\"86.0\" y2=\"110.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"114.5\" text-anchor=\"end\">2.0<\/text>\n<line x1=\"81.0\" y1=\"64.0\" x2=\"86.0\" y2=\"64.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"68.5\" text-anchor=\"end\">2.5<\/text>\n<line x1=\"81.0\" y1=\"18.0\" x2=\"86.0\" y2=\"18.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"22.5\" text-anchor=\"end\">3.0<\/text>\n<text x=\"39.2\" y=\"156.0\" text-anchor=\"middle\" class=\"axlab\" transform=\"rotate(-90 39.2 156.0)\">Fuel used (litres)<\/text>\n<\/svg>","figcap":null,"options":[{"text":"Recording distance in metres instead of km multiplies the covariance by 1,000.","correct":true,"note":"TRUE. Covariance carries the units of X × Y, so rescaling X by 1,000 rescales it to 5651 m·L."},{"text":"Recording distance in metres instead of km leaves the correlation unchanged.","correct":true,"note":"TRUE. CORR = COV / √(V(X)V(Y)). Both the numerator and √V(X) are scaled by 1,000, so the factors cancel and r has no units."},{"text":"A covariance of 5.65 cannot by itself show how strong the link is, as it depends on units.","correct":true,"note":"TRUE. The covariance's size changes with the units (it would be 5651 in metres), so it cannot measure strength on its own. The correlation can."},{"text":"The correlation is close to +1, which matches the tight upward band of points.","correct":true,"note":"TRUE. r = 0.95. The points lie in a narrow band around a rising straight line."},{"text":"Since r = 0.95, distance alone explains 95% of the variation in the fuel each rider uses.","correct":false,"note":"FALSE. The share of variation explained is R² = r² = 0.89, i.e. 89% (L5: R² = (correlation)² in simple regression). The correlation itself is not a percentage."}],"explanation":{"verdict":"Tick the four TRUE statements, all except 'r is the percentage explained'. The idea tested is that covariance depends on units while correlation is unit-free and bounded, and that r² (not r) is the share explained.","reasoning":"<p>COV(X, Y) = (1/N)Σ(Xᵢ − μX)(Yᵢ − μY) measures joint variation in the data's own units, so its size has no fixed scale (L2 slide 33). CORR = COV/√(V(X)V(Y)) standardises it, which puts it between −1 and +1 and makes it unaffected by changes of units (L2 slide 34). In simple linear regression the coefficient of determination is R² = r² (L5 slide 11). Reading r as a percentage overstates the fit.<\/p>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 31–35; L5 · L5 - Linear Regression (1).pdf, slide 11"},"forms":["combo","fig"],"paper":1,"num":47},{"id":"p1-l2b","type":"multi","marks":2,"lecture":"L2","lectures":["L2"],"kind":"calculation","tier":3,"archetype":"A4","trap":null,"pattern":["A4","MOCK-Q02b","F2024-Q1c"],"topic":"Quartiles, IQR and outliers","stem":"<p>A server's daily downtime (minutes) over 11 days was:<\/p><p><span class=\"dataline\">3, 5, 6, 6, 7, 8, 9, 10, 12, 13, 31<\/span><\/p><p>Using the median-of-halves method for quartiles (the median is excluded from both halves when n is odd) and the 1.5 × IQR rule, which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Q1 = 6 and Q3 = 12, so the interquartile range is 6 minutes.","correct":true,"note":"TRUE. Lower half 3, 5, 6, 6, 7 gives Q1 = 6. Upper half 9, 10, 12, 13, 31 gives Q3 = 12. IQR = 6."},{"text":"The upper fence is 21, so the 31-minute day is flagged as an outlier.","correct":true,"note":"TRUE. Q3 + 1.5 × IQR = 12 + 9 = 21, and 31 > 21."},{"text":"The IQR is 5, since Q1 = 6 and Q3 = 11 once the median joins both halves.","correct":false,"note":"FALSE. This includes the median (8) in both halves, which is not the stated method. Excluding it gives Q3 = 12 and IQR = 6."},{"text":"Changing the 31 to 18 would lower the median from 8 down to 7 minutes.","correct":false,"note":"FALSE. The value is still the largest, so the middle (6th) value is still 8. The median is resistant to changes in extreme values."},{"text":"Changing the 31 to 18 would remove the only outlier and lower the mean.","correct":true,"note":"TRUE. 18 < 21, so no outlier remains, and the mean falls from 10 to 8.82."}],"explanation":{"verdict":"Tick three: Q1 = 6, Q3 = 12, IQR = 6; upper fence 21 flags 31; changing 31 to 18 removes the outlier and lowers the mean. The skill tested is applying the slides' quartile method and the 1.5 × IQR fences.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Order the data, n = 11<\/td><td>median = 6th value<\/td><td class=\"num\">8<\/td><\/tr><tr><td>Lower half (5 values)<\/td><td>3, 5, 6, 6, 7 → median<\/td><td class=\"num\">6<\/td><\/tr><tr><td>Upper half (5 values)<\/td><td>9, 10, 12, 13, 31 → median<\/td><td class=\"num\">12<\/td><\/tr><tr><td>IQR<\/td><td>Q3 − Q1<\/td><td class=\"num\">6<\/td><\/tr><tr><td>Lower fence<\/td><td>Q1 − 1.5 × IQR<\/td><td class=\"num\">−3<\/td><\/tr><tr><td>Upper fence<\/td><td>Q3 + 1.5 × IQR<\/td><td class=\"num\">21<\/td><\/tr><tr><td>Outliers<\/td><td>values outside the fences<\/td><td class=\"num\">31<\/td><\/tr><\/table><\/div>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 9, 11–12"},"forms":[],"paper":1,"num":48},{"id":"p1-l4m","type":"best","marks":2,"lecture":"L4","lectures":["L4","L3"],"kind":"theory","tier":2,"archetype":"A8","trap":null,"pattern":["A8","F2025-Q3b.a","F2025-Q3b.b","F2024-Q3a"],"topic":"Unbiased vs efficient estimators","stem":"<p>To estimate a population mean μ from a random sample X1, …, X20 with variance σ², two estimators are proposed: T1 = X̄ (the mean of all 20 observations) and T2 = (X1 + X2)/2.<\/p><div class=\"claims\"><p><span class=\"who\">Student A:<\/span> “T2 is biased, because it ignores 18 of the observations.”<\/p><p><span class=\"who\">Student B:<\/span> “Both are unbiased, but T1 is more efficient, because its variance σ²/20 is smaller than σ²/2.”<\/p><\/div><p>Who is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Student B, because E(T1) = E(T2) = μ while V(T1) = σ²/20 is below V(T2) = σ²/2.","correct":true,"note":"Correct. E((X1 + X2)/2) = (μ + μ)/2 = μ, so both are unbiased. Among unbiased estimators, the one with the smaller variance is the more efficient."},{"text":"Student A, because an estimator that leaves out data cannot have expected value μ.","correct":false,"note":"Bias depends on E(T), not on how much data is used. E(T2) = μ, so T2 is unbiased, just wasteful."},{"text":"Student B, because T1 has the smaller bias, which is what efficiency measures.","correct":false,"note":"Right student, wrong reason. Both biases are 0. Efficiency compares the variances of unbiased estimators."},{"text":"Neither, because any two unbiased estimators of μ are equally good to use.","correct":false,"note":"Unbiasedness is only the first requirement. The slides' 'most efficient' estimator is the unbiased one with the smallest variance."}],"explanation":{"verdict":"Student B is correct. Both estimators are unbiased, and X̄ is more efficient because it has the smaller variance.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>E(T2)<\/td><td>(E(X1) + E(X2))/2<\/td><td class=\"num\">μ<\/td><\/tr><tr><td>V(T2)<\/td><td>(σ² + σ²)/2² (independent)<\/td><td class=\"num\">σ²/2<\/td><\/tr><tr><td>V(T1)<\/td><td>σ²/n<\/td><td class=\"num\">σ²/20<\/td><\/tr><tr><td>Compare<\/td><td>σ²/20 < σ²/2<\/td><td class=\"num\">T1 more efficient<\/td><\/tr><\/table><\/div>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 2–3; L3 · L3 - Probability Theory and Distributions (1).pdf, slides 56–57"},"forms":["ab","combo"],"paper":1,"num":49},{"id":"p1-l4n","type":"best","marks":2,"lecture":"L4","lectures":["L4","L3"],"kind":"theory","tier":3,"archetype":"A2","trap":null,"pattern":["A2","F2024-Q3a","MOCK-Q10a","F2025-Q3a"],"topic":"Variance of the sample mean (derivation)","stem":"<p>A student derives the variance of the mean of n independent observations, each with variance σ²:<\/p><ol class=\"derivation\"><li>X̄ = (X1 + X2 + … + Xn)/n<\/li><li>V(X̄) = (1/n)·V(X1 + X2 + … + Xn)<\/li><li>V(X1 + … + Xn) = V(X1) + … + V(Xn) = nσ²<\/li><li>V(X̄) = (1/n)(nσ²) = σ²<\/li><\/ol><p>Which step is the first wrong one?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Step 2: a constant comes out of a variance squared, so the factor is 1/n², not 1/n","correct":true,"note":"Correct. V(aX) = a²V(X), so V(X̄) = (1/n²)·nσ² = σ²/n, the slides' variance of X̄."},{"text":"Step 3: variances of a sum add only if the observations are identical, not independent","correct":false,"note":"Step 3 is right. For independent variables V(X + Y) = V(X) + V(Y), and the covariance terms vanish."},{"text":"Step 4: the n's should cancel to give σ²/n, so only the final arithmetic is wrong","correct":false,"note":"Given step 2 as written, step 4's arithmetic is correct. The error was made earlier, in step 2."},{"text":"Step 1: the sample mean divides by n − 1, just as the sample variance does","correct":false,"note":"The mean divides by n (L4 slide 3). Only the sample variance S² divides by n − 1."}],"explanation":{"verdict":"Step 2 is the first wrong step. Scaling a variable by 1/n scales its variance by 1/n². The idea tested is V(aX) = a²V(X) combined with independence.","reasoning":"<p>Using the variance properties (L3 slide 57): V(aX) = a²V(X), and V(X + Y) = V(X) + V(Y) for independent variables. So V(X̄) = (1/n²)(nσ²) = σ²/n, the variance of the sampling distribution of X̄ (L3 slide 79). This is why the standard error σ/√n shrinks as n grows. The lecturer's October 2024 final asked for the companion result E(X̄) = μ.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 57, 79; L4 · L4 – Statistical Inference (2).pdf, slide 3"},"forms":["combo"],"paper":1,"num":50}],"2":[{"id":"p2-l4j","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"calculation","tier":3,"archetype":"A6","trap":null,"pattern":["A6","F2025-Q3e.ii","F2025-Q3e.iii"],"topic":"Completing an ANOVA table","stem":"<p>Three fertilisers are compared on 18 plots (6 per fertiliser). The partial one-way ANOVA table is below. Use F<sub>0.05, 2, 15<\/sub> = 3.68.<\/p><div class=\"tablewrap\"><table class=\"data\"><tr><th>Source of variation<\/th><th class=\"num\">Degrees of freedom<\/th><th class=\"num\">Sum of squares<\/th><th class=\"num\">Mean square<\/th><th class=\"num\">F<\/th><\/tr><tr><td>Between groups<\/td><td class=\"num\">?<\/td><td class=\"num\">84<\/td><td class=\"num\">?<\/td><td class=\"num\">?<\/td><\/tr><tr><td>Within groups<\/td><td class=\"num\">?<\/td><td class=\"num\">?<\/td><td class=\"num\">?<\/td><td class=\"num\"><\/td><\/tr><tr><td>Total<\/td><td class=\"num\">?<\/td><td class=\"num\">264<\/td><td class=\"num\"><\/td><td class=\"num\"><\/td><\/tr><\/table><\/div><p>Which statements are TRUE (2 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"SSW = 84 + 264 = 348, the within-groups sum of squares.","correct":false,"note":"FALSE. SST = SSA + SSW, so SSW = SST − SSA = 180."},{"text":"F = 3.50 < 3.68, so H0 is not rejected at the 5% level.","correct":true,"note":"TRUE. MSA = 84/2 = 42, MSW = 180/15 = 12, F = 3.50 < 3.68."},{"text":"MSW = 180/17 = 10.59, dividing SSW by the total df.","correct":false,"note":"FALSE. MSW uses the within-groups df, n − c = 15."},{"text":"As F = 3.50 is greater than 1, the means differ significantly.","correct":false,"note":"FALSE. F must exceed the critical value 3.68, not 1."},{"text":"MSA = 84/3 = 28.00, dividing by the number of groups.","correct":false,"note":"FALSE. MSA = SSA/(c − 1) = 42."}],"explanation":{"verdict":"Only 'F = 3.50 < 3.68, do not reject H0' is true. The skill tested is the slides' ANOVA table: SST = SSA + SSW, the df, the mean squares and the F decision.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>SSW<\/td><td>SST − SSA<\/td><td class=\"num\">180<\/td><\/tr><tr><td>df<\/td><td>c − 1, n − c, n − 1<\/td><td class=\"num\">2, 15, 17<\/td><\/tr><tr><td>MSA, MSW<\/td><td>SSA/(c − 1), SSW/(n − c)<\/td><td class=\"num\">42, 12<\/td><\/tr><tr><td>F<\/td><td>MSA/MSW<\/td><td class=\"num\">3.5000<\/td><\/tr><tr><td>Decision<\/td><td>F vs 3.68<\/td><td class=\"num\">do not reject H0<\/td><\/tr><\/table><\/div>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 55–62"},"forms":[],"paper":2,"num":1},{"id":"p2-l2g","type":"multi","marks":2,"lecture":"L2","lectures":["L2"],"kind":"calculation","tier":3,"archetype":"A4","trap":null,"pattern":["A4","MOCK-Q02b","F2024-Q1c"],"topic":"Quartiles and fences (even n)","stem":"<p>A coffee shop records how many minutes 12 customers waited:<\/p><p><span class=\"dataline\">2, 3, 3, 4, 5, 5, 6, 7, 8, 9, 10, 18<\/span><\/p><p>Using the median-of-halves method and the 1.5 × IQR rule, which statements are <strong>FALSE<\/strong>?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The median wait is 5 minutes, the 6th of the 12 ordered values.","correct":true,"note":"FALSE, so tick it. With n even the median averages the 6th and 7th values: (5 + 6)/2 = 5.5."},{"text":"The IQR is 5 minutes, with Q1 = 3.5 and Q3 = 8.5 from the two halves.","correct":false,"note":"TRUE statement, so leave it. Lower half 2, 3, 3, 4, 5, 5 gives Q1 = 3.5. Upper half 6, 7, 8, 9, 10, 18 gives Q3 = 8.5."},{"text":"The upper fence is 13.5, so 18 is flagged as an outlier.","correct":true,"note":"FALSE, so tick it. 13.5 = Q3 + 1 × IQR. The fence is Q3 + 1.5 × IQR = 16. 18 is still an outlier, but the stated fence is wrong, so the statement is false."},{"text":"18 lies above the upper fence of 16 and so is an outlier.","correct":false,"note":"TRUE statement. 8.5 + 1.5 × 5 = 16, and 18 > 16."},{"text":"Q1 = 3 and Q3 = 9, taking the 3rd and 10th ordered values.","correct":true,"note":"FALSE, so tick it. That is a position-based rule, not the median-of-halves method the question specifies."}],"explanation":{"verdict":"Tick the three FALSE statements: 'median 5', 'upper fence 13.5' and 'Q1 = 3, Q3 = 9'. The skill tested is applying the slides' quartile method when n is even, and the exact 1.5 × IQR fences.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Median (n = 12)<\/td><td>(6th + 7th)/2 = (5 + 6)/2<\/td><td class=\"num\">5.5<\/td><\/tr><tr><td>Q1<\/td><td>median of 2, 3, 3, 4, 5, 5<\/td><td class=\"num\">3.5<\/td><\/tr><tr><td>Q3<\/td><td>median of 6, 7, 8, 9, 10, 18<\/td><td class=\"num\">8.5<\/td><\/tr><tr><td>IQR<\/td><td>Q3 − Q1<\/td><td class=\"num\">5<\/td><\/tr><tr><td>Fences<\/td><td>Q1 − 1.5·IQR, Q3 + 1.5·IQR<\/td><td class=\"num\">−4, 16<\/td><\/tr><\/table><\/div>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 9, 11–12"},"forms":["neg"],"paper":2,"num":2},{"id":"p2-l6e","type":"best","marks":2,"lecture":"L6","lectures":["L6"],"kind":"theory","tier":2,"archetype":"A1","trap":null,"pattern":["A1","MOCK-Q15a"],"topic":"Choosing a forecasting model","stem":"<p>A bank forecasts the daily number of new online-banking registrations. The series has drifted steadily upward for two years, so it is not stationary, and it shows no seasonal or weekly pattern.<\/p><p>Which model from the lecture's table fits it best?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"ARIMA, as its differencing handles a non-stationary series","correct":true,"note":"Correct. The table: ARIMA 'incorporates differencing with AR and MA components to model non-stationary time series'."},{"text":"ARMA, as it combines past values and past forecast errors","correct":false,"note":"Runner-up. ARMA does combine AR and MA, but the table restricts it to stationary series. The upward drift needs differencing."},{"text":"MA, as it uses previous forecast errors to improve its forecasts","correct":false,"note":"MA alone has no differencing and assumes a stationary series."},{"text":"AR, as each day's count depends on the counts of earlier days","correct":false,"note":"AR uses previous observations but has no differencing to handle the drift."}],"explanation":{"verdict":"ARIMA. A non-stationary series without seasonality needs differencing but no seasonal terms.","reasoning":"<p>Lecture table (L6 slide 23): AR (previous observations), MA (previous forecast errors), ARMA (both, for stationary series), ARIMA (adds differencing for non-stationary series), SARIMA (adds seasonal patterns). With no seasonal pattern, the seasonal extension is unnecessary.<\/p>","source":"L6 · L6 - Time Series Analysis.pdf, slides 20–23"},"forms":["runner"],"paper":2,"num":3},{"id":"p2-l4n","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"calculation","tier":3,"archetype":"A6","trap":null,"pattern":["A6","MOCK-Q13a","MOCK-Q13b","MOCK-Q13c"],"topic":"Chi-square test of independence","stem":"<p>A survey of 300 shoppers records their preferred way to pay, by age group.<\/p><div class=\"tablewrap\"><table class=\"data\"><tr><th>Age group<\/th><th class=\"num\">Cash<\/th><th class=\"num\">Card<\/th><th class=\"num\">Mobile<\/th><th class=\"num\">Total<\/th><\/tr><tr><td>Under 35<\/td><td class=\"num\">20<\/td><td class=\"num\">60<\/td><td class=\"num\">70<\/td><td class=\"num\">150<\/td><\/tr><tr><td>35 and over<\/td><td class=\"num\">40<\/td><td class=\"num\">70<\/td><td class=\"num\">40<\/td><td class=\"num\">150<\/td><\/tr><tr><td>Total<\/td><td class=\"num\">60<\/td><td class=\"num\">130<\/td><td class=\"num\">110<\/td><td class=\"num\">300<\/td><\/tr><\/table><\/div><p>Test H0: payment method and age group are independent at 5%, with χ²<sub>0.05, 2<\/sub> = 5.991. Which statements are TRUE (2 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Under H0, the expected count for 'Under 35, Mobile' is 55.","correct":true,"note":"TRUE. fe = row total × column total / n = 150 × 110/300 = 55."},{"text":"The test has (2 − 1)(3 − 1) = 2 degrees of freedom for this 2 × 3 table.","correct":true,"note":"TRUE. df = (r − 1)(c − 1) for an r × c table."},{"text":"The expected count for 'Under 35, Mobile' is 50, splitting 150 equally.","correct":false,"note":"FALSE. This ignores the column totals. Mobile is chosen by 110 of the 300 shoppers overall, so the expected count is 55."},{"text":"χ²stat ≈ 15.62 > 5.991, so payment and age group are related.","correct":true,"note":"TRUE. Summing (fo − fe)²/fe over the six cells gives 15.62, so H0 is rejected: the variables are dependent."},{"text":"Had χ²stat been under 5.991, it would show the two are independent.","correct":false,"note":"FALSE. Not rejecting H0 means NO EVIDENCE of a relationship. It does not prove independence (L4 slide 16: 'do not reject', not 'accept')."}],"explanation":{"verdict":"Tick three: fe = 55, df = 2, and χ² ≈ 15.62 > 5.991 (related). The skill tested is the slides' independence test, from expected counts to a correctly worded conclusion.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Expected counts (each row)<\/td><td>fe = row total × column total / n<\/td><td class=\"num\">30, 65, 55<\/td><\/tr><tr><td>χ²stat<\/td><td>Σ (fo − fe)²/fe over 6 cells<\/td><td class=\"num\">15.6177<\/td><\/tr><tr><td>df<\/td><td>(2 − 1)(3 − 1)<\/td><td class=\"num\">2<\/td><\/tr><tr><td>Decision<\/td><td>χ²stat vs 5.991<\/td><td class=\"num\">reject H0 (dependent)<\/td><\/tr><\/table><\/div>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 77–80, 16"},"forms":[],"paper":2,"num":4},{"id":"p2-l1d","type":"best","marks":2,"lecture":"L1","lectures":["L1"],"kind":"theory","tier":1,"archetype":"A1","trap":null,"pattern":["A1","F2024-Q1a"],"topic":"Identifying a sampling method","stem":"<p>A researcher studies people who repair mobile phones informally from home. No list of them exists. She interviews three repairers she finds, and each puts her in touch with others they know, until she has 25 participants.<\/p><p>Which sampling method is this?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Snowball sampling, as participants recruit more participants","correct":true,"note":"Correct. The population is hard to reach and has no list, and the sample grows through referrals (L1 slide 23)."},{"text":"Purposive sampling, as she picks who suits her research aims","correct":false,"note":"Runner-up. She does have a research aim, but she does not select the later participants herself: they come through referrals, which the slides define as snowball sampling."},{"text":"Convenience sampling, as she interviews whoever is easiest","correct":false,"note":"Convenience sampling takes the people who are most accessible to the researcher. Here access comes from participants' contacts."},{"text":"Cluster sampling, as the repairers form natural social groups","correct":false,"note":"Cluster sampling randomly selects whole groups from a listed population. Here there is no list and nothing is random."}],"explanation":{"verdict":"Snowball sampling. The deciding feature is recruitment through participants' own contacts.","reasoning":"<p>The slides' non-probability methods are convenience (most accessible people), voluntary response (people volunteer), purposive or judgement (the researcher chooses on criteria), and snowball ('recruit participants via other participants' when the population is hard to access, as in the slides' example of studying homelessness) (L1 slides 19–23). Without a frame, probability sampling isn't possible here.<\/p>","source":"L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slides 19–23"},"forms":["runner"],"paper":2,"num":5},{"id":"p2-l3j","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":1,"archetype":"A4","trap":null,"pattern":["A4","F2024-Q2d.i","F2025-Q2c","MOCK-Q07a"],"topic":"Choosing a distribution and parameter","stem":"<p>Typing errors in a firm's reports occur at random at an average rate of 0.4 per page.<\/p><p>Which model describes the number of errors in a 5-page report?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Poisson with λ = 2.0 errors per report","correct":true,"note":"Correct. A count of random events over a fixed span at a constant rate, with λ = 0.4 × 5 = 2.0."},{"text":"Poisson with λ = 0.4 errors per report","correct":false,"note":"Right family, but λ was not rescaled from one page to five."},{"text":"Binomial with n = 5 pages and p = 0.4","correct":false,"note":"Runner-up. This treats each page as a single yes/no trial, but a page can contain several errors. Errors are counts over a span, which is the Poisson set-up."},{"text":"Exponential with a mean of 2.0 per report","correct":false,"note":"The exponential models a continuous waiting time, not a count of events."}],"explanation":{"verdict":"Poisson with λ = 2.0. Rescale the rate to the interval asked about.","reasoning":"<p>The Poisson distribution models 'the number of events occurring (X) within a fixed period' (L3 slide 65). Here the span is 5 pages, so λ = 0.4 × 5 = 2. A binomial needs a fixed number of yes/no trials, and an exponential models the gap between events.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 62, 65–67, 74"},"forms":["runner"],"paper":2,"num":6},{"id":"p2-l3c","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"calculation","tier":3,"archetype":"A4","trap":null,"pattern":["A4","MOCK-Q05b","MOCK-Q05c"],"topic":"Total probability and Bayes","stem":"<p>A phone maker buys 75% of its screens from Supplier P, whose defect rate is 2%, and 25% from Supplier Q, whose defect rate is 6%. A screen is found to be defective.<\/p><p>Which statements are TRUE (3 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The overall defect rate across both suppliers is P(defective) = 0.030.","correct":true,"note":"TRUE. Total probability: 0.75 × 0.02 + 0.25 × 0.06 = 0.015 + 0.015 = 0.030."},{"text":"A defective screen is equally likely to have come from P or from Q.","correct":true,"note":"TRUE. P(P | D) = 0.015/0.030 = 0.500, and likewise for Q. Q's higher defect rate is exactly offset by its smaller share."},{"text":"P(Q | defective) = 0.750, since Q's defect rate is three times as high as P's.","correct":false,"note":"FALSE. 0.06/(0.02 + 0.06) compares the defect rates only and ignores how many screens each supplier sends (the prior)."},{"text":"P(defective) = 0.040, the simple average of the two defect rates.","correct":false,"note":"FALSE. An unweighted average ignores the 75/25 split. Total probability weights each rate by its supplier's share."},{"text":"If P supplied 90% of screens, a defective one would more likely be from P.","correct":true,"note":"TRUE. 0.9 × 0.02 = 0.018 against 0.1 × 0.06 = 0.006, so P(P | D) = 0.750."}],"explanation":{"verdict":"Tick three: P(D) = 0.030, equally likely from P or Q, and with a 90% share P becomes the more likely source. The skill tested is weighting likelihoods by priors.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Total probability<\/td><td>P(D) = P(D|P)P(P) + P(D|Q)P(Q)<\/td><td class=\"num\">0.0300<\/td><\/tr><tr><td>Bayes for P<\/td><td>P(D|P)P(P) / P(D)<\/td><td class=\"num\">0.5000<\/td><\/tr><tr><td>Bayes for Q<\/td><td>P(D|Q)P(Q) / P(D)<\/td><td class=\"num\">0.5000<\/td><\/tr><tr><td>With a 90% share for P<\/td><td>0.018 / (0.018 + 0.006)<\/td><td class=\"num\">0.7500<\/td><\/tr><\/table><\/div>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 34, 36–40"},"forms":[],"paper":2,"num":7},{"id":"p2-l4k","type":"best","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":2,"archetype":"A8","trap":null,"pattern":["A8","F2025-Q3e.i","F2025-Q3e.iii"],"topic":"What an ANOVA rejection means","stem":"<p>A one-way ANOVA of mean delivery times for three courier firms gives F = 7.9 against F<sub>0.05, 2, 27<\/sub> = 3.35.<\/p><div class=\"claims\"><p><span class=\"who\">Student A:<\/span> “F is significant, so all three firms have different mean delivery times.”<\/p><p><span class=\"who\">Student B:<\/span> “At least one firm's mean differs, but a post-hoc comparison is needed to find out which.”<\/p><\/div><p>Who is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Student B, because ANOVA's H1 only says that at least one of the means differs.","correct":true,"note":"Correct. Rejecting H0: μ1 = μ2 = μ3 supports H1, 'not necessarily that all population means are different'. Post-hoc analysis identifies which ones."},{"text":"Student A, because rejecting H0 means that no two of the three firms share a mean.","correct":false,"note":"Two firms could share a mean while the third differs, and H0 would still be false."},{"text":"Student B, because F = 7.9 is too small for an ANOVA to detect any difference.","correct":false,"note":"Right student, wrong reason. 7.9 > 3.35, so the test IS significant."},{"text":"Student A, because the test compares the firms' variances, which all differ.","correct":false,"note":"ANOVA tests means. Equal variances are one of its assumptions, not what it tests."}],"explanation":{"verdict":"Student B is correct. A significant F says at least one mean differs, and post-hoc tests say which.","reasoning":"<p>H1 in one-way ANOVA: 'At least one population mean is different (not necessarily that all population means are different)' (L4 slide 54). 'When the null hypothesis of ANOVA is rejected, it only suggests that there are significant differences between means. However, it does not specify which' (L4 slide 63).<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 53–54, 60–63"},"forms":["ab"],"paper":2,"num":8},{"id":"p2-l4o","type":"best","marks":2,"lecture":"L4","lectures":["L4"],"kind":"calculation","tier":3,"archetype":"A6","trap":null,"pattern":["A6","F2024-Q3d.ii","F2024-Q3d.i"],"topic":"Two-sample z-test (one-tailed)","stem":"<p>Customer-satisfaction scores: Centre A, n = 50, x̄ = 74.3; Centre B, m = 40, x̄ = 72.0. Assume a common, known σ = 6. Test at 5% whether Centre A's mean score is HIGHER (z<sub>0.05<\/sub> = 1.645, z<sub>0.025<\/sub> = 1.96).<\/p><p>Which result and decision are correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"z ≈ 1.81 > 1.645, so reject H0: A's mean is higher","correct":true,"note":"Correct. z = (74.3 − 72.0)/(6√(1/50 + 1/40)) = 2.3/1.2728 = 1.81. H1: μA > μB is right-tailed, so compare with 1.645."},{"text":"z ≈ 1.81 < 1.96, so H0 is not rejected at the 5% level","correct":false,"note":"Runner-up. The z value is right, but 1.96 is the TWO-tailed cut-off. The question asks whether A is HIGHER, which is a one-tailed test (as in the slides' scouts-and-guides example)."},{"text":"z ≈ 0.38 < 1.645, so H0 is not rejected at the 5% level","correct":false,"note":"This divides by σ alone and forgets the √(1/n + 1/m) factor of the standard error of a difference in means."},{"text":"z ≈ 3.64 > 1.645, so H0 is rejected: A's mean is higher","correct":false,"note":"This uses σ/√(n + m), treating the two samples as one big sample. The SE of x̄A − x̄B is σ√(1/n + 1/m)."}],"explanation":{"verdict":"z ≈ 1.81 > 1.645, so H0 is rejected. Use the one-tailed critical value when H1 has a direction.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>H0, H1<\/td><td>μA − μB = 0 vs μA − μB > 0<\/td><td class=\"num\">right-tailed<\/td><\/tr><tr><td>SE of the difference<\/td><td>σ√(1/n + 1/m)<\/td><td class=\"num\">1.2728<\/td><\/tr><tr><td>Test statistic<\/td><td>(x̄A − x̄B)/SE<\/td><td class=\"num\">1.8071<\/td><\/tr><tr><td>Decision<\/td><td>z vs z(0.05) = 1.645<\/td><td class=\"num\">reject H0<\/td><\/tr><\/table><\/div>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 39–46"},"forms":["runner"],"paper":2,"num":9},{"id":"p2-l3n","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":2,"archetype":"A3","trap":null,"pattern":["A3","F2024-Q2b","MOCK-Q04a"],"topic":"Mutually exclusive and exhaustive events","stem":"<p>Every member of a gym holds exactly one membership type. A manager's report gives, for a randomly chosen member, P(Basic) = 0.50, P(Standard) = 0.30 and P(Premium) = 0.25.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"No member can hold two types, so the three types are mutually exclusive.","correct":true,"note":"TRUE. Holding exactly one type means no member is in two types at once."},{"text":"The types are collectively exhaustive, so their probabilities must total 1.","correct":true,"note":"TRUE. Every member holds some type, so Basic ∪ Standard ∪ Premium = S and P(S) = 1."},{"text":"The report must contain an error, since 0.50 + 0.30 + 0.25 = 1.05.","correct":true,"note":"TRUE. Mutually exclusive and exhaustive events must sum to exactly 1, and 1.05 ≠ 1."},{"text":"The report is fine, since each probability lies between 0 and 1.","correct":false,"note":"FALSE. Each value being in [0, 1] is necessary but not enough. The full set must also sum to 1."},{"text":"For exclusive types, P(Basic or Standard) = 0.50 + 0.30, subtracting nothing.","correct":true,"note":"TRUE. For mutually exclusive events the addition rule has no intersection term to subtract."}],"explanation":{"verdict":"Tick all except 'the report is fine'. The skill tested is checking mutual exclusivity and exhaustiveness against the numbers.","reasoning":"<p>Mutually exclusive: no outcomes in common (L3 slide 7). Collectively exhaustive: A1 ∪ … ∪ An = S (L3 slide 9). Together they form a partition, so P(A1) + … + P(An) = P(S) = 1 (L3 slides 15, 18). A report whose parts sum to 1.05 breaks this.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 7–11, 15, 18"},"forms":[],"paper":2,"num":10},{"id":"p2-l2c","type":"multi","marks":2,"lecture":"L2","lectures":["L2"],"kind":"theory","tier":3,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q02b","F2025-Q1c"],"topic":"Reading boxplots","stem":"<p>The boxplots show the weekly overtime hours of nurses in three hospital wards. Whiskers reach the most extreme values inside the 1.5 × IQR fences, and dots are outliers.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 640 320\" style=\"max-width:704px\" role=\"img\" aria-label=\"Boxplots of weekly overtime hours in three hospital wards\">\n<line x1=\"116.2\" y1=\"54.0\" x2=\"184.4\" y2=\"54.0\" class=\"whisk\"/>\n<line x1=\"275.2\" y1=\"54.0\" x2=\"388.8\" y2=\"54.0\" class=\"whisk\"/>\n<line x1=\"116.2\" y1=\"45.0\" x2=\"116.2\" y2=\"63.0\" class=\"whisk\"/>\n<line x1=\"388.8\" y1=\"45.0\" x2=\"388.8\" y2=\"63.0\" class=\"whisk\"/>\n<rect x=\"184.4\" y=\"39.0\" width=\"90.9\" height=\"30\" class=\"box\"/>\n<line x1=\"229.8\" y1=\"39.0\" x2=\"229.8\" y2=\"69.0\" class=\"med\"/>\n<circle cx=\"502.4\" cy=\"54.0\" r=\"4.5\" class=\"outl\"/>\n<circle cx=\"547.9\" cy=\"54.0\" r=\"4.5\" class=\"outl\"/>\n<text x=\"56.8\" y=\"58.5\" text-anchor=\"end\">Ward A<\/text>\n<line x1=\"161.7\" y1=\"134.0\" x2=\"252.5\" y2=\"134.0\" class=\"whisk\"/>\n<line x1=\"366.1\" y1=\"134.0\" x2=\"434.3\" y2=\"134.0\" class=\"whisk\"/>\n<line x1=\"161.7\" y1=\"125.0\" x2=\"161.7\" y2=\"143.0\" class=\"whisk\"/>\n<line x1=\"434.3\" y1=\"125.0\" x2=\"434.3\" y2=\"143.0\" class=\"whisk\"/>\n<rect x=\"252.5\" y=\"119.0\" width=\"113.6\" height=\"30\" class=\"box\"/>\n<line x1=\"343.4\" y1=\"119.0\" x2=\"343.4\" y2=\"149.0\" class=\"med\"/>\n<text x=\"56.8\" y=\"138.5\" text-anchor=\"end\">Ward B<\/text>\n<line x1=\"93.5\" y1=\"214.0\" x2=\"138.9\" y2=\"214.0\" class=\"whisk\"/>\n<line x1=\"207.1\" y1=\"214.0\" x2=\"275.2\" y2=\"214.0\" class=\"whisk\"/>\n<line x1=\"93.5\" y1=\"205.0\" x2=\"93.5\" y2=\"223.0\" class=\"whisk\"/>\n<line x1=\"275.2\" y1=\"205.0\" x2=\"275.2\" y2=\"223.0\" class=\"whisk\"/>\n<rect x=\"138.9\" y=\"199.0\" width=\"68.2\" height=\"30\" class=\"box\"/>\n<line x1=\"161.7\" y1=\"199.0\" x2=\"161.7\" y2=\"229.0\" class=\"med\"/>\n<text x=\"56.8\" y=\"218.5\" text-anchor=\"end\">Ward C<\/text>\n<line x1=\"70.8\" y1=\"254.0\" x2=\"616.0\" y2=\"254.0\" class=\"ax\"/>\n<line x1=\"70.8\" y1=\"254.0\" x2=\"70.8\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"70.8\" y=\"281.0\" text-anchor=\"middle\">0<\/text>\n<line x1=\"161.7\" y1=\"254.0\" x2=\"161.7\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"161.7\" y=\"281.0\" text-anchor=\"middle\">4<\/text>\n<line x1=\"252.5\" y1=\"254.0\" x2=\"252.5\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"252.5\" y=\"281.0\" text-anchor=\"middle\">8<\/text>\n<line x1=\"343.4\" y1=\"254.0\" x2=\"343.4\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"343.4\" y=\"281.0\" text-anchor=\"middle\">12<\/text>\n<line x1=\"434.3\" y1=\"254.0\" x2=\"434.3\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"434.3\" y=\"281.0\" text-anchor=\"middle\">16<\/text>\n<line x1=\"525.1\" y1=\"254.0\" x2=\"525.1\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"525.1\" y=\"281.0\" text-anchor=\"middle\">20<\/text>\n<line x1=\"616.0\" y1=\"254.0\" x2=\"616.0\" y2=\"259.0\" class=\"ax\"/>\n<text x=\"616.0\" y=\"281.0\" text-anchor=\"middle\">24<\/text>\n<text x=\"343.4\" y=\"308.0\" text-anchor=\"middle\" class=\"axlab\">Overtime per week (hours)<\/text>\n<\/svg>","figcap":null,"options":[{"text":"Ward B has the highest median weekly overtime of all three wards shown.","correct":true,"note":"TRUE. The medians are about 7 (A), 12 (B) and 4 (C)."},{"text":"Ward B is left-skewed: its median sits close to Q3 and its lower whisker is long.","correct":true,"note":"TRUE. The long lower side shows a tail toward small values, which is negative skew."},{"text":"Ward A has the largest IQR, as its whiskers and outliers span the most.","correct":false,"note":"FALSE. The IQR is the box width: A = 4, B = 5, C = 3. Whiskers and outliers show the range, not the IQR."},{"text":"About 25% of Ward C's nurses work more than 4 hours of overtime a week.","correct":false,"note":"FALSE. 4 is Ward C's median, so about 50% work more than 4 hours. 25% work more than Q3 = 6."},{"text":"In Ward A, a nurse with 16 hours of overtime would also be shown as an outlier.","correct":true,"note":"TRUE. Ward A's upper fence is Q3 + 1.5 × IQR = 9 + 6 = 15, and 16 > 15."}],"explanation":{"verdict":"Tick three: B has the highest median, B is left-skewed, and 16 hours would be an outlier in Ward A. The skill tested is reading the median, IQR, skew and fences from boxplots.","reasoning":"<p>A boxplot draws the five-number summary: whiskers, Q1, median, Q3, plus outliers (L2 slide 24). The box holds the middle 50%, so its width is the IQR. The median splits the data in half. A median near one end of the box with a long whisker on the other side shows skew toward that whisker. Outliers are values outside Q1 − 1.5 IQR and Q3 + 1.5 IQR (L2 slide 12).<\/p>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 12, 24, 29"},"forms":["fig"],"paper":2,"num":11},{"id":"p2-l3h","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"calculation","tier":3,"archetype":"A4","trap":null,"pattern":["A4","F2025-Q2b.i","F2025-Q2b.ii","F2025-Q2b.v","F2025-Q2b.iii"],"topic":"PDF: constant, CDF and median","stem":"<p>The delay X (minutes) of a tram past its scheduled time has density f(x) = cx for 0 &lt; x &lt; 2, and 0 otherwise. The density is plotted below.<\/p><p>Which statements are <strong>FALSE<\/strong> (3 d.p.)?<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 580 310\" style=\"max-width:638px\" role=\"img\" aria-label=\"Triangular density f(x) = x/2 between 0 and 2\">\n<line x1=\"87.0\" y1=\"192.6\" x2=\"556.0\" y2=\"192.6\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"141.3\" x2=\"556.0\" y2=\"141.3\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"89.9\" x2=\"556.0\" y2=\"89.9\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"38.5\" x2=\"556.0\" y2=\"38.5\" class=\"grid\"/>\n<polyline points=\"116.0,244.0 516.0,38.5\" class=\"curve\"/>\n<line x1=\"516.0\" y1=\"38.5\" x2=\"516.0\" y2=\"244.0\" class=\"curve\"/>\n<line x1=\"86.0\" y1=\"244.0\" x2=\"556.0\" y2=\"244.0\" class=\"ax\"/>\n<line x1=\"116.0\" y1=\"244.0\" x2=\"116.0\" y2=\"249.0\" class=\"ax\"/>\n<text x=\"116.0\" y=\"271.0\" text-anchor=\"middle\">0.0<\/text>\n<line x1=\"216.0\" y1=\"244.0\" x2=\"216.0\" y2=\"249.0\" class=\"ax\"/>\n<text x=\"216.0\" y=\"271.0\" text-anchor=\"middle\">0.5<\/text>\n<line x1=\"316.0\" y1=\"244.0\" x2=\"316.0\" y2=\"249.0\" class=\"ax\"/>\n<text x=\"316.0\" y=\"271.0\" text-anchor=\"middle\">1.0<\/text>\n<line x1=\"416.0\" y1=\"244.0\" x2=\"416.0\" y2=\"249.0\" class=\"ax\"/>\n<text x=\"416.0\" y=\"271.0\" text-anchor=\"middle\">1.5<\/text>\n<line x1=\"516.0\" y1=\"244.0\" x2=\"516.0\" y2=\"249.0\" class=\"ax\"/>\n<text x=\"516.0\" y=\"271.0\" text-anchor=\"middle\">2.0<\/text>\n<text x=\"321.0\" y=\"298.0\" text-anchor=\"middle\" class=\"axlab\">Delay x (minutes)<\/text>\n<line x1=\"86.0\" y1=\"18.0\" x2=\"86.0\" y2=\"244.0\" class=\"ax\"/>\n<line x1=\"81.0\" y1=\"244.0\" x2=\"86.0\" y2=\"244.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"248.5\" text-anchor=\"end\">0.00<\/text>\n<line x1=\"81.0\" y1=\"192.6\" x2=\"86.0\" y2=\"192.6\" class=\"ax\"/>\n<text x=\"74.0\" y=\"197.1\" text-anchor=\"end\">0.25<\/text>\n<line x1=\"81.0\" y1=\"141.3\" x2=\"86.0\" y2=\"141.3\" class=\"ax\"/>\n<text x=\"74.0\" y=\"145.8\" text-anchor=\"end\">0.50<\/text>\n<line x1=\"81.0\" y1=\"89.9\" x2=\"86.0\" y2=\"89.9\" class=\"ax\"/>\n<text x=\"74.0\" y=\"94.4\" text-anchor=\"end\">0.75<\/text>\n<line x1=\"81.0\" y1=\"38.5\" x2=\"86.0\" y2=\"38.5\" class=\"ax\"/>\n<text x=\"74.0\" y=\"43.0\" text-anchor=\"end\">1.00<\/text>\n<text x=\"31.6\" y=\"131.0\" text-anchor=\"middle\" class=\"axlab\" transform=\"rotate(-90 31.6 131.0)\">Density f(x)<\/text>\n<\/svg>","figcap":null,"options":[{"text":"c = 0.5, since the total area under f must equal 1.","correct":false,"note":"TRUE statement, so leave it. ∫₀² cx dx = 2c = 1, so c = 0.5. The graph's height at x = 2 is 1."},{"text":"P(X ≤ 1) = 0.250, found from the CDF F(x) = x²/4.","correct":false,"note":"TRUE statement. F(x) = ∫₀ˣ t/2 dt = x²/4, so F(1) = 0.25."},{"text":"P(X ≤ 1) = 0.500, since 1 is the middle of the range.","correct":true,"note":"FALSE, so tick it. 'Middle of the range gives 0.5' holds only for a flat density. This one is low near 0."},{"text":"The median delay is √2 ≈ 1.414 minutes, where F(x) = 0.5.","correct":false,"note":"TRUE statement. x²/4 = 0.5 gives x = √2 = 1.414."},{"text":"E(X) = 1.000, the midpoint of the interval 0 to 2.","correct":true,"note":"FALSE, so tick it. E(X) = ∫₀² x · x/2 dx = [x³/6]₀² = 1.333. The density is heavier toward 2."}],"explanation":{"verdict":"Tick the two FALSE statements: P(X ≤ 1) = 0.5 and E(X) = 1. The skill tested is building and using the CDF of a PDF.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Normalise<\/td><td>∫₀² cx dx = 2c = 1<\/td><td class=\"num\">c = 0.5<\/td><\/tr><tr><td>CDF<\/td><td>F(x) = ∫₀ˣ t/2 dt<\/td><td class=\"num\">x²/4<\/td><\/tr><tr><td>P(X ≤ 1)<\/td><td>F(1)<\/td><td class=\"num\">0.250<\/td><\/tr><tr><td>Median<\/td><td>x²/4 = 0.5<\/td><td class=\"num\">1.414<\/td><\/tr><tr><td>Mean<\/td><td>∫₀² x²/2 dx<\/td><td class=\"num\">1.333<\/td><\/tr><\/table><\/div>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 53, 55"},"forms":["fig","neg"],"paper":2,"num":12},{"id":"p2-l4d","type":"best","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":1,"archetype":"A6","trap":null,"pattern":["A6","MOCK-Q11a"],"topic":"Choosing z or t","stem":"<p>A filling machine's volumes are normal with σ = 2.5 ml, known from years of records. An inspector samples 9 bottles to build a 95% interval for the current mean μ.<\/p><p>Which interval follows the lecture's rule?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"A z-interval, x̄ ± 1.96 × 2.5/√9, since σ is known","correct":true,"note":"Correct. With a known variance the slides use X̄ ± Z·σ/√n, whatever the sample size."},{"text":"A t-interval with 8 df, since there are fewer than 30 bottles","correct":false,"note":"Runner-up. Small samples often go with t, but the slides choose t because σ is UNKNOWN. Here σ is known, so z applies."},{"text":"A z-interval, x̄ ± 1.96 × 2.5, since σ is known in advance","correct":false,"note":"Right family, but it forgets to divide σ by √n. That would describe single bottles, not the mean."},{"text":"A t-interval with 9 df, since σ came from older records","correct":false,"note":"The rule is about whether σ is known, and the df would be n − 1 = 8 anyway."}],"explanation":{"verdict":"A z-interval with σ/√n. The deciding question is whether σ is known.","reasoning":"<p>Case 'variance known': X̄ ± Z(1−α/2)·σ/√n (L4 slide 6, with the example 'normal population with variance 4' and n = 12, which uses z). Case 'variance unknown': X̄ ± t(n−1, α/2)·S/√n (L4 slide 8). Sample size alone never switches z to t in the slides' rule.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 6–8"},"forms":["runner"],"paper":2,"num":13},{"id":"p2-l6b","type":"best","marks":2,"lecture":"L6","lectures":["L6"],"kind":"calculation","tier":1,"archetype":"A4","trap":null,"pattern":["A4","MOCK-Q15b"],"topic":"Additive model value","stem":"<p>A theme park forecasts monthly visitors (thousands) with the additive model Y = T + S + C + I. For next January: T = 68, S = −12, C = 3 and I = 0.<\/p><p>What is the forecast?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"59.0 thousand","correct":true,"note":"Correct. 68 + (−12) + 3 + 0 = 59."},{"text":"83.0 thousand","correct":false,"note":"This ignores the minus sign on S. January's seasonal effect lowers the forecast."},{"text":"56.0 thousand","correct":false,"note":"This drops the cyclical component C = 3."},{"text":"62.8 thousand","correct":false,"note":"This treats S = −12 as −12% (multiplying T by 0.88). In an additive model S is in the series' own units."}],"explanation":{"verdict":"59.0 thousand. In an additive model the components are simply added, signs included.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Add the components<\/td><td>68 + (−12) + 3 + 0<\/td><td class=\"num\">59<\/td><\/tr><\/table><\/div>","source":"L6 · L6 - Time Series Analysis.pdf, slides 10–11"},"forms":[],"paper":2,"num":14},{"id":"p2-l2b","type":"best","marks":2,"lecture":"L2","lectures":["L2"],"kind":"calculation","tier":2,"archetype":"A5","trap":5,"pattern":["A5","F2025-Q1b","MOCK-Q03b"],"topic":"Sample variance (n − 1)","stem":"<p>A lab measures the potassium content (mg) of 5 bananas taken at random from a shipment:<\/p><p><span class=\"dataline\">410, 425, 398, 432, 415<\/span><\/p><p>What is the <em>sample<\/em> variance s² (2 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"174.50","correct":true,"note":"Correct. x̄ = 416; Σ(x − x̄)² = 698; s² = 698/(5 − 1) = 174.50."},{"text":"139.60","correct":false,"note":"698/5 divides by n. That is the population variance formula, and it underestimates when applied to a sample."},{"text":"13.21","correct":false,"note":"√174.50 = 13.21 is the sample standard deviation, not the variance."},{"text":"698.00","correct":false,"note":"This is Σ(x − x̄)², the sum of squared deviations, before dividing by n − 1."}],"explanation":{"verdict":"s² = 174.50 mg². A sample variance divides by n − 1.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Mean<\/td><td>2080 / 5<\/td><td class=\"num\">416<\/td><\/tr><tr><td>Deviations<\/td><td>x − x̄<\/td><td class=\"num\">−6, 9, −18, 16, −1<\/td><\/tr><tr><td>Sum of squares<\/td><td>Σ(x − x̄)²<\/td><td class=\"num\">698<\/td><\/tr><tr><td>Sample variance<\/td><td>Σ(x − x̄)² / (n − 1)<\/td><td class=\"num\">174.50<\/td><\/tr><\/table><\/div>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 13–14; L4 · L4 – Statistical Inference (2).pdf, slide 3"},"forms":[],"paper":2,"num":15},{"id":"p2-l3b","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":2,"archetype":"A3","trap":null,"pattern":["A3","MOCK-Q04c","MOCK-Q04b","F2024-Q2a"],"topic":"Independence from a two-way table","stem":"<p>A driving school records 200 learners:<\/p><div class=\"tablewrap\"><table class=\"data\"><tr><th><\/th><th class=\"num\">Passed first test<\/th><th class=\"num\">Failed<\/th><th class=\"num\">Total<\/th><\/tr><tr><td>Took night lessons<\/td><td class=\"num\">36<\/td><td class=\"num\">24<\/td><td class=\"num\">60<\/td><\/tr><tr><td>No night lessons<\/td><td class=\"num\">84<\/td><td class=\"num\">56<\/td><td class=\"num\">140<\/td><\/tr><tr><td>Total<\/td><td class=\"num\">120<\/td><td class=\"num\">80<\/td><td class=\"num\">200<\/td><\/tr><\/table><\/div><p>A learner is chosen at random. Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"P(pass | night lessons) = P(pass) = 0.6, so these events are independent.","correct":true,"note":"TRUE. 36/60 = 0.6 and 120/200 = 0.6. Conditioning on night lessons does not change the pass rate."},{"text":"'Took night lessons' and 'passed' are not mutually exclusive events.","correct":true,"note":"TRUE. 36 learners did both, so the intersection is not empty."},{"text":"P(night lessons | passed) = 0.6, the same value as P(pass | night lessons).","correct":false,"note":"FALSE. P(night | pass) = 36/120 = 0.3. Reversing a conditional generally changes its value."},{"text":"P(pass ∩ night) = 0.6 × 0.3 = 0.18 shows the events are dependent.","correct":false,"note":"FALSE. 36/200 = 0.18 equals the product 0.18, which shows INDEPENDENCE."},{"text":"P(passed or took night lessons) = 0.72, using the addition rule.","correct":true,"note":"TRUE. (120 + 60 − 36)/200 = 0.72, using the addition rule."}],"explanation":{"verdict":"Tick three: independent (36/60 = 120/200), not mutually exclusive, and P(pass ∪ night) = 0.72. The skill tested is the formal tests for independence and exclusivity, read from a table.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>P(pass)<\/td><td>120 / 200<\/td><td class=\"num\">0.6<\/td><\/tr><tr><td>P(pass | night)<\/td><td>36 / 60<\/td><td class=\"num\">0.6<\/td><\/tr><tr><td>P(night | pass)<\/td><td>36 / 120<\/td><td class=\"num\">0.3<\/td><\/tr><tr><td>P(pass ∩ night)<\/td><td>36 / 200<\/td><td class=\"num\">0.18<\/td><\/tr><tr><td>P(pass ∪ night)<\/td><td>(120 + 60 − 36) / 200<\/td><td class=\"num\">0.72<\/td><\/tr><\/table><\/div>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 18, 22, 27, 41"},"forms":[],"paper":2,"num":16},{"id":"p2-l2f","type":"multi","marks":2,"lecture":"L2","lectures":["L2"],"kind":"theory","tier":3,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q02c","MOCK-Q02b"],"topic":"Robust vs sensitive measures","stem":"<p>A clerk records the ages of a 9-member committee:<\/p><p><span class=\"dataline\">34, 37, 41, 42, 45, 48, 51, 53, 56<\/span><\/p><p>By mistake, the age 56 is typed as 506. Quartiles use the median-of-halves method. Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The mean age rises by exactly 50 years because of the error.","correct":true,"note":"TRUE. The total rises by 506 − 56 = 450, and 450/9 = 50."},{"text":"The median changes, because one of the nine ages is now far larger.","correct":false,"note":"FALSE. The 5th of 9 ordered values is still 45. Changing an extreme value does not move the median."},{"text":"The range of the recorded ages increases from 22 years to 472 years.","correct":true,"note":"TRUE. 56 − 34 = 22 and 506 − 34 = 472. The range uses the extremes, so it is very sensitive."},{"text":"The IQR changes, since Q3 now comes from an upper half containing 506.","correct":false,"note":"FALSE. Q3 is the median of 48, 51, 53, 506, which is still (51 + 53)/2 = 52. The IQR stays 13."},{"text":"The 1.5 × IQR rule now flags 506 as an outlier (upper fence 71.5).","correct":true,"note":"TRUE. 52 + 1.5 × 13 = 71.5, and 506 lies far beyond it."}],"explanation":{"verdict":"Tick three: the mean rises by 50, the range jumps, and 506 is flagged as an outlier. The skill tested is which statistics are resistant (median, IQR) and which are sensitive (mean, range, SD).","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Q1, median, Q3 (both data sets)<\/td><td>median-of-halves<\/td><td class=\"num\">39, 45, 52<\/td><\/tr><tr><td>Mean before / after<\/td><td>Σx / 9<\/td><td class=\"num\">45.22 / 95.22<\/td><\/tr><tr><td>Range before / after<\/td><td>max − min<\/td><td class=\"num\">22 / 472<\/td><\/tr><tr><td>Upper fence after<\/td><td>Q3 + 1.5 × IQR<\/td><td class=\"num\">71.5<\/td><\/tr><\/table><\/div>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 5–12"},"forms":[],"paper":2,"num":17},{"id":"p2-l4f","type":"best","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":1,"archetype":"A1","trap":null,"pattern":["A1","F2024-Q3b","MOCK-Q12a"],"topic":"α and β trade-off","stem":"<p>A food-safety lab lowers its significance level from 0.05 to 0.01 but keeps the same sample size.<\/p><p>What happens to β, the probability of a Type II error?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"β rises: a smaller rejection region makes a false H0 harder to reject","correct":true,"note":"Correct. With less of the distribution in the rejection region, a false H0 is rejected less often, so more Type II errors occur."},{"text":"β falls, since the two error probabilities α and β add up to exactly 1","correct":false,"note":"α and β are probabilities under different states of the world (H0 true or false). They do not sum to 1."},{"text":"β stays the same, as β depends on the sample size alone and not on α","correct":false,"note":"β depends on α as well: changing the critical value changes how often a false H0 is rejected."},{"text":"β falls, as a stricter test makes fewer errors of every kind overall","correct":false,"note":"Being stricter about Type I errors makes Type II errors MORE likely when n is fixed. You can't reduce both without more data."}],"explanation":{"verdict":"β rises. At a fixed n, lowering α trades fewer Type I errors for more Type II errors.","reasoning":"<p>α = P(Type I) is chosen in advance; β = P(Type II) and power = 1 − β (L4 slide 15). Lowering α moves the critical value outward (e.g. 1.645 → 2.326 for a one-tailed z-test), which shrinks the rejection region (L4 slides 19–21). A false H0 then lands in the rejection region less often, so β increases. The October 2024 final asked students to compare these errors.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 15–16, 19–21"},"forms":[],"paper":2,"num":18},{"id":"p2-l2e","type":"multi","marks":2,"lecture":"L2","lectures":["L2"],"kind":"theory","tier":2,"archetype":"A1","trap":null,"pattern":["A1","F2024-Q1e"],"topic":"Choosing a chart for a purpose","stem":"<p>A transport authority prepares five charts.<\/p><p>Which purpose–chart pairings are <strong>NOT<\/strong> appropriate?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Showing how monthly ridership changed over three years: a pie chart.","correct":true,"note":"NOT appropriate, so tick it. Change over time needs a line chart. A pie shows the parts of one whole."},{"text":"Comparing journey-time distributions on four routes: side-by-side boxplots.","correct":false,"note":"Appropriate. This is one quantitative variable across the levels of a categorical variable."},{"text":"Showing how trip distance relates to the fare paid: a stacked bar chart.","correct":true,"note":"NOT appropriate, so tick it. The relationship between two numerical variables calls for a scatter plot."},{"text":"Showing each depot's buses split into electric and diesel: a stacked bar chart.","correct":false,"note":"Appropriate. Each bar is a total broken into sub-amounts."},{"text":"Showing the share of trips by payment type in one year: a pie chart.","correct":false,"note":"Appropriate. These are proportions of one whole at one time, which is what pie charts are for."}],"explanation":{"verdict":"Tick the pie chart for change over time and the stacked bar for a relationship between two numerical variables. The skill tested is matching the chart to the data type and the purpose.","reasoning":"<p>Line chart: patterns over time. Histogram: the distribution of one numerical variable. Bar or pie: categorical counts or proportions. Stacked bar: totals broken into parts. Side-by-side boxplots: a quantitative variable across groups. Scatter plot: two numerical variables together (L2 slides 18–32).<\/p>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 18–32"},"forms":["neg"],"paper":2,"num":19},{"id":"p2-l4e","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":3,"archetype":"A6","trap":null,"pattern":["A6","F2024-Q3d.i","MOCK-Q12a","F2025-Q3e.i"],"topic":"Setting up H0 and H1","stem":"<p>Each aim below is followed by the hypotheses an analyst wrote.<\/p><p>Which set-ups are CORRECT for the stated aim?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Check whether a new route changed the mean delivery time (42 min): H0: μ = 42, H1: μ ≠ 42.","correct":true,"note":"CORRECT. 'Changed' has no direction, so the test is two-tailed."},{"text":"Show that a supplier's mean fill is below the labelled 500 g: H0: μ < 500, H1: μ = 500.","correct":false,"note":"INCORRECT. The claim to be shown goes in H1 (μ < 500), and H0 holds the equality (μ = 500)."},{"text":"Test whether more than 30% of users click an advert: H0: p = 0.30, H1: p > 0.30.","correct":true,"note":"CORRECT. The question 'more than' becomes a right-tailed H1, like the slides' 'majority' example (H1: p > 0.5)."},{"text":"Test whether method 1 has a higher mean yield than method 2: H0: μ1 − μ2 = 0, H1: μ1 − μ2 ≠ 0.","correct":false,"note":"INCORRECT. 'Higher' is directional, so H1: μ1 − μ2 > 0, as in the slides' scouts-and-guides example."},{"text":"Test whether a coin is biased towards heads, using a sample: H0: p̂ = 0.5, H1: p̂ > 0.5.","correct":false,"note":"INCORRECT. Hypotheses concern the parameter p. The sample proportion p̂ is a known statistic."}],"explanation":{"verdict":"Tick two: the two-tailed route test and the right-tailed advert test. The skill tested is putting the question in H1 with the right direction, about a parameter.","reasoning":"<p>'Putting the question under the alternative hypothesis' (L4 slide 13): the claim to be shown goes in H1 with the matching tail (&gt;, &lt; or ≠), and H0 keeps the equality. Both are statements about population parameters (μ, p, μ1 − μ2), never about the sample statistics (L4 slides 11–14).<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 11–14, 39"},"forms":[],"paper":2,"num":20},{"id":"p2-l4c","type":"best","marks":2,"lecture":"L4","lectures":["L4","L3"],"kind":"theory","tier":2,"archetype":"A8","trap":null,"pattern":["A8","MOCK-Q10c"],"topic":"Sample size and interval width","stem":"<p>A 95% interval for a mean from n = 50 has width 8 units. The team wants width 4 units, with the same confidence level and the same σ.<\/p><div class=\"claims\"><p><span class=\"who\">Student A:<\/span> “Double the sample size to 100.”<\/p><p><span class=\"who\">Student B:<\/span> “Quadruple the sample size to 200.”<\/p><\/div><p>Who is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Student B, because the width is proportional to 1/√n, and √4 = 2.","correct":true,"note":"Correct. Width = 2z·σ/√n. To halve it, √n must double, so n must be multiplied by 4."},{"text":"Student A, because the width is proportional to 1/n, so 2n halves it.","correct":false,"note":"The width depends on √n, not n. Doubling n only divides the width by √2 ≈ 1.41, giving about 5.66."},{"text":"Neither, because the width depends on σ and z, not on the size n.","correct":false,"note":"n is in the formula through σ/√n (the standard error), so it affects the width directly."},{"text":"Student B, because σ²/n must be halved, and that takes 4n in total.","correct":false,"note":"Right student, wrong reason. Halving σ²/n needs only 2n. It is σ/√n (the standard error) that must be halved."}],"explanation":{"verdict":"Student B is correct. Halving a confidence interval's width needs four times the sample size.","reasoning":"<p>The standard error of X̄ is σ/√n (L3 slide 79), and the interval's half-width is z × σ/√n (L4 slide 6). Width ∝ 1/√n, so width 8 → 4 needs √n to double, i.e. n from 50 to 200. The lecturer's mock asked what happens when n goes from 81 to 324 (SE halves), which is the same √n idea.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slide 6; L3 · L3 - Probability Theory and Distributions (1).pdf, slide 79"},"forms":["ab","combo"],"paper":2,"num":21},{"id":"p2-l3i","type":"multi","marks":2,"lecture":"L3","lectures":["L3","L4"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q10a","MOCK-Q10b","MOCK-Q10c","F2024-Q3a"],"topic":"Sampling distribution of the mean","stem":"<p>Customers' monthly phone bills have mean μ = Rs 2,400 and σ = Rs 900, and their distribution is right-skewed. An auditor repeatedly takes random samples of n = 81 bills and computes x̄ each time.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"x̄ is unbiased for μ: its sampling distribution has mean Rs 2,400.","correct":true,"note":"TRUE. E(X̄) = μ (L3 slide 79; unbiasedness, L4 slide 3)."},{"text":"The standard error of x̄ for samples of this size is Rs 100.","correct":true,"note":"TRUE. σ/√n = 900/√81 = 900/9 = 100."},{"text":"Doubling the sample size to 162 would halve the standard error.","correct":false,"note":"FALSE. The SE scales with 1/√n, so doubling n divides it by √2, giving 70.7. Halving needs 4n."},{"text":"x̄ cannot be treated as normal, as the bills themselves are right-skewed.","correct":false,"note":"FALSE. With n = 81 the CLT applies: x̄ is approximately normal whatever the population's shape."},{"text":"Any single bill has about a 95% chance of being within Rs 200 of 2,400.","correct":false,"note":"FALSE. ±2 SE describes sample means. Single bills vary with σ = 900, nine times as much."}],"explanation":{"verdict":"Tick two: x̄ is unbiased, and SE = Rs 100. The skill tested is the mean and standard error of x̄, and what the CLT does and does not cover.","reasoning":"<p>The sampling distribution of x̄ has mean μ and standard error σ/√n, and by the CLT it is approximately normal for large n even from a skewed population (L3 slides 78–79). Because E(X̄) = μ, X̄ is the slides' unbiased estimator of μ (L4 slide 3). Individual observations keep their own spread σ. Only averages concentrate around μ.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 76–79; L4 · L4 – Statistical Inference (2).pdf, slide 3"},"forms":["combo"],"paper":2,"num":22},{"id":"p2-l3o","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":1,"archetype":"A8","trap":null,"pattern":["A8","MOCK-Q04a","F2024-Q2a"],"topic":"Independent vs mutually exclusive","stem":"<p>Events A and B both have positive probabilities.<\/p><div class=\"claims\"><p><span class=\"who\">Student A:<\/span> “If A and B are mutually exclusive, they are also independent, because neither one affects the other.”<\/p><p><span class=\"who\">Student B:<\/span> “If A and B are mutually exclusive, knowing A happened tells us B did not, so they are dependent.”<\/p><\/div><p>Who is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Student B, because P(A ∩ B) = 0 cannot equal P(A)P(B) when both are positive.","correct":true,"note":"Correct. Independence requires P(A ∩ B) = P(A)P(B) > 0, while exclusivity forces P(A ∩ B) = 0."},{"text":"Student A, because mutually exclusive events have no outcomes in common.","correct":false,"note":"Having no outcomes in common is the definition of exclusivity. It is exactly what makes them dependent: one occurring rules out the other."},{"text":"Both, because 'exclusive' and 'independent' are two names for one idea.","correct":false,"note":"The slides warn that these two are commonly confused. Independence means one event doesn't change the other's probability; exclusivity means they can't happen together."},{"text":"Student B, because mutually exclusive events must have P(A) + P(B) = 1.","correct":false,"note":"Right student, wrong reason. P(A) + P(B) = 1 is needed only if they are also collectively exhaustive."}],"explanation":{"verdict":"Student B is correct. Mutually exclusive events with positive probabilities are always dependent.","reasoning":"<p>'It's common to find the concepts of independent events and mutually exclusive events confusing. Independence: the occurrence of one event does not affect the probability of the other. Mutual exclusivity: the occurrence of one event means the other event cannot occur' (L3 slide 12). Formally, independence needs P(A ∩ B) = P(A)P(B) (L3 slide 41), and that cannot equal 0 when both probabilities are positive.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 7, 12, 41"},"forms":["ab"],"paper":2,"num":23},{"id":"p2-l6a","type":"multi","marks":2,"lecture":"L6","lectures":["L6"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q15a"],"topic":"Components of a time series from a plot","stem":"<p>The chart shows a museum's monthly visitors over four years.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 680 340\" style=\"max-width:748px\" role=\"img\" aria-label=\"Monthly museum visitors over four years\">\n<line x1=\"87.0\" y1=\"210.0\" x2=\"656.0\" y2=\"210.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"146.0\" x2=\"656.0\" y2=\"146.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"82.0\" x2=\"656.0\" y2=\"82.0\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"18.0\" x2=\"656.0\" y2=\"18.0\" class=\"grid\"/>\n<polyline points=\"91.9,163.6 103.8,168.4 115.7,150.8 127.6,139.6 139.4,131.6 151.3,123.6 163.2,115.6 175.1,101.2 186.9,122.0 198.8,136.4 210.7,144.4 222.6,101.2 234.4,144.4 246.3,149.2 258.2,131.6 270.1,120.4 281.9,112.4 293.8,104.4 305.7,96.4 317.6,82.0 329.4,102.8 341.3,117.2 353.2,125.2 365.1,82.0 376.9,125.2 388.8,130.0 400.7,170.0 412.6,101.2 424.4,93.2 436.3,85.2 448.2,77.2 460.1,62.8 471.9,83.6 483.8,98.0 495.7,106.0 507.6,62.8 519.4,106.0 531.3,110.8 543.2,93.2 555.1,82.0 566.9,74.0 578.8,66.0 590.7,58.0 602.6,43.6 614.4,64.4 626.3,78.8 638.2,86.8 650.1,43.6\" class=\"curve\"/>\n<circle cx=\"91.9\" cy=\"163.6\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"103.8\" cy=\
