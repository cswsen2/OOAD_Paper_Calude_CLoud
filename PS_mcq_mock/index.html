8\" y1=\"240.0\" x2=\"201.8\" y2=\"161.8\" class=\"marker\"/>\n<line x1=\"40.0\" y1=\"240.0\" x2=\"600.0\" y2=\"240.0\" class=\"ax\"/>\n<line x1=\"86.7\" y1=\"240.0\" x2=\"86.7\" y2=\"245.0\" class=\"ax\"/>\n<text x=\"86.7\" y=\"267.0\" text-anchor=\"middle\">−3<\/text>\n<line x1=\"192.1\" y1=\"240.0\" x2=\"192.1\" y2=\"245.0\" class=\"ax\"/>\n<text x=\"192.1\" y=\"267.0\" text-anchor=\"middle\">−1.645<\/text>\n<line x1=\"320.0\" y1=\"240.0\" x2=\"320.0\" y2=\"245.0\" class=\"ax\"/>\n<text x=\"320.0\" y=\"267.0\" text-anchor=\"middle\">0<\/text>\n<line x1=\"397.8\" y1=\"240.0\" x2=\"397.8\" y2=\"245.0\" class=\"ax\"/>\n<text x=\"397.8\" y=\"267.0\" text-anchor=\"middle\">1<\/text>\n<line x1=\"475.6\" y1=\"240.0\" x2=\"475.6\" y2=\"245.0\" class=\"ax\"/>\n<text x=\"475.6\" y=\"267.0\" text-anchor=\"middle\">2<\/text>\n<line x1=\"553.3\" y1=\"240.0\" x2=\"553.3\" y2=\"245.0\" class=\"ax\"/>\n<text x=\"553.3\" y=\"267.0\" text-anchor=\"middle\">3<\/text>\n<text x=\"320.0\" y=\"294.0\" text-anchor=\"middle\" class=\"axlab\">z<\/text>\n<rect x=\"425.0\" y=\"30\" width=\"22\" height=\"12\" class=\"shade\"/>\n<text x=\"455.0\" y=\"40.5\" text-anchor=\"start\" class=\"legend\">rejection region, α = 0.05<\/text>\n<line x1=\"436.0\" y1=\"58.0\" x2=\"436.0\" y2=\"74.0\" class=\"marker\"/>\n<text x=\"455.0\" y=\"70.5\" text-anchor=\"start\" class=\"legend\">observed z = −1.52<\/text>\n<\/svg>","figcap":null,"options":[{"text":"At the 5% level H0 is not rejected, since −1.52 is not below −1.645.","correct":true,"note":"TRUE. For a left-tailed test the slides reject when z_cal < −z_α. −1.52 > −1.645, so z_cal is outside the rejection region."},{"text":"At the 10% level H0 is not rejected, since −1.52 is above −1.645.","correct":false,"note":"FALSE. At α = 0.10 the critical value is −1.282, and −1.52 < −1.282, so H0 IS rejected. This reuses the 5% cut-off."},{"text":"Not rejecting at 5% shows the school's mean score is exactly 72.","correct":false,"note":"FALSE. Not rejecting means the evidence is insufficient. It does not prove H0. The slides say 'do not reject' rather than 'accept' for this reason."},{"text":"H0 is rejected at 5%, since |−1.52| is larger than the value 1.282.","correct":false,"note":"FALSE. 1.282 is the 10% critical value. At 5% the comparison is with −1.645."},{"text":"A two-tailed test at 5% would reject H0, as −1.52 lies beyond −1.96.","correct":false,"note":"FALSE. −1.52 is closer to 0 than −1.96, so a two-tailed test would not reject either."}],"explanation":{"verdict":"Only 'not rejected at 5%' is true. The skill tested is reading a decision against the right critical value and phrasing the conclusion correctly.","reasoning":"<p>Classical approach: compute the statistic, define the rejection region from α and the tail, then reject H0 only if the statistic falls inside it (L4 slide 17). Left tail at 5%: reject if z_cal &lt; −1.645 (as in the slides' 'underfed boys' example). Here −1.52 is not in the region, so the conclusion is 'no evidence at the 5% level that the mean is below 72'. At 10% the region starts at −1.282, which does contain −1.52, so the decision depends on α.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 16–22"},"forms":["fig"],"paper":1,"num":20},{"id":"p1-l1b","type":"multi","marks":2,"lecture":"L1","lectures":["L1"],"kind":"calculation","tier":2,"archetype":"A4","trap":null,"pattern":["A4","MOCK-Q01b","MOCK-Q01a"],"topic":"Proportionate stratified allocation","stem":"<p>A hotel chain has 1,000 staff: Housekeeping 450, Food &amp; beverage 300, Front office 150 and Maintenance 100. It will survey 80 staff using <strong>proportionate<\/strong> stratified random sampling by department.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Housekeeping should receive 36 of the 80 places, matching its 45% share.","correct":true,"note":"TRUE. 450/1,000 × 80 = 36. A proportionate sample matches each stratum's share of the population."},{"text":"Each department should get 20 places, so that every stratum counts equally.","correct":false,"note":"FALSE. 20 each is equal allocation, not proportionate allocation. It over-samples Maintenance (10% of staff) and under-samples Housekeeping (45%)."},{"text":"Front office should get 15 places, since 150 of the 1,000 staff work there.","correct":false,"note":"FALSE. 150/1,000 = 15%, and 15% of 80 is 12, not 15. This option reads the percentage as a number of places, as if the sample were 100."},{"text":"Maintenance should get 8 places, the same 10% share it has of all staff.","correct":true,"note":"TRUE. 100/1,000 = 10%, and 10% of 80 is 8."},{"text":"So a maintenance worker is less likely to be chosen than a housekeeper.","correct":false,"note":"FALSE. Proportionate allocation gives every stratum the same sampling fraction: 8/100 = 36/450 = 0.08. Each worker has an 8% chance either way."}],"explanation":{"verdict":"Tick the two TRUE statements: Housekeeping gets 36 places and Maintenance gets 8 (10%). The skill tested is proportionate allocation: each stratum's sample share equals its population share.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Housekeeping<\/td><td>450 / 1,000 × 80<\/td><td class=\"num\">36<\/td><\/tr><tr><td>Food & beverage<\/td><td>300 / 1,000 × 80<\/td><td class=\"num\">24<\/td><\/tr><tr><td>Front office<\/td><td>150 / 1,000 × 80<\/td><td class=\"num\">12<\/td><\/tr><tr><td>Maintenance<\/td><td>100 / 1,000 × 80<\/td><td class=\"num\">8<\/td><\/tr><tr><td>Check<\/td><td>sum of allocations<\/td><td class=\"num\">80<\/td><\/tr><tr><td>Sampling fraction<\/td><td>80 / 1,000<\/td><td class=\"num\">0.08<\/td><\/tr><\/table><\/div>","source":"L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slide 26"},"forms":[],"paper":1,"num":21},{"id":"p1-l3e","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"calculation","tier":2,"archetype":"A5","trap":2,"pattern":["A5","F2024-Q2d.i","F2025-Q2c","MOCK-Q07c"],"topic":"Poisson with rate scaling","stem":"<p>Online orders reach a pharmacy at an average rate of 1.5 per 10 minutes, following a Poisson distribution.<\/p><p>Which statements are TRUE (3 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The count of orders in 30 minutes is Poisson with mean 4.5.","correct":true,"note":"TRUE. The rate scales with the interval: 1.5 × 3 = 4.5."},{"text":"P(exactly 4 orders arrive in a 30-minute spell) ≈ 0.190.","correct":true,"note":"TRUE. e^(−4.5) × 4.5⁴ / 4! = 0.1898."},{"text":"P(exactly 4 orders arrive in a 30-minute spell) ≈ 0.047.","correct":false,"note":"FALSE. This uses λ = 1.5, the 10-minute rate, for a 30-minute window. The rate was not rescaled."},{"text":"P(no orders at all arrive in a 10-minute spell) ≈ 0.223.","correct":true,"note":"TRUE. For 10 minutes λ = 1.5, and e^(−1.5) = 0.2231."},{"text":"P(more than 4 orders in a 30-minute spell) = 1 − 0.190 = 0.810.","correct":false,"note":"FALSE. 'More than 4' is the complement of 'at most 4', not of 'exactly 4'. The correct value is 1 − P(X ≤ 4) = 1 − 0.5321 = 0.468."}],"explanation":{"verdict":"Tick three: λ = 4.5 for 30 minutes, P(X = 4) ≈ 0.190, and P(none in 10 min) ≈ 0.223. This is the rate-scaling trap, which appears in both finals.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Rescale the rate<\/td><td>λ = 1.5 per 10 min × 3<\/td><td class=\"num\">4.5<\/td><\/tr><tr><td>P(X = 4)<\/td><td>e^(−λ) λ⁴ / 4!<\/td><td class=\"num\">0.1898<\/td><\/tr><tr><td>P(X ≤ 4)<\/td><td>Σ P(X = k), k = 0…4<\/td><td class=\"num\">0.5321<\/td><\/tr><tr><td>P(X > 4)<\/td><td>1 − P(X ≤ 4)<\/td><td class=\"num\">0.4679<\/td><\/tr><\/table><\/div>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 65–67"},"forms":[],"paper":1,"num":22},{"id":"p1-l1c","type":"best","marks":2,"lecture":"L1","lectures":["L1","L4"],"kind":"theory","tier":3,"archetype":"A8","trap":null,"pattern":["A8","F2024-Q1a","MOCK-Q01c","MOCK-Q11c"],"topic":"Voluntary response bias and inference","stem":"<p>A news website posts a poll: 'Should private vehicles be banned from the old town at weekends?' In two days 12,400 readers respond and 71% say <em>No<\/em>. A 95% confidence interval for the proportion saying No is reported as (0.702, 0.718).<\/p><div class=\"claims\"><p><span class=\"who\">Student A:<\/span> “With over twelve thousand responses the interval is very narrow, so about 71% of the city's residents oppose the ban.”<\/p><p><span class=\"who\">Student B:<\/span> “The interval only allows for random sampling error. The readers chose to respond, so 71% may be biased, and a bigger n does not remove that bias.”<\/p><\/div><p>Who is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Student B, because self-selected readers may differ from residents, and a bigger n does not fix that.","correct":true,"note":"Correct. A voluntary response sample is 'always at least somewhat biased' (L1). A confidence interval measures only random sampling error, so a narrow interval around a biased estimate is still biased."},{"text":"Student A, because an interval this narrow shows the estimate must be close to the city's true proportion.","correct":false,"note":"This confuses precision with accuracy. The width reflects random error under random sampling. It cannot detect self-selection bias."},{"text":"Student B, because a sample of over twelve thousand is too large for a confidence interval to be valid.","correct":false,"note":"Right student, wrong reason. Large samples are fine for confidence intervals. The problem is how the respondents were selected, not how many there were."},{"text":"Student A, because twelve thousand responses exceed what any standard sample-size table asks for.","correct":false,"note":"Sample-size tables (such as the Krejcie and Morgan table) assume a random sample. A huge self-selected sample is still not representative."}],"explanation":{"verdict":"Student B is correct. A large voluntary response sample gives a narrow but possibly biased interval. Inference assumes a probability sample.","reasoning":"<p>Voluntary response: people 'volunteer themselves' and those with strong opinions are more likely to respond, so the sample is 'always at least somewhat biased' (L1 slide 21). Non-probability samples make inferences about the population 'weaker' (L1 slide 18). The 95% confidence interval logic (L4 slide 4) is about repeated <em>random<\/em> samples. It quantifies sampling error, not selection bias, so making n bigger narrows the interval around the same biased value.<\/p>","source":"L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slides 18, 21; L4 · L4 – Statistical Inference (2).pdf, slides 4–5"},"forms":["ab","combo"],"paper":1,"num":23},{"id":"p1-l6a","type":"best","marks":2,"lecture":"L6","lectures":["L6"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q15a"],"topic":"Additive or multiplicative model","stem":"<p>The chart shows a shop's quarterly sales over five years.<\/p><p>Which model suits this series, and why?<\/p>","table":null,"figure":"<svg class=\"chart\" viewBox=\"0 0 660 340\" style=\"max-width:726px\" role=\"img\" aria-label=\"Quarterly sales over five years with growing seasonal swings\">\n<line x1=\"87.0\" y1=\"237.4\" x2=\"636.0\" y2=\"237.4\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"200.9\" x2=\"636.0\" y2=\"200.9\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"164.3\" x2=\"636.0\" y2=\"164.3\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"127.7\" x2=\"636.0\" y2=\"127.7\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"91.1\" x2=\"636.0\" y2=\"91.1\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"54.6\" x2=\"636.0\" y2=\"54.6\" class=\"grid\"/>\n<line x1=\"87.0\" y1=\"18.0\" x2=\"636.0\" y2=\"18.0\" class=\"grid\"/>\n<polyline points=\"99.8,210.8 127.2,184.9 154.8,156.1 182.2,191.9 209.8,192.1 237.2,160.3 264.8,125.7 292.2,172.0 319.8,173.4 347.2,135.8 374.8,95.2 402.2,152.1 429.8,154.6 457.2,111.2 484.8,64.8 512.2,132.2 539.8,135.9 567.2,86.6 594.8,34.4 622.2,112.4\" class=\"curve\"/>\n<circle cx=\"99.8\" cy=\"210.8\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"127.2\" cy=\"184.9\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"154.8\" cy=\"156.1\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"182.2\" cy=\"191.9\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"209.8\" cy=\"192.1\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"237.2\" cy=\"160.3\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"264.8\" cy=\"125.7\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"292.2\" cy=\"172.0\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"319.8\" cy=\"173.4\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"347.2\" cy=\"135.8\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"374.8\" cy=\"95.2\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"402.2\" cy=\"152.1\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"429.8\" cy=\"154.6\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"457.2\" cy=\"111.2\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"484.8\" cy=\"64.8\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"512.2\" cy=\"132.2\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"539.8\" cy=\"135.9\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"567.2\" cy=\"86.6\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"594.8\" cy=\"34.4\" r=\"3.5\" class=\"pt\"/>\n<circle cx=\"622.2\" cy=\"112.4\" r=\"3.5\" class=\"pt\"/>\n<line x1=\"86.0\" y1=\"274.0\" x2=\"636.0\" y2=\"274.0\" class=\"ax\"/>\n<line x1=\"86.0\" y1=\"274.0\" x2=\"86.0\" y2=\"279.0\" class=\"ax\"/>\n<line x1=\"196.0\" y1=\"274.0\" x2=\"196.0\" y2=\"279.0\" class=\"ax\"/>\n<line x1=\"306.0\" y1=\"274.0\" x2=\"306.0\" y2=\"279.0\" class=\"ax\"/>\n<line x1=\"416.0\" y1=\"274.0\" x2=\"416.0\" y2=\"279.0\" class=\"ax\"/>\n<line x1=\"526.0\" y1=\"274.0\" x2=\"526.0\" y2=\"279.0\" class=\"ax\"/>\n<line x1=\"636.0\" y1=\"274.0\" x2=\"636.0\" y2=\"279.0\" class=\"ax\"/>\n<text x=\"141.0\" y=\"301.0\" text-anchor=\"middle\">2021<\/text>\n<text x=\"251.0\" y=\"301.0\" text-anchor=\"middle\">2022<\/text>\n<text x=\"361.0\" y=\"301.0\" text-anchor=\"middle\">2023<\/text>\n<text x=\"471.0\" y=\"301.0\" text-anchor=\"middle\">2024<\/text>\n<text x=\"581.0\" y=\"301.0\" text-anchor=\"middle\">2025<\/text>\n<text x=\"361.0\" y=\"328.0\" text-anchor=\"middle\" class=\"axlab\">Quarter (four per year)<\/text>\n<line x1=\"86.0\" y1=\"18.0\" x2=\"86.0\" y2=\"274.0\" class=\"ax\"/>\n<line x1=\"81.0\" y1=\"274.0\" x2=\"86.0\" y2=\"274.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"278.5\" text-anchor=\"end\">0<\/text>\n<line x1=\"81.0\" y1=\"237.4\" x2=\"86.0\" y2=\"237.4\" class=\"ax\"/>\n<text x=\"74.0\" y=\"241.9\" text-anchor=\"end\">50<\/text>\n<line x1=\"81.0\" y1=\"200.9\" x2=\"86.0\" y2=\"200.9\" class=\"ax\"/>\n<text x=\"74.0\" y=\"205.4\" text-anchor=\"end\">100<\/text>\n<line x1=\"81.0\" y1=\"164.3\" x2=\"86.0\" y2=\"164.3\" class=\"ax\"/>\n<text x=\"74.0\" y=\"168.8\" text-anchor=\"end\">150<\/text>\n<line x1=\"81.0\" y1=\"127.7\" x2=\"86.0\" y2=\"127.7\" class=\"ax\"/>\n<text x=\"74.0\" y=\"132.2\" text-anchor=\"end\">200<\/text>\n<line x1=\"81.0\" y1=\"91.1\" x2=\"86.0\" y2=\"91.1\" class=\"ax\"/>\n<text x=\"74.0\" y=\"95.6\" text-anchor=\"end\">250<\/text>\n<line x1=\"81.0\" y1=\"54.6\" x2=\"86.0\" y2=\"54.6\" class=\"ax\"/>\n<text x=\"74.0\" y=\"59.1\" text-anchor=\"end\">300<\/text>\n<line x1=\"81.0\" y1=\"18.0\" x2=\"86.0\" y2=\"18.0\" class=\"ax\"/>\n<text x=\"74.0\" y=\"22.5\" text-anchor=\"end\">350<\/text>\n<text x=\"39.2\" y=\"146.0\" text-anchor=\"middle\" class=\"axlab\" transform=\"rotate(-90 39.2 146.0)\">Sales (units)<\/text>\n<\/svg>","figcap":null,"options":[{"text":"Multiplicative, because the seasonal swings grow as the trend rises","correct":true,"note":"Correct. The peak-to-trough gap widens from year to year in step with the level, which the slides describe as 'seasonal variation changes with the trend'."},{"text":"Additive, because the same seasonal pattern repeats every year","correct":false,"note":"A repeating pattern is present in both models. It does not decide between them."},{"text":"Multiplicative, because the series shows a clear upward trend","correct":false,"note":"Runner-up. Right model, wrong reason. A trend alone does not decide it: the slides' additive example (Trend + Seasonality) also rises. The deciding feature is whether the swings grow with the trend."},{"text":"Additive, because the gap between peak and trough stays the same","correct":false,"note":"This misreads the chart. The gap grows from about 74.8 units in the first year to about 138.8 in the last."}],"explanation":{"verdict":"Multiplicative, because the swings grow with the trend. The model is chosen by how the seasonal swing behaves, not by whether there is a trend.","reasoning":"<p>Additive Y = T + S + C + I: 'used when seasonal fluctuations remain approximately constant over time' (L6 slide 10). Multiplicative Y = T × S × C × I: 'used when seasonal fluctuations increase or decrease proportionally with the trend' (L6 slide 12). Compare the slides' plots: the additive Trend + Seasonality curve has equal-height waves, while the Trend × Seasonality curve's waves grow (L6 slides 16, 19).<\/p>","source":"L6 · L6 - Time Series Analysis.pdf, slides 10–14, 16, 19"},"forms":["fig","runner"],"paper":1,"num":24},{"id":"p1-l3a","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":1,"archetype":"A3","trap":null,"pattern":["A3","F2024-Q2a","F2024-Q2b","MOCK-Q04c"],"topic":"Independent vs mutually exclusive","stem":"<p>For two events, P(A) = 0.6, P(B) = 0.5 and P(A ∩ B) = 0.3. Which conclusion is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Independent, not mutually exclusive: P(A ∩ B) = P(A)P(B) ≠ 0","correct":true,"note":"Correct. P(A)P(B) = 0.6 × 0.5 = 0.30 = P(A ∩ B), which is the slides' independence test. P(A ∩ B) ≠ 0, so A and B can occur together."},{"text":"Mutually exclusive, since P(A) + P(B) = 1.1, which is more than 1","correct":false,"note":"This misreads the sum rule. A sum above 1 shows A and B must overlap, so they cannot be mutually exclusive."},{"text":"Dependent, since P(A ∩ B) = 0.3 differs from P(A) + P(B) = 1.1","correct":false,"note":"Independence compares P(A ∩ B) with the product P(A)P(B), not with the sum."},{"text":"Dependent, since P(A ∪ B) = 0.8 falls short of the value 1","correct":false,"note":"P(A ∪ B) = 0.6 + 0.5 − 0.3 = 0.8. Whether it reaches 1 decides collective exhaustiveness, not independence."}],"explanation":{"verdict":"Independent and not mutually exclusive. The skill tested is applying the formal tests: the product rule for independence and P(A ∩ B) = 0 for mutual exclusivity.","reasoning":"<p>Independence: P(A ∩ B) = P(A)·P(B) (L3 slide 41). Mutually exclusive: A ∩ B = ∅, so P(A ∩ B) = 0 (L3 slide 7). Here 0.6 × 0.5 = 0.3 = P(A ∩ B), so the events are independent. Because that intersection is not 0, they are not mutually exclusive. Two events with positive probabilities can never be both independent and mutually exclusive.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 7, 18, 41"},"forms":[],"paper":1,"num":25},{"id":"p1-l1d","type":"multi","marks":2,"lecture":"L1","lectures":["L1"],"kind":"theory","tier":1,"archetype":"A1","trap":null,"pattern":["A1"],"topic":"Types of variables","stem":"<p>A hospital admission form records: blood group (A, B, AB, O); pain level (none, mild, moderate, severe); number of previous admissions; body temperature in °C; body weight in kg.<\/p><p>Which classifications are CORRECT?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Pain level is ordinal: its categories are ordered, but the gaps need not be equal.","correct":true,"note":"CORRECT. The categories have a meaningful ranking, but the step from mild to moderate need not equal the step from moderate to severe (L1 slide 11)."},{"text":"Blood group is ordinal, since the groups are usually listed in the fixed order A, B, AB, O.","correct":false,"note":"INCORRECT. The order in which labels are listed is not a meaningful ranking. Blood group is nominal, like the slides' examples of gender and nationality."},{"text":"Number of previous admissions is a discrete variable: it is counted in whole numbers.","correct":true,"note":"CORRECT. Counts take whole-number values (L1 slide 8)."},{"text":"Temperature in °C is interval data: 0 °C does not mean an absence of temperature.","correct":true,"note":"CORRECT. Equal intervals but no true zero (L1 slide 9 uses °C as its interval example)."},{"text":"Weight in kg is ratio data, since 0 kg would mean no weight at all (a true zero).","correct":true,"note":"CORRECT. A true zero makes it ratio data (L1 slide 10 lists weight as a ratio example)."}],"explanation":{"verdict":"Tick all except 'blood group is ordinal'. The idea tested is classifying variables in context, where listing order is not the same as ranking.","reasoning":"<p>Quantitative variables are discrete (counted) or continuous (measured). Measured quantities sit on an interval scale (no true zero, e.g. °C) or a ratio scale (true zero, e.g. kg). Qualitative variables are nominal (no meaningful order) or ordinal (meaningful order, unequal gaps). Blood groups have no natural ranking, so they are nominal however they happen to be listed.<\/p>","source":"L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slides 7–11"},"forms":[],"paper":1,"num":26},{"id":"p1-l4j","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"calculation","tier":3,"archetype":"A6","trap":null,"pattern":["A6","F2025-Q3e.ii","F2025-Q3e.iii","F2025-Q3e.i"],"topic":"Completing an ANOVA table","stem":"<p>Four teaching methods are compared using the exam scores of 24 students (6 per method). The partly completed one-way ANOVA table is below. Use F<sub>0.05, 3, 20<\/sub> = 3.10.<\/p><div class=\"tablewrap\"><table class=\"data\"><tr><th>Source of variation<\/th><th class=\"num\">Degrees of freedom<\/th><th class=\"num\">Sum of squares<\/th><th class=\"num\">Mean square<\/th><th class=\"num\">F<\/th><\/tr><tr><td>Between groups<\/td><td class=\"num\">?<\/td><td class=\"num\">186<\/td><td class=\"num\">?<\/td><td class=\"num\">?<\/td><\/tr><tr><td>Within groups<\/td><td class=\"num\">?<\/td><td class=\"num\">340<\/td><td class=\"num\">?<\/td><td class=\"num\"><\/td><\/tr><tr><td>Total<\/td><td class=\"num\">?<\/td><td class=\"num\">526<\/td><td class=\"num\"><\/td><td class=\"num\"><\/td><\/tr><\/table><\/div><p>Which statements are TRUE (2 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The within-groups degrees of freedom are n − c = 20.","correct":true,"note":"TRUE. 24 − 4 = 20 (and between = c − 1 = 3)."},{"text":"F = 3.65, so H0 (all four means equal) is rejected at 5%.","correct":true,"note":"TRUE. MSA = 186/3 = 62, MSW = 340/20 = 17, F = 3.65 > 3.10."},{"text":"MSW = 340/23 = 14.78, dividing SSW by the total df n − 1.","correct":false,"note":"FALSE. n − 1 = 23 is the TOTAL df. MSW divides SSW by its own df, n − c = 20."},{"text":"F = MSW/MSA = 0.27, so H0 is not rejected at 5%.","correct":false,"note":"FALSE. The ratio is inverted. F = MSA/MSW: between-group variation over within-group variation."},{"text":"MSA = 186/4 = 46.50, dividing by the number of groups.","correct":false,"note":"FALSE. MSA = SSA/(c − 1) = 186/3 = 62."}],"explanation":{"verdict":"Tick two: df(within) = 20, and F = 3.65 so H0 is rejected. The skill tested is completing the slides' ANOVA table and reading the F decision.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>df between, within<\/td><td>c − 1, n − c<\/td><td class=\"num\">3, 20<\/td><\/tr><tr><td>MSA<\/td><td>SSA/(c − 1)<\/td><td class=\"num\">62<\/td><\/tr><tr><td>MSW<\/td><td>SSW/(n − c)<\/td><td class=\"num\">17<\/td><\/tr><tr><td>F<\/td><td>MSA/MSW<\/td><td class=\"num\">3.6471<\/td><\/tr><tr><td>Decision<\/td><td>F vs F(0.05, 3, 20) = 3.10<\/td><td class=\"num\">reject H0<\/td><\/tr><\/table><\/div>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 54–62"},"forms":[],"paper":1,"num":27},{"id":"p1-l4i","type":"best","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":3,"archetype":"A6","trap":null,"pattern":["A6","F2024-Q3c","F2025-Q3d"],"topic":"Paired vs unpaired comparison","stem":"<p>A gym records the resting heart rate of the <em>same<\/em> 12 members before and after a 10-week programme, and wants to test whether the mean rate fell.<\/p><p>Which procedure follows the lecture's rules?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"A paired t-test on the 12 before − after differences, with 11 degrees of freedom","correct":true,"note":"Correct. Each 'after' reading is matched to a 'before' reading for the same person, so the samples are dependent. Analyse the differences d with T = (d̄ − 0)/(S_d/√n) ~ t(n−1)."},{"text":"A pooled two-sample t-test with 12 + 12 − 2 = 22 degrees of freedom","correct":false,"note":"Runner-up. The pooled test is right for two independent groups with equal variances. These readings are paired on the same people, so the slides' paired case applies."},{"text":"A two-sample z-test, because there are 24 heart-rate readings in all","correct":false,"note":"σ is unknown, and the 24 readings are 12 matched pairs, not two independent samples. Neither condition for the z-test holds."},{"text":"A one-way ANOVA comparing the 'before' group and the 'after' group","correct":false,"note":"ANOVA compares independent groups, and with two groups it extends the pooled t-test. It ignores the pairing."}],"explanation":{"verdict":"A paired t-test on the differences with 11 df. Dependent samples call for the paired design.","reasoning":"<p>'Paired samples: the sample selected from the first population is related to the corresponding sample from the second' (L4 slide 47). The key is to use the difference data: n is the number of pairs and the test statistic follows t with n − 1 df (L4 slide 48). The pooled-variance t (Case C, as in the lecturer's 4-male/3-female question) needs independent samples.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 34, 39–51"},"forms":["runner"],"paper":1,"num":28},{"id":"p1-l6d","type":"multi","marks":2,"lecture":"L6","lectures":["L6"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","MOCK-Q15c","MOCK-Q15b"],"topic":"Meaning of a seasonal index","stem":"<p>A hotel uses a multiplicative model for quarterly room-nights. Its seasonal indices are Q1 = 0.80, Q2 = 1.10, Q3 = 1.25 and Q4 = 0.85.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"If next Q1's trend is 4,000 room-nights (C = I = 1), the forecast is 3,200.","correct":true,"note":"TRUE. Y = T × S = 4,000 × 0.80 = 3,200."},{"text":"An index of 0.80 means Q1 sits 0.80 room-nights below the trend.","correct":false,"note":"FALSE. This is an additive reading. In a multiplicative model 0.80 means 80% of the trend level, i.e. 20% below it."},{"text":"Q4's index of 0.85 shows the hotel's business is in long-term decline.","correct":false,"note":"FALSE. A seasonal index describes a within-year pattern. Long-term decline would be a falling trend (T)."},{"text":"If the trend doubles, the extra Q3 room-nights above trend stay the same.","correct":false,"note":"FALSE. In a multiplicative model the Q3 excess is 0.25 × T, so it doubles with the trend."},{"text":"Q3's index means Q3 has 1.25 times as many room-nights as Q1.","correct":false,"note":"FALSE. Both indices are relative to the trend: Q3/Q1 = 1.25/0.80 = 1.5625 at the same trend level."}],"explanation":{"verdict":"Only the Q1 forecast of 3,200 is true. The skill tested is that a multiplicative seasonal index is a proportion of the trend, so effects scale with it.","reasoning":"<p>In Y = T × S × C × I, S is a 'seasonal index' (L6 slide 12). S &gt; 1 means above the trend level by (S − 1) × 100%, and S &lt; 1 means below it. Because S multiplies T, the size in units of each season's effect grows or shrinks with the trend: 'higher trend results in larger seasonal fluctuations' (L6 slide 13).<\/p>","source":"L6 · L6 - Time Series Analysis.pdf, slides 12–14"},"forms":[],"paper":1,"num":29},{"id":"p1-l4k","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":2,"archetype":"A7","trap":null,"pattern":["A7","F2025-Q3e.i","F2025-Q3e.iii"],"topic":"What an ANOVA rejection means","stem":"<p>A one-way ANOVA compares the mean braking distance of five tyre brands and rejects H0 at the 5% level.<\/p><p>Which statements are <strong>FALSE<\/strong>?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"All five brands have mean braking distances that differ from each other.","correct":true,"note":"FALSE, so tick it. H1 says at least one mean differs, 'not necessarily that all population means are different' (L4 slide 54)."},{"text":"At least one brand's mean braking distance differs from the other brands'.","correct":false,"note":"TRUE statement. This is exactly what rejecting H0: μ1 = … = μ5 gives."},{"text":"The ANOVA has shown which brand has the shortest mean braking distance.","correct":true,"note":"FALSE, so tick it. ANOVA 'does not specify which of the treatment means differ'. That needs a post-hoc analysis (L4 slide 63)."},{"text":"A post-hoc comparison is needed to find out which brands differ.","correct":false,"note":"TRUE statement. Post-hoc mean comparisons follow a significant ANOVA."},{"text":"It showed that the brands' variances differ, as ANOVA analyses variance.","correct":true,"note":"FALSE, so tick it. 'Though the term mentions the word variance, we are testing differences in means' (L4 slide 53). Equal variances are an assumption of the test."}],"explanation":{"verdict":"Tick the three FALSE claims: 'all differ', 'shows which brand', and 'variances differ'. The skill tested is what a significant F does and does not tell you.","reasoning":"<p>H0: μ1 = μ2 = … = μc against H1: at least one mean differs (L4 slide 54). Rejection says only that the group means are not all equal. Which pairs differ needs post-hoc mean comparisons (L4 slide 63). ANOVA compares means by partitioning variation, and it assumes normal populations with equal variances drawn by independent random samples (L4 slide 53).<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 52–54, 63"},"forms":["neg"],"paper":1,"num":30},{"id":"p1-l4f","type":"best","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":1,"archetype":"A6","trap":null,"pattern":["A6","F2024-Q3d.i","MOCK-Q12a"],"topic":"Setting up H0 and H1","stem":"<p>A consumer group suspects that a brand's 'low-sodium' soup contains <em>more<\/em> than its advertised mean of 140 mg per serving.<\/p><p>Which hypotheses should the group test?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"H0: μ = 140, H1: μ > 140 (right-tailed)","correct":true,"note":"Correct. The suspicion ('more than') goes under H1, so the test is one-tailed to the right."},{"text":"H0: μ = 140, H1: μ ≠ 140 (two-tailed)","correct":false,"note":"Runner-up. This is a valid form for checking whether μ is merely different from 140. The group's question is directional, and the slides put the question under H1 with the matching tail (as in 'greater than 37000')."},{"text":"H0: μ > 140, H1: μ = 140 (left-tailed)","correct":false,"note":"This reverses the roles. The claim being investigated goes in H1, and H0 holds the equality."},{"text":"H0: x̄ = 140, H1: x̄ > 140 (right-tailed)","correct":false,"note":"Hypotheses are statements about the population parameter μ, never about the sample statistic x̄, which is already known."}],"explanation":{"verdict":"H0: μ = 140 against H1: μ > 140. The researcher's question sets the direction of H1.","reasoning":"<p>'Putting the question under the alternative hypothesis' (L4 slide 13): a suspicion of 'more than' gives H1: μ &gt; 140 with H0: μ = 140, as in the slides' income example (H1: μ &gt; 37000). The direction of H1 then decides whether the rejection region sits in one tail or two (L4 slide 17). The October 2024 final asked for H0 and H1 to test whether 'males performed better', which is the same directional reasoning.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 11–14, 17"},"forms":["runner"],"paper":1,"num":31},{"id":"p1-l3c","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"calculation","tier":3,"archetype":"A5","trap":7,"pattern":["A5","MOCK-Q05b","MOCK-Q05c","MOCK-Q05a"],"topic":"Bayes' theorem and the base rate","stem":"<p>A bottling plant's camera rejects bottles it thinks are cracked. 1% of bottles are cracked. The camera rejects 98% of cracked bottles and also rejects 4% of sound bottles. A bottle is rejected.<\/p><p>Which statements are TRUE (to 3 decimal places)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"P(rejected) = 0.049, combining cracked and sound bottles.","correct":true,"note":"TRUE. Total probability: 0.01 × 0.98 + 0.99 × 0.04 = 0.0098 + 0.0396 = 0.0494."},{"text":"P(cracked | rejected) ≈ 0.198, about 1 reject in 5 being cracked.","correct":true,"note":"TRUE. Bayes: 0.0098 / 0.0494 = 0.198."},{"text":"P(cracked | rejected) ≈ 0.980, the same as the camera's hit rate.","correct":false,"note":"FALSE. This is P(rejected | cracked), the camera's detection rate. It reverses the conditional."},{"text":"Most of the bottles that the camera rejects are actually sound.","correct":true,"note":"TRUE. P(sound | rejected) = 1 − 0.198 = 0.802. The 4% false alarms on the 99% sound bottles outnumber the true detections."},{"text":"If 2% were cracked, P(cracked | rejected) would double to 0.397.","correct":false,"note":"FALSE. P(rejected) also changes, so the posterior is not proportional to the prior. With 2% cracked, P(cracked | rejected) = 0.333."}],"explanation":{"verdict":"Tick three: P(rejected) = 0.049, P(cracked | rejected) ≈ 0.198, and most rejected bottles are sound. This is the base-rate trap: a rare condition plus false alarms gives a posterior far below the detection rate.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>Prior<\/td><td>P(C)<\/td><td class=\"num\">0.01<\/td><\/tr><tr><td>Likelihoods<\/td><td>P(R | C), P(R | S)<\/td><td class=\"num\">0.98, 0.04<\/td><\/tr><tr><td>Total probability<\/td><td>P(R) = P(R|C)P(C) + P(R|S)P(S)<\/td><td class=\"num\">0.0494<\/td><\/tr><tr><td>Bayes<\/td><td>P(C | R) = P(R|C)P(C) / P(R)<\/td><td class=\"num\">0.1984<\/td><\/tr><tr><td>Check: prior 2%<\/td><td>0.0196 / (0.0196 + 0.0392)<\/td><td class=\"num\">0.3333<\/td><\/tr><\/table><\/div>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 34, 36–40"},"forms":[],"paper":1,"num":32},{"id":"p1-l4d","type":"multi","marks":2,"lecture":"L4","lectures":["L4","L3"],"kind":"theory","tier":2,"archetype":"A1","trap":null,"pattern":["A1","MOCK-Q10c","MOCK-Q11b"],"topic":"What changes a confidence interval's width","stem":"<p>A researcher computes a 95% interval for μ with σ known, using the slides' formula, shown below.<\/p><p><math display=\"block\"><mover accent=\"true\"><mrow><mi>X<\/mi><\/mrow><mo>‾<\/mo><\/mover><mo>±<\/mo><msub><mrow><mi>Z<\/mi><\/mrow><mrow><mrow><mn>1<\/mn><mo>−<\/mo><mi>α<\/mi><mo>/<\/mo><mn>2<\/mn><\/mrow><\/mrow><\/msub><mfrac><mrow><mi>σ<\/mi><\/mrow><mrow><msqrt><mi>n<\/mi><\/msqrt><\/mrow><\/mfrac><\/math><\/p><p>Which of these changes would <strong>NOT<\/strong> make the interval narrower (all else unchanged)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Taking n = 200 instead of n = 50, which halves the interval's width.","correct":false,"note":"This does narrow it, so leave it. The width is proportional to 1/√n and √(200/50) = 2, so the width halves."},{"text":"Sampling from a population ten times as large, with n kept the same.","correct":true,"note":"Does NOT narrow it, so tick it. The population size does not appear in the formula. The width depends on z, σ and n only."},{"text":"Using a measuring process whose standard deviation σ is smaller.","correct":false,"note":"This narrows it. The width is 2·z·σ/√n, which shrinks with σ."},{"text":"Obtaining a larger sample mean x̄ when the new data come in.","correct":true,"note":"Does NOT narrow it, so tick it. x̄ only shifts the interval's centre. Its width does not depend on x̄."},{"text":"Lowering the confidence level from 95% to 90% for the same data.","correct":false,"note":"This narrows it. z drops from 1.96 to 1.645 (the slides' 90% example uses 1.645)."}],"explanation":{"verdict":"Tick 'a larger population' and 'a larger x̄': neither changes the width. The skill tested is which inputs control a confidence interval's width.","reasoning":"<p>Width = 2 × z × σ/√n. It shrinks when n rises (the standard error σ/√n, L3 slide 79), when σ is smaller, or when the confidence level, and hence z, is lower. The centre x̄ and the population size play no part in the slides' formula. This links the CLT's standard error to interval estimation: four times the data halves the width.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slide 6; L3 · L3 - Probability Theory and Distributions (1).pdf, slide 79"},"forms":["combo","neg"],"paper":1,"num":33},{"id":"p1-l3l","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":3,"archetype":"A2","trap":null,"pattern":["A2","F2024-Q2c","F2025-Q3a"],"topic":"Bernoulli variance (derivation)","stem":"<p>X is Bernoulli: P(X = 1) = p and P(X = 0) = 1 − p. A student derives V(X):<\/p><ol class=\"derivation\"><li>E(X) = 0·(1 − p) + 1·p = p<\/li><li>E(X²) = [E(X)]² = p²<\/li><li>V(X) = E(X²) − [E(X)]² = p² − p²<\/li><li>V(X) = 0, so a Bernoulli variable never varies<\/li><\/ol><p>Which step is the first wrong one?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Step 2: E(X²) comes from the pmf, giving 0²(1 − p) + 1²p = p, not from E(X)²","correct":true,"note":"Correct. In general E(X²) ≠ [E(X)]². Here E(X²) = p, so V(X) = p − p² = p(1 − p), matching the slide."},{"text":"Step 1: E(X) should be 1 − p, because the outcome 0 has probability 1 − p","correct":false,"note":"Step 1 is right. E(X) = Σ x·P(X = x) = 0·(1 − p) + 1·p = p, as the lecturer's October 2024 final asked students to show."},{"text":"Step 3: the variance identity is V(X) = E(X²) + [E(X)]², a sum, not a difference","correct":false,"note":"The identity on the slide is V(X) = E(X²) − [E(X)]². Step 3 uses it correctly, but with the wrong E(X²) from step 2."},{"text":"Step 4: no step is wrong, as an outcome that is only 0 or 1 has no variance","correct":false,"note":"A 0/1 variable varies unless p is 0 or 1. Its variance is p(1 − p), which is largest at p = 0.5."}],"explanation":{"verdict":"Step 2 is the first wrong step: it treats E(X²) as [E(X)]². The idea tested is the variance identity applied to a pmf.","reasoning":"<p>V(X) = E(X²) − [E(X)]² (L3 slide 57). Each expectation must be computed from the pmf: E(X²) = Σx²P(X = x). For Bernoulli, X² = X because 0² = 0 and 1² = 1, so E(X²) = p and V(X) = p − p² = p(1 − p) (L3 slide 61). Squaring E(X) instead of averaging X² is exactly the error that makes every variance collapse to 0.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 57, 61"},"forms":[],"paper":1,"num":34},{"id":"p1-l2g","type":"best","marks":2,"lecture":"L2","lectures":["L2"],"kind":"theory","tier":3,"archetype":"A2","trap":null,"pattern":["A2","F2024-Q1c"],"topic":"1.5 × IQR fences (derivation)","stem":"<p>The outlier fences of a data set (1.5 × IQR rule) are a = −7 and b = 33. A student finds the IQR as follows:<\/p><ol class=\"derivation\"><li>b − a = (Q3 + 1.5·IQR) − (Q1 + 1.5·IQR)<\/li><li>b − a = Q3 − Q1<\/li><li>So IQR = b − a = 40<\/li><\/ol><p>Which step is the first wrong one, and why?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Step 1, because the lower fence is Q1 − 1.5·IQR, so subtracting it adds 1.5·IQR to b − a.","correct":true,"note":"Correct. b − a = (Q3 + 1.5·IQR) − (Q1 − 1.5·IQR) = IQR + 3·IQR = 4·IQR, so IQR = 40/4 = 10."},{"text":"Step 2, because Q3 − Q1 is not the IQR: the IQR is measured from the median to Q3.","correct":false,"note":"IQR = Q3 − Q1 by definition (L2 slide 11). Step 2 is a correct simplification of step 1 as written."},{"text":"Step 3, because the fences equal the smallest and largest data values, so b − a is the range.","correct":false,"note":"The fences are cut-offs, not data values. The data lie inside them (outliers outside), so b − a is not the range."},{"text":"No step is wrong, because the two fences lie exactly one IQR apart from each other.","correct":false,"note":"The fences are 4·IQR apart: 1.5·IQR below Q1, the IQR itself, and 1.5·IQR above Q3. The correct IQR here is 10, not 40."}],"explanation":{"verdict":"Step 1 is the first wrong step: the lower fence has a minus sign. The idea tested is turning the fence definitions into algebra.","reasoning":"<p>The slide defines the expected minimum as Q1 − 1.5 × IQR and the expected maximum as Q3 + 1.5 × IQR (L2 slide 12). So b − a = (Q3 − Q1) + 3·IQR = 4·IQR, and IQR = (b − a)/4 = 10. This is the result the lecturer asked students to prove in the October 2024 final, here as an MCQ about where a derivation breaks.<\/p>","source":"L2 · L2 - Descriptive Statistics.pdf, slides 11–12"},"forms":[],"paper":1,"num":35},{"id":"p1-l6e","type":"best","marks":2,"lecture":"L6","lectures":["L6"],"kind":"theory","tier":2,"archetype":"A1","trap":null,"pattern":["A1","MOCK-Q15a"],"topic":"Choosing a forecasting model","stem":"<p>A ride-hailing firm has six years of monthly trip counts. The series rises steadily, so it is not stationary, and it peaks every December.<\/p><p>Which model from the lecture's table fits it best?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"SARIMA, as it adds seasonal terms to ARIMA's differencing","correct":true,"note":"Correct. Differencing handles the non-stationary trend, and the seasonal extension models the December peaks (L6 slide 23)."},{"text":"ARIMA, as its differencing removes the steady upward trend","correct":false,"note":"Runner-up. ARIMA handles non-stationarity, but the table describes SARIMA as 'extends ARIMA by modelling seasonal patterns', and this series has a strong seasonal pattern."},{"text":"ARMA, as it combines past values with past forecast errors","correct":false,"note":"The table describes ARMA as being 'for stationary time series'. This series is not stationary."},{"text":"AR, as each month's trips depend on previous months' trips","correct":false,"note":"AR uses only previous observations. It has no differencing for the trend and no seasonal terms."}],"explanation":{"verdict":"SARIMA. Pick the model whose description matches both features of the series: non-stationary and seasonal.","reasoning":"<p>From the lecture's forecasting-model table (L6 slide 23): AR uses previous observations; MA uses previous forecast errors; ARMA combines them for stationary series; ARIMA adds differencing for non-stationary series; SARIMA extends ARIMA with seasonal patterns. The forecasting cycle starts by identifying components (L6 slide 21), which here are a trend plus seasonality.<\/p>","source":"L6 · L6 - Time Series Analysis.pdf, slides 20–23"},"forms":["runner"],"paper":1,"num":36},{"id":"p1-l1a","type":"multi","marks":2,"lecture":"L1","lectures":["L1"],"kind":"theory","tier":2,"archetype":"A1","trap":null,"pattern":["A1","F2024-Q1b","MOCK-Q01a"],"topic":"Stratified vs cluster sampling","stem":"<p>A district education office wants the mean monthly mobile-data use of its Grade 10 students. It lists the district's 40 schools, picks 4 schools at random and surveys <em>every<\/em> Grade 10 student in those 4. A planning officer warns that the schools are very unlike each other: 8 are large urban schools with good Wi-Fi and 32 are small rural schools with weak coverage.<\/p><p>Which statements about this plan are <strong>FALSE<\/strong>?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The design is cluster sampling: whole schools are picked at random and everyone inside is surveyed.","correct":false,"note":"TRUE statement, so it should not be ticked. Randomly selecting entire subgroups and surveying all of their members is the slides' definition of cluster sampling."},{"text":"Because the 4 schools are drawn at random, both school types are sure to appear in proportion.","correct":true,"note":"FALSE, so tick it. Random selection of clusters gives no guarantee about the mix. Here P(all 4 schools rural) = C(32,4)/C(40,4) = 0.393, so the urban schools are left out entirely in about 39% of draws. Guaranteeing each type is what stratifying does."},{"text":"Cluster sampling assumes each school mirrors the district; these schools clearly do not do so.","correct":false,"note":"TRUE statement. The slide says each cluster 'should have similar characteristics to the whole'. With very unlike schools, 4 clusters can easily misrepresent the district."},{"text":"Taking urban and rural schools as strata and sampling students in both ensures both are covered.","correct":false,"note":"TRUE statement. Stratified sampling samples within every stratum, so both school types are represented. This is the fix the officer's warning points to."},{"text":"The design is stratified sampling, because the district was split into schools before sampling.","correct":true,"note":"FALSE, so tick it. Both designs split the population into subgroups. The difference is that stratified samples individuals from every subgroup, while cluster takes whole subgroups. Splitting alone does not make it stratified."}],"explanation":{"verdict":"Tick the two FALSE statements: 'random clusters guarantee proportional representation' and 'it is stratified because the district was split into schools'. The idea tested is what makes cluster sampling valid and how it differs from stratified sampling.","reasoning":"<p>Both methods divide the population into subgroups, so 'divided into groups' never tells them apart. Stratified sampling draws individuals from <em>every<\/em> stratum. It works best when strata differ, and it guarantees each one is represented. Cluster sampling draws <em>whole<\/em> clusters at random and surveys everyone in them. It is valid only if each cluster is a mini-version of the population, as the slide's example of offices 'with similar roles' shows.<\/p><p>Here the clusters (schools) are heterogeneous, so a draw of 4 can easily miss the urban group: P(all rural) = 0.393.<\/p>","source":"L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slides 26–27"},"forms":["neg"],"paper":1,"num":37},{"id":"p1-l4l","type":"multi","marks":2,"lecture":"L4","lectures":["L4"],"kind":"theory","tier":3,"archetype":"A1","trap":null,"pattern":["A1","MOCK-Q13a","MOCK-Q13c"],"topic":"Facts about the chi-square test","stem":"<p>A clinic compares the proportion of patients who miss appointments under two reminder systems (SMS and phone call). A chi-square test on the 2 × 2 table gives χ²<sub>stat<\/sub> = 6.25.<\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"The equivalent two-proportion Z-test would give |Z| = 2.5 on these data.","correct":true,"note":"TRUE. With 1 df, Z² = χ²_stat, so |Z| = √6.25 = 2.5 (L4 slide 68)."},{"text":"Rejecting H0 here would show that the SMS group's no-show rate is the higher one.","correct":false,"note":"FALSE. 'Chi-square tests can't be used to determine evidence of a directional difference (such as p1 > p2): for this you must use the Z-test' (L4 slide 68)."},{"text":"The test has (2 − 1)(2 − 1) = 1 degree of freedom for the 2 × 2 table.","correct":true,"note":"TRUE. A 2 × 2 contingency table gives 1 degree of freedom (L4 slide 66)."},{"text":"Each expected count should be at least 5 for the 2 × 2 result to be accurate.","correct":true,"note":"TRUE. This is the slides' condition for a 2 × 2 table (L4 slide 68)."},{"text":"The same kind of test could compare no-show rates across four reminder systems.","correct":true,"note":"TRUE. The chi-square test extends to more than two groups, which the Z-test cannot handle (L4 slides 68, 72)."}],"explanation":{"verdict":"Tick all except the directional claim. The skill tested is the slide 'Important Facts About Chi Square Test'.","reasoning":"<p>The slide lists the facts: Z² = χ² for 1 df; each expected frequency should be at least 5 for a 2 × 2 table; chi-square cannot show a direction such as p1 &gt; p2; it can compare more than two groups; and it generalises to a test of independence (L4 slide 68). A significant χ² says the proportions differ, and the direction then needs a one-tailed Z-test.<\/p>","source":"L4 · L4 – Statistical Inference (2).pdf, slides 65–68, 72"},"forms":[],"paper":1,"num":38},{"id":"p1-l3d","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"calculation","tier":2,"archetype":"A4","trap":null,"pattern":["A4","MOCK-Q06b","F2024-Q2b"],"topic":"Complement rule","stem":"<p>A data centre has 6 cooling units that fail independently. Each fails during a heatwave with probability 0.1.<\/p><p>What is the probability that <em>at least one<\/em> unit fails (3 d.p.)?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"0.469","correct":true,"note":"Correct. P(at least one) = 1 − P(none) = 1 − 0.9⁶ = 1 − 0.5314 = 0.469."},{"text":"0.600","correct":false,"note":"6 × 0.1 adds the six probabilities, which is valid only for mutually exclusive events. Failures can happen together, so this over-counts."},{"text":"0.531","correct":false,"note":"0.9⁶ is P(no unit fails). The complement was never taken."},{"text":"0.354","correct":false,"note":"6 × 0.1 × 0.9⁵ = 0.354 is P(exactly one fails), which drops the cases with two or more failures."}],"explanation":{"verdict":"0.469. 'At least one' is computed through the complement, 'none'.","reasoning":"<div class=\"tablewrap\"><table class=\"steps\"><tr><th>Step<\/th><th>Formula<\/th><th class=\"num\">Value<\/th><\/tr><tr><td>P(one unit survives)<\/td><td>1 − 0.1<\/td><td class=\"num\">0.9<\/td><\/tr><tr><td>P(all six survive)<\/td><td>0.9⁶ (independence: multiply)<\/td><td class=\"num\">0.5314<\/td><\/tr><tr><td>P(at least one fails)<\/td><td>1 − P(none fail)<\/td><td class=\"num\">0.4686<\/td><\/tr><\/table><\/div>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 18, 41"},"forms":[],"paper":1,"num":39},{"id":"p1-l5a","type":"multi","marks":2,"lecture":"L5","lectures":["L5"],"kind":"theory","tier":3,"archetype":"A9","trap":null,"pattern":["A9","F2024-Q4b","F2025-Q4b"],"topic":"Dummy variables and the baseline","stem":"<p>A chain models a store's weekly sales ŷ (Rs '000) on advertising spend x (Rs '000) and Region (North, South, East, West), using dummies N, S and E with West as the baseline:<\/p><p><math display=\"block\"><mover accent=\"true\"><mrow><mi>y<\/mi><\/mrow><mo>^<\/mo><\/mover><mo>=<\/mo><mn>50<\/mn><mo>+<\/mo><mn>2.1<\/mn><mi>x<\/mi><mo>+<\/mo><mn>6.0<\/mn><mi>N<\/mi><mo>−<\/mo><mn>3.5<\/mn><mi>S<\/mi><mo>+<\/mo><mn>1.2<\/mn><mi>E<\/mi><\/math><\/p><p>Which statements are TRUE?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Region needs three dummy variables, because it has four categories.","correct":true,"note":"TRUE. k categories need k − 1 dummies. The category with all zeros (West) is the baseline."},{"text":"At the same advertising spend, a South store sells 3.5 less than a West store.","correct":true,"note":"TRUE. Each dummy's coefficient is that region's difference from the baseline region."},{"text":"At the same advertising spend, a South store sells 3.5 less than a North store.","correct":false,"note":"FALSE. Both coefficients are measured from West: South − North = −3.5 − 6.0 = −9.5."},{"text":"A West store spending x = 10 has predicted weekly sales of 71 thousand.","correct":true,"note":"TRUE. For West N = S = E = 0, so ŷ = 50 + 2.1 × 10 = 71."},{"text":"Adding a fourth dummy W for West would make the model more accurate.","correct":false,"note":"FALSE. W would equal 1 − N − S − E, so it adds no information. It is redundant, which is why the slides code k categories with k − 1 dummies."}],"explanation":{"verdict":"Tick three: three dummies, South 3.5 below West, and West at x = 10 predicted at 71. The skill tested is k − 1 dummy coding and reading coefficients against the baseline.","reasoning":"<p>The slides code Colour (4 categories) with three dummies C1, C2, C3, and Blue is the all-zero baseline (L5 slides 9–10). In ŷ = β0 + β1x + β2c1 + β3c2 + β4c3, each dummy coefficient shifts the prediction relative to the baseline, holding x fixed. Comparing two non-baseline categories means subtracting their coefficients.<\/p>","source":"L5 · L5 - Linear Regression (1).pdf, slides 9–10"},"forms":[],"paper":1,"num":40},{"id":"p1-l3o","type":"best","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":1,"archetype":"A8","trap":null,"pattern":["A8","MOCK-Q05a","MOCK-Q04c"],"topic":"Reading a conditional probability","stem":"<p>A delivery firm reports that P(late | heavy rain) = 0.40.<\/p><div class=\"claims\"><p><span class=\"who\">Student A:<\/span> “So 40% of all late deliveries happen on heavy-rain days.”<\/p><p><span class=\"who\">Student B:<\/span> “So on heavy-rain days, 40% of deliveries are late.”<\/p><\/div><p>Who is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Student B, as the 40% is a share of the heavy-rain days, the event after the bar.","correct":true,"note":"Correct. P(A | B) is the probability of A among the outcomes in B, so it is the share of rainy-day deliveries that are late."},{"text":"Student A, because P(late | rain) and P(rain | late) are equal to each other by definition.","correct":false,"note":"These are equal only if P(late) = P(rain). In general P(A | B) = P(B | A)P(A)/P(B), which is Bayes' theorem."},{"text":"Both, because each sentence describes the same joint event, being late and rainy.","correct":false,"note":"The joint probability P(late ∩ rain) is a third quantity. Neither statement is about it."},{"text":"Student A, because the event written before the bar is the one we condition on.","correct":false,"note":"This reverses the notation. The conditioning event comes after the bar: P(late | rain) means 'given rain'."}],"explanation":{"verdict":"Student B is correct. P(late | rain) is taken within rainy days. Student A has described P(rain | late), the reversed conditional.","reasoning":"<p>Conditional probability P(A | B) is 'the probability of A given that B has already occurred' (L3 slide 27), i.e. P(A ∩ B)/P(B). Reversing the conditional is the same mistake that produces the wrong answer in Bayes questions, which is why the lecturer's mock asks students to separate prior and conditional probabilities.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 27–30, 34"},"forms":["ab"],"paper":1,"num":41},{"id":"p1-l3j","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":3,"archetype":"A4","trap":null,"pattern":["A4","MOCK-Q06a","MOCK-Q07a","F2024-Q2d.i"],"topic":"Choosing a distribution and its parameter","stem":"<p>For each story, a student proposes a model.<\/p><p>Which proposals are CORRECT?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"Faulty LEDs in a box of 20, each independently faulty with p = 0.03: Binomial(20, 0.03).","correct":true,"note":"CORRECT. Fixed n = 20, two outcomes, constant p, independent trials: the binomial set-up (L3 slide 62)."},{"text":"Correct guesses when 10 true/false questions are answered at random: Poisson with λ = 5.","correct":false,"note":"INCORRECT. A fixed number (10) of independent yes/no trials with constant p = 0.5 is Binomial(10, 0.5). Poisson approximates a binomial only when n is large and p small (L3 slide 65)."},{"text":"Wait for the next taxi when 12 pass per hour on average: exponential, mean 5 minutes.","correct":true,"note":"CORRECT. A rate of 12 per hour is 0.2 per minute, so the exponential waiting time has E(T) = 1/λ = 5 minutes."},{"text":"Misprints in a 200-page book, at an average of 0.01 per page: Poisson with λ = 2.","correct":true,"note":"CORRECT. Rare events counted over a fixed span, with λ = 0.01 × 200 = 2."},{"text":"Last digit of a randomly chosen phone number: discrete uniform on 0–9, probability 0.1 each.","correct":true,"note":"CORRECT. Ten equally likely values, so each has probability 1/10, as in the slides' 0–9 example."}],"explanation":{"verdict":"Tick all except 'random true/false guesses are Poisson', which is binomial. The skill tested is choosing the distribution and its parameter for a story.","reasoning":"<p>Counts in a fixed interval at a constant average rate are Poisson, with λ for the interval asked about. Waiting times between such events are exponential with mean 1/λ. A fixed number of independent yes/no trials with constant p is binomial. Equally likely values are discrete uniform. The Poisson approximation to the binomial is reserved for large n with small p, so 10 trials at p = 0.5 stay binomial.<\/p>","source":"L3 · L3 - Probability Theory and Distributions (1).pdf, slides 59–67, 74"},"forms":[],"paper":1,"num":42},{"id":"p1-l1e","type":"best","marks":2,"lecture":"L1","lectures":["L1"],"kind":"theory","tier":1,"archetype":"A1","trap":null,"pattern":["A1"],"topic":"Domains of data analytics","stem":"<p>A supermarket chain's analytics team has three tasks: (1) a dashboard of last month's sales by branch; (2) finding out <em>why<\/em> returns of one product doubled in March; (3) estimating next quarter's demand from five years of sales history.<\/p><p>Which matching of tasks to domains is correct?<\/p>","table":null,"figure":null,"figcap":null,"options":[{"text":"1 descriptive, 2 diagnostic, 3 predictive","correct":true,"note":"Correct. (1) summarises the past, (2) looks for causes, and (3) forecasts future outcomes from historical data."},{"text":"1 descriptive, 2 predictive, 3 diagnostic","correct":false,"note":"This swaps 2 and 3. Explaining a past rise is diagnostic, and forecasting demand is predictive."},{"text":"1 diagnostic, 2 diagnostic, 3 predictive","correct":false,"note":"A sales dashboard describes what happened. It does not determine causes, so it is descriptive, not diagnostic."},{"text":"1 descriptive, 2 descriptive, 3 predictive","correct":false,"note":"Runner-up. Task 2 does involve describing the returns, but its goal is to find out why they rose, which the slide defines as diagnostic ('determine the causes of observed phenomena')."}],"explanation":{"verdict":"1 descriptive, 2 diagnostic, 3 predictive. Each domain is identified by the question it answers.","reasoning":"<p>The slide defines descriptive analytics as summarising the main features and explaining the past and current state, diagnostic analytics as determining the causes of observed patterns (the slide pairs it with statistical inference), and predictive analytics as predicting future outcomes from historical data (the slide pairs it with regression). The runner-up fails only on task 2: 'why' questions are diagnostic even though they start from a description.<\/p>","source":"L1 · L1 - Introduction to Data Analytics and Sampling.pdf, slide 12"},"forms":["runner"],"paper":1,"num":43},{"id":"p1-l3f","type":"multi","marks":2,"lecture":"L3","lectures":["L3"],"kind":"theory","tier":3,"archetype":"A5","trap":1,"pattern":["A5","F2024-Q2d.ii","MOCK-Q09b"],"topic":"Continuous point probability","stem":"<p>The time T (minutes) to fully charge a phone at a public kiosk is exponential with mean 40 minutes. Its density is plotted below, with a line drawn at t = 40.<\/p><p>Which statements are TRUE?<\/p>","table":nul
